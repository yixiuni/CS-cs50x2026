 if there is a winner yet."],[719160,720370,"What does that mean?"],[720370,723000,"Well, if any candidate has more than half of the vote,"],[723000,726600,"in other words, a majority of the vote, you should print out their name"],[726600,729060,"and return true from this function."],[729060,732870,"But it's possible that no candidate has yet won the election because nobody"],[732870,734490,"has more than half the vote."],[734490,736470,"In that case, you shouldn't print out anything,"],[736470,739000,"and your function should just return false."],[739000,741250,"So let's take a look at an example."],[741250,744210,"In this case, there are five total votes in this election,"],[744210,747510,"and because there are five votes, you would need three votes, a majority,"],[747510,748870,"in order to win."],[748870,752290,"Since nobody has three votes, that means there is no winner yet."],[752290,755260,"So your print winner function shouldn't print out any names"],[755260,757450,"and should just return false."],[757450,760480,"But now, let's take a look at these votes, for example."],[760480,762400,"Still, there are five total votes, which means"],[762400,766520,"you need three votes in order to win, but here, Charlie has three votes."],[766520,768730,"So Charlie would be the winner of this election."],[768730,772480,"Your print winner function, in this case, should print out Charlie's name"],[772480,775210,"and then return true to indicate that Charlie is,"],[775210,778090,"in fact, the winner of this election."],[778090,782530,"The next function you'll implement in runoff.c is called find min."],[782530,786910,"In find min, what you'll do is you'll return the minimum number of votes"],[786910,788870,"of anyone still in the election."],[788870,791380,"And we'll use this to figure out, for example, who we need"],[791380,794330,"to eliminate in this runoff process."],[794330,796610,"So let's take a look at an example."],[796610,799990,"Here's a sample election with five candidates, Alice, Bob, Charlie,"],[799990,802270,"Dave, and Emma, and their vote totals."],[802270,805630,"And notice, that based on the fact that all of their eliminated flags"],[805630,809550,"are all set to false, all five candidates are still in the election."],[809550,813010,"Here, your algorithm should return the number one from this"],[813010,816760,"find min function because Bob is the candidate that has the fewest votes out"],[816760,819220,"of anyone in the current election."],[819220,822730,"Of course, you may run into a situation where some candidates have already"],[822730,823820,"been eliminated."],[823820,825880,"Let's take a look at an example of that."],[825880,829050,"Here, for example, Bob has already been eliminated."],[829050,833810,"For Bob's candidate struct, his eliminated status is set to true."],[833810,836920,"So in this case, we wouldn't want to return 0 as the minimum,"],[836920,841510,"even though 0 is the smallest vote total of any candidate inside of this array,"],[841510,843260,"because Bob's already been eliminated."],[843260,846970,"And we only want to consider candidates that are still in the election."],[846970,850150,"So in this case, the candidates that have the fewest number of votes"],[850150,853210,"are Alice and Emma, who both have two votes each,"],[853210,858190,"and so 2 is the number that we would return from find min in this case."],[858190,862450,"The next function you'll implement is called is tied, and the job of is tied"],[862450,865990,"is to decide whether or not this election is tied between all"],[865990,867890,"of the remaining candidates."],[867890,869710,"So how does this function work?"],[869710,872260,"Well, the function will take as input in integer"],[872260,874960,"called min, which is that minimum number of votes"],[874960,878380,"that you calculated inside of the find min function."],[878380,882730,"And is tied should return true if the election is tied between all"],[882730,884290,"of the remaining candidates."],[884290,887200,"If it's not tied between all of the remaining candidates,"],[887200,889550,"then your function should return false."],[889550,893230,"So for example, if all of the candidates are still in the election,"],[893230,897430,"and every candidate has two votes, then this election is a tie,"],[897430,899830,"and your function should return true."],[899830,902950,"Of course, this election is also tied."],[902950,905260,"Even though candidates have different vote totals,"],[905260,908200,"Bob and Dave have already been eliminated from the election,"],[908200,912040,"so I'm only looking at the three other people that are still in the election."],[912040,914230,"They each have two votes, and so because it's"],[914230,917520,"a tie between all of the remaining candidates in the election,"],[917520,920420,"then this function should return true."],[920420,924552,"Finally, the last function that you'll write in runoff.c is called eliminate,"],[924552,927760,"and this is the function that's going to take care of the process of actually"],[927760,931060,"eliminating the candidate who's in last place in the election,"],[931060,934330,"such that the election can run again, as if that person had not been"],[934330,936740,"in the election in the first place."],[936740,939700,"So your eliminate function should eliminate anyone still"],[939700,943060,"in the race, who has the min number of votes."],[943060,946060,"Recall that min is going to be the input to this function,"],[946060,950020,"and it's going to be that value that you computed in the find min function."],[950020,953230,"So anyone who has the fewest number of votes in the election, which"],[953230,955990,"might be one candidate, or it might be more than one,"],[955990,958960,"they should all be eliminated from the election."],[958960,960520,"Let's take a look at an example."],[960520,963970,"Here, for example, none of the candidates have yet been eliminated,"],[963970,968530,"but we can see that Bob is the candidate who has the minimum number of votes."],[968530,971650,"He has one vote, and everyone else has more than that."],[971650,975670,"So your eliminate function should update Bob's candidate struct,"],[975670,980620,"changing eliminated from false to true to indicate the fact that Bob has now"],[980620,983140,"been eliminated from this election."],[983140,985550,"Of course, when we run the runoff the next time around"],[985550,988030,"and recompute the vote totals, we might get something"],[988030,990970,"a little like this, where Bob has now been eliminated,"],[990970,993340,"and now we've decided the minimum number of votes"],[993340,996490,"that anyone still in the election has is 2."],[996490,998470,"What should your function do in this case?"],[998470,1000720,"Well, your function should look through the candidates"],[1000720,1005760,"and identify that both Alice and Emma each have two votes, the minimum number"],[1005760,1007650,"of votes of anyone in the election."],[1007650,1010080,"And your function should eliminate both of them,"],[1010080,1013650,"taking each of their candidate structs and changing eliminated"],[1013650,1016467,"from false to true for each of them."],[1016467,1019050,"Once you've done that, you'll have completed all that you need"],[1019050,1023640,"to implement a runoff election by implementing the vote, tabulate,"],[1023640,1027300,"print winner, find min, is tied, and eliminate functions,"],[1027300,1031020,"you'll be able to simulate this runoff election you can test for yourself"],[1031020,1035310,"by running ./runoff and then passing in as command line arguments the names"],[1035310,1039720,"of the candidates in the election, and then typing in each voter's ranked"],[1039720,1043410,"preferences, and then seeing whether your program computes the correct"],[1043410,1045960,"winner of this runoff election."],[1045960,1049369,"My name is Brian, and this was runoff."]]},"kb83NwyYI68":{"edited":true,"zh":[[0,1740,"我们来看看 Tideman 这道题。"],[1740,7500,"你的任务是写一个程序，实现 Tideman 投票法。"],[7500,11610,"这是一种按偏好排序的投票制度，"],[11610,17950,"每个选民都可以按照自己的喜好给所有候选人排名。"],[17950,24250,"比如，一名选民可以把 Alice 排在第一位，"],[24250,28440,"第二位选 Charlie，第三位选 Bob。"],[28440,34560,"Tideman 投票法又叫 Ranked Pairs（排序对法）。"],[34560,44310,"它会考察所有可能的候选人组合，看看每两个人如果单独对决，谁会赢。"],[44310,47650,"来看一个例子。"],[47650,53130,"这次选举有三名候选人 Alice、Bob 和 Charlie，共有五名选民。"],[53130,58450,"我们逐对比较候选人，一次只看两个人。"],[58450,61590,"先比较 Alice 和 Bob。"],[61590,66510,"五名选民中，有三人把 Alice 排在 Bob 前面，"],[66510,69900,"有两人把 Bob 排在 Alice 前面。"],[69900,75930,"所以，如果只有 Alice 和 Bob 两人参选，Alice 会获胜。"],[75930,81870,"我们写下 Alice 和 Bob 的名字，从 Alice 画一支箭头指向 Bob，"],[81870,87760,"表示两人单独对决时，Alice 能赢 Bob。"],[87760,92340,"再看其他组合。比如 Alice 和 Charlie。"],[92340,97320,"看这五张选票，有三人把 Charlie 排在 Alice 前面，"],[97320,100440,"只有两人把 Alice 排在 Charlie 前面。"],[100440,103780,"所以这组对决是 Charlie 赢。"],[103780,111600,"再画一支箭头，这次从 Charlie 指向 Alice，表示多数选民更喜欢 Charlie。"],[111600,115260,"最后比较 Charlie 和 Bob。"],[115260,119970,"五名选民中，有三人把 Charlie 排在 Bob 前面，"],[119970,122310,"只有两人把 Bob 排在 Charlie 前面。"],[122310,130600,"因此从 Charlie 画箭头指向 Bob，表示这组对决也是 Charlie 赢。"],[130600,136060,"我们刚刚画出来的结构，在计算机科学里叫作「图」。每位候选人是一个顶点。"],[136060,144880,"箭头也叫作边，从胜者指向败者，表示前一位候选人可以赢过后一位。"],[144880,152020,"接下来只看这张图，就能找出整场选举的获胜者，无须再去翻选票。"],[152020,156010,"获胜者就是图中的「源点」："],[156010,160660,"没有箭头指向这个人，箭头只从这个人指向别人。"],[160660,164110,"这里 Charlie 有箭头分别指向 Alice 和 Bob，"],[164110,168490,"却没有箭头指向 Charlie，说明没有人赢过 Charlie。"],[168490,173420,"所以我们可以判定，Charlie 赢得了这场选举。"],[173420,176120,"这个例子比较简单。"],[176120,180930,"有时候，把每组对决的结果都画上去，图里可能根本没有源点。"],[180930,185720,"这种情况该怎么处理？再看一个例子。"],[185720,191150,"这一次有九名选民，候选人还是 Alice、Bob 和 Charlie 三位。"],[191150,194990,"我们仍然逐对来看。"],[194990,198560,"Alice 对 Bob，Alice 以 7 比 2 获胜。"],[198560,201800,"九人中有七人把 Alice 排在 Bob 前面。"],[201800,204590,"因此从 Alice 画一支箭头指向 Bob。"],[204590,210410,"接下来看 Bob 和 Charlie，Bob 以 5 比 4 获胜，"],[210410,214040,"因为九人中有五人更喜欢 Bob。"],[214040,218720,"所以这次从 Bob 画一支箭头指向 Charlie。"],[218720,222470,"最后看 Alice 和 Charlie。"],[222470,227360,"这次 Charlie 以 6 比 3 赢了 Alice。"],[227360,231290,"九人中有六人把 Charlie 排在 Alice 前面。"],[231290,234750,"所以从 Charlie 画一支箭头指向 Alice。"],[234750,239720,"看看最后得到的图：里面没有源点，"],[239720,242430,"换句话说，没人能在两两对决中保持不败。"],[242430,249660,"Alice 赢 Bob，Bob 赢 Charlie，Charlie 又赢 Alice，就像石头、剪刀、布一样。"],[249660,254700,"这时就很难说整场选举到底该算谁赢。"],[254700,259290,"这正是这种投票法要给候选人对排序的原因。"],[259290,266100,"我们不一口气把所有的边都加进图里，而是排好顺序，一条一条加。"],[266100,269730,"排序依据是每组对决中胜者的获胜强度。"],[269730,278190,"先拿出这三组：Alice 对 Bob、Bob 对 Charlie、Charlie 对 Alice，按获胜强度排序。"],[278190,282090,"最强的是 Alice 胜 Bob，票数是 7 比 2。"],[282090,285450,"接下来是 Charlie 胜 Alice，6 比 3。"],[285450,292300,"最后是 Bob 胜 Charlie，这次只是 5 比 4。"],[292300,298780,"现在按这个从强到弱的顺序，逐条向图中添加边。"],[298780,303060,"但如果加一条边会形成环，就不加这条边。"],[303060,310110,"所谓环，就像刚才的石头、剪刀、布：沿箭头从一人走向另一人，最后又回到起点。"],[310110,314340,"否则我们就不知道该判谁赢。"],[314340,319200,"具体来看，先处理最强的一组：Alice 赢 Bob。"],[319200,321540,"画箭头，从 Alice 指向 Bob。"],[321540,325090,"下一组，Charlie 以 6 比 3 胜 Alice。"],[325090,327810,"于是画箭头，从 Charlie 指向 Alice。"],[327810,330420,"接下来，Bob 以 5 比 4 胜 Charlie。"],[330420,334260,"按理说该从 Bob 指向 Charlie 了，但先别急着画。"],[334260,338910,"要先看一看，从 Bob 指向 Charlie 会不会形成环。"],[338910,344190,"答案是会。Bob 指向 Charlie，Charlie 指向 Alice，而 Alice 又指回 Bob。"],[344190,350440,"只要加边会形成环，我们就跳过这条边。"],[350440,353160,"这里所有组合都已经处理完了，到此结束。"],[353160,358140,"最后看留下来的这张图，找出整场选举的获胜者。"],[358140,364600,"获胜者仍然是图的源点，在这个例子中就是 Charlie。"],[364600,368600,"总结一下，Tideman 投票法有以下几个步骤。"],[368600,370570,"一开始先计票。"],[370570,375760,"等所有选民给出自己的排名之后，查看每一对候选人，"],[375760,380590,"看看如果只有这两人竞争，谁会胜出。"],[380590,386800,"得到各组对决结果后，下一步是给这些候选人对排序。"],[386800,392020,"按获胜强度从高到低排列，赢得最有优势的排在最前面，"],[392020,396390,"赢得最接近的排在最后。"],[396390,401830,"排好顺序以后，再一对一对地「锁定」这些结果。"],[401830,405330,"从最强的一对开始，依次锁定。"],[405330,411090,"所谓锁定，就是把代表对决结果的边加进图里，前提是加进去不会形成环。"],[411090,416310,"如果会形成环，就跳过这条边，继续看下一对。"],[416310,423870,"有了最终的图，就可以找到图中的源点，确定谁赢得了选举。"],[423870,428170,"换句话说，看哪个人没有箭头指向他。"],[428170,433720,"要在 C 里实现这个过程，需要用到一些数据结构和变量。"],[433720,438420,"我们先看看这个程序里有哪些现成的数据结构。"],[438420,442170,"首先是候选人数组 candidates。"],[442170,446963,"它是一个字符串数组，存放所有候选人的名字。"],[446963,452160,"比如有 Alice、Bob 和 Charlie 三人，可以把 Alice 作为 0 号候选人，"],[452160,456720,"Bob 作为 1 号，Charlie 作为 2 号。"],[456720,460380,"此外，还有一个名为 preferences 的变量。"],[460380,465540,"preferences 是一个二维整数数组。怎样理解其中的值呢？"],[465540,472800,"preferences[i][j] 表示有多少名选民把候选人 i 排在候选人 j 前面。"],[472800,476800,"我们用一个例子来看。"],[476800,481890,"三名候选人是 Alice、Bob 和 Charlie，这次有四名选民。"],[481890,487890,"根据这四张选票，可以这样填写二维数组 preferences。"],[487890,495360,"第一行 preferences[0] 对应 Alice，因为她在 candidates 数组中的下标是 0。"],[495360,502050,"第一个格子的值是 0，也就是没人把 Alice 排在她自己前面。"],[502050,506970,"同一行第二个格子是 3，表示有三人把 Alice 排在 Bob 前面。"],[506970,511590,"最后一个格子也表示有三人把 Alice 排在 Charlie 前面。"],[511590,516690,"第二行 preferences[1] 对应 Bob。"],[516690,518970,"一人把 Bob 排在 Alice 前面，"],[518970,520950,"没人把 Bob 排在他自己前面，"],[520950,523919,"一人把 Bob 排在 Charlie 前面。"],[523919,529500,"preferences 的最后一行则对应 Charlie。"],[529500,531990,"一人把 Charlie 排在 Alice 前面，"],[531990,534450,"三人把 Charlie 排在 Bob 前面，"],[534450,537690,"没人把 Charlie 排在他自己前面。"],[537690,543600,"有了这个二维数组，关于选民偏好的信息就足够了。"],[543600,548820,"可以用它找出每组候选人对，并判断每组对决谁赢。"],[548820,554250,"那要怎么表示一组对决呢？我们已经为你定义了一个结构体。"],[554250,560370,"其中有两个整型字段，叫 winner 和 loser。"],[560370,566760,"它们存的分别是本组胜者和败者在候选人数组中的下标。"],[566760,569460,"接下来，要把有胜负的候选人对加入 pairs。"],[569460,575770,"pairs 是个数组，收集所有一方比另一方更受欢迎的候选人对。"],[575770,584930,"如果两人平票，谁都没赢过对方，就不把他们加入 pairs 数组。"],[584930,588650,"然后用 pairs 数组来构建一张图。"],[588650,590210,"这张图用 locked 表示。"],[590210,595670,"locked 是一个二维布尔数组，用来表示候选人之间的有向边。"],[595670,607850,"如果 locked[i][j] 为 true，就表示从候选人 i 指向候选人 j 的边已经锁定。"],[607850,616400,"刚开始它的所有元素都是 false，因为此时图中还没有任何箭头。"],[616400,628901,"之后每添加一条从候选人 i 指向候选人 j 的边，就把 locked[i][j] 设为 true。"],[628901,633720,"再来看实现 Tideman 投票法需要编写哪些函数。"],[633720,637500,"一共六个：vote、record_preferences、"],[637500,642240,"add_pairs、sort_pairs、lock_pairs 和 print_winner。"],[642240,647440,"这六个函数写完，整个投票系统就实现了。"],[647440,652020,"我们逐个来看，先从 vote 开始。"],[652020,659580,"每当一名选民表明自己要把哪位候选人排在第几位时，程序就调用 vote。"],[659580,661590,"vote 接收三个参数："],[661590,668010,"名次 rank、候选人的姓名，以及存放该选民各个名次的 ranks 数组。"],[668010,675210,"在这个函数里，要遍历 candidates 数组，查找与输入姓名匹配的候选人。"],[675210,684150,"找到了，就把对应的候选人编号填入这名选民的 ranks 数组，然后返回 true。"],[684150,691200,"ranks[i] 存的是这位选民排在第 i 个位置的候选人编号，下标从 0 开始。"],[691200,698560,"所以 ranks[0] 是选民最喜欢的候选人，ranks[1] 是第二喜欢的，依此类推。"],[698560,706080,"如果输入的姓名与所有候选人都不匹配，就别改 ranks 数组。"],[706080,709950,"直接返回 false 即可。"],[709950,716830,"接下来，ranks 会作为实参传给另一个函数 record_preferences。"],[716830,719910,"每位选民完成投票后，这个函数都会被调用一次。"],[719910,724920,"传入的 ranks 就是这位选民给所有候选人排出的顺序。"],[724920,733590,"record_preferences 的任务是根据这份排名，更新二维数组 preferences。"],[733590,737280,"每位选民都要这样处理一次。"],[737280,740550,"看看其中一位选民的例子。"],[740550,746970,"这是这位选民的 ranks 数组，第一选择是 3 号候选人。"],[746970,752560,"第二选择是 0 号，第三选择是 4 号，后面依此类推。"],[752560,759570,"要根据这个数组判断，在这位选民心中，每个人都排在哪些人前面。"],[759570,771170,"比如 3 号排第一，所以排在其他所有人之前，也就是 0、4、1、2 号之前。"],[771170,776150,"而 0 号排在 4、1、2 号前面。"],[776150,779390,"4 号排在 1 号和 2 号前面。"],[779390,782210,"1 号排在 2 号前面。"],[782210,785450,"2 号排最后，所以没有排在任何人前面。"],[785450,791270,"通过这份 ranks 数组，我们就知道了这位选民在每组对决中偏向谁。"],[791270,795300,"然后需要把这些结果累加到 preferences 数组里。"],[795300,798870,"收集完所有选民的偏好之后，"],[798870,805730,"下一步是查看每一对候选人，确定双方有没有分出胜负。"],[805730,809780,"如果有，就在 add_pairs 函数中把他们加入 pairs 数组。"],[809780,815870,"add_pairs 的任务就是检查各个候选人对，把符合条件的加入 pairs。"],[815870,825560,"条件是一方比另一方更受欢迎，也就是说，这一对有明确的胜者和败者。"],[825560,834070,"函数还要更新全局变量 pair_count，记录一共往 pairs 数组里添加了多少对。"],[834070,842540,"比如屏幕上的这个 preferences 数组，有两对候选人分出了胜负。"],[842540,848090,"第一对是 0 号和 1 号，其中 0 号赢了 1 号。"],[848090,856250,"看 preferences 就能知道原因：有三名选民把 0 号排在 1 号前面，"],[856250,861050,"却只有一名选民把 1 号排在 0 号前面。"],[861050,869540,"另一对是 2 号和 0 号，其中 2 号获胜，0 号落败。"],[869540,872910,"这也可以从 preferences 数组中读出来。"],[872910,878240,"把 2 号排在 0 号前面的有三人，"],[878240,884340,"把 0 号排在 2 号前面的只有一人。"],[884340,889860,"所有有胜负的组合加入 pairs 后，下一步就是给它们排序。"],[889860,893070,"这个步骤由 sort_pairs 来完成。"],[893070,899220,"它要把各组对决按获胜强度从高到低排序。"],[899220,906390,"怎么衡量获胜强度？数一数有多少选民把这一对中的胜者排在败者前面。"],[906390,909900,"支持胜者的人越多，这场胜利的强度就越高。"],[909900,913410,"这里可以使用任何你喜欢的排序算法。"],[913410,920960,"只要 sort_pairs 执行完，pairs 数组已经按获胜强度从高到低排好了就行。"],[920960,925790,"接下来，lock_pairs 函数会用到这个已经排好的数组，"],[925790,930590,"依次处理其中各对候选人，把符合条件的结果锁定在图中。"],[930590,937400,"具体来说，lock_pairs 需要更新二维布尔数组 locked，"],[937400,946250,"按获胜强度从高到低依次加边，前提是新加的边不会形成环。"],[946250,953960,"如果两个候选人之间的这条边会让图中出现环，就不能把它加进去。"],[953960,956550,"跳过这一对，再处理下一对。"],[956550,964160,"所以 lock_pairs 里需要想办法判断，加上某条边后会不会出现环。"],[964160,968660,"也就是，能不能从某个候选人出发，沿着箭头又走回他自己。"],[968660,973460,"看这个例子，左边是表示锁定关系的数组，"],[973460,977400,"右边则是同样的关系画成的图。"],[977400,986340,"二维数组 locked 中每一处 true，都对应一条从某个候选人指向另一个人的箭头。"],[986340,992300,"比如 locked[0][1] 为 true，所以有一条箭头从 Alice 指向 Bob。"],[992300,997880,"locked[2][0] 为 true，所以有一条箭头从 Charlie 指向 Alice。"],[997880,1005130,"locked[2][1] 也是 true，因此 Charlie 还有一条箭头指向 Bob。"],[1005130,1010680,"构建好这张图之后，最后一步就是输出选举的获胜者。"],[1010680,1017010,"再回顾一下，获胜者就是图中作为源点的候选人。"],[1017010,1025589,"这道题允许你假设源点只有一个，因此只会有一位获胜者。"],[1025589,1033150,"所谓源点，就是没有任何箭头指向的顶点。"],[1033150,1040470,"因此可以查看这张图，找出哪位候选人没有箭头指向他。"],[1040470,1044550,"当你写完这六个函数：vote、record_preferences、"],[1044550,1048119,"add_pairs、sort_pairs、lock_pairs 和 print_winner，"],[1048119,1054240,"就完成了用 Tideman 投票法模拟一场选举所需的全部代码。"],[1054240,1057740,"我是 Brian，这就是 Tideman 这道题。"]],"en":[[0,1740,"BRIAN: Let's dive into Tideman."],[1740,3750,"In this program, your task is going to be"],[3750,7500,"to write a program that implements the Tideman Voting System."],[7500,11610,"This voting system is an example of a ranked-preference voting system, which"],[11610,14850,"means that every voter, instead of just voting for one candidate,"],[14850,17950,"will get to rank their candidates in order of preference."],[17950,21040,"So a voter, instead of just voting for Alice for example,"],[21040,24250,"might instead indicate that Alice is their top choice."],[24250,26100,"But their second choice is Charlie."],[26100,28440,"And their third choice is Bob."],[28440,31440,"And in particular, the Tideman voting method, otherwise known"],[31440,34560,"as Ranked Pairs, determines the winner of an election"],[34560,38410,"by looking at every possible pair of candidates in that election"],[38410,42240,"and determining who would have won a race if the election was just"],[42240,44310,"between those two candidates."],[44310,47650,"Let's take a look at an example of a Ranked Pairs election."],[47650,49440,"Here's an election with three candidates--"],[49440,53130,"Alice, Bob, and Charlie, and five voters."],[53130,57300,"And what we're going to do is consider each pair of candidates, one pair"],[57300,58450,"at a time."],[58450,61590,"Let's start just by considering Alice and Bob."],[61590,64530,"Based on these five voters, three of the five voters"],[64530,66510,"think that Alice is better than Bob."],[66510,69900,"And two of the five voters think that Bob is better than Alice."],[69900,73560,"So between Alice and Bob, Alice would have won the election"],[73560,75930,"if it was just between the two of them."],[75930,78900,"To represent that, we're going to write Alice and Bob's name"],[78900,81870,"and draw an arrow pointing from Alice to Bob"],[81870,84600,"to indicate that Alice would have beaten Bob"],[84600,87760,"in a head-to-head match-up between the two of them."],[87760,89670,"Let's now consider the other pairs."],[89670,92340,"Let's look at Alice and Charlie, for example."],[92340,94620,"In this case, judging by these five voters,"],[94620,97320,"three voters thought Charlie was better than Alice."],[97320,100440,"And only two voters thought Alice was better than Charlie."],[100440,103780,"So Charlie would have beaten Alice in a head-to-head match up."],[103780,106020,"So we're going to again, draw an arrow, this time"],[106020,108510,"pointing from Charlie to Alice, indicating"],[108510,111600,"that Charlie is preferred over Alice."],[111600,115260,"And finally, let's consider the last pair of Charlie and Bob."],[115260,118200,"And in this case, we can see that three of the five voters"],[118200,119970,"think that Charlie is better than Bob."],[119970,122310,"Only two think Bob is better than Charlie."],[122310,126540,"So we'll draw one final arrow here, pointing from Charlie to Bob,"],[126540,130600,"indicating that Charlie beats Bob in this election."],[130600,132580,"This structure that we've created is what"],[132580,136060,"we call a graph, where we have each of these individual candidates."],[136060,140380,"And we have arrows, otherwise known as edges, pointing from one candidate"],[140380,142780,"to another candidate if the first candidate"],[142780,144880,"would have beaten the second candidate."],[144880,148810,"And now just using this graph and without looking at the ballots anymore,"],[148810,152020,"we can determine who the winner of the election should be."],[152020,156010,"The winner of the election is the so-called source of the graph,"],[156010,159118,"the person who has no arrows pointing at them, but does"],[159118,160660,"have arrows pointing at other people."],[160660,164110,"In this case, Charlie has arrows pointing to Alice and Bob."],[164110,166600,"But there are no arrows that are pointing at Charlie,"],[166600,168490,"which means nobody beats Charlie."],[168490,173420,"And Charlie therefore, we can conclude, should be the winner of this election."],[173420,176120,"Now this was a relatively simple election."],[176120,178790,"But there are some times where we might have an election where"],[178790,180930,"there is no source of the graph."],[180930,183750,"And we need to figure out how to handle that situation."],[183750,185720,"Let's take a look at an example of that."],[185720,188360,"Here is an election that has nine voters, again"],[188360,189710,"voting for three candidates--"],[189710,191150,"Alice, Bob, and Charlie."],[191150,194990,"And let's consider each of these pairs of candidates one at a time again."],[194990,198560,"Between Alice and Bob, Alice beats Bob, 7 to 2."],[198560,201800,"Seven of these nine voters think that Alice is better than Bob."],[201800,204590,"So we'll draw an arrow from Alice to Bob."],[204590,207530,"Next we'll take a look at the pair of Bob and Charlie,"],[207530,210410,"where we see that Bob beats Charlie 5 to 4."],[210410,214040,"Because five out of the nine voters think that Bob is better than Charlie."],[214040,215990,"So in this case, we'll draw another arrow,"],[215990,218720,"this time pointing from Bob to Charlie."],[218720,222470,"And now let's consider the final pair, Alice and Charlie."],[222470,227360,"And what you'll notice here is that Charlie actually beats Alice 6 to 3."],[227360,231290,"Six of these nine voters think that Charlie is better than Alice."],[231290,234750,"So we'll draw an arrow from Charlie to Alice."],[234750,237150,"And what you'll notice in this resulting graph"],[237150,239720,"is that there is no source of the graph."],[239720,242430,"There's nobody that is undefeated, so to speak."],[242430,246120,"Alice beats Bob, Bob beats Charlie, and Charlie beats Alice"],[246120,249660,"in this rock, paper, scissors, reminiscent-style of graph."],[249660,253170,"And so it would be difficult to say who the winner of this election"],[253170,254700,"should actually be."],[254700,259290,"But this is where the ranked pairs idea of Ranked Pairs Voting comes in."],[259290,262710,"Instead of adding all of these edges to the graph all at once,"],[262710,266100,"we're going to add the edges one at a time in order,"],[266100,269730,"based on the strength of victory for any particular pair."],[269730,271560,"So we'll first take these three pairs--"],[271560,274830,"Alice and Bob, Bob and Charlie, and Charlie and Alice,"],[274830,278190,"and put them in order based on the strength of their victory."],[278190,280560,"The strongest victory is Alice beating Bob--"],[280560,282090,"7 votes to 2."],[282090,284160,"The next strongest is Charlie beating Alice--"],[284160,285450,"6 votes to 3."],[285450,289380,"And the least strong margin of victory is Bob beating Charlie,"],[289380,292300,"who only won on a 5 to 4 margin."],[292300,296610,"And now what we're going to do is add edges to this graph in order,"],[296610,298780,"based on this strength of victory."],[298780,303060,"But we're not going to add an edge if it would create a cycle, a rock, paper,"],[303060,306390,"scissors-style situation, where one candidate points to another which"],[306390,310110,"might point to another, which eventually loops back to that original candidate."],[310110,314340,"Because in that sort of situation, we wouldn't know who the winner should be."],[314340,316620,"So to put this into practice, we would start"],[316620,319200,"with Alice beating Bob, the strongest pair,"],[319200,321540,"and draw an arrow from Alice to Bob."],[321540,325090,"The next pair is Charlie beating Alice on a 6 to 3 margin."],[325090,327810,"So we would draw an arrow from Charlie to Alice."],[327810,330420,"And next, Bob beats Charlie 5 to 4."],[330420,334260,"So we would have drawn an arrow from Bob to Charlie, but we shouldn't yet."],[334260,336480,"Because we should first notice that if we"],[336480,338910,"were to draw an arrow from Bob to Charlie,"],[338910,341810,"that would create a cycle, where Bob goes to Charlie, who"],[341810,344190,"goes to Alice, who goes back to Bob."],[344190,347070,"Any time we would be adding an edge that creates a cycle,"],[347070,350440,"we're just going to skip that edge and declare that now, in this case,"],[350440,353160,"since we've made it through all of the pairs, we're done."],[353160,355440,"And we're going to look at this result graph"],[355440,358140,"to determine who the winner of the election should be."],[358140,360150,"And in this case, the winner of the election"],[360150,364600,"is again, the source of the graph, who in this case, is Charlie."],[364600,368600,"So in summary, the Tideman Voting Method works as follows--"],[368600,370570,"we start by tallying up the votes."],[370570,373330,"Once all of the voters have indicated their preferences,"],[373330,375760,"we're going to look at each pair of candidates"],[375760,377890,"and determine who the winner of the election"],[377890,380590,"would be for just that particular pair."],[380590,383140,"After we have all of those pairs, the next step"],[383140,386800,"is going to be to sort those pairs we're going to sort the pairs of candidates"],[386800,390850,"in decreasing strength of victory, where the strongest or widest margin"],[390850,392020,"of victory is first."],[392020,396390,"And we go down to the smallest margin of victory at the end."],[396390,400830,"After we have the sorted pairs, the next step is to lock those pairs in one"],[400830,401830,"at a time."],[401830,405330,"Starting with the strongest pair, we're going to lock in each pair."],[405330,408090,"That is to say add an edge to that graph,"],[408090,411090,"as long as adding that edge isn't going to create a cycle."],[411090,413730,"If it would create a cycle, we're going to skip that edge"],[413730,416310,"and just move on to the next pair."],[416310,418530,"And after we have that resulting graph, we"],[418530,421200,"can determine the winner of the election by just checking"],[421200,423870,"to see who the source of the graph is--"],[423870,428170,"in other words, who has no arrows pointing at them."],[428170,430980,"So in order to implement this idea in C, we're"],[430980,433720,"going to need to use some data structures and variables."],[433720,435720,"So let's take a look at the data structures"],[435720,438420,"that you're going to be using in this program."],[438420,442170,"The first that you're going to have access to is an array of candidates."],[442170,444690,"Candidates is an array of strings that is just"],[444690,446963,"an array of all of the candidates names."],[446963,448380,"So if there are three candidates--"],[448380,452160,"Alice, Bob, and Charlie, you might have Alice as candidate number 0,"],[452160,456720,"Bob as candidate number 1, and Charlie as candidate number 2, for example."],[456720,460380,"You're also going to have access to a variable called preferences."],[460380,464520,"And preferences is a two-dimensional array of integers interpreted"],[464520,465540,"as follows--"],[465540,471510,"preferences [i][j] is the number of voters who prefer a candidate i over"],[471510,472800,"candidate j."],[472800,476800,"Let's take a look at an example to see what that actually means in context."],[476800,479160,"Here's an example of an election with three candidates--"],[479160,481890,"Alice, Bob, and Charlie, And four voters."],[481890,484470,"And based on these four ballots, you might fill"],[484470,487890,"in the preferences' two-dimensional array as follows--"],[487890,490860,"this first row preference, of 0, represents"],[490860,495360,"preferences for Alice, who's candidate number 0 in the candidates array."],[495360,498810,"That first cell, also with 0, means that 0 people"],[498810,502050,"think that Alice is better than Alice, which makes sense."],[502050,505140,"The next cell in this row 3, means that three voters"],[505140,506970,"think that Alice is better than Bob."],[506970,509190,"And the final cell here means that three voters"],[509190,511590,"think Alice is better than Charlie."],[511590,513990,"The second row, meanwhile, preferences square bracket"],[513990,516690,"1, that represents preferences for Bob."],[516690,518970,"One voter thinks Bob is better than Alice."],[518970,520950,"Nobody thinks Bob is better than Bob."],[520950,523919,"And one voter thinks Bob is better than Charlie."],[523919,527430,"And finally, this last row in the preferences two-dimensional array"],[527430,529500,"represents preferences for Charlie."],[529500,531990,"One voter thinks Charlie is better than Alice."],[531990,534450,"Three voters think Charlie is better than Bob."],[534450,537690,"And nobody thinks Charlie is better than Charlie."],[537690,540510,"This two-dimensional array now captures all"],[540510,543600,"of the data we need about individual voter preferences"],[543600,546210,"to determine what the pairs are and who is"],[546210,548820,"the winner of each pair in the election."],[548820,551430,"So we need now, some way to represent pairs."],[551430,554250,"And to do that, we've defined a struct for you."],[554250,556110,"This struct has two fields--"],[556110,560370,"winner and loser-- each of which is an integer representing the candidate"],[560370,564090,"index in that candidate's array, who is the winner or the loser"],[564090,566760,"for this particular pair, respectively."],[566760,569460,"Those pairs are going to be added to pairs,"],[569460,572250,"which is going to be an array of all of the pairs"],[572250,575770,"where one candidate is preferred above another."],[575770,579300,"In other words, if there's a pair where the two candidates tie and no one"],[579300,581160,"person is favored over the other, we're not"],[581160,584930,"going to bother adding that pair to the pairs array."],[584930,588650,"You're then going to use that pairs array to generate a graph."],[588650,590210,"This graph is called locked."],[590210,593330,"And this is going to be a two-dimensional Boolean array,"],[593330,595670,"representing the candidate graph."],[595670,599240,"And the way to interpret this two-dimensional array is that if locked"],[599240,604130,"[i][j] is true, that means we have locked in the edge or the arrow"],[604130,607850,"pointing from candidate i to candidate j."],[607850,611420,"So at first, all of the values in this two-dimensional Boolean array"],[611420,614720,"are going to be false, because we have no arrows pointing anywhere"],[614720,616400,"at the beginning of our algorithm."],[616400,620600,"But every time you want to add an arrow or an edge pointing from one candidate"],[620600,624650,"to another candidate, you're going to change the value of locked [i][j]"],[624650,628901,"to true, for some candidates i and j."],[628901,631530,"So let's take a look at the functions that you'll actually need"],[631530,633720,"to write in order to implement Tideman."],[633720,637500,"You're going to implement six functions-- vote, record_preferences,"],[637500,642240,"add_pairs, sort_pairs, lock_pairs, and print_winner, where"],[642240,644280,"after you've completed all of these functions,"],[644280,647440,"you'll have implemented the entire voting system."],[647440,650070,"So let's take a look at these functions one at a time,"],[650070,652020,"beginning with the vote function."],[652020,655740,"The vote function is going to be called every time a voter indicates"],[655740,659580,"that some candidate has some rank in their preferences."],[659580,661590,"The vote function takes in three inputs--"],[661590,663960,"the rank itself, the name of the candidate,"],[663960,668010,"as well as an array of all of that particular voter's ranks."],[668010,669930,"So what you're going to do in this function"],[669930,672450,"is you're going to look through the candidate's array"],[672450,675210,"for a candidate that has the same name."],[675210,678300,"And if you're able to find a candidate with the same name,"],[678300,681930,"you're going to update the ranks array for that particular voter,"],[681930,684150,"and your function should return true."],[684150,688350,"The way to interpret the ranks is that ranks [i]"],[688350,691200,"represents the voter's ith preference."],[691200,694170,"So rank 0 is the candidate's top preference."],[694170,698560,"Ranks 1 is the candidate's next preference, so on and so forth."],[698560,701100,"And if no candidate is found that matches"],[701100,703980,"the name that's provided as input to the function,"],[703980,706080,"you shouldn't update any ranks at all."],[706080,709950,"And instead, your function should just return false."],[709950,714390,"Ultimately, you're going to use this ranks in another function as the input"],[714390,716830,"to the record_preferences function."],[716830,719910,"This function is going to be called once for each voter."],[719910,722460,"And it takes as input, that users ranks."],[722460,724920,"All of their rankings for all of the candidates."],[724920,728100,"And what you're going to do in the record_preferences function"],[728100,731670,"is update the preferences two-dimensional array based"],[731670,733590,"on this current voter is ranks."],[733590,737280,"And this function again, is going to be called for each of the voters."],[737280,740550,"Let's take a look at an example for one particular voter."],[740550,744030,"Here's an example of one voter's ranks, where in this case,"],[744030,746970,"candidate number 3 is this voters top choice."],[746970,749040,"Candidate 0 is their second choice."],[749040,752560,"Candidate 4 is their third choice, so on and so forth."],[752560,754770,"And based on this ranks array, you're going"],[754770,759570,"to need to determine which candidates are preferred over other candidates."],[759570,762120,"And in this case, based on this particular array,"],[762120,764940,"we might notice that candidate 3, the top choice,"],[764940,771170,"is preferred over all of the other candidates-- candidate 0, 4, 1, and 2."],[771170,776150,"Meanwhile, candidate 0 is preferred over candidates 4, 1, and 2."],[776150,779390,"Candidate 4 is preferred over candidates 1 and 2."],[779390,782210,"Candidate 1 is preferred over candidate 2."],[782210,785450,"And candidate 2 is not preferred over anyone."],[785450,787850,"So for this particular ranks array, we were"],[787850,791270,"able to determine which candidates are preferred over others."],[791270,795300,"And we would have to update our preferences array accordingly."],[795300,798870,"After we have a representation of all of the voters preferences,"],[798870,801950,"the next step is going to be to look at each pair of candidates,"],[801950,805730,"determine who the winner or the loser, if any, are for that particular pair,"],[805730,809780,"and add them to the pairs array in the add_pairs function."],[809780,811850,"What the add_pairs function is going to do"],[811850,815870,"is it's going to add each pair of candidates to the pairs array,"],[815870,818270,"as long as one of the candidates is actually"],[818270,820980,"preferred over the other candidate-- in other words,"],[820980,825560,"as long as there's actually a winner and a loser for that particular pair."],[825560,829340,"This function should also update the global variable pair account"],[829340,834070,"to represent the total number of pairs that you added to the pairs array."],[834070,837350,"So for example, if we had a two-dimensional array of preferences"],[837350,840890,"as shown here, there are two pairs of candidates"],[840890,842540,"that have a winner and a loser."],[842540,845960,"There is this pair of 0 and 1 where candidate 0"],[845960,848090,"is preferred over candidate 1."],[848090,851040,"And we know that because looking at the preferences array,"],[851040,854810,"we can see that there are three voters that think that candidate 0 is"],[854810,856250,"better than candidate 1."],[856250,858590,"But there's only one voter who thinks the candidate"],[858590,861050,"1 is better than candidate 0."],[861050,863360,"The other pair that we could add to the pairs array"],[863360,867770,"is the pair of candidates 2 and 0, where candidate 2 is the winner,"],[867770,869540,"and 0 is the loser."],[869540,872910,"And again, we know that by looking at the preferences array."],[872910,876560,"We can see that there are three voters that think that candidate 2 is"],[876560,878240,"better than candidate 0."],[878240,881720,"And there's only one voter who thinks that candidate 0 is"],[881720,884340,"better than candidate 2."],[884340,887880,"The next step after we've added all of the pairs to the pairs array"],[887880,889860,"is to sort all of those pairs."],[889860,893070,"And we're going to do that in the sort_pairs function."],[893070,896910,"What this function is going to do is it is going to sort the pairs in order"],[896910,899220,"by decreasing strength of victory."],[899220,901380,"And you can measure the strength of a victory"],[901380,904980,"by looking at how many people preferred the winner of that pair"],[904980,906390,"over the loser of the pair."],[906390,909900,"If more people prefer the winner, it's a stronger victory."],[909900,913410,"You can use any sorting algorithm you'd like in order to sort those pairs."],[913410,915540,"But at the end of the sort_pairs function,"],[915540,919200,"the pairs array should be sorted in order from strongest victory"],[919200,920960,"to weakest victory."],[920960,924710,"Ultimately, we're going to use that sort of array in the next function--"],[924710,925790,"lock_pairs--"],[925790,928400,"which is going to go through those pairs one at a time"],[928400,930590,"and lock them into the graph."],[930590,933050,"In particular, the lock_pairs function is"],[933050,937400,"responsible for updating the locked two-dimensional Boolean array in order"],[937400,940880,"to create the locked graph by adding all of the edges"],[940880,944210,"in decreasing order of victory strength, as long as adding"],[944210,946250,"that edge won't create a cycle."],[946250,949490,"If adding a particular edge between one candidate and another"],[949490,952490,"would ultimately create a cycle inside of the candidate graph,"],[952490,953960,"you shouldn't add that edge."],[953960,956550,"And you should skip and move on to the next one."],[956550,959960,"So you'll need some mechanism inside of your lock_pairs function"],[959960,964160,"to detect whether or not adding an edge is going to lead to a cycle"],[964160,968660,"where you could follow some path to get back to that original candidate."],[968660,971130,"To take a look at an example, here on the left,"],[971130,973460,"you can see an example of a locked graph."],[973460,977400,"And on the right is the graphical representation of the same thing."],[977400,980210,"Notice that every time a true appears inside"],[980210,982370,"of the locked two-dimensional array, that"],[982370,986340,"represents an arrow pointing from one candidate to another."],[986340,989600,"So because locked 0, 1 is true, that means"],[989600,992300,"there is an arrow pointing from Alice to Bob."],[992300,996320,"Because locked 2, 0 is true, that means there's an arrow pointing"],[996320,997880,"from Charlie to Alice."],[997880,1001090,"And because locked 2, 1 is also true, that"],[1001090,1005130,"means there's also an arrow pointing from Charlie to Bob."],[1005130,1007350,"After you've generated this locked graph,"],[1007350,1010680,"the final step is to print out the winner of the election."],[1010680,1013110,"Recall again that the winner of the election"],[1013110,1017010,"is just going to be whichever candidate is the source of the graph."],[1017010,1019560,"And you can assume for the purposes of this program,"],[1019560,1021940,"that there will not be more than one source."],[1021940,1025589,"So there's only going to be one winner for the election."],[1025589,1028140,"And recall again, that the source of the graph"],[1028140,1033150,"is just whichever candidate doesn't have any arrows or edges pointing at them."],[1033150,1035490,"And so you might want to look at this graph"],[1035490,1040470,"to figure out which of the candidates has no arrow that's pointed at them."],[1040470,1044550,"Once you've implemented these six functions-- vote, record_preferences,"],[1044550,1048119,"add_pairs, sort_pairs, lock_pairs, and print_winner,"],[1048119,1050340,"you'll have implemented all that you need in order"],[1050340,1054240,"to simulate an election using the Tideman Voting System."],[1054240,1057740,"My name is Brian, and this was Tideman."]]},"LiGhjz9ColQ":{"edited":true,"zh":[[320,7230,"这次练习要用 C 写一个程序，调整音频文件的音量。"],[7230,14580,"我们要处理的是 WAV 文件。这是一种存储音频数据的标准文件格式。"],[14580,16950,"WAV 文件的结构是什么样的？"],[16950,19890,"和其他文件一样，WAV 文件也由字节组成。"],[19890,29160,"在这道题里，WAV 文件的前 44 个字节是文件头，里面记录着文件的相关信息。"],[29160,36480,"计算机上的程序需要这些信息，才能正确读取并解释这个文件。"],[36480,40860,"44 字节的文件头之后，就是音频采样，每个采样占 2 个字节。"],[40860,46530,"这些采样在文件中一个紧挨着一个排列。"],[46530,51800,"每个采样值表示音频波形在某一时刻的振幅。"],[51800,58990,"所以，这里的 WAV 文件以 44 字节的文件头开头，后面跟着许多 2 字节的采样。"],[58990,64760,"这些采样有个特点：每个采样其实就是一个数。"],[64760,71030,"要调整音量，就把采样值乘以一个系数。"],[71030,77350,"比如，想把一段音频的音量调到原来的两倍，"],[77350,82540,"就把文件中的每个采样值都乘以 2。"],[82540,88930,"同样，如果想把音量减半，就取出每个 2 字节的采样，"],[88930,96070,"分别乘以 0.5，也就是二分之一。这样音量就减半了。"],[96070,104740,"运行程序时，输入 ./volume，后面跟三个命令行参数。"],[104740,113550,"第一个参数是输入 WAV 文件，也就是你想调整音量的那个已有文件。"],[113550,117180,"第二个参数是输出文件的名称。"],[117180,123250,"程序会创建这个新的音频文件，把调整音量后的声音写进去。"],[123250,133140,"最后一个参数是浮点数，表示要把原始音量调到原来的多少倍。"],[133140,140170,"比如这里用 2.0，表示要把音量加倍。"],[140170,148920,"如果系数改用 0.5，音量就会减半。"],[148920,152550,"来看看这次练习具体要做什么。"],[152550,162870,"我们想让输出文件保留同一段声音，只调整音量。要先处理 WAV 文件头。"],[162870,169480,"输入文件最开头的 44 个字节就是文件头。"],[169480,173790,"所以第一步，从输入文件读取文件头。"],[173790,178580,"然后，把文件头原样写入输出文件。"],[178580,182180,"文件头后面是一个个 2 字节的采样。"],[182180,188760,"它们紧挨着排列在文件里，共同表示这段声音的波形。"],[188760,192080,"对每个 2 字节的采样，都要重复以下操作。"],[192080,197630,"先从输入文件读出采样，可以用一个变量来存放它。"],[197630,202580,"然后把采样值乘以音量系数。"],[202580,206510,"想把音量加倍，就把采样值乘以 2。"],[206510,208820,"想调到三倍，就乘以 3。"],[208820,213540,"想把音量减半，就乘以 0.5。"],[213540,219240,"乘完以后，把新的采样值写进输出文件。"],[219240,228760,"对整个文件的每个采样都这么做，输出文件里保存的就是调整音量后的采样。"],[228760,232700,"写这道题时，有几个技巧会用得上。"],[232700,239800,"先看看 C 提供的数据类型，它们可以用来处理不同大小的数据。"],[239800,248350,"比如，uint8_t 存储 8 位无符号整数，每个数正好占 1 个字节。"],[248350,252740,"只要想表示一个普通的数据字节，就可以用它。"],[252740,257589,"比如，要读入的文件头有 44 个字节，"],[257589,268190,"就可以用包含 44 个 uint8_t 元素的数组来保存它。"],[268190,272930,"int16_t 则用来存储有符号整数。"],[272930,279020,"它可以表示正数、零和负数，每个数占 16 位，也就是 2 个字节。"],[279020,283550,"这个类型很适合表示音频采样。"],[283550,286910,"因为我们知道，这里的每个采样正好占 2 个字节。"],[286910,293670,"int16_t 的大小刚好合适。"],[293670,297830,"接下来，还要处理文件的读写。"],[297830,303470,"这里有两个会用到的函数，分别叫 fread 和 fwrite。"],[303470,309870,"fread 从文件中读取指定数量的字节，放进计算机内存。"],[309870,314960,"相应地，fwrite 可以把内存中的数据写入指定文件。"],[314960,321830,"你可以查阅 fread 和 fwrite 的文档，看看它们需要什么参数、"],[321830,331180,"参数的顺序是什么，以及怎样读取输入文件，再把更新后的数据写进输出文件。"],[331180,335335,"现在来看看这次练习发给你的初始代码。"],[335335,342100,"在代码开头附近，有个名叫 HEADER_SIZE 的整型常量，值是 44。"],[342100,351810,"代码中凡是要用到 WAV 文件头的字节数，都可以写 HEADER_SIZE。"],[351810,355090,"在 main 函数里，我们已经帮你完成了一部分工作。"],[355090,360390,"首先，程序检查命令行参数的个数，"],[360390,368720,"确保用户提供了输入文件、输出文件，以及调整音量的系数。"],[368720,374050,"接下来打开输入文件，并检查是否成功。"],[374050,378563,"然后以 \"w\" 模式打开输出文件。w 代表写入。"],[378563,382900,"这里同样要确认，用来写入的文件已成功打开。"],[382900,390670,"接着，把表示音量系数的参数转换成浮点数。比如 2.0 表示音量加倍，"],[390670,393260,"0.5 表示音量减半。"],[393260,395210,"下面轮到你来写了。"],[395210,400700,"第一件事，是把输入文件的文件头复制到输出文件。"],[400700,404300,"记得这道题里的文件头固定占 44 个字节。"],[404300,408500,"可以用 fread 从输入文件读出 44 个字节，"],[408500,412850,"再用 fwrite 把这 44 个字节写进输出文件。"],[412850,415490,"接着逐个处理采样。"],[415490,421230,"可以用循环读取输入文件，一直读到文件末尾。"],[421230,426170,"对每个 2 字节的采样，把它读进内存，调整音量，"],[426170,430700,"再把更新后的采样写进输出文件。"],[430700,434500,"我们还提供了一个示例输入文件，叫 input.wav。"],[434500,437290,"你可以先播放它，听听原来的声音。"],[437290,441850,"然后用你的 volume 程序处理这个文件。传入系数 2.0，"],[441850,446110,"音量就会加倍。也可以换个系数，试试不同的音量。"],[446110,449110,"接下来，播放新生成的输出文件。"],[449110,454610,"你应该能听出来：还是原来那段声音，只是音量变了。"],[454610,462590,"完成这些步骤后，你就能用这个程序按给定的倍数调整 WAV 文件的音量了。"],[462590,463700,"我是 Brian。"],[463700,465500,"这就是 Volume。"]],"en":[[320,2070,"SPEAKER 1: In this lab, your task is going"],[2070,7230,"to be to write a program in C that changes the volume of an audio file."],[7230,9090,"Specifically, in this lab, we're going to be"],[9090,12870,"working with WAV files, a standard file format for representing"],[12870,14580,"audio information."],[14580,16950,"What is the structure of a WAV file?"],[16950,19890,"Well, like any file, these files consist of bytes."],[19890,24600,"And in particular, in a WAV file, the first 44 bytes of that file"],[24600,29160,"are the header for that WAV file that contain information about that file"],[29160,31530,"that your computer, or programs on your computer,"],[31530,36480,"might need to know in order to read and understand and interpret that file."],[36480,40860,"After the 44-byte header, are two byte samples of audio."],[40860,42810,"Many, many of these 2-byte samples of audio"],[42810,46530,"are repeated back to back to back, where each of these 2-byte samples"],[46530,51800,"represents the value of some audio waveform at a particular point in time."],[51800,56110,"So ultimately, your WAV file is going to consist of one 44-byte header followed"],[56110,58990,"by many of those 2-byte samples."],[58990,61930,"And the interesting thing about those 2-byte samples"],[61930,64760,"is that each one is really just a number."],[64760,67670,"And if you want to change the volume of a sample,"],[67670,71030,"you're going to multiply that sample by a number."],[71030,73510,"If I have an audio sample, and I want to double the volume,"],[73510,77350,"for example, I would take each of the samples of audio in the audio file"],[77350,81160,"that I'm trying to modify and just multiply each of those sample values"],[81160,82540,"by 2."],[82540,85000,"Likewise, if I'm trying to cut the volume in half"],[85000,88930,"for a particular audio file, then I'll take each of the 2-byte samples,"],[88930,94570,"and I'll multiply each by 0.5, or 1/2, in order to cut the volume in half"],[94570,96070,"as well."],[96070,99150,"Ultimately, the way your program is going to work is we're going to run"],[99150,104740,"our program as ./volume followed by three command line arguments."],[104740,107580,"The first command line argument is an input WAV file,"],[107580,111540,"some file that already exists representing the audio file that we're"],[111540,113550,"here going to try to modify."],[113550,117180,"The next command line argument is the name of some output file,"],[117180,119520,"some new audio file that our program is going"],[119520,123250,"to generate that is going to have the modified volume."],[123250,126060,"And finally, the last command line argument to this program"],[126060,128759,"is going to be a floating point number representing"],[128759,133140,"the factor by which to change the volume of the original audio file."],[133140,136830,"In this case, for example, we're using a factor of 2.0"],[136830,140170,"to mean we want to double the volume of the audio file."],[140170,144420,"But if instead we had tried to use 0.5, for example, as the factor,"],[144420,148920,"then we would be cutting the volume of the audio file in half."],[148920,152550,"So here's what you're going to need to do in this lab."],[152550,155220,"In order to take the input file and then generate"],[155220,158940,"a new output file that's the same audio but just with the volume"],[158940,162870,"changed, you're going to want to start with the header of that WAV file,"],[162870,165720,"since the header, those first 44 bytes of the file"],[165720,169480,"are the first thing you'll find inside the input WAV file."],[169480,173790,"So you'll initially want to read the header from the input file."],[173790,178580,"And then you'll want to write that exact same header to the output file."],[178580,182180,"After the header, recall, comes each of those 2-byte samples,"],[182180,184850,"many 2 byte samples, back-to-back in the file,"],[184850,188760,"representing the audio waveform of the file itself."],[188760,192080,"So you'll want to repeat, for each of those 2-byte samples,"],[192080,195260,"you'll want to first read the sample from the input file,"],[195260,197630,"likely into some sort of variable."],[197630,202580,"And then, you'll want to multiply that sample value by the volume factor."],[202580,205010,"If you're trying to double the volume of the sample,"],[205010,206510,"then you'll double that volume."],[206510,208820,"If you're trying to triple it, you'll multiply it by 3."],[208820,210630,"If you're trying to cut the volume in half,"],[210630,213540,"you'll multiply by 0.5, for example."],[213540,215510,"And after you've done that multiplication,"],[215510,219240,"you'll then write that new sample to the output file."],[219240,222200,"So that the updated sample, with the modified volume,"],[222200,226460,"ends up being written to the output file for each of the samples of audio"],[226460,228760,"in that entire file."],[228760,232700,"As you go about working on this lab, a couple of techniques will be helpful."],[232700,235420,"One is taking advantage of the various different types"],[235420,239800,"that C gives you for dealing with data of different sizes."],[239800,245380,"uint8_t, for example, is a type that stores unsigned integers that"],[245380,248350,"are 8 bits, or 1-byte large."],[248350,252740,"And this is useful anytime you want to represent just a generic byte of data."],[252740,257589,"For example, if you're trying to read in a header that has 44 bytes of data,"],[257589,263440,"you might use an array of 44 of these unsigned integers of 8-bit size"],[263440,268190,"as uint8_ts, inside of an array, to store your header."],[268190,272930,"Meanwhile, int16_t is a type that stores signed integers,"],[272930,279020,"meaning they could be positive or 0 or negative, of 16-bits, or 2-bytes, each."],[279020,283550,"And ultimately, this is a great choice of type for representing your samples."],[283550,286910,"Because we know that each sample is 2 bytes large."],[286910,293670,"And int16_t is the perfect size for representing this kind of information."],[293670,297830,"Next you're also going to want to deal with reading and writing files."],[297830,303470,"And for that, these two functions will likely prove helpful, fread and fwrite."],[303470,307520,"fread will read a certain number of bytes from some file"],[307520,309870,"into memory inside of your computer."],[309870,313340,"And likewise, fwrite can write data from your computer's memory"],[313340,314960,"to a particular file."],[314960,317720,"And you'll likely want to look to the documentation for each"],[317720,321830,"of these functions, fread and fwrite to get an understanding for what arguments"],[321830,325940,"they take in what order and how you might use these functions to read"],[325940,331180,"from the input file and then write your updated data to your output file."],[331180,333280,"Now let's take a look at the distribution code"],[333280,335335,"that we give to you as part of this lab."],[335335,337210,"You'll notice that one of the first things we"],[337210,342100,"give you is a constant integer called HEADER_SIZE, equal to 44."],[342100,344380,"You can use this variable anytime you need"],[344380,348280,"to reference the number of bytes inside of the header of a WAV file"],[348280,351810,"as this constant integer called HEADER_SIZE."],[351810,355090,"Inside of the main function, we've already done some work for you."],[355090,357480,"First, checking the number of command line arguments"],[357480,360390,"to ensure that when the user is running this program,"],[360390,363210,"they're providing an input file, an output file,"],[363210,368720,"as well as some factor by which to change the volume of the input file."],[368720,371860,"We then open the input file, checking to make sure that the input"],[371860,374050,"file was able to be opened correctly."],[374050,378563,"We then open the output file using the W mode, W for writing that file,"],[378563,380980,"in order to make sure that we can open the file that we're"],[380980,382900,"going to be writing to correctly."],[382900,385480,"And then we compute the factor, converting that factor"],[385480,390670,"to a floating point number like 2.0 for doubling the volume or 0.5"],[390670,393260,"for cutting the volume in half."],[393260,395210,"Here, then, are your to dos."],[395210,399200,"The first thing you want to do is to copy the header from the input file"],[399200,400700,"to the output file."],[400700,404300,"Recall that you know that header is always going to be 44 bytes."],[404300,408500,"So you'll likely want to use fread to read 44 bytes from your file"],[408500,412850,"and then fwrite to write 44 new bytes to the output file."],[412850,415490,"Then you'll want to go through each of the samples,"],[415490,418520,"likely using some kind of loop to loop through the input"],[418520,421230,"file until you get to the end of the file."],[421230,426170,"And for each of those 2-byte samples, to read it into memory, update the volume,"],[426170,430700,"and then write that updated sample to the output file as well."],[430700,434500,"You'll notice that we provide you with a sample input file, input.wav,"],[434500,437290,"which you can listen to as just a sample of audio."],[437290,441850,"And you can run your volume program on this file, passing in a factor of 2.0"],[441850,443830,"to double the volume, or some other factor"],[443830,446110,"to change the volume by a different amount."],[446110,449110,"And then you should be able to listen to that new output file"],[449110,452830,"and detect that it does, in fact, have the same audio, just"],[452830,454610,"with a different volume."],[454610,456440,"After you've done all of those steps, you"],[456440,459500,"should then have a program that you can take any WAV file"],[459500,462590,"and change the volume by a particular factor."],[462590,463700,"My name is Brian."],[463700,465500,"And this was volume."]]},"-rtZkTAK2gg":{"edited":true,"zh":[[500,3970,"我们来看看 Volume 这道题可以怎么做。"],[3970,9660,"题目要求我们接收一个音频文件， 把它的音量按指定倍数调整。"],[9660,13090,"音量可以调大，也可以调小。"],[13090,17370,"我们来看 volume.c 里的一种写法。"],[17370,21060,"main 函数开头的代码已经给好了。"],[21060,24480,"接下来，你要先处理文件头。"],[24480,27570,"从输入文件读出文件头，"],[27570,30870,"再把它写入输出文件。"],[30870,37830,"首先，得在内存中留出一块空间， 用来存放读进来的文件头。"],[37830,42870,"所以这里先声明一个叫 header 的数组。"],[42870,49260,"数组元素是 uint8_t 类型， 即 8 位无符号整数，每个元素占一个字节。"],[49260,51720,"那么，header 需要留出多少字节？"],[51720,54450,"需要 HEADER_SIZE 个字节。"],[54450,58380,"还记得吗？HEADER_SIZE 是整数常量，值是 44。"],[58380,61380,"这就是题中 WAV 文件的文件头大小。"],[61380,64709,"这里也可以直接写 header[44]。"],[64709,71460,"但用 HEADER_SIZE 更好， 这样就不用在代码里反复写 44。"],[71460,76710,"现在有了一块存放文件头的内存， 我们通常称它为“缓冲区”。"],[76710,81450,"接下来，要从输入文件读取数据，填入缓冲区。"],[81450,86160,"这里从输入文件读取 HEADER_SIZE 个字节，"],[86160,93290,"存进刚才创建的 header 数组。"],[93290,100540,"数据读进内存后，就可以调用 fwrite，"],[100540,104950,"把 header 里的内容原样写入输出文件。"],[104950,109750,"要写入多少字节呢？同样是 HEADER_SIZE 个。"],[109750,113680,"这几行会从输入文件开头读出 44 个字节，"],[113680,119910,"再把它们复制到输出文件的前 44 个字节。"],[119910,125550,"输入文件的文件头后面，紧接着就是音频数据。"],[125550,128919,"这些字节保存着音频的采样值。"],[128919,135210,"每个采样值占两个字节。我们把它读入内存， 修改它的值来调整音量，"],[135210,138100,"然后写入新的音频文件。"],[138100,141270,"这里先创建另一个缓冲区。"],[141270,144330,"这次用不着留出 44 个字节，"],[144330,148270,"只要能放下一个两字节的采样值就够了。"],[148270,155570,"所以可以用 int16_t， 它能存放一个 16 位有符号整数。"],[155570,158800,"接下来的操作会放在循环里重复执行。"],[158800,162730,"我们用 fread 从输入文件读取数据。"],[162730,165740,"要让它把数据读进 buffer，就传入 buffer 的地址。"],[165740,169120,"这样 fread 才知道要把读到的数据放在哪里。"],[169120,176530,"每次读一个采样值，占 16 位，也就是两个字节。"],[176530,181750,"因为读取操作在循环里，程序会不断读取采样值，"],[181750,185710,"一个接一个地读，直到文件末尾。"],[185710,190790,"fread 的返回值是它成功读到的数据项个数。"],[190790,196030,"等到文件里再也读不出数据时，fread 就返回 0。"],[196030,200990,"while 会把 0 视为假，于是程序退出循环。"],[200990,205030,"在一次成功的读取之后，采样值就存在 buffer 里。"],[205030,208930,"接下来，把 buffer 的值乘以 factor，再存回 buffer。"],[208930,211870,"如果 factor 是 2，音量就变为原来的两倍。"],[211870,215530,"如果 factor 在 0 和 1 之间，音量就会变小。"],[215530,221840,"factor 可以取不同的浮点数， 从而按不同比例调整这个采样值。"],[221840,227590,"修改好采样值后，还要把新值写入输出文件。"],[227590,233320,"这里再次调用 fwrite，把 buffer 里的数据写出去。"],[233320,235240,"这次写多少数据呢？"],[235240,241690,"写入的大小等于一个 int16_t，也就是两个字节。"],[241690,245080,"最后，关闭文件的代码已经给你写好了。"],[245080,251020,"现在运行程序时，你可以指定输入音频文件，"],[251020,255760,"再给出输出文件的新名字，以及调整音量的倍数。"],[255760,263115,"这样就能生成一个新文件， 声音内容跟原来一样，音量按指定倍数改变。"],[263115,266500,"我是 Brian。以上就是 Volume。"]],"en":[[500,3970,"BRIAN: Let's take a look at how you might have solved the volume problem."],[3970,6780,"In this problem, your task was to take an audio file"],[6780,9660,"and modify its volume by a particular factor,"],[9660,13090,"increasing or decreasing the volume of the audio file."],[13090,17370,"So let's now take a look at the solution inside of volume.c."],[17370,21060,"We gave you some of the initial code inside of the main function already,"],[21060,24480,"but the first thing you needed to do was to deal with the header,"],[24480,27570,"to be able to read the header from the input file,"],[27570,30870,"and to write that header to the output file."],[30870,32729,"The first thing you might have needed to do"],[32729,35610,"was to create some place in your computer's memory"],[35610,37830,"into which to read that header."],[37830,40710,"And so the first thing we have here is the declaration"],[40710,42870,"of an array called \"header.\""],[42870,49260,"Its type is uint8_t, a type for unsigned 8-bit integers just representing bytes."],[49260,51720,"And how many bytes do we want in the header?"],[51720,54450,"Well, we want header-size bytes."],[54450,58380,"Recall that header size, is a constant integer just equal to 44."],[58380,61380,"That's the number of bytes in the header of a WAV file."],[61380,64709,"So we could have written header 44 here, but it's slightly better"],[64709,66840,"designed to take advantage of this constant"],[66840,71460,"rather than reuse the number over and over by just saying header size."],[71460,76710,"So we now have this buffer, as we might call it, to represent the header."],[76710,81450,"And now we need to read that buffer from the input file."],[81450,86160,"And so here we're reading header size bytes from the input file,"],[86160,91440,"and we're going to go ahead and read it into the header variable"],[91440,93290,"that we've created here."],[93290,95740,"And after we've read it into memory, then we"],[95740,100540,"can write that same data to the output file calling the fwrite function"],[100540,104950,"and then writing the contents of that header to the output file."],[104950,106780,"And how many bytes are we going to write?"],[106780,109750,"Well, we're going to write header-size bytes."],[109750,113680,"Those lines are going to have the effect of reading 44 bytes from the input"],[113680,119910,"file, and then copying them into the first 44 bytes of the output file."],[119910,122880,"Next, after the header of an input file is"],[122880,125550,"going to come all of the bytes of data, the sample"],[125550,128919,"bytes that are contained within the audio file as well."],[128919,131250,"And for each of those two-byte samples, we"],[131250,135210,"want to read that sample into memory, modify it to adjust its volume,"],[135210,138100,"and then write it to the updated file."],[138100,141270,"So here, we're going to start by creating another buffer."],[141270,144330,"This time the buffer doesn't need to store 44 bytes of data."],[144330,148270,"It just needs to store enough data for a two-byte sample."],[148270,151560,"And for that, we can use the int16_t type"],[151560,155570,"for a type that stores an integer with 16 bits."],[155570,158800,"And now we're going to repeat this inside of a loop."],[158800,162730,"We're going to use the fread function to read from the input file"],[162730,165740,"into the buffer, passing in the address of the buffer."],[165740,169120,"So that fread knows where to put the memory that it's reading."],[169120,176530,"And we're going to read one sample of 16 bits, in other words, two bytes."],[176530,178750,"And because this is in a loop, the effect"],[178750,181750,"this loop is going to have is it's going to repeatedly read"],[181750,185710,"a sample, one sample after another, until we reach the end of the file."],[185710,188950,"fread returns to us the number of blocks of data"],[188950,190790,"it was able to read successfully."],[190790,194320,"And so once it's no longer able to read any more data from the file,"],[194320,196030,"fread will return 0."],[196030,198760,"And at that point, \"while\" is going to treat that as false,"],[198760,200990,"and we'll exit the loop."],[200990,205030,"So now we've read the sample into memory as this variable \"buffer,\""],[205030,208930,"and now we need to update the buffer by multiplying it by \"factor.\""],[208930,211870,"If factor is 2, that has the effect of doubling the volume."],[211870,215530,"If factor is less than 1, it has the effect of decreasing the volume."],[215530,218110,"So factor could be some other floating-point number"],[218110,221840,"to change the value of this particular sample."],[221840,224360,"And once we've changed the value of the sample,"],[224360,227590,"now we just need to write that updated data to the output"],[227590,232060,"file, again, using fwrite to do so, writing data from the buffer"],[232060,233320,"to the output file."],[233320,235240,"And how much data are we writing?"],[235240,239110,"Well, it's however big an int16_t is, which in this case,"],[239110,241690,"is going to be 2 bytes."],[241690,245080,"After that, we wrote the code to close the files for you already."],[245080,247240,"So now when you run this program, you should"],[247240,251020,"be able to specify an input audio file, specify a new file"],[251020,254380,"name for an output audio file, as well as a factor by which"],[254380,255760,"to change that volume."],[255760,258730,"And you should be able to generate new audio files that"],[258730,262150,"have the same audio but just with a different volume compared"],[262150,263115,"to the original."],[263115,266500,"My name is Brian, and this was volume."]]},"K0v9byp9jd0":{"edited":true,"zh":[[500,1980,"我们来看看 Filter 这道题。"],[1980,8520,"你要给一张位图应用几种不同的滤镜。"],[8520,12995,"用灰度滤镜把彩色图像转换成黑白图像。"],[12995,19050,"用棕褐色滤镜给图像加上红褐色调，看起来像张老照片。"],[19050,23490,"还要将图像左右翻转，得到原图的镜像。"],[23490,29740,"最后用模糊滤镜使画面柔和一些，细节也没那么清晰。"],[29740,35040,"这就是本题的四部分：grayscale、sepia、reflect 和 blur。"],[35040,38640,"到底怎么给图像应用滤镜呢？"],[38640,44580,"回想一下，图像就是由许多像素按行和列排列而成的。"],[44580,46770,"怎样表示一个像素？"],[46770,51670,"对屏幕上的每个像素，我们用三个数来表示它的颜色，也就是三个颜色通道。"],[51670,60940,"三个通道分别是红、绿、蓝。每个通道从 0 到 255， 0 表示完全没有这种颜色，255 表示强度最大。"],[60940,65760,"比如，把红色分量设成一个较小的值，像素里就有一点红色。"],[65760,74190,"值越大，红色分量就越强，直到 255 达到最大值。"],[74190,77470,"把它调回 0，这个像素就又变黑了。"],[77470,82000,"为什么通道的取值是 0 到 255？"],[82000,86590,"因为 0 的二进制表示还是 0，"],[86590,91060,"而用二进制表示 255，正好是连续八个 1。"],[91060,98570,"所以红、绿、蓝每个分量都可以用一个字节，也就是 8 位来表示。"],[98570,103630,"三个分量合起来，每个像素就是 3 个字节，也就是 24 位。"],[103630,108320,"你可能听过“24 位色”，指的就是这个。"],[108320,113000,"红色通道控制像素里有多少红色，"],[113000,116800,"绿色通道控制有多少绿色，"],[116800,120820,"蓝色通道则控制有多少蓝色。"],[120820,128350,"这三个通道可以搭配使用，组合出各种各样的颜色。"],[128350,133520,"比如让红色分量多一些，加上一点蓝色，就得到画面上的颜色。"],[133520,140330,"如果有很多绿色、很多蓝色和一点红色，就能调出这种青绿色。"],[140330,151670,"如果三个通道都取最大值 255，就得到一个纯白色的像素。"],[151670,164070,"把许多像素设成适当的颜色，再排在相应的位置上， 就能组成一幅看得出内容的图像。"],[164070,167970,"做这道题要用到哪些文件？"],[167970,172890,"bmp.h 里存放的是位图格式的相关定义，"],[172890,178760,"其中有几个结构体，是做这道题要用到的。"],[178760,184310,"filter.c 提供了运行这些滤镜的主程序。"],[184310,192930,"它负责读入图像，调用函数应用滤镜， 再将处理好的图像作为一个新文件写到磁盘上。"],[192930,203630,"helpers.c 里放的是四个滤镜的实现函数：模糊、镜像、棕褐色和灰度。"],[203630,215210,"helpers.h 是头文件，声明了 helpers.c 中所有滤镜函数， 给出了各个函数的返回类型和参数类型。"],[215210,226310,"题目还提供了 Makefile。运行 make， 就能把各个文件编译成一个可执行程序，给自己的图片应用滤镜。"],[226310,231570,"其他文件已经写好。你需要动手补完的是 helpers.c。"],[231570,235070,"那么，实现滤镜的代码该怎么写呢？"],[235070,243500,"bmp.h 中已经定义了一个叫 RGBTRIPLE 的结构体， 表示一个带有红、绿、蓝三个分量的像素。"],[243500,246020,"这个结构体有三个成员。"],[246020,250025,"rgbtBlue 表示蓝色分量，"],[250025,253490,"rgbtGreen 表示绿色分量，"],[253490,257510,"rgbtRed 表示红色分量。"],[257510,263720,"每个成员都占一个字节，也就是 8 位。"],[263720,271670,"你要在 helpers.c 中实现四个函数：grayscale、sepia、reflect 和 blur。"],[271670,274580,"这几个函数都接收三个参数。"],[274580,286010,"两个整数 height 和 width，以及一个由 RGBTRIPLE 组成的二维数组。 也就是由 height 行、width 列像素组成的图像。"],[286010,296970,"图像就像画面上的二维数组。它的高度和宽度都作为参数传给函数。"],[296970,303110,"假设这个存放图像的二维数组叫 image，那么 image[0] 就表示第一行。"],[303110,309020,"image[1] 表示第二行，image[2] 表示第三行，依此类推。"],[309020,312500,"那要怎么取得最后一行？"],[312500,322710,"图像一共有 height 行，下标从 0 开始， 所以最后一行就是 image[height - 1]。"],[322710,328170,"现在已经能找到某一行了，那怎么找到其中一个特定的像素？"],[328170,332880,"image[0] 是一行，这一行本身又是一个数组。"],[332880,340550,"既然 image[0] 是第一行，image[0][0] 就是这一行的第一个像素。"],[340550,347010,"image[0][1] 是这一行第二个像素，image[0][2] 是第三个，以此类推。"],[347010,350660,"用这种写法能访问图里的任意一个像素。"],[350660,358180,"比如，image[2][3] 表示行下标为 2、列下标为 3 的像素。"],[358180,363630,"找到一个像素后，怎样修改它的颜色？"],[363630,371400,"还记得吗？像素是结构体，其中包含 rgbtRed、rgbtGreen 和 rgbtBlue。"],[371400,374970,"访问结构体的成员要用点号。"],[374970,381120,"比如，给 image[2][3].rgbtRed 赋值，就能更改这个像素的红色分量。"],[381120,384280,"绿色和蓝色分量也可以这样改。"],[384280,394680,"如果将红、绿、蓝三个值都设为 0，这个像素就会变黑。 因为黑色对应的正是三个分量全为 0。"],[394680,412760,"每个滤镜函数都接收这幅二维像素数组作为输入。 你要修改数组里的像素，实现相应的滤镜效果。"]],"en":[[500,1980,"SPEAKER 1: Let's dive into filter."],[1980,5400,"In filter, your task is going to be to take a bitmap image"],[5400,8520,"and apply some number of different filters to that image."],[8520,11670,"You'll apply a filter to take an image and convert it into grayscale,"],[11670,12995,"making it black and white."],[12995,15120,"You'll take the image and apply a filter to turn it"],[15120,19050,"into sepia, giving everything a reddish brown, old time feel to it."],[19050,21540,"You'll take the image and reflect it, getting the mirror"],[21540,23490,"image of the original picture."],[23490,26490,"And finally, you'll apply a blur filter that will take the image"],[26490,29740,"and soften it so the details are a little bit less clear."],[29740,32009,"So these are the four parts of this project."],[32009,35040,"Grayscale, sepia, reflect, and blur."],[35040,38640,"But how do you go about applying filters to images at all?"],[38640,41160,"Well, every image, remember, is just a sequence"],[41160,44580,"of individual pixels arranged into a particular grid."],[44580,46770,"And how do we represent a pixel?"],[46770,50190,"Well, on a computer screen, every pixel has three values,"],[50190,51670,"which we might call channels."],[51670,54780,"A red channel, a green channel, and a blue channel,"],[54780,56850,"where those values range from 0--"],[56850,59250,"meaning none-- to 255--"],[59250,60940,"meaning the maximum."],[60940,63120,"If we set the red value to a small value,"],[63120,65760,"you'll see that we have a little bit of red in the pixel."],[65760,68490,"A higher red value means more red in the pixel."],[68490,74190,"And 255 means we have as much red as we possibly can in this particular pixel."],[74190,77470,"We set it back to 0, and the pixel goes back to black."],[77470,82000,"Why is it that each channel value goes from 0 to 255?"],[82000,86590,"Well, 0 represented in binary is just 0, as you might imagine."],[86590,91060,"And 255 represented in binary is eight 1s,"],[91060,95710,"which means that for each color value, we can use one byte or 8 bits"],[95710,98570,"for each color-- red, green, and blue."],[98570,103630,"And since we have three of those, we can use three bytes or 24 bits per pixel."],[103630,106280,"So if you've ever heard the term 24-bit color,"],[106280,108320,"that's what this is referring to."],[108320,113000,"So we can use the red channel to control how much red is in this pixel."],[113000,116800,"We can use the green channel to control how much green is in the pixel."],[116800,120820,"And we can use the blue channel to control how much blue is in the pixel."],[120820,124120,"But of course, we don't need to just use one of the channels at a time."],[124120,128350,"We can use them in combination to create any number of different colors."],[128350,130840,"If we have a lot of red and a little bit of blue,"],[130840,133520,"we have a color that looks a little something like this."],[133520,136930,"And if we have a lot of green and a lot of blue but just a little bit of red,"],[136930,140330,"then we get a turquoise color that looks a little something like this."],[140330,143480,"And if we set each of the channel values of red, green,"],[143480,148030,"and blue to the maximum value of 255, well, that pixel"],[148030,151670,"is just going to be a pure white pixel."],[151670,155120,"If we take enough of these pixels, set them to the right color value,"],[155120,157340,"and arrange them in the appropriate order,"],[157340,159770,"the result is that we can actually see an image that"],[159770,164070,"looks like something by arranging colors in the correct position."],[164070,167970,"So what files do you actually need to work with in this problem?"],[167970,172890,"Well, there's bmp.h, which is going to store information about bitmap images."],[172890,175220,"It's going to store some of the structs that you're"],[175220,178760,"going to need to deal with in order to complete this assignment."],[178760,181820,"We've also given you filter.c, which is the program you'll"],[181820,184310,"run to actually run these filters, which is going"],[184310,187190,"to take care of the logic of reading the file from memory,"],[187190,191210,"calling a function to apply a filter, and then writing the new image to disk"],[191210,192930,"as a brand new file."],[192930,195980,"Helpers.c is the file that actually contains"],[195980,198410,"all of the functions that are going to implement"],[198410,202310,"each of the filters for this assignment-- blur, reflection, sepia,"],[202310,203630,"grayscale."],[203630,206120,"Helpers.h is the header file that's going"],[206120,209870,"to declare all of the functions that show up in helpers.c, telling you"],[209870,212240,"what the return type of the function is and what"],[212240,215210,"all of the types of the arguments for the functions are."],[215210,218030,"Finally, we've given you a makefile, which when you run make"],[218030,220910,"is going to take all of these files and combine them together"],[220910,225050,"into an executable that you can run to actually apply these filters to images"],[225050,226310,"of your very own."],[226310,229700,"We've completed all of the files except for helpers.c,"],[229700,231570,"and that's where you come in."],[231570,235070,"So how are you actually going to write the code to implement these filters?"],[235070,238130,"Well, in bmp.h, we've defined a struct for you"],[238130,241550,"called RGBTRIPLE, which is going to represent a pixel that"],[241550,243500,"has a red, green, and blue value."],[243500,246020,"You'll notice that this struct has three fields."],[246020,250025,"A field called rgbtBlue representing the amount of blue in the triple,"],[250025,253490,"a field called rgbtGreen representing the amount of green,"],[253490,257510,"and a field called rgbtRed representing the amount of red."],[257510,260930,"Each field stores a byte worth of information-- remembering"],[260930,263720,"that a byte is really just 8 bits."],[263720,267980,"Your task is going to be to implement the four functions in helpers.c;"],[267980,271670,"grayscale, sepia, reflect, and blur."],[271670,274580,"Each of these functions takes three arguments."],[274580,278930,"An integer called height, an integer called width, and a two dimensional"],[278930,280790,"array of RGBTRIPLES--"],[280790,286010,"a 2D array of pixels where there are height rows and width columns."],[286010,288650,"So your image might look a little something like this."],[288650,291620,"A two dimensional array which has a particular height, which"],[291620,295070,"will be an argument to your function, and has a particular width, which"],[295070,296970,"will also be an argument."],[296970,299600,"So if we have an image which is a two dimensional array,"],[299600,303110,"image[0] is going to represent the first row of that image."],[303110,305420,"Image[1] represents the second row."],[305420,307410,"Image[2] represents the third row."],[307410,309020,"So on and so forth."],[309020,312500,"How, for example would you get the last row in the image?"],[312500,316340,"Well, if there are height many rows in the image and we start counting from"],[316340,320690,"row 0, then the last row in the image is going to be image[height-1],"],[320690,322710,"for example."],[322710,324530,"So that's how you get a row of the image."],[324530,328170,"But how do you get at a very particular pixel in that image?"],[328170,332880,"Well, image[0] is a row of the image, which itself is just an array."],[332880,335510,"So if image[0] is the first row of the image,"],[335510,340550,"image[0][0] is going to be the first pixel in that first row."],[340550,343280,"Image[0][1] is the second pixel in the row."],[343280,345740,"Image[0][2] is the third pixel in the row."],[345740,347010,"So on and so forth."],[347010,350660,"And we can use this notation to access any pixel in the image."],[350660,356120,"Image[2][3], for example, is the pixel in row 2 and column 3 of this"],[356120,358180,"particular image."],[358180,360420,"So if we have a pixel, how do we actually"],[360420,363630,"modify the pixel to change its color values?"],[363630,367530,"Well, recall that every pixel is really just a struct that has values"],[367530,371400,"rgbtRed, rgbtGreen, and rgbtBlue."],[371400,374970,"So to access the properties of a struct, we can use dot notation."],[374970,381120,"Using image[2][3].rgbtRed to set the red value of the pixel equal to something."],[381120,384280,"And doing the same for the green and the blue values, for example."],[384280,386700,"If we set the red, green, and blue values all to 0,"],[386700,388560,"then we're going to turn this pixel black"],[388560,391830,"because black is the color represented by values of 0"],[391830,394680,"for each of red, green, and blue."],[394680,399810,"Your task in each of these functions-- grayscale, sepia, reflect, and blur--"],[399810,403620,"is going to be to take the image as input, as this two dimensional array,"],[403620,408060,"and modify the two dimensional array, changing the individual pixels in order"],[408060,412760,"to create the effect that you would get by applying one of these filters."]]},"A8LA2osnAwM":{"edited":true,"zh":[[120,3090,"你要实现的第一个滤镜叫 grayscale，也就是灰度滤镜。"],[3090,8280,"它会把彩色照片转换成只有黑、白和深浅灰色的照片。"],[8280,11080,"这个效果要怎么实现呢？"],[11080,16710,"来看一个像素。还记得吗？ 每个像素都有红、绿、蓝三个分量。"],[16710,20250,"三个值都是 0 时，像素就是黑色。"],[20250,26610,"如果三个值都取最大值 255，像素就是白色。"],[26610,34690,"有意思的是，只要红、绿、蓝三个值相等， 就能得到不同深浅的灰色。"],[34690,38220,"如果这三个值相等而且都比较小，"],[38220,42540,"得到的灰色就比较深，更接近黑色。"],[42540,48240,"如果三个值相等而且都比较大，得到的灰色就比较浅，"],[48240,50880,"更接近白色。"],[50880,58210,"所以，grayscale 要做的就是 让每个像素的红、绿、蓝三个分量相等。"],[58210,60900,"可是，应该把它们设成多少呢？"],[60900,66810,"你大概会希望，原来颜色较浅的地方转成浅灰色，"],[66810,71487,"原来颜色较深的地方转成深灰色。"],[71487,76410,"比如画面上这个颜色，适合用浅一点的灰色来表示。"],[76410,82130,"可以把红、绿、蓝三个分量都设成同一个较大的值。"],[82130,86570,"如果原来的颜色再暗一点，相应的灰色也应该深一点，"],[86570,89980,"三个分量的值就都应该小一些。"],[89980,98120,"一种做法是算出这个像素的红、绿、蓝三个分量的平均值，"],[98120,102478,"然后把三个分量都设成这个平均值。"],[102478,104020,"具体怎么算呢？"],[104020,113230,"拿这种绿色举例。它的红色分量是 50， 绿色分量是 190，蓝色分量是 90。"],[113230,119980,"把三个分量加起来再除以 3，得到的平均值是 110。"],[119980,123280,"所以，把这个像素转成灰度时，"],[123280,127840,"先把红色分量设为 110，"],[127840,133240,"再把绿色和蓝色分量也都设为 110。"],[133240,140350,"这样得到的灰色，明暗程度就和原来的像素差不多。"],[140350,147010,"当然，算出来的平均值有时并不是整数。"],[147010,150820,"比如画面上这个例子，平均值约为 109.67。"],[150820,157670,"还记得吗？红、绿、蓝每个分量 都得是 0 到 255 之间的整数。"],[157670,163330,"所以，当平均值不是整数时，要先四舍五入，"],[163330,167410,"用最接近的整数作为新的分量值。"],[167410,170650,"这就是把单个像素转换成灰度的方法。"],[170650,173200,"那整张图像要怎么处理？"],[173200,176360,"可以用一个循环，逐行处理图像。"],[176360,182650,"从第一行开始，接着处理下一行， 依次把每一行都转换成灰度。"],[182650,186760,"处理每一行时，再用一层循环，"],[186760,191800,"从这行的第一个像素走到第二个像素，依次往后。"],[191800,196870,"遇到每个像素，先算出它的分量平均值。"],[196870,203530,"也就是取出红、绿、蓝三个分量，算出它们的平均数。"],[203530,207470,"算出平均数之后，就可以给各个颜色分量赋值，"],[207470,211490,"把红、绿、蓝都设成这个平均数。"],[211490,214790,"当然，记得先四舍五入到最接近的整数。"],[214790,219410,"写好 grayscale 函数后，就能试运行 filter 程序了。"],[219410,223070,"用 make 编译好 filter，再运行 ./filter，"],[223070,228800,"加上命令行参数 -g，表示要使用灰度滤镜。"],[228800,233270,"接着输入原图的文件名，比如 infile.bmp，"],[233270,240720,"最后给新生成的文件起个名字，比如 outfile.bmp。"],[240720,246470,"如果输入的是一张彩色图片，而且 grayscale 实现正确，"],[246470,249110,"运行程序后，打开输出文件，"],[249110,252920,"你就会看到同一张照片的灰度版本。"],[252920,256810,"我是 Brian。以上就是 grayscale。"]],"en":[[120,3090,"BRIAN YU: The first filter you're going to implement is grayscale."],[3090,5250,"The grayscale filter should take a color photo"],[5250,8280,"and convert it into grayscale, turning it into black and white."],[8280,11080,"But how exactly are you going to do that?"],[11080,13590,"Well, let's take a look at a pixel, which as you'll recall,"],[13590,16710,"has a red value, a green value, and a blue value."],[16710,20250,"If all of those values are zero, the pixel shows up as black."],[20250,24270,"And remember that if all of the values are the maximum of 255,"],[24270,26610,"then the pixel shows up as white."],[26610,28950,"The interesting thing to note, though, is as long"],[28950,32520,"as the red, green, and blue values are the same, what you'll get"],[32520,34690,"is a different shade of gray."],[34690,38220,"If the red, green, and blue values are the same small value,"],[38220,40410,"you'll get a darker shade of gray, something closer"],[40410,42540,"to the black end of the spectrum."],[42540,44920,"And if the red, green, and blue values are all the same"],[44920,48240,"but are a higher value, then you'll get a lighter shade of gray,"],[48240,50880,"something closer to the white end of the spectrum."],[50880,54180,"So your task in grayscale is really just, for each pixel,"],[54180,58210,"to make sure that the red, green, and blue values are all the same."],[58210,60900,"But what value are you going to set them to?"],[60900,63570,"Well, you might imagine that for a lighter color,"],[63570,66810,"you probably want a lighter shade of gray to represent it."],[66810,69990,"And for a darker color, you probably want a darker shade of gray"],[69990,71487,"to represent that."],[71487,74070,"So if we have a color that looks a little something like this,"],[74070,76410,"you probably want a lighter shade of gray"],[76410,79410,"to represent it by setting the red, green, and blue values"],[79410,82130,"all to a relatively high value."],[82130,84280,"But if we have a color that's a little bit darker,"],[84280,86570,"then you probably want a darker shade of gray,"],[86570,89980,"where the red, green, and blue values are all
