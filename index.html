e going to start writing to."],[29640,33690,"And you're going to keep writing data in 512 byte chunks"],[33690,37380,"until you find a new JPEG file, at which point you can close the old one"],[37380,38820,"and start writing the new one."],[38820,40528,"And you're going to repeat this process--"],[40528,43920,"looking for new JPEG files, writing new data to those JPEG files--"],[43920,46230,"until you reach the end of the file."],[46230,47880,"How are you going to do all of that?"],[47880,49755,"Well, let's start by talking about how you're"],[49755,51660,"going to open the memory card file."],[51660,55410,"To do this, you can take advantage of the fopen function, which"],[55410,59130,"will take as its first parameter the name of a file you want to open."],[59130,61470,"And the second parameter represents what mode"],[61470,65099,"you want to open it in, where r stands for read mode, where you want"],[65099,67830,"to read information from that file."],[67830,69660,"As you're reading that file, though, you're"],[69660,72450,"going to want to be on the lookout for JPEGs."],[72450,74740,"How are you going to know that an image is a JPEG?"],[74740,78060,"Well, every JPEG begins with a distinct header,"],[78060,83830,"meaning the first byte of every JPEG file is 0xff in hexadecimal."],[83830,86850,"The second byte is always 0xd8."],[86850,89670,"The third byte is always 0xff."],[89670,91710,"And the fourth byte could vary a little bit."],[91710,95490,"But it's always 0xe0, or 0xe1, or 0xe2."],[95490,97950,"Anything that starts with 0xe and then something."],[97950,100440,"So it could be 0xef, for example."],[100440,102960,"These are all valid JPEG headers."],[102960,107850,"So if you notice this pattern of four bytes at the beginning of any 512 byte"],[107850,113200,"block, you can pretty safely assume it's the beginning of a JPEG file."],[113200,116070,"So let's talk a little bit more detail about JPEGs."],[116070,118770,"Each JPEG is going to start with a distinct header, where"],[118770,124560,"the first three bytes, as we've talked about, are 0xff, 0xd8, and 0xff."],[124560,128639,"And the last bite is 0xe0, or 0xe1, or 0xe2."],[128639,131009,"Anything up to 0xef."],[131009,133560,"So this is the header that you're going to be looking for."],[133560,135480,"And we'll tell you that each of the JPEGs"],[135480,138150,"are stored back-to-back in the memory card."],[138150,142050,"After one JPEG ends, the next one begins, and so on and so forth,"],[142050,147460,"up through the end of the file inside of these 512 byte blocks."],[147460,150570,"So what does this mean for how you can look through this memory card"],[150570,152070,"to try to find JPEGs?"],[152070,156900,"Well, if you imagine your memory card as a whole bunch of these 512 byte blocks,"],[156900,160560,"then what you can do is start at the first block of the JPEG file,"],[160560,163850,"and check to see if you found a JPEG header or not."],[163850,165600,"If you haven't found a JPEG header, you'll"],[165600,168270,"keep moving on, looking one block at a time"],[168270,171060,"until you find that sequence of four bytes that"],[171060,175540,"indicates to you that this block is the beginning of a JPEG file."],[175540,178740,"Once you find that block, now you can open up a new JPEG file"],[178740,180360,"that you're going to start writing to."],[180360,183330,"And you can start writing block after block after block"],[183330,186810,"as you find more and more blocks of this JPEG file."],[186810,188850,"What you'll run into eventually, though, is"],[188850,191910,"another block where the first four bytes also"],[191910,194260,"look like the start of a JPEG file."],[194260,197610,"And when you detect that, you should realize that this is probably the start"],[197610,201150,"of a new JPEG file, meaning you should close the old one--"],[201150,202500,"you're done writing to it--"],[202500,205200,"and start writing to a new JPEG file that has"],[205200,209080,"all of these next sequences of blocks as the data within it."],[209080,210900,"So you continue writing again and again."],[210900,213720,"And you'll repeat this process, looking through this file,"],[213720,216060,"until you find the start of another JPEG file."],[216060,217760,"Then, starting to write that new file."],[217760,219510,"And repeating that process again and again"],[219510,223260,"and again until you reach the end of the memory card, at which point"],[223260,228090,"you'll have found all of the JPEG files that are inside of this memory card."],[228090,231420,"How are you going to read data, though, from the memory card?"],[231420,236230,"Well, to do that you can use the fread function, which takes four parameters."],[236230,238200,"The first parameter is called data."],[238200,240600,"And it is going to be a pointer to where you're"],[240600,242760,"going to store the data that you're reading,"],[242760,247020,"likely some buffer of some kind that might be an array, for example."],[247020,251430,"Next is size, which is the number of bytes of each element you're"],[251430,254330,"going to try to read from the file."],[254330,257420,"Next up is number, which is the number of those elements"],[257420,260120,"that you want to try to read all at once."],[260120,262940,"And then, finally, is inptr, which is the file that you're"],[262940,265403,"going to actually read that data from."],[265403,268070,"And recall that what you want to do is read from the memory card"],[268070,271850,"file in 512 byte chunks."],[271850,274740,"Once you've read one of those 512 byte chunks, though,"],[274740,278540,"how are you going to know if that 512 byte chunk is actually"],[278540,281330,"the start of a JPEG file or not?"],[281330,284580,"Well, recall that the JPEG file has a distinct header."],[284580,288215,"So if you've read this 512 byte block into some sort of buffer,"],[288215,291380,"which might be an array of bytes, then what you can do"],[291380,294480,"is check to see if buffer square bracket 0--"],[294480,297252,"in other words, the first byte of the buffer--"],[297252,300320,"is 0xff, the first byte of a JPEG file."],[300320,302000,"And likewise, you can do the same thing."],[302000,305060,"Checking if the second byte in the buffer is 0xd8"],[305060,307970,"and the third byte in the buffer is 0xff."],[307970,311150,"The fourth byte is where things get a little bit tricky."],[311150,314940,"Recall that there are 16 different values that buffer square bracket"],[314940,316280,"3 could take on."],[316280,319490,"It could be 0xe0, 0xe1, so on and so forth."],[319490,323780,"And so what you might imagine doing as a first pass is a Boolean condition where"],[323780,331280,"you ask yourself, if buffer 3 is 0xe0 or buffer 3 is 0xe1, or 0xe2, or 0xe3,"],[331280,333360,"your 0xe4, so on and so forth."],[333360,336770,"But doing this 16 times is going to get very, very tedious."],[336770,340900,"So to simplify, we can use a trick known as bitwise arithmetic"],[340900,346180,"where I can take the bitwise and of buffer 3 and 0xf0."],[346180,349160,"What that's going to do is it's going to say, just look"],[349160,352850,"at the first four bits of this 8-bit byte,"],[352850,355730,"and set the remaining four bits to 0."],[355730,360410,"What that means is that 0xe0, 0xe1, 0xe2, so on and so forth all"],[360410,365600,"become 0xe0 because we've cleared out those last four bits."],[365600,370370,"Then, after we've done this bitwise and, we can just compare the result to 0xe0"],[370370,373430,"to determine whether or not this byte is a byte"],[373430,376940,"that might appear as the fourth byte inside of a JPEG."],[376940,379670,"If all of these conditions are true, it's pretty likely"],[379670,384470,"that the 512 byte block that you found represents the beginning of a new JPEG"],[384470,385550,"file."],[385550,388880,"So when you found the beginning of a new JPEG file, what you'll need to do"],[388880,393140,"is create a new file where you're going to write this data to."],[393140,394910,"How do you make a new JPEG file?"],[394910,398810,"Well, each file should have a very particular file name as digit digit"],[398810,404375,"digit dot JPEG starting with 000 dot JPEG in the order in which you find it."],[404375,408320,"So you'll likely want to keep track of how many JPEGs you found so far"],[408320,412040,"so that you can write the correct file names in the correct order."],[412040,416000,"How do you create a string of the format digit digit digit dot JPEG?"],[416000,419360,"Well, to do this, you can take advantage of a function called sprintf, where"],[419360,422480,"you're printing not to the terminal, but to a string where"],[422480,425570,"the first parameter is the name of the string you want to write to."],[425570,427130,"In this case, file name."],[427130,429340,"The second parameter is the format string."],[429340,434990,"%03i just means print an integer with three digits to represent it,"],[434990,438830,"even if a number like 0, or 1, or 2 doesn't really require 3 digits"],[438830,440270,"to print out that integer."],[440270,443120,"And the final parameter is the number that you want to substitute."],[443120,447470,"In this case, 2, where the result would be that the file name string would now"],[447470,451490,"contain 002 dot JPEG instead."],[451490,454310,"Make sure that file name, though, has enough memory"],[454310,459050,"or has enough characters to fully represent this entire file name."],[459050,463160,"After you've created the file name, you can open a new file with that file name"],[463160,464658,"by calling fopen again."],[464658,467450,"This time, providing as the first argument the name of the file you"],[467450,468500,"want to open."],[468500,471650,"And now, the second argument to fopen instead of r for"],[471650,474530,"read it is going to be w for writing so that you"],[474530,477770,"can begin to write to this new file all of the data"],[477770,480590,"that you're going to find from the memory card."],[480590,482720,"How do you write data to a file?"],[482720,486740,"To do that, you can use the inverse of fread, which is fwrite,"],[486740,488960,"which is going to write data to a file."],[488960,492540,"Fwrite, just like fread, also takes four parameters."],[492540,494840,"The first parameter, called data, is going"],[494840,499580,"to be a pointer to all of the bytes that you want to write to the file."],[499580,503270,"Next, you need to tell fwrite how big the elements that you're going to write"],[503270,503810,"are."],[503810,506240,"So the second parameter, size, represents"],[506240,510470,"the number of bytes in each element that you're going to write to the file."],[510470,511640,"Next is number."],[511640,514740,"The number of elements that you're going to write to the file."],[514740,518090,"And finally, outptr is the file pointer that you actually"],[518090,520490,"want to write the data to, likely the JPEG"],[520490,523432,"that you've just opened for the purpose of writing to it."],[523432,525140,"And you're going to continue doing this--"],[525140,527480,"writing data to JPEG after JPEG--"],[527480,529820,"until you reach the end of the file."],[529820,533450,"But how do you detect when the end of the file is?"],[533450,536022,"Well, to do that let's take another look at fread,"],[536022,537980,"which is the function that we're using in order"],[537980,541100,"to read data from the memory card that's given"],[541100,543200,"to you at the beginning of the program."],[543200,545150,"What does fread return?"],[545150,549560,"Well, it turns out that fread returns the number of items of size size"],[549560,550880,"that were read."],[550880,554870,"We currently try to read number elements of size size."],[554870,558630,"And so most likely, if fread is able to read all of that data,"],[558630,560840,"it's going to return back to you number."],[560840,565310,"Say that I'm trying to read 255 elements, for example."],[565310,568880,"Then fread is going to return to me 255."],[568880,571500,"Of course, once I reach the end of the file,"],[571500,575660,"it might be the case that I don't have 255 additional bytes to read,"],[575660,577280,"and I have fewer than that."],[577280,579740,"In that case, fread is going to return to me"],[579740,582625,"some number that is less than 255."],[582625,584750,"So you might want to think about what condition you"],[584750,588980,"could write to determine whether fread has gotten to the end of the file"],[588980,590660,"or not."],[590660,594050,"Let's put all of this together now and start to think about some pseudocode"],[594050,597230,"that you could use to implement this recover program."],[597230,600560,"The first thing you'll want to do is open the memory card."],[600560,603680,"Then after that, you're going to want to repeat some process until you"],[603680,605570,"reach the end of the card."],[605570,608480,"You'll want to read 512 bytes, likely using"],[608480,612680,"fread into some sort of some buffer-- some space in your computer's memory"],[612680,615080,"where you have 512 bytes worth of storage"],[615080,617780,"that you can read that data into."],[617780,620900,"Then, take a look at the 512 bytes that you've read."],[620900,622910,"If it's the start of a new JPEG, which you"],[622910,625370,"can detect by looking at those first four bytes"],[625370,628310,"and determining whether or not it's a JPEG header or not,"],[628310,630800,"then you know you've found a new JPEG."],[630800,635060,"So if this is the first JPEG, you should start writing 000 dot JPEG and start"],[635060,637070,"writing your very first file."],[637070,639350,"Of course, if you've already found a JPEG,"],[639350,641840,"then you'll need to make sure to close the file you've just"],[641840,645110,"been writing to so that you can open up this new file"],[645110,647830,"that you're going to continue writing to."],[647830,653620,"So that's what to do if the 512 bytes you read is the start of a new JPEG."],[653620,657580,"But if it's not the start of the new JPEG, what should you do then instead?"],[657580,661120,"Well, if you've already found a JPEG and you've already been writing to it,"],[661120,662660,"then you should keep writing to it."],[662660,666490,"This is the next 512 byte block of this current JPEG"],[666490,667690,"that you've been writing to."],[667690,669970,"And you might repeat this process multiple times"],[669970,672790,"because every JPEG might take up multiple blocks"],[672790,676130,"of memory inside of the memory card that we've given to you."],[676130,677650,"So you'll repeat this process--"],[677650,680200,"reading 512 bytes and then checking."],[680200,683230,"If it's the start of a new JPEG, you might need to do something."],[683230,687010,"If it's not the start of a new JPEG, you might need to do something else."],[687010,689350,"After you've reached the end of the memory card,"],[689350,691460,"then you should close any remaining files."],[691460,693427,"And if all goes well, you should be done."],[693427,695260,"And you should see that you've now generated"],[695260,699190,"a number of JPEG files, each of which contains image data that you can then"],[699190,701800,"open up and view visually."],[701800,705420,"My name is Brian, and this was recover."]]},"9p7ddI3ozTY":{"edited":true,"zh":[[500,9210,"在 Inheritance 这道题里， 你要用 C 写一个程序，模拟血型基因在一个家庭里是怎样遗传的。"],[9210,14220,"先介绍一点背景知识：血型取决于等位基因。"],[14220,16490,"等位基因是一个基因的不同版本。"],[16490,22440,"就 ABO 血型而言，有 A、B、O 三种等位基因。"],[22440,25170,"每个人都有其中两个。"],[25170,27840,"可能两个都是 A，两个都是 B，或者两个都是 O。"],[27840,34150,"也可能是不同的组合，比如 A 和 B、B 和 O，或者 A 和 O。"],[34150,40180,"父母双方各把自己的一个等位基因传给孩子。"],[40180,51420,"比如，父母一方的基因组合是 AB，另一方是 OO。"],[51420,53230,"孩子会从双方各继承一个等位基因。"],[53230,61380,"如果从前者随机选中 A，从后者选中 O，孩子的基因组合就是 AO。"],[61380,65110,"也可能得到 BO。"],[65110,69990,"传给孩子的是哪一个等位基因，是随机的。"],[69990,80400,"要在程序里模拟这种遗传，我们需要一种数据结构，既能表示一个人和双亲的关系，"],[80400,84200,"以及决定他们血型的两个等位基因。"],[84200,91290,"C 没有现成的类型可以表示这些信息， 我们可以用 typedef 自定义一个类型。"],[91290,98250,"这里用结构体 person 表示一个人，它有两个成员。"],[98250,108480,"其中 parents 是一个长度为 2 的数组，保存指向双亲的指针。"],[108480,110770,"每个指针都指向另一个 person。"],[110770,121710,"另一个成员是由两个字符组成的数组 alleles， 表示这个人的两个等位基因，各取 A、B 或 O。"],[121710,129759,"因为每个人有两个等位基因，所以数组长度是 2。"],[129759,140230,"比如，对刚才的孩子，可以把字符 A 存在 alleles[0]， 把字符 O 存在 alleles[1]。"],[140230,147660,"parents[0] 指向父母一方，parents[1] 指向另一方。"],[147660,154020,"现在看看这些结构在题目给的起始代码里是怎么用的。"],[154020,162510,"在给出的 inheritance.c 中已经有不少起始代码，我们分开来看。"],[162510,173340,"可以看到同一个 typedef 定义：person 有 parents 数组中的两个指针， 还有一个由两个字符组成的数组，"],[173340,178550,"表示决定这个人血型的等位基因。"],[178550,186410,"接着是整数常量 GENERATIONS，代码中把它设为 3。"],[186410,192170,"它表示这次模拟要生成几代人的数据。"],[192170,200600,"这里要模拟三代人的血型，除了孩子本人，"],[200600,207578,"还有上一代的父母，以及再上一代的四位祖父母。"],[207578,214440,"后面有几个函数原型，我们先跳到 main，看看整个程序要做什么。"],[214440,216390,"main 函数已经写好了。"],[216390,218110,"这里不需要你修改。"],[218110,225420,"开头先给随机数生成器设置种子，这样就能生成接下来要用的伪随机数。"],[225420,234910,"因为模拟遗传时，要随机决定父母会把哪个等位基因传给孩子。"],[234910,247340,"接着调用 create_family， 生成指定代数的家族树，返回指向最年轻一代成员的指针。"],[247340,252190,"比如，建立三代人的家族树后，我们拿到的是指向其中一个人的指针。"],[252190,263580,"顺着这个人的父母指针，可以找到他的父母， 再找到祖父母。只模拟三代的话，就到这里为止。"],[263580,266160,"create_family 要由你来实现。"],[266160,268650,"print_family 则已经给你写好了。"],[268650,276990,"生成家族树之后，可以用这个函数按世代层次打印整棵树，"],[276990,281760,"其中会列出每个成员的血型。"],[281760,289860,"最后要写 free_family，把生成这棵树时分配的内存全部释放。"],[289860,301370,"要在内存里表示家族中的每个人，通常得用 malloc 为其动态分配空间。"],[301370,311010,"这些空间用完后要释放，还给系统，用于其他用途。"],[311010,319830,"因此，create_family 要先为一名新成员分配内存， 再处理两种可能的情况。"],[319830,331700,"一种情况是还要递归生成他的双亲。 另一种是只生成这一代，也就是生成一个不记录父母的成员。"],[331700,337990,"还要实现 free_family。它接收一个指针 p，指向某个 person。"],[337990,343130,"这个函数要释放 p 指向的人以及他所有祖先占用的内存。"],[343130,350200,"如果 p 有父母、祖父母或者更早的祖先，他们占用的内存也要释放。"],[350200,352200,"print_family 已经写好，"],[352200,353760,"这里也不用改。"],[353760,358620,"它接收一名成员，从他开始打印整棵家族树，并列出每个人的血型。"],[358620,362640,"给定的 random_allele 函数也能派上用场。"],[362640,374740,"它会随机返回 A、B、O 中的一个， 需要为 alleles 数组生成随机等位基因时就可以用它。"],[374740,380530,"了解了这些起始代码，来看看你需要实现哪些步骤。"],[380530,388270,"先完成 create_family，创建一个包含指定代数的家族。"],[388270,398980,"先调用 malloc， 按 sizeof(person) 分配足够的内存，存放一个新成员。"],[398980,405860,"如果还需要生成更早的世代，就要为这个人建立祖先的数据。"],[405860,415960,"当 generations 大于 1 时， 说明家族树还要往上延伸。这时要递归生成前几代。"],[415960,419410,"递归地生成前几代，具体是什么意思？"],[419410,429520,"比如，要为孩子生成父母和祖父母， 就要为双亲分别调用 create_family，"],[429520,434060,"两次调用都比原来少生成一代，以此类推。"],[434060,439810,"所以，只要 generations 大于 1，就递归地构建上一代。"],[439810,449470,"把两次递归调用返回的指针分别存进这个人的 parents 数组。"],[449470,456850,"一次调用的结果存入 parents[0]，另一次存入 parents[1]。"],[456850,464590,"设好双亲指针后，还要为这个人设置两个等位基因。"],[464590,471580,"从父母双方各随机继承一个等位基因。"],[471580,481050,"先从一方的两个等位基因里随机取一个，存进孩子的 alleles[0]。"],[481050,490770,"再从另一方的两个等位基因里随机取一个，存进孩子的 alleles[1]。"],[490770,496780,"这样，孩子的两个等位基因就分别来自父母双方。"],[496780,506050,"另一种情况是 generations 等于 1。 这表示这里只生成一个人，不再记录他的父母。"],[506050,510375,"这时两个父母指针都设为 NULL。"],[510375,519970,"由于没有双亲的数据，无法从中继承，就随机生成这个人的两个等位基因。"],[519970,526780,"题目已经提供了随机生成等位基因的函数。"],[526780,533230,"最后一步是写 free_family，释放前面动态分配的所有内存。"],[533230,542170,"每次调用 create_family， 至少调用了一次 malloc，在堆上为新成员动态分配空间，"],[542170,546080,"用来存放这个 person 结构体。"],[546080,553240,"程序结束前，要将这些动态分配的内存全部释放。"],[553240,556750,"先处理递归的终止条件。"],[556750,560860,"如果传给 free_family 的指针是 NULL，直接返回即可。"],[560860,563800,"这里没有需要释放的对象。"],[563800,571390,"接着处理递归的情况：先递归释放双亲，最后再释放孩子本人。"],[571390,573610,"怎样递归地释放双亲所占的内存？"],[573610,578860,"分别对两个父母指针调用 free_family。"],[578860,586520,"如果还有更早的世代，递归调用也会处理祖父母以及更早的祖先。"],[586520,597000,"释放双亲后，再用 free 释放孩子的内存。 这样程序分配的所有内存都得到了释放。"],[597000,608880,"写完这两个函数，就能运行 inheritance， 观察几代人之间的血型遗传。先看祖父母的血型，"],[608880,617610,"再看孩子的父母分别继承了哪些等位基因，最后看看孩子的血型。"],[617610,618690,"我是 Brian。"],[618690,621500,"以上就是 Inheritance。"]],"en":[[500,2430,"BRIAN: In this lab, your task is going to be"],[2430,7530,"to write a program in C that simulates the inheritance of blood type genes"],[7530,9210,"within a family."],[9210,11130,"To give a little bit of science background,"],[11130,14220,"your blood type is determined by alleles."],[14220,16490,"Alleles are different versions of a gene."],[16490,19620,"And there are three different alleles with regard to blood type,"],[19620,22440,"called A, B, and O."],[22440,25170,"Each person has two of these alleles."],[25170,27840,"Maybe you have two A's, two B's, two O's."],[27840,31170,"Or maybe you mix and match, have an A and a B, or a B and an O,"],[31170,34150,"or an A or an O, for example."],[34150,38670,"And when a parent has a child, each parent passes on one of their alleles"],[38670,40180,"to their child."],[40180,42840,"So for example, if we imagine two parents,"],[42840,47740,"one that has a blood type of AB and one who has a blood type of OO,"],[47740,51420,"tthen their child is going to inherit one blood type of little"],[51420,53230,"from each of their parents."],[53230,56820,"For example, we might randomly choose A from one parent,"],[56820,61380,"and between the other parent O, and ultimately get a blood type of AO."],[61380,65110,"But we also could have gotten a blood type of BO, for example."],[65110,69990,"Which of the two alleles is passed on is just chosen at random."],[69990,74380,"In order to simulate this type of inheritance inside of our program,"],[74380,76560,"we're going to need some sort of data structure"],[76560,80400,"that lets us represent the connection between people and their parents,"],[80400,84200,"as well as what alleles they have for their blood type."],[84200,87550,"And because there is no type built into C to do just that,"],[87550,91290,"we can create a type of our own using a typedef."],[91290,95850,"So here, we have typedef struct person, where every person is going"],[95850,98250,"to be represented by these two fields."],[98250,104160,"Struct person star *parents[2] means that every person is going to have"],[104160,108480,"an array of 2 parents, where each of those parents is going to be a pointer"],[108480,110770,"to another person."],[110770,115020,"Meanwhile, every person is also going to have an array of two characters called"],[115020,121710,"alleles, representing which two alleles, A, B, or O, this particular person has."],[121710,126370,"And because each person has two alleles, this is going to be an array of size 2"],[126370,129759,"to represent both of those alleles."],[129759,133720,"So in the example we saw before, we might, for this particular child,"],[133720,140230,"have the letter A stored at this child's alleles 0 and 0 stored at alleles 1."],[140230,145180,"And meanwhile, parents[0] would point to one of the parents and parents[1] would"],[145180,147660,"point to the other parent."],[147660,150540,"Let's see how these pieces now would come together inside"],[150540,154020,"of the distribution code that we give to you for the lab."],[154020,156090,"There is a fair amount of distribution code"],[156090,159570,"that we already give to you inside of inheritance.c"],[159570,162510,"But let's try and distill it to just what's most important."],[162510,166410,"Here we'll notice that same typedef, that we define a person"],[166410,170670,"as having pointers to two parents in this array of 2 pointers"],[170670,173340,"and also having an array of two characters,"],[173340,178550,"representing the two alleles that this person has for their blood type."],[178550,182690,"Next up is this relevant variable called const int GENERATIONS,"],[182690,186410,"a constant integer, which is set equal to the number of 3."],[186410,190190,"And this is going to represent the number of generations of data"],[190190,192170,"that we're going to simulate generating."],[192170,194900,"In this case, we're simply waiting three generations"],[194900,197660,"worth of data for blood types, which means we're not just"],[197660,200600,"going to simulate the single child, but also generation"],[200600,207578,"2, their parents, and also generation 3, that child's grandparents as well."],[207578,209370,"We then have some prototypes for functions,"],[209370,212160,"but let's skip down to the main function to really see"],[212160,214440,"what it is that this program is doing."],[214440,216390,"The main function is already written for you."],[216390,218110,"Nothing you need to do here."],[218110,221160,"But we start by seeding the random number generator,"],[221160,224220,"just so that we're able to generate pseudo random numbers, which"],[224220,225420,"is going to be useful."],[225420,228210,"Because when we decide how genes are inherited,"],[228210,231420,"we want to be able to randomly choose which gene is going"],[231420,234910,"to be passed on from parent to child."],[234910,240430,"Next we call the create_family function to create a family with a specified"],[240430,245260,"number of generations, returning a pointer to the most recent generation"],[245260,247340,"of person in that family."],[247340,249850,"So if we create a family with three generations,"],[249850,252190,"we'll end up with a pointer to one person."],[252190,254230,"But using their parent pointers, we could"],[254230,258010,"access that child's parents as well as that child's grandparents,"],[258010,263580,"but no further if we're only looking at a family with three generations."],[263580,266160,"The create_family function will be up to you to write."],[266160,268650,"But the print family function we will write."],[268650,270900,"After you've already created a family, we've"],[270900,274080,"already written for you a function that will take that family"],[274080,276990,"and print them out as a hierarchical family tree,"],[276990,281760,"printing out what blood type each of the people in that family has."],[281760,284640,"Finally, you'll write the free_family function,"],[284640,287640,"which will free all of the memory that you may have allocated"],[287640,289860,"in the process of creating this family."],[289860,292050,"Because recall that for each of the people"],[292050,295350,"that you want to represent inside of your computer's memory,"],[295350,297570,"you'll likely need to allocate memory for them"],[297570,301370,"by using the malloc function to allocate some memory dynamically."],[301370,303990,"But any time you allocate memory with malloc,"],[303990,307530,"you'll also want to free that memory, giving it back to the computer"],[307530,311010,"so that it can be used for other purposes."],[311010,313500,"Here then, in the create_family function,"],[313500,317280,"is going to be what you'll implement, allocating memory for a new person"],[317280,319830,"and then dealing with two possible cases."],[319830,322770,"One, if there are potential parents that this child has"],[322770,325380,"that we need to recursively generate, or else,"],[325380,327930,"if we're just generating a single generation,"],[327930,331700,"generating just a single person without any parent data."],[331700,335060,"You'll also, then, write the free_family function, which"],[335060,337990,"takes as input a pointer to a person p."],[337990,343130,"And the task for this function is to free p as well as any ancestors of p."],[343130,347000,"So if person p has parents or grandparents or other ancestors"],[347000,350200,"as well, you'll want to make sure to free them, too."],[350200,352200,"The print family function we've written for you."],[352200,353760,"No need to do anything here."],[353760,356760,"It takes a person and goes ahead and prints out their entire family"],[356760,358620,"tree, along with their blood types."],[358620,362640,"And this random allele function that we wrote might be helpful for you, too."],[362640,366360,"It randomly chooses an allele, A, B, or O,"],[366360,368430,"which can be useful if you get to a point"],[368430,370900,"where you need to randomly generate an allele"],[370900,374740,"to store inside of that allele's array."],[374740,377140,"So with that distribution code in mind, let's then"],[377140,380530,"walk through what it is that your program is going to do."],[380530,384310,"The first thing you should do is complete the create_family function"],[384310,388270,"to create a family with a specified number of generations."],[388270,391120,"In order to do so, the first thing you should do"],[391120,394750,"is allocate memory for a new person, calling malloc,"],[394750,396850,"passing in size of person to make sure you"],[396850,398980,"have enough memory for a new person."],[398980,402580,"And then you'll use that person to potentially generate ancestors"],[402580,405860,"if there are more generations that you need to work with."],[405860,410560,"So if generations is greater than 1, meaning there are more generations"],[410560,413170,"that you need to generate, then you'll recursively"],[413170,415960,"create those previous generations."],[415960,419410,"What does it mean to recursively create previous generations?"],[419410,423820,"Well, if you're trying to create a child that has two generations of parents"],[423820,426820,"then you'll recursively call the create_family function"],[426820,429520,"for each of those parents where each one of those parents"],[429520,434060,"will have one generation of parents, and so on and so forth."],[434060,436390,"So if generations is greater than 1, you'll"],[436390,439810,"want to recursively create those previous generations."],[439810,444400,"And using the return value you get from those create_family functions,"],[444400,449470,"you'll update this new person's parents, setting parents[0] equal to the result"],[449470,454240,"of one recursive call and setting parents[1] equal to the result of some"],[454240,456850,"other recursive call."],[456850,459400,"After you set that person's parents, recall"],[459400,462560,"that every person not only has two pointers to parents,"],[462560,464590,"but also has two alleles."],[464590,468310,"So now you'll need to do the actual inheritance step, inheriting"],[468310,471580,"one allele from each parent at random."],[471580,475290,"So you want to inherit the alleles from the parents by looking at one parents"],[475290,481050,"two alleles, randomly choosing one, and setting that as the child's allele 0."],[481050,484440,"And then doing the same with the other parent, looking at their two alleles,"],[484440,490770,"randomly choosing one, and using one of those as alleles[1] so that the child"],[490770,496780,"ends up with two alleles, one inherited from either parent."],[496780,499840,"Otherwise, if generations is equal to 1, that"],[499840,503230,"means you're only generating one generation worth of family, that is,"],[503230,506050,"an individual person with no parents."],[506050,510375,"And if that's the case, then both of the parent pointers should be set to null."],[510375,512500,"And because there is nothing to inherit, because we"],[512500,514600,"don't have any data about the parents, you'll"],[514600,517780,"go ahead and randomly generate alleles for each of the two"],[517780,519970,"alleles for this particular person."],[519970,522130,"And recall that, in the distribution code,"],[522130,526780,"we give to you a function that will randomly generate those alleles."],[526780,530950,"The final step for this lab is going to be to write the free_family function"],[530950,533230,"to free all of that allocated memory."],[533230,536410,"Recall that every time you called the create_family function,"],[536410,538930,"you were calling malloc at least once in order"],[538930,542170,"to generate data for a new person, to allocate memory"],[542170,546080,"for that person dynamically inside of the computer's heap."],[546080,547960,"Now, after you've malloced that memory, it's"],[547960,550960,"your task at the end of the program to free all of that memory"],[550960,553240,"up and give it back to the computer."],[553240,556750,"In order to do so, you'll want to first handle the base case."],[556750,560860,"If the input to free_family is null, there is no action you should take."],[560860,563800,"You should never be freeing the null pointer."],[563800,566710,"But after that, you'll want to deal with the recursive case,"],[566710,571390,"recursively freeing the parents, and then after that, freeing the child."],[571390,573610,"How do you recursively free the parents?"],[573610,576700,"Well, you'll want to call the free_family function"],[576700,578860,"on each of the child's two parents."],[578860,581680,"Recursively then, that will also call for a family"],[581680,584290,"on the child's grandparents and higher generations,"],[584290,586520,"if there are other generations, as well."],[586520,590680,"And after those parents have been freed then you can use free in order"],[590680,594520,"to free the child as well, ultimately freeing all of the memory"],[594520,597000,"that you've allocated throughout the program."],[597000,599050,"After you've written these two functions,"],[599050,602160,"you should then be able to run your inheritance program in order"],[602160,606390,"to simulate the inheritance of blood types across multiple generations,"],[606390,608880,"seeing what blood types the grandparents had,"],[608880,612630,"seeing how those blood types translated into the blood types of a child's"],[612630,617610,"parent, and ultimately, what blood type that child inherited as well."],[617610,618690,"My name is Brian."],[618690,621500,"And this was inheritance."]]},"H7LULatPwcQ":{"edited":true,"zh":[[360,4540,"来看看 Inheritance 的一种解法。"],[4540,13500,"这道题要模拟一个家族里血型基因是如何在几代人之间遗传的。"],[13500,24780,"首先要写一个函数，为家族成员分配内存，模拟孩子从父母双方继承血型等位基因。"],[24780,26190,"一起来看。"],[26190,33130,"在 create_family 中， 第一步是为一个新的 person 分配内存。"],[33130,42480,"这里调用 malloc 分配足够存放一个 person 的内存， 把返回的指针保存在 p 中。"],[42480,47560,"现在，p 就指向刚才分配的这块内存。"],[47560,56260,"接着要分两种情况。第一种是 generations 大于 1， 意味着还得为这个人生成双亲。"],[56260,65780,"第二种是 generations 等于 1，此时模拟不再记录这个人的父母。"],[65780,71230,"先看需要递归的情况，也就是还有上一代要生成。"],[71230,79490,"递归调用 create_family，分别生成父母双方的家族树。"],[79490,91880,"比如，一开始要求生成孩子和上面两代人， 就要为父母各生成一棵树，在他们上面各有一代，"],[91880,98430,"也就是每次递归要生成的家族树都减少一代。"],[98430,110270,"所以，生成父母一方的家族树时， 调用 create_family(generations - 1)。"],[110270,117290,"这次调用返回的指针指向父母一方，把它存入 parents[0]。"],[117290,121700,"孩子需要有两位家长，所以还要再做一次。"],[121700,129830,"再调用 create_family(generations - 1)， 把结果保存在 parents[1]。"],[129830,141670,"孩子现在可以通过指针找到父母。如果模拟三代以上， 这些父母又有指针指向他们自己的父母。"],[141670,149230,"建立双亲之后，就从双方各继承一个等位基因。"],[149230,150670,"具体怎么选？"],[150670,153700,"我们要随机选择一个等位基因。"],[153700,155740,"怎样取得家长的等位基因？"],[155740,161740,"如果有指向结构体的指针，就可以用箭头运算符访问成员。"],[161740,169270,"用 p->parents[0] 可以得到第一个父母指针。"],[169270,177150,"再用 p->parents[0]->alleles 访问这位家长的等位基因数组。"],[177150,180550,"alleles 是由两个字符组成的数组。"],[180550,183580,"两个位置的下标分别是 0 和 1。"],[183580,186820,"从这两个里面随机选一个就好。"],[186820,189830,"怎样生成一个不是 0 就是 1 的随机数？"],[189830,194200,"可以用 rand() 生成一个伪随机整数。"],[194200,202870,"再取它除以 2 的余数，也就是对 2 取模。"],[202870,206950,"如果生成的数是偶数，余数就是 0。"],[206950,209680,"如果是奇数，余数就是 1。"],[209680,217330,"这样大约一半的时候得到 0，另一半得到 1。"],[217330,227050,"这样就能从家长的两个等位基因中随机选一个，存入孩子的 alleles 数组。"],[227050,232430,"怎么访问孩子的数组呢？这里用变量 p 表示孩子。"],[232430,234880,"p 是个指针。"],[234880,239050,"所以用 p->alleles 访问它的等位基因数组。"],[239050,246340,"把从父母一方随机选到的等位基因放进 p->alleles[0]。"],[246340,249970,"对父母另一方重复同样的步骤。"],[249970,261640,"把另一方传下来的等位基因存入 p->alleles[1]， 同样用 rand() % 2 生成下标。"],[261640,267320,"结果是 0 时选第一个等位基因，是 1 时选第二个。"],[267320,272510,"这就处理完了需要生成父母数据的情况。"],[272510,281330,"但是，递归函数总要有个终止条件，否则就会无限调用下去。"],[281330,290730,"这里的 else 负责处理终止条件，也就是程序不再为这位成员记录父母。"],[290730,296720,"如果没有父母的数据，两个指针都应设为 NULL。"],[296720,302220,"也就是把 parents[0] 和 parents[1] 都设为 NULL。"],[302220,309180,"但仍需给这个人指定两个血型等位基因，可以是 A、B 或 O。"],[309180,316640,"没有双亲的数据可供继承，就用随机生成的等位基因来做模拟。"],[316640,322500,"题目提供的 random_allele 函数会随机返回一个等位基因。"],[322500,331230,"调用它两次，把结果分别存到 alleles[0] 和 alleles[1]。"],[331230,342090,"以上就是 create_family：递归生成指定代数的家族树，"],[342090,347820,"再从双亲那里各随机选一个等位基因传给孩子。"],[347820,354420,"前面用 malloc 分配的内存，用完后要全部释放。"],[354420,362720,"这就是本题最后的 free_family 函数。先来看递归的终止条件。"],[362720,367480,"如果传给 free_family 的指针是 NULL，就直接返回。"],[367480,370880,"这里没有要释放的内存。"],[370880,378800,"接着要释放父母。由于他们可能也有父母乃至更早的祖先，这里同样需要递归。"],[378800,390450,"分别对这个人的两个父母指针递归调用 free_family。"],[390450,400880,"层层递归，直到最早的一代，此时再向上追溯得到的父母指针是 NULL。"],[400880,405950,"达到终止条件后函数直接返回。"],[405950,417410,"释放完父母双方各自的家族树后，"],[417410,428360,"就可以调用 free(p)，释放为孩子动态分配的内存，"],[428360,431370,"这也是最后要释放的一块内存。"],[431370,441550,"到这里，程序就能为整棵家族树分配内存、模拟并打印各人的血型，然后释放全部内存。"],[441550,442510,"我是 Brian。"],[442510,445500,"以上就是 Inheritance。"]],"en":[[360,2193,"BRIAN YU: Let's take a look at how you might"],[2193,4540,"have solved the inheritance problem."],[4540,6540,"Recall that in this problem your task was"],[6540,10860,"to write a program to simulate the inheritance of blood type genes"],[10860,13500,"from multiple generations in a family."],[13500,17520,"And the first step was to write a function to create that family,"],[17520,20340,"to allocate memory for all of the people in that family,"],[20340,24780,"and to inherit all of the blood type genes from parents to children."],[24780,26190,"So let's do that."],[26190,30150,"Inside of the create_family function, the first thing you wanted to do"],[30150,33130,"was to allocate memory for a new person."],[33130,39360,"So here we called malloc, allocating enough memory for a new person"],[39360,42480,"and saving the returned pointer inside of p."],[42480,47560,"So p is going to be a pointer to that new memory that we have just allocated."],[47560,52750,"Then we need to handle two cases, one where generations is greater than 1,"],[52750,56260,"meaning this person we've just allocated has parents."],[56260,58120,"And meanwhile, we need to handle the case"],[58120,62200,"where generations is equal to 1, when the person doesn't have parents"],[62200,65780,"that we're going to be representing inside of our program."],[65780,70000,"So let's start with the recursive case, so to speak, the generation that does"],[70000,71230,"have parents."],[71230,73810,"What we need to do in that case is recursively"],[73810,79490,"call the create_family function to create those parent family trees."],[79490,83450,"What that means is that if originally we called create_family in order"],[83450,88040,"to create a family with a child with two generations of parents, well,"],[88040,91880,"then we need to generate the parent and family trees and each with one"],[91880,95090,"generation of parents, so generating family trees that"],[95090,98430,"have one fewer number of generations."],[98430,101450,"So here, to create one parent family tree,"],[101450,106730,"we recursively call the create_family function on generations minus 1,"],[106730,110270,"one fewer generation than the generations we started with."],[110270,114140,"And whatever pointer we get back will be a pointer to a parent,"],[114140,117290,"so we'll store that inside of parents 0."],[117290,120110,"And because we need to store two parents for this child,"],[120110,121700,"we'll do the same thing again."],[121700,125630,"Call the create_family function on generations minus 1,"],[125630,129830,"save the output of that inside of parents 1."],[129830,133080,"Now we've updated the parent pointers for this child"],[133080,135530,"so that they have pointers to parents and those parents"],[135530,138470,"have pointers to their parents if we're trying to represent"],[138470,141670,"more than just one or two generations."],[141670,144550,"But after we've generated these parents, the next step"],[144550,149230,"is going to be to inherit one allele from each of those parents."],[149230,150670,"And how are we going to do that?"],[150670,153700,"Well, we want to choose an allele at random."],[153700,155740,"How do we access the parents alleles?"],[155740,159340,"Well, we can use this arrow notation to access some field"],[159340,161740,"if we have a pointer to instruct."],[161740,168160,"So if we have a person p, we can access their first parent with p arrow parents"],[168160,169270,"0."],[169270,173110,"And once we have that parent, we can access that parent's alleles"],[173110,177150,"via parent 0 arrow alleles."],[177150,180550,"And now recall that alleles is an array of two characters."],[180550,183580,"There is allele as 0, and there's allele as 1."],[183580,186820,"And we just want to choose one of them at random."],[186820,189830,"And how do we get a random number that's either 0 or 1?"],[189830,192580,"Well, one way to do it is to use the rand function, which"],[192580,194200,"will give us a random integer."],[194200,199700,"And then use mod 2 to get the remainder when divided by 2, which in other words"],[199700,202870,"just tells us if a number is even or odd."],[202870,206950,"If a number is even, then when it's modded by 2, we're going to get 0."],[206950,209680,"If a number is odd, then we're going to get one."],[209680,214180,"And so the effect of this is that half the time we'll get a value of 0,"],[214180,217330,"and the other half the time, we'll get a value of 1."],[217330,221260,"And this has the effect of randomly choosing one of those two alleles"],[221260,227050,"from the parent that we then need to store inside of the child's allele ray."],[227050,230410,"And how do we access that child array, well, the child"],[230410,232430,"is this variable p here."],[232430,234880,"And they are a pointer to instruct."],[234880,239050,"So to access their alleles, I can say p arrow alleles."],[239050,243970,"And then we'll go ahead and store inside of p arrow allele 0 one randomly chosen"],[243970,246340,"allele from the first parent."],[246340,249970,"And then we'll repeat the exact same thing for the second parent."],[249970,253450,"Inside of p arrow alleles 1, we're going to store"],[253450,257800,"one allele from the second parent as well, using the exact same logic,"],[257800,261640,"using rand mod 2 to get us a pseudo random number that"],[261640,267320,"is either going to be 0 for the first allele or 1 for the second allele."],[267320,270800,"So that's the case where a child does have parent data"],[270800,272510,"that we're going to try to generate."],[272510,275780,"But ultimately, any time we're dealing with a recursive function,"],[275780,279710,"we need a base case, some point to stop to make sure the function doesn't just"],[279710,281330,"keep running infinitely."],[281330,285020,"And so in that case, this is what the else is designed to handle,"],[285020,288020,"an individual that doesn't have parent data"],[288020,290730,"represented inside our computer program."],[290730,293420,"So in that case, if we don't have any parent data,"],[293420,296720,"then both of these parent pointers should be set to null."],[296720,302220,"We'll set parent 0 equal to null and parents 1 equal to null as well."],[302220,306620,"But we also need to specify alleles, blood type alleles like A or B"],[306620,309180,"or O for these people as well."],[309180,312710,"And if they don't have parents from which to inherit that allele data,"],[312710,316640,"we're just going to generate a random allele as part of the simulation."],[316640,320630,"And to do so, recall that we gave you this random allele function, which"],[320630,322500,"would randomly give you an allele."],[322500,326420,"So we store one random allele in allele zero,"],[326420,331230,"and we do it again to store in alleles 1."],[331230,334287,"And that then is the create_family function,"],[334287,336120,"the function that is able to create a family"],[336120,338670,"tree of a specified number of generations"],[338670,342090,"by taking advantage of recursion to generate parent data"],[342090,345420,"and then inherit from those parents particular alleles"],[345420,347820,"into the child chosen at random."],[347820,351240,"But after we've allocated all of this memory using malloc,"],[351240,354420,"we need to make sure that we free that memory when we're done with it."],[354420,356740,"And that's where the free_family function came in,"],[356740,360920,"which was the last part of this lab, and the first thing you needed to do here"],[360920,362720,"was to handle the base case."],[362720,365563,"If the input to the free_family function is null,"],[365563,367480,"then there's nothing our function needs to do."],[367480,370880,"There's nothing left to free, so we can just return."],[370880,373250,"But now we can go ahead and free the parents,"],[373250,374958,"because the parents might themselves have"],[374958,378083,"parents that need to be freed that might themselves have other parents that"],[378083,378800,"need to be freed."],[378800,382700,"So we are going to recursively call the free_family function"],[382700,385340,"on the first parent of this person and then"],[385340,389060,"recursively call the free_family function on the second parent"],[389060,390450,"of this person as well."],[390450,393560,"And that is going to induce even more recursion all the way until we"],[393560,397370,"get to that base case, until we get to the last generation that"],[397370,400880,"doesn't have parent data, meaning both of the parents are null."],[400880,405950,"At which point, this function returns without any additional recursion."],[405950,409010,"But after we freed both of the parents' family trees,"],[409010,412670,"all of the parents and ancestors on one side of the family,"],[412670,414560,"and then all of the parents and ancestors"],[414560,417410,"on the other side of the family, the last thing we need to do"],[417410,421790,"is free the pointer for this last child that we dynamically allocated memory"],[421790,424730,"for via malloc, by calling the free function"],[424730,428360,"and then passing it as input this pointer p to free"],[428360,431370,"this last piece of data as well."],[431370,433880,"Once we've done that, we will be able to allocate memory"],[433880,437720,"for all of the people inside the family tree, simulate their blood types"],[437720,441550,"and print them out, and then free all of that data at the end."],[441550,442510,"My name is Brian."],[442510,445500,"And this was inheritance."]]},"_z57x5PGF4w":{"edited":true,"zh":[[560,9810,"在 Speller 这道题里，你要写一个拼写检查器， 逐个检查一篇文本里的单词有没有拼错。"],[9810,12800,"还有一个重要要求：检查得越快越好。"],[12800,14040,"这个程序该怎么写？"],[14040,18110,"先来看看题目给的起始代码。"],[18110,27140,"speller.c 里是做拼写检查的代码， 它会调用在 dictionary.h 中声明的函数。"],[27140,34160,"打开 dictionary.h，就能看到这道题需要你实现的五个函数的原型。"],[34160,39342,"这些函数的具体实现要写在 dictionary.c 里。"],[39342,44720,"Makefile 包含构建命令，可以把这些文件编译成一个完整的程序。"],[44720,47430,"除此之外，还有三个目录，也就是文件夹。"],[47430,55790,"dictionaries/ 里有一大一小两份词典， texts/ 里有一些示例文本，"],[55790,58010,"可以用来测试你的拼写检查器。"],[58010,66860,"keys/ 里存着参考结果，列出了每篇示例文本中拼错的单词。"],[66860,74900,"我们仔细看一下 dictionary.c。 你要编辑的就是这个文件，让拼写检查器能够工作。"],[74900,78380,"dictionary.c 里要实现哪五个函数呢？"],[78380,85970,"第一个叫 load，负责把词典里的所有单词 加载到某个数据结构中，比如哈希表。"],[85970,93680,"然后是 hash。它接收一个单词， 计算并返回这个单词对应的哈希值。"],[93680,97970,"接着是 size，返回词典里一共有多少个单词。"],[97970,104070,"check 接收一个单词，判断它在不在词典里。"],[104070,106260,"也就是说，用词典来判断这个单词的拼写是否正确。"],[106260,115910,"最后是 unload。为了存放词典数据而分配的内存， 现在都要释放，交还给系统。"],[115910,117590,"这就是 Speller 的五个步骤。"],[117590,123550,"接下来我们逐一讲解。完成这五步，你就有了一个能用的拼写检查器。"]],"en":[[560,2510,"SPEAKER: In speller, your task is going to be"],[2510,6560,"to write a spell checker that can take a text and take every word in that text"],[6560,9810,"and check to see if the word is spelled correctly or not"],[9810,12800,"and, importantly, to do so as quickly as possible."],[12800,14040,"How are you going to do that?"],[14040,16290,"Well, let's first take a look at the distribution code"],[16290,18110,"that you'll be given in this problem."],[18110,20240,"We're going to give you a file called speller.c,"],[20240,22730,"which contains the code that will do the spell checking"],[22730,27140,"calling upon some functions that are going to be declared in dictionary.h."],[27140,30860,"So if you open up dictionary.h, you'll see the function prototypes"],[30860,34160,"for five functions that you're going to implement in this problem."],[34160,37190,"In dictionary.c is where you are actually going to write"],[37190,39342,"the implementations of these functions."],[39342,41300,"Makefile is going to contain some commands that"],[41300,44720,"will compile all our files together into a finished program."],[44720,47430,"And then we've given you three directories, or folders--"],[47430,51170,"a dictionaries/ directory, which will contain both a large and small"],[51170,55790,"dictionary of words, a text/ directory that will contain some sample files,"],[55790,58010,"so you can run your spell checker against,"],[58010,61550,"and we'll give you a keys/ directory, which will contain the solutions,"],[61550,65600,"the list of words that are misspelled in each of the sample texts that we"],[65600,66860,"provide to you."],[66860,69410,"So let's take a closer look at dictionary.c"],[69410,72920,"because dictionary.c is the file that you'll have to edit in this problem"],[72920,74900,"in order to make this spell checker work."],[74900,78380,"What are the five functions that you'll need to implement in dictionary.c?"],[78380,81350,"Well, the first is called load, which is responsible for loading"],[81350,84680,"all of the words in the dictionary into some sort of data structure,"],[84680,85970,"like a hash table."],[85970,89240,"Next up is a function called hash, which is going to take a word"],[89240,92120,"and run a hash function on it, returning some number that"],[92120,93680,"corresponds to that word."],[93680,95840,"Next up is size, which is just going to return"],[95840,97970,"how many words are in your dictionary."],[97970,101760,"Next is check, which will take a word and answer the question of,"],[101760,104070,"is this word in the dictionary or not?"],[104070,106260,"In other words, is it correctly spelled or not?"],[106260,109100,"And finally, we'll be unload, where any of the memory that you've"],[109100,112580,"had to allocate in order to store data inside of your data structure,"],[112580,115910,"you'll now need to free up and give back to the computer."],[115910,117590,"So these are the five steps for speller."],[117590,120960,"And we'll take a look at each of them one at a time so that by the end of it,"],[120960,123550,"you'll have a working spell checker."]]},"-BX4wLZRwbc":{"edited":true,"zh":[[360,9000,"Speller 的第一项任务是实现 load，把词典里的单词加载到哈希表中。"],[9000,10230,"具体怎样实现呢？"],[10230,21510,"load 接收一个字符串，表示要打开并读取的词典文件的路径。"],[21510,23100,"函数将返回一个布尔值。"],[23100,31270,"如果成功把词典加载进哈希表就返回 true， 遇到错误则返回 false。比如内存不足，"],[31270,34060,"或者无法打开词典文件。"],[34060,36400,"我们来一步步看。"],[36400,43140,"最终，你要打开词典文件，读出所有单词，并把它们存进内存里的哈希表。"],[43140,47820,"这里的哈希表是一个数组，每个元素都对应一条链表。"],[47820,59400,"决定一个词该插入哪条链表，要靠哈希函数。 它的输入是一个字符串，也就是要加入词典的单词。"],[59400,70320,"根据这个输入算出的数字，告诉你应该把单词放进哪条链表。"],[70320,76860,"我们仔细看看哈希表是怎么工作的，以及 load 为什么能用上它。"],[76860,81330,"比如，我有五个单词要放进哈希表。"],[81330,83550,"这五个词是 apple、banana、bat、car 和 book。"],[83550,87210,"我当然可以把它们全部存在一条链表上。"],[87210,96030,"如果将它们全部放进同一条链表，要查某个词就可能得逐个走过五个节点。"],[96030,101100,"也可以把单词存进哈希表，分到几个不同的桶里。"],[101100,109920,"为 A 开头的词建一个 A 桶，B 开头的放 B 桶，C 开头的放 C 桶，"],[109920,113670,"每个词就有了对应的桶。"],[113670,115910,"比如，apple 会放进 A 桶。"],[115910,118260,"bat、book 和 banana 都放进 B 桶。"],[118260,120270,"car 放进 C 桶。"],[120270,129419,"我刚才用的就是一种哈希函数。给它 apple、 bat 或 book，它告诉我该用哪条链表，"],[129419,134700,"是 A 链表、B 链表，还是 C 链表。"],[134700,137550,"那么，哈希函数到底是什么？"],[137550,147600,"在这个例子里，哈希函数接收单词，返回一个数， 告诉我们应把它存在哪个桶，也就是数组的哪个位置。"],[147600,155402,"这里的哈希表本身是数组。第一条链表的下标是 0， 第二条是 1，再往后是 2，依此类推。"],[155402,162960,"所以，将单词传给哈希函数，就能得到它应该放入的数组下标。"],[162960,167670,"哈希表中的每个下标都对应一条链表。"],[167670,169265,"还记得什么是链表吗？"],[169265,177930,"链表由一串节点组成。每个节点存着一个值，还有一个指向下一个节点的指针。"],[177930,183360,"在拼写检查器里，这些链表的表头组成一个数组，也就是我们的哈希表。"],[183360,191910,"每个节点要能存一个单词。这里用字符数组保存单词，"],[191910,197010,"数组要能容纳允许的最长单词。节点还要保存指向下一个单词所在节点的指针。"],[197010,198190,"对应的代码是什么样？"],[198190,202980,"看 dictionary.c 的开头，那里给出了节点的定义。"],[202980,214900,"typedef 定义了新的类型 node。 每个 node 中有存储单词的字符数组，也有指向下一个节点的指针。"],[214900,218040,"查询哈希表的某个桶，可以得到那条链表的首节点。"],[218040,226890,"沿着 next 指针可以访问之后的节点，直到在链表末尾遇到 NULL。"],[226890,230880,"在 dictionary.c 里再往下一点，会看到这行。"],[230880,234010,"这里把 const int N 定义为 1。"],[234010,238800,"也就是说，这里定义了一个叫 N 的整数常量，初始值是 1。"],[238800,242370,"数组 table 表示这张哈希表。"],[242370,245460,"它是一个节点指针数组。"],[245460,249540,"数组的每个元素都是指向节点的指针。"],[249540,252990,"目前在这个例子里，数组只有一个元素，"],[252990,255670,"也就是哈希表只有一个桶。"],[255670,263970,"很可能需要把 N 设得大一些，给哈希表增加几个桶，让数据分布得更均匀。"],[263970,266920,"起初，哈希表是空的。"],[266920,270570,"那该怎样往里面添加数据？"],[270570,276360,"先给新节点分配内存，然后把数据存进去。"],[276360,280560,"要为一个新节点分配空间，代码可以像这样。"],[280560,283680,"可以写 node *n = malloc(sizeof(node))。"],[283680,285840,"malloc 的用途是动态分配内存，"],[285840,287730,"也就是向系统申请一块内存。"],[287730,290040,"那要申请多少字节呢？"],[290040,295620,"sizeof(node) 表示存放一个节点需要的字节数。"],[295620,300010,"因此按 sizeof(node) 来分配，空间就足够容纳一个节点。"],[300010,303700,"将返回的节点地址存到指针 n 中。"],[303700,305920,"有了节点，要怎样往里填数据？"],[305920,308450,"节点有两个成员，"],[308450,311950,"一个保存单词，另一个是指向下一个节点的指针。"],[311950,316600,"比如，可以写 strcpy(n->word, \"hello\")。"],[316600,317770,"这行代码做什么？"],[317770,319990,"strcpy 是字符串复制函数。"],[319990,323530,"它会把字符串从源位置复制到目标位置。"],[323530,333430,"这里把 \"hello\" 复制到 n->word 这个字符数组， 也就是新节点存放单词的成员。"],[333430,336490,"现在，\"hello\" 就复制进刚分配的空间了。"],[336490,340570,"如果已经知道下一个节点在哪里，可以立刻给 next 指针赋值。"],[340570,343000,"如果还不知道，就先把 next 设为 NULL。"],[343000,348160,"n->next = NULL，表示这个节点目前没有后继节点。"],[348160,356990,"当然，链表中很多节点都有后继。在这些节点里， next 指向链表中接下来的那个节点。"],[356990,360202,"回到 load，在这个函数里要做什么？"],[360202,364630,"首先打开词典文件。"],[364630,368020,"接着一次从文件里读一个字符串，"],[368020,370840,"也就是每次读取词典中的一个单词。"],[370840,373990,"每读到一个词，就为它新建一个节点，"],[373990,376990,"其中有存放单词的成员，还有 next 指针。"],[376990,388390,"对单词调用 hash，使用返回的下标确定要把新节点插入哪条链表。"],[388390,396680,"最后，将这个单词所在的节点插入哈希函数指定的位置。"],[396680,399830,"我们逐项来看。"],[399830,403000,"先看怎样打开词典文件。"],[403000,410290,"load 的参数是一个字符串，也就是 char *，表示要加载的词典文件。"],[410290,413708,"可以用 fopen 打开文件。"],[413708,420070,"检查返回值是否为 NULL，这样可以知道文件有没有成功打开。"],[420070,424780,"如果打开失败，load 就返回 false。"],[424780,429010,"成功打开则继续下一步。"],[429010,432250,"接下来要从文件中读出字符串。"],[432250,443270,"可以使用 fscanf。它的第一个参数是文件指针， 也就是 fopen 打开词典后返回的指针。"],[443270,447010,"第二个参数是格式字符串 \"%s\"，表示要读取一个字符串。"],[447010,451130,"第三个参数是 word，一个字符数组，"],[451130,453520,"用来存放读进来的单词。"],[453520,460625,"从文件读出单词后，就能在这个数组里逐个访问它的字符。"],[460625,472960,"对词典里的每个词重复这个过程。 每次调用 fscanf 读一个词，直到它返回 EOF。"],[472960,476870,"当 fscanf 读到文件末尾，就会返回 EOF。"],[476870,482410,"在这个例子里，这是词典已经读完的标志。"],[482410,491350,"可以写个循环，反复调用 fscanf，一次读一个词，直到文件末尾。"],[491350,494390,"那么，读到每个单词后该怎么处理？"],[494390,501280,"下一步要创建新节点，让这个词在哈希表里有地方存放。"],[501280,502280,"怎么创建呢？"],[502280,505630,"我们可以用 malloc 分配内存。"],[505630,508690,"申请的空间需要能容纳一个新的 node。"],[508690,519070,"检查 malloc 是否返回 NULL。 如果内存不足，load 应返回 false。"],[519070,530803,"创建节点后，用 strcpy 将刚读到的单词复制到节点中。"],[530803,536930,"节点就绪后，接下来要把它插入哈希表。"],[536930,540160,"回想一下，这张哈希表的每个数组元素都对应一条链表。"],[540160,547810,"我们需要找出，刚创建的节点应该放进哪一条。"],[547810,550480,"为了选择对应的链表，我们先计算单词的哈希值。"],[550480,561400,"调用 dictionary.c 中的 hash。 它接收字符串，返回一个可以索引到对应链表的整数。"],[561400,565812,"这个讲解示例最初给出的 hash，对每个输入都返回 0。"],[565812,570550,"之后会用更合适的哈希函数替换它。"],[570550,581170,"但现在就可以在 load 中调用 hash， 让它告诉你插入新节点时应使用哪个下标。"],[581170,588190,"选定链表后，下一步才是真正将单词插进去。"],[588190,589430,"具体怎么做呢？"],[589430,592480,"哈希表中的每个数组元素是一条链表的表头指针。"],[592480,599045,"用相应下标找到要放入这个单词的那条链表。"],[599045,602912,"接着把新节点加入其中。"],[602912,607530,"这里给指针赋值的顺序非常重要。"],[607530,608580,"这话是什么意思？"],[608580,610400,"来看一个例子。"],[610400,615500,"看图的上方。变量 head 指向链表的开头。"],[615500,616760,"链表的第一个节点里存着 bat。"],[616760,617870,"接下来是 book。"],[617870,618950,"再接下来是 banana。"],[618950,621510,"最后一个节点 banana 的 next 指针为 NULL。"],[621510,626510,"假设有一个刚用 malloc 分配的新节点，也就是画面中的蓝色节点。"],[626510,628650,"我想把它加进现有的链表中。"],[628650,638030,"要把新节点作为新的表头，你也许会想到，直接让 head 指向这个刚创建的节点。"],[638030,639380,"但这样会发生什么？"],[639380,649340,"一旦把 head 改为指向这个蓝色节点，原先链表里的所有节点就都找不到了。"],[649340,655310,"因为 head 和保存新节点的指针现在都指向这个蓝色节点，"],[655310,658050,"而蓝色节点又没有指向其他任何节点。"],[658050,659822,"那到底该怎么做？"],[659822,670070,"第一步，拿到新的蓝色节点，把它的 next 指针设为原来链表的首节点。"],[670070,677280,"做完这一步，再让 head 指向刚刚创建的新节点。"],[677280,679580,"现在，这条链表以 blue 开头，"],[679580,682580,"后面依次是 bat、book 和 banana。"],[682580,691640,"把新节点插在表头，原来的单词和新单词就都能通过同一条链表访问了。"],[691640,695030,"对词典中的每个单词，都要重复这个过程。"],[695030,705500,"用 fscanf 读一个词，分配足够的节点空间， 把单词复制进去，再把节点插入对应的链表。"],[705500,708245,"用哪条链表，取决于哈希函数的返回值。"],[708245,718600,"所有单词都处理完，词典就全部加载进内存中的哈希表里，可以开始检查拼写了。"]],"en":[[360,2310,"SPEAKER: Your first task in speller is going"],[2310,4500,"to be to implement the load function, which"],[4500,9000,"is responsible for taking the dictionary and loading it into a hash table."],[9000,10230,"How is this going to work?"],[10230,14340,"Well, the load function will take as its argument a char star, or a string,"],[14340,16440,"which is the dictionary file that you're going"],[16440,18750,"to have to open up and read from in order"],[18750,21510,"to load all this data into your hash table."],[21510,23100,"It's going to return a Boolean value."],[23100,27300,"True if you were able to successfully load all the data into your hash table,"],[27300,29370,"and false if there was some sort of memory error,"],[29370,31270,"like not enough memory available to allocate,"],[31270,34060,"for example, or a file that couldn't be opened."],[34060,36400,"So let's take a look at how you're going to do this."],[36400,38483,"Well, ultimately, when you open up this dictionary"],[38483,40530,"file and store all of the words in memory,"],[40530,43140,"you're going to store them all inside of a hash table."],[43140,47010,"And recall that a hash table is really just an array of individual linked"],[47010,47820,"lists."],[47820,50520,"And the way you determine which of those linked lists"],[50520,52740,"you're going to insert a word into is based"],[52740,55290,"on a hash function, a function that in this case"],[55290,57442,"is going to take input, a string, or a word"],[57442,59400,"that you're going to include in the dictionary."],[59400,61770,"And the output is going to be some number"],[61770,64080,"that you're able to generate from that input, which"],[64080,66720,"is going to correspond to which of the linked lists"],[66720,70320,"you want to place this particular word into."],[70320,73740,"Let's take a closer look at hash tables to get a better sense for how they work"],[73740,76860,"and how they're going to be useful for this load function."],[76860,79140,"Here, for example, I have five words that I would"],[79140,81330,"like to store inside of my hash table."],[81330,83550,"Apple, banana, bat, car and book."],[83550,87210,"And I could take all of these words and just put them in a single linked list."],[87210,89030,"But then I'd have a pretty long linked list"],[89030,91080,"of five words that I would have to traverse"],[91080,94590,"if I wanted to find whether any one particular word was inside"],[94590,96030,"of my data structure."],[96030,98640,"Instead, I can put them into a hash table,"],[98640,101100,"creating several buckets so to speak."],[101100,104430,"I'll create an A bucket for all words that begin with the letter A,"],[104430,107070,"a B bucket for all words that begin with the letter B,"],[107070,109920,"and a C bucket for all words that begin with the letter C,"],[109920,113670,"and then associate each of those words with a particular bucket."],[113670,115910,"So, for example, apple ends up in the A bucket."],[115910,118260,"Bat, book, and banana end up in the B bucket."],[118260,120270,"Car ends up with the C bucket."],[120270,125070,"What I've used here is a hash function, a function that takes apple, or bat,"],[125070,129419,"or book as input, and outputs which of the linked lists-- the A linked list,"],[129419,131670,"or the B linked list, or the C linked list--"],[131670,134700,"that I should place this particular word into."],[134700,137550,"So what exactly is a hash function?"],[137550,140970,"Well, a hash function in this case is going to take a word as input,"],[140970,143370,"and it's going to output a number corresponding"],[143370,147600,"to which bucket or element within this array we want to store the word in."],[147600,149820,"Because recall that a hash table really is just"],[149820,153390,"an array where the very first linked list in that array is at index 0,"],[153390,155402,"and then 1 and, then 2, and then so forth."],[155402,157110,"And so our hash function is going to take"],[157110,160560,"the word and output which index into that array"],[160560,162960,"we should use to place that particular word in."],[162960,167670,"And at each index inside of the hash table is going to be a linked list."],[167670,169265,"And what is a linked list again?"],[169265,171390,"We'll recall that a linked list is a way of storing"],[171390,175770,"data that's comprised of nodes, where every node has a value as well"],[175770,177930,"as a pointer to the next node."],[177930,180330,"So, for example, in the case of our spell checker,"],[180330,183360,"we're going to have a hash table, which has an array of linked lists."],[183360,186950,"And each of those linked list nodes is going to have a value--"],[186950,188430,"some place to store a word--"],[188430,191910,"which in this case is going to be a character array, which can store words"],[191910,197010,"up to the maximum length of any word, as well as a pointer to the next word."],[197010,198190,"What does this look like?"],[198190,201040,"Well, if you look at the top of dictionary dot C,"],[201040,202980,"you'll see the definition of a node here."],[202980,206130,"We've typedef'd a new node to create a new type called node, where"],[206130,209130,"every node has a word, which is a character array,"],[209130,211320,"as well as a pointer that is going to give us"],[211320,214900,"the address of the next node in this linked list."],[214900,218040,"So our hash table is going to give us the first node in the linked list."],[218040,221125,"And from there, we can get to the next node, and the node after that,"],[221125,224250,"so on and so forth, until we get to the end of the linked list, where we're"],[224250,226890,"just going to find the value null."],[226890,229380,"Then, immediately below that in dictionary dot C,"],[229380,230880,"you'll also notice this."],[230880,234010,"We've defined const int N to be equal to 1."],[234010,236200,"In other words, we defined a constant integer,"],[236200,238800,"which is called N, which we've initially set to 1."],[238800,242370,"And now said that table is going to represent our hash table."],[242370,245460,"And it's going to be an array of node pointers."],[245460,249540,"An array where every element in that array is a pointer to a node."],[249540,252990,"Right now, this hash table has only one element in the array."],[252990,255670,"In other words, there's only one bucket in the hash table."],[255670,259149,"So you'll likely want to change N. Set it to some higher value"],[259149,261060,"so your hash table can have more buckets,"],[261060,263970,"and therefore spread data out a little bit more evenly."],[263970,266920,"Initially, though, your hash table is going to be empty."],[266920,270570,"So how are you going to be able to add more data to that hash table?"],[270570,274140,"Well, to do so, you're going to need to allocate memory for a new node,"],[274140,276360,"and then put some data into that node."],[276360,278310,"In order to allocate memory for a new node,"],[278310,280560,"I might have some code that looks something like this."],[280560,283680,"Node star N equals malloc size of node."],[283680,285840,"Malloc here means allocate some memory."],[285840,287730,"Ask for some memory from the computer."],[287730,290040,"And how much memory do I want to allocate?"],[290040,293040,"Well, size of node is going to be the number of bytes of memory"],[293040,295620,"that I need in order to restore a node."],[295620,298620,"And so malloc size of node is going to give me just enough memory"],[298620,300010,"to be able to store a node."],[300010,303700,"And I'm going to store the address of that node inside of N."],[303700,305920,"How do I then put data into that node?"],[305920,308450,"Well, remember that a node has two properties to it."],[308450,311950,"It has the word itself, as well as a pointer to the next node."],[311950,316600,"So I might say, strcpy N arrow word, and then hello."],[316600,317770,"What is this going to do?"],[317770,319990,"Well, strcpy is short for string copy."],[319990,323530,"It's going to copy a string from a source into a destination."],[323530,327880,"And in this case, it's going to copy the word hello into the character array"],[327880,331780,"N arrow word, which is the word field of this node"],[331780,333430,"that I've just created some space for."],[333430,336490,"I've copied the word hello into that space of memory."],[336490,337930,"In order to set the next pointer--"],[337930,340570,"if I knew what the next node was, I could set it right away."],[340570,343000,"But if I don't know, I can just set it to null."],[343000,345460,"N arrow next equals null means right now,"],[345460,348160,"nothing comes after this particular node."],[348160,350290,"Of course, in our linked list, some of these nodes"],[350290,354190,"are going to have other nodes that are the next node in the sequence"],[354190,356990,"of elements inside of the linked list."],[356990,360202,"So what exactly do you need to do now inside of this load function?"],[360202,362410,"Well, the first thing that you're going to have to do"],[362410,364630,"is open up this dictionary file."],[364630,368020,"Next, you're going to read strings from that file one at a time."],[368020,370840,"One word in the dictionary at a time."],[370840,373990,"For each of those words, you're going to create a new node."],[373990,376990,"Some node that is going to have a value and the next pointer."],[376990,381160,"And you're going to hash that word using a hash function to obtain a hash value,"],[381160,384850,"and index into your hash table to determine which of those linked lists"],[384850,388390,"you should use when you're inserting this node into a linked list."],[388390,391030,"And then, finally, you're going to take each of those words"],[391030,394320,"and insert that node into the hash table at the location"],[394320,396680,"given by your hash function."],[396680,399830,"So let's take a look now at each of these steps one at a time."],[399830,403000,"Let's start with how you're going to open the dictionary file."],[403000,405040,"Recall that the argument to the load function"],[405040,408550,"is a char star or string representing the dictionary file that you're"],[408550,410290,"going to use for the loading."],[410290,413708,"You can use the f-open function to open up that file."],[413708,415750,"And then, make sure to check to see if the return"],[415750,420070,"value is null to make sure that you were able to successfully open up the file."],[420070,422560,"If you weren't able to successfully open up the file,"],[422560,424780,"your load function should return false."],[424780,429010,"Otherwise, you'll be able to keep going to the next step of the load function."],[429010,432250,"The next step is to read strings from the file."],[432250,434170,"And for this, you can use a function called"],[434170,438640,"fscanf, short for scanning from a file, where the first argument is"],[438640,441790,"going to be that file pointer, the result of calling f-open"],[441790,443270,"on the dictionary file."],[443270,447010,"The second argument is %s, meaning you want to read in a string."],[447010,451130,"And the third argument is word, which is going to be some character array."],[451130,453520,"Some place where you're going to read the word into."],[453520,455312,"In other words, some character array inside"],[455312,458380,"of memory where you can then access all of the individual characters"],[458380,460625,"of that word after you've read it from the file."],[460625,463000,"And you're going to want to repeat this again, and again,"],[463000,467260,"and again for each of the words in the dictionary, calling fscanf on the file"],[467260,472960,"over and over getting one word at a time until fscanf returns EOF."],[472960,476870,"And that will happen once fscanf reaches the end of the file."],[476870,479590,"So when fscanf returns EOF, that's your sign"],[479590,482410,"that you finished reading all of the words in the dictionary."],[482410,484750,"But you'll likely want to have some sort of loop that's"],[484750,487300,"running fscanf again and again on one word,"],[487300,491350,"after word, after word until you get to the end of the file."],[491350,494390,"What are you going to do for each of those individual words?"],[494390,496480,"Well, the next step is going to be to create"],[496480,499720,"a new node that is going to store that particular word"],[499720,501280,"inside of your hash table."],[501280,502280,"How to do that?"],[502280,505630,"We'll recall that the malloc function you can use to allocate memory."],[505630,508690,"So you'll want to allocate enough memory to store a new node."],[508690,511810,"And again, be sure to check if malloc returns null or not,"],[511810,515159,"because if malloc doesn't have enough memory to be able to store the node,"],[515159,519070,"it will return null and your load function should return false."],[519070,520900,"Once you've created that node, you're going"],[520900,523780,"to want to copy the word into that node using"],[523780,527020,"the strcpy function, a function which will take a string"],[527020,530803,"and copy it from one location into another location."],[530803,532720,"Now that we've created the node, the next step"],[532720,534910,"is to figure out how it is we're going to insert"],[534910,536930,"this node into the hash table."],[536930,540160,"Recall again that a hash table is just an array of linked lists."],[540160,542200,"And we now need to determine which linked"],[542200,544480,"list we should use when we're determining"],[544480,547810,"where to place this particular node that we've just created."],[547810,550480,"And to do that, we're going to hash the word."],[550480,553600,"You're going to use the hash function, which is defined in dictionary"],[553600,556240,"don't C, which will be a function that takes a string"],[556240,560590,"and returns an index, some number that you can use to index into your linked"],[560590,561400,"list."],[561400,563680,"Right now, we've given you a hash function that just"],[563680,565812,"returns 0 for every particular input."],[565812,567520,"And later in this assignment, we're going"],[567520,570550,"to replace this hash function with a better hash function."],[570550,574840,"But for now, you can just call upon the hash function inside of load"],[574840,577480,"to determine which index into the hash table"],[577480,581170,"you should use when you're inserting this new node."],[581170,584200,"Once you've determined which linked list you should use,"],[584200,588190,"the next step is to actually insert that word into the linked list."],[588190,589430,"How are you going to do that?"],[589430,592480,"Well, again, recall that the hash table is an array of linked lists."],[592480,595150,"And you're going to want to index into the hash table"],[595150,599045,"to get the linked list that you want to use to add this particular word into."],[599045,600920,"And in order to do that, you're going to have"],[600920,602912,"to add a new node to a linked list."],[602912,605120,"So you'll want to be sure to make sure you're setting"],[605120,607530,"your pointers in the correct order."],[607530,608580,"What do I mean by that?"],[608580,610400,"Well, let's take a look at an example."],[610400,613430,"Here up at the top, imagine that head is a variable that"],[613430,615500,"points to the start of a linked list."],[615500,616760,"The linked list is bat."],[616760,617870,"And next is book."],[617870,618950,"And next is banana."],[618950,621510,"And banana here points to null, for example."],[621510,625400,"And let's imagine that I have this new node, which is this blue mode"],[625400,626510,"that I've just malloced."],[626510,628650,"And I want to add it to this linked list."],[628650,632488,"So if I wanted to make this new node the new head of the linked list,"],[632488,634280,"one thing you might imagine that I would do"],[634280,638030,"is point head to point at this new node that I've just created."],[638030,639380,"But what's just happened?"],[639380,643100,"Now that I've set head to be blue, this very first node inside"],[643100,646130,"of this linked list, I've now lost access effectively"],[646130,649340,"to all of the other nodes that were previously in the linked list."],[649340,653780,"I have no way to get to them because both head and new node both point"],[653780,655310,"to just this blue node."],[655310,658050,"And blue doesn't point to anything else."],[658050,659822,"So what is the actual solution here."],[659822,662030,"Well, the first thing that you're going to want to do"],[662030,663920,"is probably to take this new node--"],[663920,665210,"in this case, blue--"],[665210,670070,"and set its next pointer to be the first element in the linked list."],[670070,673110,"Then after that, you can reset head-- in other words,"],[673110,674780,"the first element in the linked list--"],[674780,677280,"to be the new node that you've just created."],[677280,679580,"Now the beginning of the linked list is blue."],[679580,682580,"And next comes bat, and then book, and banana."],[682580,684990,"And we've been able to represent all of these words"],[684990,688940,"now together inside of a single linked list by adding our new node"],[688940,691640,"to the beginning of the linked list."],[691640,695030,"And you're going to repeat this process for every word in the dictionary."],[695030,698420,"Reading that word using fscanf, allocating enough memory in order"],[698420,701750,"to store that word, copying the word into the node,"],[701750,705500,"and then inserting that node into one of the linked lists in your hash table"],[705500,708245,"based on the result of calling your hash function."],[708245,710870,"After you've done that for each of the words in the dictionary,"],[710870,713300,"you'll have successfully loaded all of your data"],[713300,715940,"into memory into a hash table such that you can now"],[715940,718600,"begin the spell checking process."]]},"aFe05MQ56Rc":{"edited":true,"zh":[[127,7830,"无论把单词存入词典，还是检查单词的拼写，都需要调用哈希函数。"],[7830,17200,"它接收一个单词，给出哈希表中的下标。 查找这个词，或者把它插入表中，都用这个下标。"],[17200,18840,"哈希函数的输入和输出是什么？"],[18840,24900,"hash 接收一个字符串（char *），也就是要计算哈希值的单词。"],[24900,34570,"它返回一个无符号整数，表示这个单词在哈希表里对应的索引。"],[34570,37020,"哈希函数具体要满足哪些条件？"],[37020,44070,"输入是一个单词，里面包含字母，也可能有撇号。"],[44070,51030,"输出必须是 0 到 N - 1 之间的整数下标，包含两端。"],[51030,60050,"N 是文件顶部定义的桶数，也就是保存各条链表表头的数组长度。"],[60050,62070,"给定代码中，N 默认是 1。"],[62070,71790,"应该把 N 调大一点。哈希表的桶多了，单词就能分散存放，查找也就可能更快。"],[71790,74880,"哈希函数对同一输入应当总是产生相同的结果。"],[74880,83370,"无论送入多少次，相同的输入都要得到相同的输出。 比如，要将 apple 加入词典时，先算出"],[83370,89040,"apple 的哈希值，再把它插入哈希表中对应的位置。"],[89040,95610,"检查 apple 是否拼写正确时，要能对 apple 重新调用同一个哈希函数，"],[95610,103110,"得到和插入时相同的值。这样只需检查那个桶的链表，看里面有没有 apple。"],[103110,113970,"你需要决定 N 取多少。这决定了桶的个数， 也就是数组长度，同时也决定了允许返回的哈希值范围。"],[113970,121110,"N 越大，桶就越多，数据越容易分散，查找也可能更快。"],[121110,132300,"返回的下标必须在 0 到 N - 1 之间，这才是数组的有效范围。"],[132300,142440,"如果计算出的数太大，可以对 N 取模， 也就是取除以 N 的余数，得到范围内的下标。"],[142440,145080,"举几个哈希函数的例子。"],[145080,148770,"最简单的一种，只看单词的首字母。"],[148770,153030,"首字母是 A，对应的哈希值就是 0。"],[153030,157050,"首字母是 B，哈希值就是 1，依此类推。"],[157050,161070,"首字母是 Z，哈希值就是 25。"],[161070,168450,"这时 N 取 26，字母表里的每个字母对应一个桶。"],[168450,177510,"不过，题目给的大词典包含超过 143,000 个单词，26 个桶并不多。"],[177510,186147,"可以考虑别的哈希函数，比如看开头两三个字母， 甚至更多，或者把所有字母的数值都纳入计算。"],[186147,194200,"写好 hash 之后，给它一个单词，就能知道这个词对应哈希表中的哪一条链表。"]],"en":[[127,2460,"BRAIN YU: When you're loading words into your dictionary"],[2460,5400,"and when you're checking to see if a word is spelled correctly or not,"],[5400,7830,"you're going to need to call on your hash function,"],[7830,10020,"a function that's going to take a word and return"],[10020,14370,"which index into your hash table you should use in order to find that word"],[14370,17200,"or insert the word into your data structure."],[17200,18840,"So what is the hash function?"],[18840,21750,"Well, the hash function is going to take a char star or a string"],[21750,24900,"as input representing the word that you're going to hash."],[24900,27900,"And it's going to return an unsigned integer, an integer that"],[27900,31440,"won't be negative, representing which index into the hash table"],[31440,34570,"you should use that corresponds to that particular word."],[34570,37020,"So what does your hash function need to do?"],[37020,39630,"Well, it needs to take as input a word, and that word"],[39630,41490,"is going to have alphabetical characters,"],[41490,44070,"and it may have apostrophes in it as well."],[44070,48870,"And the output of your hash function is going to be a numerical index between 0"],[48870,51030,"and N minus 1 inclusive."],[51030,53710,"Recall that N is defined at the top of the file"],[53710,56770,"and is the total number of buckets in your hash table,"],[56770,60050,"in other words, the length of that array of linked lists."],[60050,62070,"We've, by default, set N equal to 1."],[62070,64940,"But you can and should set N to be some larger number"],[64940,67213,"so that you have more buckets in your hash table"],[67213,69630,"and, therefore, can spread your data out a little bit more"],[69630,71790,"making for faster search times."],[71790,74880,"And importantly, your hash function should be deterministic."],[74880,77340,"If I give it the same input again and again,"],[77340,81330,"I should get the same output, such that when I'm loading a word like apple"],[81330,83370,"into the dictionary, I'll be able to calculate"],[83370,87720,"the hash value of the word apple and insert apple into that index"],[87720,89040,"into the hash table."],[89040,92520,"And then when I'm checking to see if the word apple is spelled correctly or not,"],[92520,95610,"I should be able to call the hash function on the word apple,"],[95610,98190,"get the same value as before, and then check"],[98190,100950,"only that particular linked list in the hash table"],[100950,103110,"to see if the word apple is there or not."],[103110,105800,"So you'll need to decide on a value of N,"],[105800,108300,"the number of buckets that your hash table is going to have,"],[108300,112080,"in other words, the length of your array, and also the possible values"],[112080,113970,"that your hash function can return."],[113970,117210,"A larger N value means you have more buckets and your hash table"],[117210,119010,"and, therefore, data is spread apart more"],[119010,121110,"and could potentially mean faster search times."],[121110,124440,"But you'll need to make sure that the output of your hash function"],[124440,128039,"is some value between 0 and n minus 1 inclusive"],[128039,132300,"because those will be the only valid indices into your hash table."],[132300,135030,"If your function were to end up with a value greater than N"],[135030,137820,"you could always take that value mod N or the remainder"],[137820,140610,"when you divide by N, in other words, to get a value that's"],[140610,142440,"in the appropriate range."],[142440,145080,"Now what are some examples of some hash functions?"],[145080,148770,"Well, a very simple hash function might just take the first letter of the word."],[148770,153030,"If the first letter of the word is A, then the hash value is going to be 0."],[153030,155430,"If the first letter of the word is B, the hash value"],[155430,157050,"is 1, so on and so forth."],[157050,161070,"If the first letter of the word is Z, the hash value might be 25."],[161070,164070,"In this case, your value of N is 26 because you'd"],[164070,168450,"have 26 different buckets, one for every letter of the alphabet."],[168450,172140,"Of course, 26 isn't very many buckets, especially considering the fact"],[172140,174390,"that the large dictionary that we're going to give you"],[174390,177510,"contains more than 143,000 words."],[177510,179760,"So you might consider using other hash f
