unctions,"],[179760,182490,"like looking at the first two or three or more letters"],[182490,186147,"or doing some sort of math using all of the individual values of the letters."],[186147,187980,"But once you've completed the hash function,"],[187980,190340,"you'll now have the ability to take a word"],[190340,193390,"and determine which of the linked lists inside of your hash table"],[193390,194200,"it should correspond to."]]},"3cD-_NGTw9A":{"edited":true,"zh":[[0,4965,"size 函数要返回词典里的单词总数。"],[4965,6840,"这有几种做法。"],[6840,9930,"一种做法是遍历哈希表里的每一条链表，"],[9930,14730,"数出各条链表有多少个节点，再加起来。"],[14730,17790,"或者，你也可以在加载哈希表时，"],[17790,24240,"一边往词典里加单词，一边记下已经加了多少个。"],[24240,25790,"最后让 size 返回这个数。"]],"en":[[0,1950,"BRIAN YU: In the Size function, you'll need"],[1950,4965,"to return the number of words that are in your dictionary."],[4965,6840,"There are a number of ways you might do that."],[6840,9930,"You might imagine iterating over every single one of the linked lists"],[9930,12750,"inside of your hash table, counting the number of nodes"],[12750,14730,"inside of each of the linked lists."],[14730,17790,"Or you could imagine that, as you're loading the hash table,"],[17790,20310,"you could somehow keep track of the number of words"],[20310,24240,"you've added to the dictionary so far so you can return that value in your Size"],[24240,25790,"function."]]},"qPz_Mr69yE0":{"edited":true,"zh":[[150,5430,"check 要做的是接收一个单词，判断它在不在词典里。"],[5430,13870,"check 接收表示待查单词的字符串，返回布尔值 true 或 false。"],[13870,16140,"它具体要做到什么呢？"],[16140,19920,"如果词典里有这个单词，就返回 true。"],[19920,22140,"如果没有，就返回 false。"],[22140,25975,"check 还应忽略大小写。"],[25975,30000,"单词里的字母写成大写或小写，都不影响结果。"],[30000,36510,"无论大小写怎么写，拼写检查器都要能识别词典里有没有这个词。"],[36510,38490,"那么，从哪里开始？"],[38490,47130,"首先，对这个单词调用先前实现的 hash，得到哈希值。"],[47130,56760,"用这个哈希值作为下标，在哈希表里找到相应的链表。 这里的哈希表就是存着各个链表表头的数组。"],[56760,63340,"如果词典里有这个词，它一定在刚刚找到的这条链表里。"],[63340,66820,"如果这条链表里没有它，那词典里也没有。"],[66820,76170,"依次遍历链表中的节点。可以用 strcasecmp 比较字符串， 它和 strcmp 类似，"],[76170,80880,"但 strcasecmp 会忽略大小写。"],[80880,86040,"这样查找时，大写、小写的区别就不会影响结果。"],[86040,89710,"成功找到这个词，check 就返回 true。"],[89710,91800,"否则就返回 false。"],[91800,94110,"怎样遍历一条链表？"],[94110,96020,"来看个例子。"],[96020,108180,"变量 head 指向第一个节点。第一个节点存着 bat， 指向存着 book 的节点，再指向存着 banana 的节点。"],[108180,110438,"怎样遍历这条链表？"],[110438,118310,"可以定义一个变量 cursor，让它一开始指向链表的第一个节点。"],[118310,120940,"看看节点里存的是不是我要找的单词。"],[120940,127731,"如果不是，就把 cursor 移到下一个节点。"],[127731,129870,"去哪儿找到下一个节点？"],[129870,135430,"指向下一个节点的地址存放在当前节点的 next 成员中。"],[135430,146220,"写 cursor = cursor->next， 就能让 cursor 指向下一个节点。"],[146220,149511,"这样 cursor 就移到了下一个节点。"],[149511,160020,"用 strcasecmp 将节点中的单词和要找的单词作不区分大小写的比较。"],[160020,166260,"如果没有命中，就再执行 cursor = cursor->next， 移向下一个节点。"],[166260,169650,"一旦找到目标单词，就返回 true。"],[169650,170880,"那要在什么时候停下来？"],[170880,173550,"可以把这个查找过程放进循环里。"],[173550,179880,"反复执行 cursor = cursor->next，最终会走到链表的末尾。"],[179880,183460,"此时会得到空指针 NULL。"],[183460,194730,"cursor 变为 NULL 表示走到了末尾，沿途都没找到这个词。"],[194730,197620,"这时 check 应返回 false。"],[197620,201030,"我们把遍历链表的过程再过一遍。"],[201030,205650,"一开始，让 cursor 指向首节点。"],[205650,214050,"依次检查节点中的单词， 并用 cursor = cursor->next 向前移动，直到遇到 NULL。"],[214050,219930,"如果途中找到目标单词，说明它在词典里，函数返回 true。"],[219930,225510,"如果直到链表末尾都没有找到，就返回 false。"],[225510,233207,"这样，check 就能判断任意给定的单词是否在词典里了。"]],"en":[[150,2730,"BRIAN YU: In the check function, your job is to take a word"],[2730,5430,"and check to see if the word is in the dictionary or not."],[5430,7980,"The check function will take a char star or a string"],[7980,10530,"representing the word as its input, and the output"],[10530,13870,"will be a Boolean variable, true or false."],[13870,16140,"So what does your check function need to do?"],[16140,19920,"Well, your function should return true if the word is in your dictionary."],[19920,22140,"And it should return false otherwise."],[22140,25975,"And importantly, your check function should be case insensitive."],[25975,28350,"It shouldn't matter if some of the characters in the word"],[28350,30000,"are uppercase or lowercase."],[30000,33780,"Your spell checker should still be able to detect whether or not the word is"],[33780,36510,"in the dictionary regardless of case."],[36510,38490,"So what are you going to need to do?"],[38490,40920,"Well, the first step is going to be to take the word"],[40920,44700,"and hash the word using the hash function that you implemented earlier"],[44700,47130,"in order to obtain a hash value."],[47130,50490,"Then, you'll access the linked list at that hash value"],[50490,53910,"at that particular index in your hash table, which, again, is just"],[53910,56760,"an array of those individual linked lists."],[56760,59280,"Once you've access that individual linked list,"],[59280,61410,"you know that if the word is in the dictionary,"],[61410,63340,"it's going to be in that list."],[63340,66820,"And if the word is not in that list, then it's not in the dictionary."],[66820,69540,"So you can traverse that linked list, looking at one node"],[69540,71910,"at a time looking for the word in question"],[71910,76170,"and using the strcasecmp function, which is similar to strcmp, which"],[76170,80880,"compares to strings, but strcasecmp will compare two strings case insensitively."],[80880,84750,"So it won't matter whether the word is uppercase or lowercase for example"],[84750,86040,"in order to find the word."],[86040,89710,"If you're able to successfully find the word, your function will return true."],[89710,91800,"And otherwise, your function will return false."],[91800,94110,"How do you traverse a linked list though?"],[94110,96020,"Well, let's take a look at an example."],[96020,98820,"Here, let's imagine that head is a variable that"],[98820,102360,"is a pointer to the first element in the linked list, in this case, the word"],[102360,104430,"bat, which is inside of a node that points"],[104430,108180,"to a node that has the word book, which points to banana, for example."],[108180,110438,"How might I traverse that linked list?"],[110438,112980,"Well, you could imagine that I could set up a variable called"],[112980,117120,"cursor, for example, which initially is a pointer to the first element"],[117120,118310,"in the linked list."],[118310,120940,"And I might check, is that the word that I'm looking for?"],[120940,123780,"And if it's not the word I'm looking for, then what I'd like to do"],[123780,127731,"is take the cursor and move it to the next node in the linked list."],[127731,129870,"Well, where's the next node stored?"],[129870,133830,"It's stored inside of the next field inside of the node"],[133830,135430,"that I'm currently looking at."],[135430,139410,"So if I were to use syntax like cursor equals cursor arrow next,"],[139410,144770,"that would mean take cursor and set it equal to whatever cursor's next pointer"],[144770,146220,"is currently pointing to."],[146220,149511,"So that would move cursor to the next node in the linked list."],[149511,153180,"And I could check this node to see if this is the correct word, again, using"],[153180,157800,"the strcasecmp function to compare two strings to see case insensitively"],[157800,160020,"whether they contain the same characters or not."],[160020,162520,"If that's not right, then I might repeat the process setting"],[162520,166260,"cursor equal to cursor arrow next to move the cursor to the next node."],[166260,169650,"If I ever find the word in question, I'll go ahead and return true."],[169650,170880,"But when do I stop?"],[170880,173550,"You might imagine that this is happening in some sort of loop."],[173550,177270,"And eventually, I'll reach the end of the linked list, where, at some point,"],[177270,179880,"I'll set cursor equal to cursor arrow next."],[179880,183460,"And at the end of the linked list, what we'll have is null."],[183460,186480,"So if we move forward cursor equals cursor arrow next"],[186480,188970,"and eventually cursor becomes null, that means"],[188970,191520,"we've reached the end of the linked list and the word"],[191520,194730,"wasn't found, which means the word isn't in our dictionary"],[194730,197620,"and our function should at this point return false."],[197620,201030,"So as a brief recap, how are we going to traverse this linked list?"],[201030,205650,"You'll start with some cursor set to the first node inside of your linked list."],[205650,208080,"And then you'll keep moving the cursor, setting"],[208080,211890,"it equal to cursor arrow next over and over again checking each word"],[211890,214050,"as you go until you get to null."],[214050,216120,"If you find the word along the way, then that"],[216120,219930,"means the word is in the dictionary and you can return true from this function."],[219930,222250,"And otherwise, if you reach the end of the list,"],[222250,225510,"then the word is not in the dictionary and you can return false."],[225510,228630,"As a result, your check function will be able to take any word"],[228630,233207,"and determine whether or not it's inside of your dictionary."]]},"qkC4l0pUvCk":{"edited":true,"zh":[[500,10710,"拼写检查器的最后一步是实现 unload，释放运行程序时动态分配的内存。"],[10710,11890,"这是什么意思？"],[11890,21970,"每次用 malloc 动态分配内存后，都要负责在用完时调用 free 释放它。"],[21970,24330,"那么，unload 要做什么呢？"],[24330,32850,"unload 负责释放此前用 malloc 分配的内存，成功后返回 true。"],[32850,34170,"具体怎么做呢？"],[34170,39120,"这里的哈希表是一个数组，每个元素都是一条链表的表头指针。"],[39120,44340,"每条链表里都有一些节点，通常是此前用 malloc 分配的。"],[44340,46980,"所以，你需要释放每个节点。"],[46980,55740,"逐个访问哈希表中的桶，遍历其中的链表，对每个节点调用 free。"],[55740,58810,"怎样释放一条链表中的所有节点？"],[58810,60720,"我们看个例子。"],[60720,67680,"这里的变量 head 是指向链表首节点的指针。"],[67680,75510,"这里的三个节点依次存着 bat、book、 banana，通过 next 指针相连。"],[75510,80220,"如何释放这些先前用 malloc 分配的节点？"],[80220,85080,"再设一个变量 cursor，先指向这里的节点。"],[85080,87540,"它指向存着 bat 的节点。"],[87540,92280,"如果想释放这个先前用 malloc 分配的节点，"],[92280,100050,"可以调用 free(cursor)，释放 cursor 指向的节点。"],[100050,112110,"不过一旦释放节点，其中的 next 指针也不能再使用， 无法通过它去找 book、banana"],[112110,113670,"以及链表后面的其他节点。"],[113670,115140,"所以释放之前要小心。"],[115140,122760,"如果提前释放了还要用的内存，可能就找不到其余待释放的节点了。"],[122760,124170,"那该怎么办？"],[124170,132210,"可以再用一个变量保存我们所在的位置，避免丢掉任何节点。"],[132210,134200,"再来一遍。"],[134200,144570,"在 cursor 指向首节点时， 再设一个临时指针 temp，让它也指向同一节点。"],[144570,146700,"两个指针都指向同一个节点。"],[146700,152340,"也就是说，它们保存的都是链表首节点的地址。"],[152340,157380,"我想释放 temp 所指的第一个节点，"],[157380,160860,"同时还得能找到链表剩余的部分。"],[160860,171930,"先执行 cursor = cursor->next， 让 cursor 在首节点被释放前移到下一个节点。"],[171930,175480,"现在 cursor 已经指向链表的第二个节点。"],[175480,182400,"然后执行 free(temp) 释放 bat 节点， 这样仍能找到链表的剩余部分。"],[182400,184560,"因为 cursor 还指向那里。"],[184560,186420,"接下来重复同样的步骤。"],[186420,188910,"再把 temp 设为 cursor，"],[188910,190710,"现在 temp 也指向 book。"],[190710,194790,"为了能找到余下的链表，先把 cursor 往后移一个节点。"],[194790,199560,"这时可以释放 temp 指向的内存。"],[199560,201960,"释放这个节点，再重复相同的过程。"],[201960,204810,"先让 temp 指向 cursor 当前指向的节点。"],[204810,206370,"让 cursor 往后移一个节点，"],[206370,207810,"然后调用 free(temp)。"],[207810,213420,"一直做下去，最终 cursor 会变为 NULL。"],[213420,216120,"这表示你已经走到了链表末尾。"],[216120,225820,"到这里，这条链表中的节点就全部释放了，原来给它们分配的内存都归还了。"],[225820,235450,"对哈希表里的每条链表都这样做，就能释放为这张表动态分配的全部内存。"],[235450,238830,"我是 Brian。以上就是 Speller。"]],"en":[[500,3030,"BRIAN YU: The last step to completing your spell checker is"],[3030,6840,"to implement the unload function, which is responsible for freeing up"],[6840,10710,"any memory that you've allocated in the process of running your spell checker."],[10710,11890,"What does this mean?"],[11890,13860,"Well, remember that anytime you dynamically"],[13860,17250,"allocate memory using malloc, it's also your responsibility"],[17250,20190,"to call free on that memory, to free up that memory"],[20190,21970,"and give it back to the computer."],[21970,24330,"So what is your unload function going to do?"],[24330,27960,"Well, your unload function is going to call free on any memory"],[27960,30720,"that you've allocated using malloc and return true"],[30720,32850,"if it's able to do so successfully."],[32850,34170,"How are you going to do that?"],[34170,36600,"Well, remember again that your hash table is really"],[36600,39120,"just an array of individual linked lists."],[39120,41370,"Each of those linked lists contains nodes"],[41370,44340,"that you have allocated memory for, likely using malloc."],[44340,46980,"So you'll need to free each one of those nodes."],[46980,49320,"So you might imagine iterating over your hash table,"],[49320,51810,"going over each of those individual linked lists,"],[51810,55740,"and calling free on all of the nodes inside of those linked lists."],[55740,58810,"But how do you free all of the nodes in the linked list?"],[58810,60720,"Let's take a look at an example."],[60720,63510,"Here again is a linked list where we have a variable called"],[63510,67680,"head, which is going to be a pointer to the first element in the linked list."],[67680,70290,"In this case, a node that has the word bat in it,"],[70290,73530,"which has a next pointer that points to book, which has a next pointer that"],[73530,75510,"points to banana, in this case."],[75510,78030,"And let's imagine how we might free up these nodes"],[78030,80220,"that we've allocated using malloc."],[80220,83460,"You might imagine again that we could have a variable called cursor which"],[83460,85080,"is set equal to this node here."],[85080,87540,"It's a pointer to this node bat."],[87540,90180,"If I wanted to free this node which I originally"],[90180,92280,"allocated memory for using malloc."],[92280,93960,"I could use syntax like this--"],[93960,97770,"free(cursor): to say, take what cursor is pointing to, this node,"],[97770,100050,"and go ahead and free up that memory."],[100050,102870,"But if I did that, what you'll notice is now suddenly"],[102870,105510,"I've freed up that memory, which means I've also freed up"],[105510,109200,"the memory that was allocated for the next pointer that gave me access"],[109200,112110,"to book, and banana, and all of the remaining elements"],[112110,113670,"inside of this linked list."],[113670,115140,"So you'll want to be careful."],[115140,117900,"If you free up some memory before you're done using it,"],[117900,120720,"you might lose access to the rest of the nodes in the linked list"],[120720,122760,"that you also need to free."],[122760,124170,"So what's the solution here?"],[124170,126720,"We probably need some other variable to help"],[126720,129180,"us keep track of where we are in this linked list"],[129180,132210,"and to make sure that we don't lose track of any nodes."],[132210,134200,"Let's go ahead and try this again."],[134200,137670,"Here, in addition to a variable called cursor, which is currently"],[137670,140580,"looking at the very first node inside of this linked list,"],[140580,142920,"I'll create another variable called temp,"],[142920,144570,"which is going to be equal to cursor."],[144570,146700,"They're both pointing to the same node."],[146700,150270,"In other words, they both contain the address of this first node"],[150270,152340,"inside of the linked list."],[152340,155700,"Now what I'd like to do is free this temp pointer,"],[155700,157380,"which is pointing to this first node."],[157380,159088,"But I want to make sure that I don't lose"],[159088,160860,"track of the rest of the linked list."],[160860,165300,"So what I can first do is say something like cursor equals cursor arrow next"],[165300,169410,"to say, go ahead and move the cursor to the next element in the linked list"],[169410,171930,"before we free the first element."],[171930,175480,"Now cursor is pointing to the second element in the linked list."],[175480,177870,"So if I run a line of code like free temp,"],[177870,181080,"I can free up the bat node without worrying about losing"],[181080,182400,"the rest of the linked list."],[182400,184560,"Cursor is still pointing to it."],[184560,186420,"And now I can repeat the same process."],[186420,188910,"Go ahead and set temp to be the same thing that cursor is."],[188910,190710,"Have temp point to book as well."],[190710,193080,"Then, to make sure we don't lose the rest of the list,"],[193080,194790,"go ahead and move cursor."],[194790,197340,"And then we can free up the space that is allocated"],[197340,199560,"to what temp is currently pointing to."],[199560,201960,"Free up that node and repeat the process."],[201960,204810,"Have temp be set to the same thing cursor is set to."],[204810,206370,"Move the cursor forward."],[206370,207810,"And then free up temp."],[207810,211200,"And eventually, once you get through this entire process, what you'll find"],[211200,213420,"is that cursor is pointing to null."],[213420,216120,"In other words, you've reached the end of the linked list."],[216120,218537,"And at that point, that will tell you that you've freed up"],[218537,220470,"all of the nodes inside of that linked list"],[220470,223200,"and you're done freeing up all the memory that was originally"],[223200,225820,"allocated for those nodes."],[225820,228700,"If you repeat that process for every one of the linked lists"],[228700,230770,"that's inside of your hash table, the result"],[230770,233080,"will be that you've freed up all of the memory that"],[233080,235450,"was allocated for your hash table."],[235450,238830,"My name is Brian, and this was Speller."]]},"j84b_EgntcQ":{"edited":true,"zh":[[500,2009,"一起来做 DNA 分析。"],[2009,9360,"这道题会给你一段 DNA 序列，让你判断它最可能属于谁。"],[9360,16410,"一段 DNA 序列是由核苷酸碱基排列而成的。碱基共有四种，"],[16410,24630,"简写为 T、C、A 和 G。 许许多多这样的碱基依次排列，就组成了人的 DNA 序列。"],[24630,32820,"观察一个人的 DNA，你经常会发现某些片段在特定位置重复出现。"],[32820,36280,"比如来看 AGAT。"],[36280,39360,"在这段 DNA 中，这里有一个 AGAT。"],[39360,43650,"紧接着，在这里、这里、这里，还有这里，又出现了 AGAT。"],[43650,47220,"它一共连续出现了五次。"],[47220,48780,"这并非巧合。"],[48780,56460,"这叫作短串联重复：一小段 DNA 序列会在特定位置连续出现多次。"],[56460,61500,"短串联重复简称 STR，它的重复次数因人而异。"],[61500,67470,"对同一种 STR，不同人的 DNA 可能包含不同的连续重复次数。"],[67470,69810,"从中可以看出什么？"],[69810,77370,"比较不同的人，同一种 STR 的连续重复次数可能不同。"],[77370,80100,"例如，某个 STR 在你的 DNA 中可能连续重复 25 次，"],[80100,81960,"在我的 DNA 中可能是 28 次，"],[81960,85080,"在另一个人那里则可能是别的次数。"],[85080,91710,"所以，对比各种 STR 的重复次数，可以用来判断一份 DNA 样本属于谁。"],[91710,102150,"如果样本里各个 STR 的重复次数都和数据库中某份记录吻合，"],[102150,107670,"那么，这两份 DNA 就很可能来自同一个人。"],[107670,116910,"事实上，刚才看的 AGAT 就是美国联邦调查局 DNA 数据库使用的一种 STR。"],[116910,120220,"这道题要你做类似的事。"],[120220,127980,"我们会给你一个 CSV 格式的 DNA 数据库，一行对应一个人。"],[127980,135840,"姓名后面的每一列都对应一种 STR，也就是某段会连续重复的 DNA 序列。"],[135840,142980,"CSV 是“逗号分隔值”的简称。把它排成表格，就更好读了。"],[142980,151980,"例如，第一行表示 Alice 的 DNA 在某处连续出现了 28 个 AGAT。"],[151980,158430,"还有一处连续出现了 42 个 AATG。"],[158430,163713,"在另一处，TATC 连续出现了 14 次。"],[163713,165630,"Bob 也记录了这些序列，只是重复次数不同。"],[165630,169107,"Charlie 记录的也是同一组 STR，次数又不一样。"],[169107,180990,"题目会给你一份包含这些记录的 CSV 文件，另给一段 DNA 序列， 放在类似 sequence.txt 的文本文件中。"],[180990,191460,"你要判断给定的 DNA 序列中各个 STR 的重复次数， 是否和数据库中某个人的记录完全相符。"],[191460,193150,"把任务拆开来看，具体要做什么？"],[193150,202380,"先在 Python 程序中打开 CSV 文件和 DNA 序列文件， 把内容读入内存。"],[202380,212150,"对于每一种 STR， 找出它在 DNA 序列中最长的一段连续重复，算出那段的重复次数。"],[212150,221788,"算出各个 STR 的最长连续重复次数后， 将这组计数与 CSV 文件中的每一行比对，寻找匹配。"],[221788,223830,"如果匹配，就输出那个人的姓名。"],[223830,230410,"如果谁都不匹配，就输出 No match。"],[230410,235050,"我们逐步看，先从打开文件开始。"],[235050,247020,"CSV 的首行是各列的列名。第一列是 name， 从第二列开始，每个列名都是一段具体的 DNA 序列，"],[247020,249690,"也就是需要计数的一种 STR。"],[249690,256079,"其余各行中，每行对应一个人，首列是姓名。"],[256079,263640,"后面每列的数值都是对应 STR 在这个人 DNA 中的连续重复次数。"],[263640,272850,"有几个提示。Python 的 csv 模块提供了专门读取 CSV 文件的函数。"],[272850,281730,"csv.reader 逐行读成列表， csv.DictReader 则逐行读成字典。"],[281730,291780,"Python 还有一个 sys 模块，sys 是 system 的简称。 它提供的 sys.argv 存放命令行参数。"],[291780,296640,"除程序名以外，第一个参数是 CSV 格式的 DNA 数据库文件。"],[296640,302530,"第二个参数是序列文件，你要读取这里面的 DNA 序列并做计算。"],[302530,313990,"例如，用 open 打开文件，若文件对象叫 f， 可以调用 f.read() 读取内容。"],[313990,320200,"接下来，分别计算每种 STR 的最长连续重复次数。"],[320200,325420,"换句话说，要找出它在给定 DNA 序列中最多连续重复多少次。"],[325420,331360,"以画面上的 DNA 序列为例，找一下 STR 中的 AGAT。"],[331360,334900,"这里出现了一个 AGAT。"],[334900,337570,"这里也出现了一个 AGAT。"],[337570,342430,"而这个位置的 AGAT 后面紧跟着另一个 AGAT，连续出现了两次。"],[342430,353620,"可以遍历序列中的每个位置，分别数一数，从这里开始的 AGAT 会连续出现几次。"],[353620,363010,"对每个可能的起点都做这个计算， 所得的最大值就是这一 STR 的最长连续重复次数。"],[363010,366310,"这就是在当前这段 DNA 序列中能找到的最长连续重复。"],[366310,369280,"把它写成算法会是什么样？"],[369280,377470,"遍历 DNA 序列的每个位置，统计从该位置开始的 STR 连续重复了几次。"],[377470,378710,"怎么统计呢？"],[378710,390493,"对每个起点，向后检查相邻的子串。先看 STR 是否匹配一次， 再看紧接着是否匹配第二次、第三次，直到不再重复。"],[390493,398560,"记下所有起点中最大的次数，就得到了这个 STR 的最长连续重复次数。"],[398560,406720,"Python 的 len 函数会很有用。 len(s) 能得到字符串 s 的长度，也可以求其他序列的长度。"],[406720,418480,"还可以用 s[i:j] 从字符串 s 中取出一段子串，"],[418480,422590,"其中包含下标 i 开始的字符，一直到 j 之前，但不包含下标 j 的字符。"],[422590,431650,"如果有一段很长的 DNA， 想检查其中某一小段是否匹配目标序列，切片就派上用场了。"],[431650,439390,"算完所有 STR 的计数后，最后一步是和 CSV 文件中的数据比对。"],[439390,440930,"具体怎么做呢？"],[440930,448780,"把这些计数保存在某种数据结构里，可以是列表、字典，或者你觉得合适的其他结构。"],[448780,454610,"逐行检查表格，把样本里每个 STR 的计数和这行对应的计数逐一比较。"],[454610,461200,"如果某个人的所有 STR 重复次数都和样本相符， 就找到了匹配，输出这个人的名字。"],[461200,463892,"如果没有匹配，就输出 No match。"],[463892,473420,"比较时，可以用 Python 的 int 函数把表示整数的字符串转换成整数。"],[473420,481140,"比如，把带引号的字符串 \"2\" 传给 int，返回的是整数 2。"],[481140,492050,"判断某个人是否匹配，需要检查这一行中除首列之外的每一列。首列只存放姓名。"],[492050,503020,"将 CSV 文件和 DNA 序列读入内存， 算出所有 STR 的计数，再逐行与 CSV 中的记录比较，"],[503020,509650,"就可以推断一段 DNA 最可能属于谁。"],[509650,513240,"我是 Brian。以上就是 DNA。"]],"en":[[500,2009,"BRIAN YU: Let's analyze some DNA."],[2009,5610,"In this problem, your task is going to be to take a sequence of DNA"],[5610,9360,"and determine which person it most likely belongs to."],[9360,13800,"Recall that a sequence of DNA is really just a sequence of nucleotide bases"],[13800,16410,"where there are four different nucleotide bases that"],[16410,21960,"are abbreviated T, C, A, and G. If you put enough of these in sequence,"],[21960,24630,"you end up with a human's DNA sequence."],[24630,27690,"And interestingly, if you look at a human's DNA sequence,"],[27690,32820,"you'll often find places in the DNA where certain parts of the DNA repeat."],[32820,36280,"Take a look at the sequence AGAT for example."],[36280,39360,"You'll notice that in this DNA sequence, it appears here."],[39360,43650,"And then it repeats right after it here and here and here and here."],[43650,47220,"And it repeats five times consecutively in a row."],[47220,48780,"This isn't a coincidence."],[48780,51240,"It's something called a short tandem repeat--"],[51240,54050,"a sequence of DNA that repeats consecutively"],[54050,56460,"in particular locations in human DNA."],[56460,61500,"The short tandem repeats, also called STRs, vary a lot in the population."],[61500,64349,"In particular, different people have each STR"],[64349,67470,"repeated different numbers of times."],[67470,69810,"So what are the key observations here?"],[69810,74280,"Well, for any STR, people in a population vary in how many times"],[74280,77370,"that particular STR repeats consecutively."],[77370,80100,"You might have a particular STR repeated 25 times."],[80100,81960,"I might have it repeated 28 times."],[81960,85080,"Someone else might have it repeated some different number of times."],[85080,90510,"And matching STR counts can be used to, therefore, identify who a sample of DNA"],[90510,91710,"belongs to."],[91710,95730,"If we take a sample of DNA and count up for each of the STRs--"],[95730,98280,"how many times do they repeat consecutively"],[98280,102150,"and it matches some existing piece of DNA in a DNA database,"],[102150,106110,"for example, then it's pretty likely that those two pieces of DNA"],[106110,107670,"came from the same person."],[107670,111840,"And in fact, the very DNA sequence that we were looking at earlier, AGAT,"],[111840,116910,"is actually one of the STRs that the FBI uses in its own DNA database."],[116910,120220,"Your task in this problem is going to be to do something similar."],[120220,123570,"We're going to give you a DNA database of your very own, formatted"],[123570,127980,"as a CSV file where each row is going to correspond to a person."],[127980,131700,"And each column is going to correspond to a particular STR,"],[131700,135840,"a particular sequence of DNA that repeats some number of times."],[135840,139410,"We can take this CSV file, or comma separated value file,"],[139410,142980,"and format it as a table in order to read it a little more easily."],[142980,145650,"And the way to interpret this is that Alice"],[145650,150660,"has the DNA sequence AGAT repeated 28 times consecutively somewhere"],[150660,151980,"in her DNA."],[151980,157410,"She also has the sequence AATG repeated 42 times consecutively somewhere"],[157410,158430,"in her DNA."],[158430,163713,"And she has the TATC sequence repeated 14 times elsewhere in her DNA."],[163713,165630,"Bob has the same thing with different numbers."],[165630,169107,"And Charlie has the same STRs with different numbers as well."],[169107,170940,"What we're going to give you in this problem"],[170940,174660,"is we're going to give you a CSV file representing all of this data,"],[174660,178110,"and we're also going to give you a DNA sequence formatted as a text"],[178110,180990,"file called sequence.txt, for example."],[180990,183990,"And your task is going to be to take this DNA sequence"],[183990,187050,"and figure out whether or not it matches all of the STR"],[187050,191460,"counts for any person in the DNA database that we give you."],[191460,193150,"What does this actually mean?"],[193150,195420,"Well, it means that your program will first"],[195420,198390,"need to open the CSV file and the DNA sequence"],[198390,202380,"and read the contents into memory in your Python program."],[202380,205320,"Next up, for each of the STRs, you're going"],[205320,209790,"to compute the longest run of consecutive repeats of that STR"],[209790,212150,"in the DNA sequence you've been given."],[212150,213900,"Once you've calculated the number of times"],[213900,216780,"that each STR repeats consecutively, you're"],[216780,220530,"going to compare those counts against every row in the CSV file"],[220530,221788,"to look for a match."],[221788,223830,"If you find a match, you'll print out their name."],[223830,225747,"And if there's no match, you'll just print out"],[225747,230410,"no match to indicate that there was no match for anyone in your DNA database."],[230410,235050,"So let's go through these steps one at a time, starting with opening the files."],[235050,237570,"When you open the CSV file, one thing you'll notice"],[237570,242400,"is that the very first row of the CSV file has name as the first column"],[242400,247020,"and every subsequent column is going to be an actual DNA sequence representing"],[247020,249690,"the STRs that you should be counting."],[249690,252390,"Every other row of the CSV file is going to correspond"],[252390,256079,"to a person, where the first column is going to be that person's name."],[256079,259890,"And all of the remaining columns are going to represent the number of times"],[259890,263640,"that the STR repeats consecutively in that person's DNA."],[263640,265860,"So a couple of hints for doing this--"],[265860,268310,"one thing to note is that Python has a CSV"],[268310,272850,"module, a module designed with functions that will help you to read CSV files."],[272850,276360,"In particular, you might want to take a look at reader and DictReader"],[276360,280560,"to read a CSV file as a sequence of lists or a sequence of dictionaries,"],[280560,281730,"respectively."],[281730,285270,"You'll also note that Python has a sys module-- short for system--"],[285270,288270,"which will give you access to sys.argv for the command"],[288270,291780,"line arguments of the program where the first command line argument, other"],[291780,295910,"than the program's name, is going to be the DNA database formatted as a CSV"],[295910,296640,"file."],[296640,298680,"And the second argument is going to be the DNA"],[298680,302530,"sequence so you're actually going to read and do some calculations on."],[302530,306280,"Another hint-- once you've opened up a file by calling open and then"],[306280,311110,"passing in the file name in parentheses, you can read its contents using f.read"],[311110,313990,"if f is the name of the file, for example."],[313990,316660,"Once you've opened up all of the files, the next step"],[316660,320200,"is going to be to compute the individual STR accounts."],[320200,325420,"In other words, how many times do they repeat consecutively in a person's DNA?"],[325420,328330,"Well, let's take a look at this DNA sequence for example"],[328330,331360,"and look at the STR AGAT."],[331360,334900,"You'll notice that it appears once here, AGAT."],[334900,337570,"It also appears once here, AGAT."],[337570,339550,"And here it repeats twice in sequence--"],[339550,342430,"AGAT and then AGAT after that."],[342430,346270,"And you could imagine doing this for every position within the DNA sequence,"],[346270,349060,"computing at that particular place in the sequence"],[349060,353620,"how many times does AGAT repeat starting from that position."],[353620,355910,"Once you've computed all of those values,"],[355910,358990,"you could imagine taking whichever of those values is the biggest"],[358990,363010,"and that's going to be the longest run of consecutive STRs"],[363010,366310,"that you're going to find for this particular DNA sequence."],[366310,369280,"So what does this actually mean algorithmically?"],[369280,372280,"Well, it means for each position in the DNA sequence,"],[372280,375460,"you'll want to compute how many times the STR repeats"],[375460,377470,"starting at that position."],[377470,378710,"How do you do that?"],[378710,382990,"Well, for every position, you can keep checking successive substrings-- first,"],[382990,386380,"checking to see whether the STR matches once, then to see if it matches twice,"],[386380,390493,"then three times, so on and so forth until it doesn't repeat anymore."],[390493,392410,"And at the end, you'll just want to keep track"],[392410,396700,"of what is the maximal number of times that this particular STR"],[396700,398560,"repeats consecutively."],[398560,401050,"In order to do this, you might find the len function"],[401050,404470,"in Python helpful, which will give you the length of a string s"],[404470,406720,"or any other sequence for that matter."],[406720,413860,"And you can also take a string and get a substring of it by using s[i:j] which"],[413860,418480,"takes the string s and will return the substring with all the characters from"],[418480,422590,"character i up to but not including character j."],[422590,425530,"And that might be helpful if you've got a long sequence of DNA"],[425530,428620,"and you want to find out whether a particular subsequence of it"],[428620,431650,"matches some expected result."],[431650,434230,"Once you've computed all of these STR counts,"],[434230,437950,"the last step is to compare it against the data in the CSV file"],[437950,439390,"that we've given you."],[439390,440930,"How are you going to do that?"],[440930,444730,"Well, you'll want to save the STR counts in some sort of data structure, maybe"],[444730,446920,"a list, maybe a dictionary, maybe something else,"],[446920,448780,"whatever makes most sense to you."],[448780,450880,"And then for each row in the data, you'll"],[450880,454610,"want to check if each of the STR accounts matches."],[454610,457450,"And if each of the STR accounts matches for a particular person,"],[457450,461200,"then the DNA is a match and you should print out that person's name."],[461200,463892,"Otherwise, you should just print out no match."],[463892,465850,"In order to do this, you might want to remember"],[465850,467890,"that int is a function that you can actually"],[467890,472000,"call in Python that takes a string and turns it into the integer"],[472000,473420,"version of that string."],[473420,476260,"So if you took the string \"2\" for example in quotation marks"],[476260,481140,"and passed it into the int function, what you'd get back is the integer 2."],[481140,484150,"And remember that to confirm a match for a particular person,"],[484150,488380,"you'll need to check every column of the CSV file other than the first column,"],[488380,492050,"because the first column just stores the person's name."],[492050,496350,"So once you've opened up the CSV file and the DNA sequence into memory,"],[496350,499870,"calculated all the STR counts, and then compared those counts"],[499870,503020,"against each row in your CSV file, you should then"],[503020,505720,"have the ability to take a sequence of DNA"],[505720,509650,"and figure out most likely who that DNA belongs to."],[509650,513240,"My name is Brian and this was DNA."]]},"wgKPUd_95AA":{"edited":true,"zh":[[500,2430,"这道实验题要你编写 SQL 查询，"],[2430,7770,"用来回答有关一个歌曲数据库的问题。"],[7770,12750,"我们会提供一个 SQLite 数据库，文件名是 songs.db。"],[12750,15660,"里面的数据来自 Spotify，"],[15660,19060,"记录了不同歌曲及其艺人的信息。"],[19060,21210,"拿到数据库后，先要弄清楚"],[21210,26280,"各张表的结构，也就是所谓的 schema。"],[26280,30240,"打开 songs.db，你会发现一张叫 songs 的表，"],[30240,32439,"其中有很多列。"],[32439,36880,"每首歌都有一个整数类型（INTEGER）的 ID，"],[36880,41160,"一个文本类型（TEXT）的歌名，还有一个整数类型的 artist_id，"],[41160,42690,"它标明这首歌的艺人是谁。"],[42690,44530,"一会儿我们会再看这个字段。"],[44530,46720,"表里还记录着歌曲的其他信息，"],[46720,50340,"例如适合跳舞的程度、活力、调性和响度，"],[50340,53810,"以及其他一些属性。"],[53810,56150,"现在来看 artist_id。"],[56150,59510,"为了记录这些歌曲的不同艺人，"],[59510,63680,"数据库里还有一张表，叫作 artists。"],[63680,66230,"每位艺人都有一个整数类型的 ID，"],[66230,69470,"还有一个文本类型的名字。"],[69470,72860,"回到 songs 表，其中的 artist_id 列"],[72860,75200,"存的是一个整数，"],[75200,78620,"它对应 artists 表里某位艺人的 ID。"],[78620,82100,"接下来看看这个数据库实际是什么样子。"],[82100,84410,"下载好实验文件之后，我打开终端，"],[84410,90110,"输入 sqlite3 songs.db，就能打开数据库。"],[90110,94460,"我还可以输入 .schema，查看"],[94460,95300,"这个数据库的表结构。"],[95300,97610,"这里能看到 CREATE TABLE songs"],[97610,101120,"和 songs 表的所有列。下面是 CREATE TABLE artists，"],[101120,103340,"可以看到记录艺人信息的那张表的结构。"],[103340,106500,"比如，想看看数据库里有哪些歌，"],[106500,111110,"我可以输入 SELECT * FROM songs，"],[111110,113330,"这样就会查出所有歌曲。"],[113330,116960,"结果里既有所有歌曲，"],[116960,119600,"也有每一行对应的全部列。"],[119600,121680,"如果我只想看其中几列呢？"],[121680,123860,"我可以缩小查询结果的范围。"],[123860,127850,"比如，输入 SELECT name FROM songs，"],[127850,132780,"就只取 songs 表里的 name 这一列。"],[132780,138000,"这样显示出来的就只有每首歌的名字。"],[138000,140070,"在这次实验中，"],[140070,143130,"我们会围绕这个数据库提出八个问题，"],[143130,145320,"你的任务就是为每个问题"],[145320,147690,"写一条能给出答案的查询。"],[147690,149940,"我们已经准备好了存放这些查询的文件。"],[149940,153540,"例如，1.sql 用来写"],[153540,156600,"第一题的答案，你要在里面写一条 SQL 查询，"],[156600,159730,"用它来回答对应的问题。"],[159730,161370,"具体会问些什么呢？"],[161370,164310,"比如，第一题要求你在 1.sql 里"],[164310,169140,"写一条查询，列出数据库中所有歌曲的名字。"],[169140,171510,"其实就是刚才演示过的这条查询："],[171510,174030,"SELECT name FROM songs。"],[174030,178890,"把 SELECT name FROM songs 写进 1.sql，"],[178890,182070,"运行它，就能得到数据库中"],[182070,184630,"所有歌曲的名字。"],[184630,187030,"剩下的题目会让你查找"],[187030,189340,"这个数据库里的其他信息。"],[189340,191800,"有时要看的除了歌名，"],[191800,194950,"还有演唱这些歌的艺人、"],[194950,198310,"歌曲的响度、适合跳舞的程度，"],[198310,200980,"或者其他属性。你需要筛选、选取数据，"],[200980,204850,"必要时把表连接起来，才能得到所需的结果。"],[204850,209920,"只凭这一个数据库，就能回答所有问题。"],[209920,213390,"我是 Brian，这就是 Songs 这道题。"]],"en":[[500,2430,"SPEAKER: In this lab, your task is going to be"],[2430,7770,"to write SQL queries that can answer questions about a database of songs."],[7770,12750,"As part of this lab, we'll give to a sqlite database called songs.db,"],[12750,15660,"inside of which is information taken from Spotify"],[15660,19060,"about various different songs and their artists."],[19060,21210,"Ultimately, the first thing you'll want to do"],[21210,26280,"is to understand the structure or the schema of the tables in this database."],[26280,30240,"Inside songs.db, you'll find a table called songs"],[30240,32439,"that has quite a few different columns."],[32439,36880,"Every song has an ID, which is an INTEGER, the name of the song,"],[36880,41160,"which is some TEXT, artist ID, which is an INTEGER representing"],[41160,42690,"the artist of the song--"],[42690,44530,"we'll come back to that in a moment--"],[44530,46720,"and then other information about the song as well--"],[46720,50340,"its danceability, its energy, its key, its loudness,"],[50340,53810,"as well as other properties of the song, too."],[53810,56150,"Now, let's take a look at artist ID."],[56150,59510,"To represent the various different artists that songs can have,"],[59510,63680,"there's another table in this database called the artists table."],[63680,66230,"Every artist has an ID, which is an INTEGER,"],[66230,69470,"and a name, which is just going to be some TEXT."],[69470,72860,"And now the artist ID column of the songs table"],[72860,75200,"is going to be an INTEGER that corresponds"],[75200,78620,"to the ID of one of these artists."],[78620,82100,"So let's take a look at what this database actually looks like."],[82100,84410,"Once I've downloaded the lab, in my terminal"],[84410,90110,"I can type sqlite3 songs.db to go ahead and open up this database."],[90110,94460,"And if I wanted to, I could type .schema to get a sense for the schema of this"],[94460,95300,"database."],[95300,97610,"I would see again, here's CREATE TABLE songs,"],[97610,101120,"along with all the columns for songs, as well as CREATE TABLE artists,"],[101120,103340,"to see all of those artists."],[103340,106500,"So if I wanted to see what the songs were, for example,"],[106500,111110,"I might write a query like SELECT star FROM songs,"],[111110,113330,"to go ahead and select all of the songs."],[113330,116960,"And I would see all the songs, along with all of the columns"],[116960,119600,"that I have for each of those individual rows."],[119600,121680,"Maybe I didn't want all of those columns."],[121680,123860,"So I could filter down my results as well."],[123860,127850,"I could write a query like SELECT name FROM song"],[127850,132780,"to just select the name column from my songs table."],[132780,138000,"If I do that, then I'll only see the names of each of those songs."],[138000,140070,"Ultimately, in this lab, we're going to ask"],[140070,143130,"you eight different questions about this database,"],[143130,145320,"and your task is going to be to write queries"],[145320,147690,"to answer each of those questions."],[147690,149940,"We've given you files in which to put those answers."],[149940,153540,"For example, 1.sql is where you'll include your response"],[153540,156600,"to the first question, writing a SQL query here"],[156600,159730,"that you can use to answer a particular question."],[159730,161370,"What might those prompts be?"],[161370,164310,"Well, for example, in 1.sql, you're going"],[164310,169140,"to write a SQL query to list the names of all of the songs in the database."],[169140,171510,"And that, in fact, is a query that I've just shown you--"],[171510,174030,"SELECT name FROM songs."],[174030,178890,"So inside of 1.sql, you would write this query, SELECT name FROM songs,"],[178890,182070,"as a query that you could run in order to get the names of all"],[182070,184630,"the songs in the database."],[184630,187030,"Ultimately, the other prompts are going to ask you"],[187030,189340,"for other information about the database."],[189340,191800,"Maybe not just looking at the names of songs,"],[191800,194950,"but perhaps looking at the artists of the songs,"],[194950,198310,"looking at the volume of those songs, looking at their danceability, maybe"],[198310,200980,"other factors as well, filtering and selecting"],[200980,204850,"and joining tables together as needed in order to get the results you ultimately"],[204850,209920,"want to answer all of these questions just based on a single database."],[209920,213390,"My name is Brian, and this was Songs."]]},"7hydPL9ZswE":{"edited":true,"zh":[[500,3120,"一起来看看 Songs 这道题的一种解法。"],[3120,6510,"这道实验题有八个问题。"],[6510,15080,"每个问题都要写一条 SQL 查询，在数据库上运行它，就能查到答案。"],[15080,22450,"第一题要求写一条 SQL 查询，列出数据库中所有歌曲的歌名。"],[22450,24550,"这里用的是 SELECT 查询。"],[24550,30310,"在 SELECT 后写上你想查询的列。"],[30310,35200,"我想从 songs 表里选择名为 name 的列。"],[35200,43990,"所以，SELECT name FROM songs 会列出 songs 表里所有歌曲的名字。"],[43990,52265,"2.sql 要你用 SQL 查询列出所有歌名，并按歌曲的速度从慢到快排列。"],[52265,54640,"因此查询开头的写法和刚才相同。"],[54640,60380,"我们还是从 songs 表选取 name，只是希望按指定顺序排列。"],[60380,68660,"SQL 的 ORDER BY 子句可以按某一列的值对结果行排序。"],[68660,74050,"可以写 SELECT name FROM songs，然后加上 ORDER BY tempo。"],[74050,78010,"这里的 tempo 就是用来排序的列。"],[78010,84530,"可以明确写上 ASC 表示升序。不过 SQL 默认就是升序，所以 ASC 可以省略。"],[84530,89380,"如果想改为降序，则可以写 DESC。"],[89380,93550,"这次要从低到高排列，SQL 默认就是升序。"],[93550,103620,"SELECT name FROM songs ORDER BY tempo 会列出所有歌名，并按速度升序排列。"],[103620,114130,"在 3.sql 中，你需要按时长从长到短列出最长的五首歌的名字。"],[114130,116700,"这条查询要做两件事。"],[116700,120570,"首先要按时长降序排列。"],[120570,128259,"其次，只返回五条结果，而不是表中的全部数据。"],[128259,131030,"先来看如何按时长降序排列。"],[131030,136650,"duration_ms 这一列记录了每首歌的时长。"],[136650,148530,"我可以写 SELECT name FROM songs ORDER BY duration_ms DESC，其中 DESC 表示降序。"],[148530,151410,"这样就会按时长从长到短排列所有行。"],[151410,157110,"但我只想看降序排列后的前五首，也就是最长的五首歌。"],[157110,165240,"这时可以加上 LIMIT 子句，限制 SQL 查询返回的行数。"],[165240,174580,"写上 LIMIT 5，就只会得到数据库中时长最长的五首歌。"],[174580,183180,"在 4.sql 中，你要列出满足这几个条件的歌：danceability、energy"],[183180,187380,"以及 valence 三项的值都大于 0.75。"],[187380,193732,"这里需要给 SELECT 查询添加条件，对查询结果做进一步筛选。"],[193732,201000,"我想找到满足特定条件的歌；取出全部歌曲或只取前几首都不符合要求。"],[201000,210070,"可以用 WHERE 指定条件，用 AND 这样的布尔运算符组合多个条件。"],[210070,222120,"先用 SELECT name FROM songs，再在 WHERE 后要求 danceability 和 energy 都大于 0.75，"],[222120,228360,"并要求 valence 也大于 0.75。这三个条件必须同时满足。"],[228360,233520,"这样，结果里只会出现符合条件的歌名。"],[233520,240930,"5.sql 要求用 SQL 查询返回所有歌曲的平均能量值。"],[240930,245560,"songs 表的 energy 列记录了每首歌的能量值。"],[245560,249570,"为了求平均能量，就要用到 SQL 函数。"],[249570,256570,"SQL 提供了 COUNT、AVG 和 SUM 等内置函数，分别可以计数、求平均与求和。"],[256570,268740,"这道题用 AVG，计算 songs 表中 energy 列的平均值。"],[268740,272800,"6.sql 的要求要复杂一些。"],[272800,279440,"你要用 SQL 查询列出 Post Malone 的所有歌曲的名字。"],[279440,287030,"理想情况下，我们只需在 songs 表中选出艺人为 Post Malone 的歌曲。"],[287030,290390,"但 songs 表中没有存放艺人姓名的列。"],[290390,298070,"songs 表有一列 artist_id，对应 artists 表中的 id。"],[298070,303270,"所以，先找出 Post Malone 的艺人 ID。"],[303270,311270,"可以从 artists 表中选取 id，并用 WHERE name = 'Post Malone' 限定艺人姓名。"],[311270,314840,"这个查询会返回 Post Malone 的艺人 ID。"],[314840,321740,"得到 ID 后，就可以在另一条查询中用它找出 Post Malone 的所有歌曲。"],[321740,324860,"不过在 SQL 中，一条查询也可以嵌套在另一条查询里面。"],[324860,332990,"我可以将一个查询嵌入另一个查询。外层查询是 SELECT name FROM songs，"],[332990,338120,"然后要求 artist_id 等于内层查询返回的值。"],[338120,342050,"内层查询返回的是 Post Malone 的艺人 ID。"],[342050,349100,"外层查询选出 artist_id 等于这个 ID 的所有歌曲的名字。"],[349100,354530,"得到的结果，就是 Post Malone 的所有歌曲的名字。"],[354530,360830,"接下来的 7.sql 要把前两道题的思路结合起来。"],[360830,369500,"这次还要求歌曲能量的平均值，但只统计 Drake 的歌曲。"],[369500,375980,"我们还是从 songs 表中取值，并用 AVG 来求平均能量。"],[375980,386660,"加上 WHERE 子句，让 AVG 只统计 artist_id 等于 Drake 的艺人 ID 的歌曲。"],[386660,390680,"我们还是可以写一条嵌套查询来获得所需的信息。"],[390680,398210,"从 artists 表里选出 name 等于 'Drake' 的那一行的 id，得到 Drake 的艺人 ID。"],[398210,404490,"然后把这个结果用于外层查询，就能只对这些歌曲求平均能量。"],[404490,413100,"最后一道题在 8.sql 中，要列出有其他艺人参与合作的歌曲名称。"],[413100,421815,"要留意，这些歌曲的名字里通常有一个标记："],[421815,426450,"feat.，拼作 f、e、a、t，最后是一个点，表示有其他艺人参与。"],[426450,437160,"这里可以用 LIKE 配合通配符来匹配名字，而不必要求名字完全相等。"],[437160,447720,"用 LIKE 匹配歌名时，先写通配符 %，表示前面可以有任意字符，接着写 feat.，"],[447720,452220,"后面再写一个 %，表示还可以跟任意字符。"],[452220,463505,"这样就能找出歌名中包含 feat. 的歌曲，也就是有其他艺人参与的歌曲。"],[463505,471730,"在 songs.db 上运行这些 SQL 查询，就可以得到八个问题的答案。"],[471730,475160,"我是 Brian，这就是 Songs 的解答。"]],"en":[[500,3120,"BRIAN: Let's take a look at how you might have solved \"songs.\""],[3120,6510,"In this lab, we gave you eight questions to answer."],[6510,9240,"And your task was to answer each of those questions"],[9240,12600,"by writing a SQL query that you could have run on a database"],[12600,15080,"to get access to that answer."],[15080,17320,"So the first query we asked you to write was"],[17320,22450,"to write a SQL query to list the names of all of the songs in the database."],[22450,24550,"And this was just a \"select\" query."],[24550,28120,"You're going to select, and then select takes as its first argument"],[28120,30310,"what columns you care about selecting."],[30310,35200,"And so here I want to select the column called \"name\" from the song's table."],[35200,37870,"So select a name from songs would have given us"],[37870,40330,"all of the names of all of the songs that"],[40330,43990,"were stored inside of the songs table."],[43990,47020,"Meanwhile, in 2.sql, you were asked to write"],[47020,52265,"a SQL query to list the names of all of the songs in increasing order of tempo."],[52265,54640,"So the start of the query would have been the same thing."],[54640,57490,"We're still selecting \"name\" from songs, but we"],[57490,60380,"want to put those songs in a particular order."],[60380,63550,"And for that, SQL has an ORDER BY clause that"],[63550,68660,"lets us put rows in a particular order according to the value of a column."],[68660,74050,"So here we could say, select name from songs, and then order by tempo."],[74050,78010,"Where tempo here is the column on which we want to order those songs."],[78010,81100,"You could have explicitly said ASC for ascending"],[81100,84530,"order, which is the default by SQL, so you didn't need to include it."],[84530,87350,"But if you had wanted to do descending order, for example,"],[87350,89380,"that would have been DESC."],[89380,91880,"But in this case, we just asked for increasing order,"],[91880,93550,"which was the default by SQL."],[93550,97150,"So just SELECT name FROM songs, ORDER BY tempo"],[97150,100000,"would have allowed us to query for all of the songs"],[100000,103620,"and then put them in order by their tempo."],[103620,106770,"In 3.sql, meanwhile, your task was to write"],[106770,110640,"a SQL query that listed the names of the top five longest"],[110640,114130,"songs in descending order of length."],[114130,116700,"So there are really two pieces to this query."],[116700,120570,"The first thing is we need to make sure they're in descending order of length."],[120570,122880,"And the next thing we need to do is to make sure"],[122880,126810,"that we only get back five results instead of getting back all of the data"],[126810,128259,"from the table."],[128259,131030,"So let's start with the descending order of length."],[131030,134310,"There's a column duration_ms, which is going"],[134310,136650,"to represent the duration of any song."],[136650,141100,"And so to organize the songs in descending order of length,"],[141100,145380,"I could say, select name from song, order by duration_ms,"],[145380,148530,"DESC for descending order."],[148530,151410,"That's going to put all of the rows in descending order."],[151410,155670,"But I only want the top five longest songs, not all of the songs,"],[155670,157110,"in descending order."],[157110,159640,"And so here I can add another clause called"],[159640,163080,"LIMIT that limits the number of rows that are"],[163080,165240,"going to be returned by the SQL query."],[165240,170190,"By saying LIMIT 5, I'm limiting myself to just the five longest songs"],[170190,174580,"that happen to be inside of this database."],[174580,179010,"Now in 4.sql, your task was to write a SQL query that"],[179010,183180,"lists the names of any songs that have danceability, energy,"],[183180,187380,"and valence greater than 0.75."],[187380,190440,"And so here I'm adding a condition, some sort of way"],[190440,193732,"to filter down the results of my select query."],[193732,195690,"I don't want all of the songs, and I don't just"],[195690,198480,"want the first some number of songs, but I want songs"],[198480,201000,"that match a particular condition."],[201000,204330,"And here's where I can use a WHERE clause to specify a condition"],[204330,207090,"and even join together multiple of those clauses"],[207090,210070,"with Boolean expressions like AND."],[210070,213690,"So here I'm selecting name from songs where"],[213690,217650,"--and this is where I introduce this condition-- where danceability"],[217650,222120,"is greater than 75 AND energy is greater than 75"],[222120,225120,"AND valence is greater than 0.75 in order"],[225120,228360,"to make sure that all three of these things are going to be true."],[228360,233520,"And I will only be able to see names of songs that match that condition."],[233520,237690,"In 5.sql, you were asked to write a SQL query that returns"],[237690,240930,"the average energy of all of the songs."],[240930,243150,"Well, the songs table has an energy column"],[243150,245560,"for the energy of any individual song."],[245560,249570,"And so, to get the average energy, you needed to use a SQL function."],[249570,254070,"SQL has some built-in functions like count, and like average, and like sum"],[254070,256570,"for performing various different operations."],[256570,260070,"And so, in this case, I needed to call the average function, which"],[260070,265530,"in SQL is just AVG, to select the average value for the energy column"],[265530,268740,"from my songs table."],[268740,272800,"In 6.sql, we ask you something a little bit more complicated."],[272800,277020,"We asked you to write a SQL query that lists the names of songs"],[277020,279440,"that are by Post Malone."],[279440,283070,"Now ideally, we wanted to just select from the songs table"],[283070,287030,"to get only the songs where the artist is Post Malone."],[287030,290390,"But there is no artist column in the songs table."],[290390,294860,"There is, however, an artist ID column in the songs table that corresponds"],[294860,298070,"to some ID from the artists table."],[298070,300470,"So the first thing I might want to do is figure"],[300470,303270,"out what Post Malone's artist ID is."],[303270,306290,"And to do that, I could have done something like SELECT ID"],[306290,311270,"from artists where name equals Post Malone."],[311270,314840,"And that would have been a query that would tell me Post Malone's artist ID."],[314840,317840,"And then I could have used that ID in another query"],[317840,321740,"to figure out all of the songs that are by Post Malone."],[321740,324860,"But in SQL, you can nest queries within each other."],[324860,328250,"Rather than separate this out into two distinct queries,"],[328250,332990,"I could nest one within the other and say, select a name from songs"],[332990,338120,"where artist ID is equal to whatever the result of this query is."],[338120,342050,"This query here will select Post Malone's artist ID."],[342050,345050,"And now I'm selecting all of the names of the songs"],[345050,349100,"where artist ID is equal to Post Malone's artist ID."],[349100,354530,"The effect of that will be to list the names of songs that are by Post Malone."],[354530,359060,"Next, in 7.sql, we ask you to combine some of the ideas"],[359060,360830,"from these past two queries."],[360830,363380,"Here we asked you to write a SQL query that"],[363380,367040,"returns the average energy of songs, not all songs,"],[367040,369500,"but only songs that are by Drake."],[369500,372440,"So here again, we wanted to use the average function"],[372440,375980,"to get the average energy and select from the songs table."],[375980,378890,"But I needed to add a WHERE clause here to say"],[378890,381320,"that I don't want the average energy of all songs"],[381320,386660,"but only songs where the artist ID is equal to Drake's artist ID."],[386660,388880,"And here we could do another nested query"],[388880,390680,"to get access to that information."],[390680,394430,"Selecting the ID from the artist table where"],[394430,398210,"name is equal to Drake, which gives us Drake's artist ID, which we can then"],[398210,404490,"use in this larger query to get the average energy of only those songs."],[404490,407700,"And finally, in 8.sql, we asked you to write"],[407700,413100,"a SQL query that lists the names of songs that feature other artists."],[413100,417240,"And this was a little bit tricky, but the thing to realize is that songs that"],[417240,421815,"feature other artists generally have in the name of the song the word feat,"],[421815,426450,"F-E-A-T, and then a dot, meaning featuring some other artist."],[426450,430290,"And so how might you gone about querying this, well, here, rather than checking"],[430290,432600,"if something is equal to something else, we"],[432600,434940,"can use LIKE here to check, again, something"],[434940,437160,"that potentially has wild cards."],[437160,439680,"Here I'm selecting the names of all songs"],[439680,443970,"where the name is like this pattern, some wild card meaning"],[443970,447720,"some potential characters, then feat dot, and then"],[447720,452220,"another wild card meaning other characters could potentially follow it."],[452220,455610,"And this query will get us any song that has"],[455610,459570,"feat dot somewhere inside of the name of that song, which"],[459570,463505,"will then give us the names of all of the songs that feature other artists."],[463505,468390,"And so by writing these SQL queries, you could run them on the songs.DB database"],[468390,471730,"to get answers to all of these questions and more."],[471730,475160,"My name is Brian, and this with songs."]]},"WGd0Jx7rxUo":{"edited":true,"zh":[[435,9540,"这道实验题要你做一个知识问答网站。网页会向用户提问，并根据他们的回答给予反馈，"],[9540,14430,"告诉他们每道题答对了还是答错了。"],[14430,17520,"完成后的网站可能像屏幕上这样。"],[17520,28050,"题目可以自己选。你要出一道选择题，多个选项中只有一个正确答案；还要出一道自由回答题，"],[28050,33600,"让用户自己输入答案，再检查是否答对。"],[33600,39120,"先来看我们提供的起始代码。"],[39120,46230,"index.html 就是这个网站的初始 HTML 页面。"],[46230,56190,"文件顶部留有编写 JavaScript 的位置。稍后会详细讲，你要用这段 JavaScript 向用户反馈结果，"],[56190,66850,"分别处理答对和答错的情况。"],[66850,71680,"网页主体的顶部有一个大标题 Trivia!，也就是知识问答。"],[71680,76213,"下面的小标题是 Part 1: Multiple Choice，也就是第一部分的选择题。"],[76213,88100,"你要在这里写下问题，并为各个选项添加按钮。用户点一个按钮，就代表选了那个答案。"],[88100,100070,"下面是第二部分的自由回答题。除了题目，还要有供用户作答的文本框和提交答案的按钮。"],[100070,110690,"想运行网站，可以在终端里进入实验目录，执行 http-server，启动 HTTP 服务器。"],[110690,119870,"终端会给出一个使用 8080 端口的网址。点这个网址，再点 Open，就能选择 index.html，"],[119870,125550,"打开网页，看到我们为这个问答网站准备的基本结构。"],[125550,135400,"两部分目前都还是空的。接下来由你补上题目，并编写处理用户回答的逻辑。"],[135400,138540,"来具体看看要做些什么。"],[138540,145050,"第一部分，先在 HTML 页面上加一道选择题。"],[145050,152760,"用 h3 标题显示题目。还记得吗，HTML 有 h1 到 h6 六个层级的标题。"],[152760,157800,"页面已经用了 h1 和 h2，所以用 h3 显示题目。"],[157800,161880,"接着为每个可能的答案各添加一个按钮。"],[161880,170310,"最好至少提供三个选项，而且只能有一个正确答案。"],[170310,176800,"然后用 JavaScript 为选择题添加交互逻辑。"],[176800,187820,"如果用户点了任意一个错误选项，被点的按钮应变红，题目下方显示 Incorrect，提示答错。"],[187820,194110,"按钮颜色和提示文字都能让用户知道答案错了。"],[194110,206110,"如果点中正确答案，按钮应变绿，题目下方的文字则提示答对。"],[206110,214220,"第二部分的做法很相似，不过这次是自由回答题。"],[214220,224300,"先选一道自由回答题，再把题目加到 HTML 页面上，题目文字还是用 h3 标题。"],[224300,235890,"这次要提供一个输入框，供用户填写答案；旁边再加一个按钮，供用户确认答案。"],[235890,240320,"同样，要用 JavaScript 为这部分编写交互逻辑。"],[240320,249830,"如果用户答错，文本框本身要变红，题目下方要显示 Incorrect。"],[249830,259700,"如果输入的答案正确，并且用户按下了按钮，文本框就要变绿，题目下方的文字"],[259700,262940,"则要告诉用户答对了。"],[262940,269250,"写这段逻辑时，有几种 JavaScript 的用法可能会帮到你。"],[269250,280490,"第一种方法是用 document.querySelector 选取页面元素。你可以按标签名、ID、"],[280490,292100,"类名或其他 CSS 选择器来选取元素，这样 JavaScript 就能访问按钮、输入框"],[292100,302640,"读取用户输入的内容，修改按钮的样式，或者改变页面上某个段落的 HTML 内容。"],[302640,312960,"另一个常用方法是 addEventListener，它能让代码在网页发生指定事件时运行。"],[312960,320300,"例如，可以给按钮添加事件监听器，使按钮被点击时调用一个函数。"],[320300,332300,"这个函数可以改变按钮样式，把它变成红色或绿色，也可以更新部分页面的 HTML，显示 Correct 或 Incorrect，"],[332300,334850,"或者两件事一起做。"],[334850,345360,"addEventListener 可以让 JavaScript 响应页面上实际发生的事件。"],[345360,355610,"完成 HTML 和 JavaScript 后，你就有了一个问答网页，上面有一道选择题和一道自由回答题。"],[355610,360620,"然后根据用户是否答对来给出反馈。"],[360620,364120,"我是 Brian，这就是 Trivia 这道题。"]],"en":[[435,2370,"BRIAN YU: In this lab your task is going to be"],[2370,6040,"to create a website that asks users trivia questions"],[6040,9540,"and then based on the user's response gives them some feedback"],[9540,14430,"based on whether the user gave a correct or incorrect answer to those questions."],[14430,17520,"You'll see here this is what your finished product might look like."],[17520,19860,"You don't have to choose these exact questions,"],[19860,22560,"but you will ask one multiple choice question"],[22560,25500,"with multiple different responses of which one is correct,"],[25500,28050,"as well as one free response question, where"],[28050,30340,"the user can type in an answer of their own"],[30340,33600,"and then check to see if that answer is correct."],[33600,36270,"Let's dive into the distribution code that we give you"],[36270,39120,"as a starting point for working on this lab."],[39120,42900,"Inside of index.html is an HTML page that's"],[42900,46230,"going to act as the starting point for this website."],[46230,49050,"You'll notice that up at the top we've left a space for you"],[49050,51940,"to add some JavaScript, more on that in a moment,"],[51940,53880,"but the JavaScript is where you're ultimately"],[53880,56190,"going to provide some feedback to the user,"],[56190,59410,"adding some logic to handle cases where the user answers"],[59410,63510,"the question correctly, as well as logic to handle cases where a user answers"],[63510,66850,"the question incorrectly as well."],[66850,69580,"Inside the body of the page we display a big heading"],[69580,71680,"at the top that says Trivia!"],[71680,76213,"And then we have a smaller heading that says Part 1: Multiple Choice."],[76213,78880,"Here is where you're going to add your multiple choice question,"],[78880,81790,"asking the question but then also adding buttons"],[81790,85510,"where the user can click on a button to indicate which of the multiple choice"],[85510,88100,"options they would like to select."],[88100,92180,"Down below is Part 2, free response, where you'll include your free response"],[92180,94850,"question as well as a text field, where the user can"],[94850,97310,"type their response to your question and a button"],[97310,100070,"where they can submit their answer to."],[100070,102920,"In order to run your website, inside of your terminal"],[102920,105080,"when you're inside of the lab directory, you"],[105080,110690,"can run http-server to go ahead and start up an HTTP server."],[110690,115400,"That will give you a URL to visit on port 8080, and if I click on that URL"],[115400,119870,"and click Open, I'll be able to choose index.html, the page"],[119870,123330,"that I want to visit, and here you'll see the outline"],[123330,125550,"we give you for your trivia website."],[125550,129000,"Right now there's nothing underneath Part 1 or Part 2"],[129000,132540,"but that's where you come in, in providing the question and adding logic"],[132540,135400,"to deal with the user's response."],[135400,138540,"So what exactly are you going to do in this lab?"],[138540,142200,"In Part 1 of the lab, you'll start by adding a multiple choice"],[142200,145050,"question to the HTML page."],[145050,148320,"You'll use an h3 heading for the question text,"],[148320,152760,"recall that there are h1, 2, 3, 4, 5, and 6 for different levels of headings."],[152760,157800,"We've already used h1 and h2, so h3 will act as the heading here."],[157800,161880,"And then you'll add one button for each possible answer choice."],[161880,164550,"You should probably have at least three different answer choices"],[164550,167970,"that the user can choose from of which exactly one of them"],[167970,170310,"should be the correct answer."],[170310,174150,"From there you'll want to write some JavaScript to add some logic"],[174150,176800,"to this part of the application."],[176800,179080,"When an incorrect answer choice is clicked,"],[179080,181730,"any of those buttons that are the wrong answer,"],[181730,186130,"the button should turn red and text should appear beneath the question that"],[186130,187820,"says, incorrect."],[187820,190240,"So the button turns red, text appears to let"],[190240,194110,"the user know that they answered your question incorrectly."],[194110,197440,"Meanwhile, when the correct answer choice is clicked then"],[197440,199990,"the button should turn green and text should"],[199990,204100,"appear beneath that question that says that the user got the question answered"],[204100,206110,"correctly."],[206110,209120,"Meanwhile in Part 2, you'll do something very similar,"],[209120,211870,"except instead of doing this for a multiple choice question,"],[211870,214220,"you'll do this for a free response question."],[214220,216730,"So you'll start by picking a free response question"],[216730,219610,"and adding that question to the HTML page"],[219610,224300,"again, using an h3 heading for the text of the question."],[224300,228230,"But this time instead of one button for each possible response,"],[228230,231320,"you'll use one input for the response and a button"],[231320,235890,"to confirm the answer once the user has typed in their response."],[235890,240320,"Again, you'll use some JavaScript to add some logic to this website as well."],[240320,243080,"If the user types in an incorrect answer,"],[243080,246470,"the text field itself should turn red and text"],[246470,249830,"should appear beneath the question that says, incorrect."],[249830,252860,"By contrast, when the correct answer choice is typed in"],[252860,257269,"and the user presses the button, then the text field should turn green"],[257269,259700,"and text should appear beneath the question that"],[259700,262940,"says that the user answered correctly."],[262940,266960,"As you try to implement this logic there are a few JavaScript techniques"],[266960,269250,"that will likely prove helpful to you."],[269250,272570,"The first is using document.querySelector,"],[272570,275360,"recall that you can use document.querySelector"],[275360,280490,"to select some element from the page by its tag name, by its ID,"],[280490,285080,"or by its class or from some other CSS selector and you can use that"],[285080,287570,"so that inside of your JavaScript code you're"],[287570,292100,"able to get access to a button for example, or an input field to access"],[292100,295040,"what the user typed in or to do something with that button,"],[295040,297350,"like change its style or to change what's"],[297350,302640,"inside of the HTML of some other paragraph that exists on your page."],[302640,306980,"You'll also likely want to use the addEventListener function, which"],[306980,310910,"is able to add some code that can respond to some event that"],[310910,312960,"happens on your web page."],[312960,316190,"For example, you could add an event listener to a button such"],[316190,318230,"that when a button is clicked then you're"],[318230,320300,"going to run some other function."],[320300,322790,"That function might change the style of the button"],[322790,326120,"so that it has a color of red or a color of green"],[326120,329360,"or it might change the HTML of some part of your page"],[329360,332300,"to display some text, like correct or incorrect"],[332300,334850,"or it could even do a combination of both."],[334850,338090,"AddEventListener is a very powerful tool in JavaScript"],[338090,342380,"for allowing yourself to have JavaScript code that can respond to events that"],[342380,345360,"are actually happening on your page."],[345360,349130,"Ultimately, once you've added the necessary HTML and JavaScript,"],[349130,351590,"you should have a working trivia website where"],[351590,355610,"you can display a multiple choice question and a free response question"],[355610,358310,"and give the user feedback depending on whether or not"],[358310,360620,"they answer those questions correctly."],[360620,364120,"My name is Brian, and this was trivia."]]},"FLlI7rSSV_M":{"edited":true,"zh":[[18,4890,"一起来看 Trivia 这道题的一种解法。"],[4890,9810,"这道题要求你做一个向用户提出知识问答题的网站，"],[9810,16590,"然后用 JavaScript 判断答对还是答错，并给用户相应的反馈。"],[16590,18920,"来看看可以怎样实现。"],[18920,23582,"先看 HTML。第一步是写一道选择题。"],[23582,25040,"这里可以用自己选的任何问题。"],[25040,28580,"示例中，我们把题目放在 h3 标签里，"],[28580,32390,"然后为每个可能的答案创建按钮。"],[32390,43340,"接下来，我们给按钮添加 CSS 类，用来区分哪个答案正确、哪些答案错误。马上你就会看到原因。"],[43340,49610,"所有错误选项都加上 incorrect 类，正确选项则加上 correct 类。"],[49610,54230,"做法有很多，这只是其中一种。"],[54230,57770,"仅仅添加这些类，用户看到的按钮外观暂时不会变化。"],[57770,62590,"稍后 JavaScript 会用到这些 CSS 类名。"],[62590,70370,"按钮下方是一个段落，ID 叫 feedback1，可以用来唯一标识这个段落。"],[70370,71970,"现在这个段落还是空的，"],[71970,75720,"用户不会看到里面有任何文字。"],[75720,87100,"留着这个位置，是为了稍后添加反馈文字，告诉用户答对了还是答错了。"],[87100,89495,"第二部分加的是自由回答题。"],[89495,91870,"这里也可以自己选题。"],[91870,95200,"我们还是把题目放在 h3 里。"],[95200,105188,"接下来有一个 text 类型的输入框，让用户填写答案；还有一个检查答案的按钮，以及一个初始为空的段落 feedback2，"],[105188,111170,"用来告诉用户这道题答得对不对。"],[111170,113440,"以上就是网页的结构。"],[113440,120590,"下一步要用 JavaScript 来处理正确和错误的回答。"],[120590,129280,"回到页面顶部，在 document 上调用 addEventListener，监听 DOMContentLoaded 事件。"],[129280,138700,"想用 JavaScript 给页面中已经存在的元素添加事件处理函数，就要等 DOM 加载完毕再运行这段代码，"],[138700,143380,"也就是在代表整个页面的文档对象模型完成加载之后。"],[143380,145790,"所以我们监听 DOMContentLoaded 事件。"],[145790,150550,"等它触发，再运行下面这段代码。"],[150550,159950,"第一件事是处理选择题。点击正确选项对应的按钮时，页面要做两件事："],[159950,166730,"把按钮变成绿色，并显示文字告诉用户答对了。"],[166730,168910,"首先要找到这个按钮。"],[168910,174370,"这里用 document.querySelector('.correct')。"],[174370,183370,"它会找到类名为 correct 的第一个元素。在这个例子里只有一个，我们把它保存在变量 correct 中。"],[183370,189710,"调用 correct.addEventListener，为这个按钮添加 click 事件监听器。"],[189710,194230,"也就是说，点击这个按钮，就会执行这里的代码。"],[194230,197290,"点击正确选项后要执行什么代码？"],[197290,199040,"要做两件事。"],[199040,203800,"首先，通过 correct.style 修改按钮的背景色。"],[203800,206620,"通过它就能修改这个按钮的样式。"],[206620,210850,"把 backgroundColor 属性设为 'green'。"],[210850,216160,"除了改变按钮的颜色，我们还想显示反馈文字。"],[216160,225100,"document.querySelector('#feedback1') 会找到 ID 为 feedback1 的元素。"],[225100,229930,"然后可以更新它的 innerHTML。"],[229930,232210,"这个段落目前是空的。"],[232210,237740,"我们把它的内容改为 Correct，表示答对。"],[237740,241850,"错误选项也要以类似方式处理，"],[241850,245140,"不过错误选项可能有好几个。"],[245140,255530,"这里用 document.querySelectorAll，而不是只返回一个匹配元素的 document.querySelector。它会找出所有"],[255530,259790,"类名为 incorrect 的元素。"],[259790,263650,"把这些匹配到的按钮保存起来。"],[263650,267325,"接下来用循环逐个遍历这些错误选项。"],[267325,269200,"遍历有好几种写法，"],[269200,271120,"也可以把代码再简化一点。"],[271120,276620,"不过现在这种写法很像在 C 里用 for 循环遍历数组，是大家比较熟悉的形式。"],[276620,280760,"对每个错误选项，我们都做类似的事。"],[280760,282520,"给每个按钮添加一个事件监听器。"],[282520,286720,"点击对应的按钮时，就运行这个函数。"],[286720,288620,"这个函数也做两件事。"],[288620,292330,"首先修改被点击的错误选项按钮的样式。"],[292330,295240,"要改的属性是背景颜色 backgroundColor，"],[295240,298270,"把它设为红色。"],[298270,303040,"然后找到 ID 为 feedback1 的那个段落。"],[303040,310420,"修改这段文字的 innerHTML，告诉用户答案有误。"],[310420,318540,"到这里，选择题的正确选项按钮和所有错误选项按钮就都能用了。"],[318540,322020,"现在来看自由回答题。"],[322020,329770,"对于 ID 为 check 的检查按钮，也要添加一个事件监听器。这样，按钮被点击时，"],[329770,331390,"就会运行这个函数。"],[331390,337480,"函数要检查用户在输入框里填的答案是否正确。"],[337480,346510,"用 document.querySelector('input') 找出用户输入答案的输入框。"],[346510,354250,"通过这个输入框的 value 属性，可以读出它的值，"],[354250,357720,"也就是用户在这个输入框里填写的内容。"],[357720,368640,"如果输入值等于正确答案，就把输入框的背景色改成绿色，"],[368640,371400,"就像之前把按钮背景改成绿色一样。"],[371400,381140,"这次更新 feedback2 这个段落，用文字告诉用户第二题答对了。"],[381140,386290,"否则，如果输入值并非正确答案，就把背景改为红色，"],[386290,391280,"并更新 feedback2，告诉用户答错了。"],[391280,396220,"现在可以测试了。先用 cd trivia 进入题目目录，"],[396220,402100,"再执行 http-server，启动 HTTP 服务器。"],[402100,413140,"打开网址，选择 index.html，就能看到问答页面。点错选项，按钮会变红，页面显示 Incorrect。"],[413140,417490,"如果点的是正确选项，按钮会变绿，页面上显示 Correct。"],[417490,425560,"自由回答题也一样。填入错误答案，再点 Check Answer，文本框会变红，显示 Incorrect。"],[425560,431290,"如果填入正确答案并点击检查，文本框就会变绿，"],[431290,434050,"同时显示 Correct，表示答对了。"],[434050,437560,"换成你自己出的题，一样可以实现这种效果。"],[437560,438580,"我是 Brian。"],[438580,441030,"这就是 Trivia 这道题的解答。"]],"en":[[18,2060,"BRIAN YU: Let's take a look at how you might have"],[2060,4890,"gone about solving the trivia problem."],[4890,7550,"In this problem, your task was to build a website that"],[7550,9810,"asks the users trivia questions."],[9810,13190,"And then, using JavaScript, gave the user feedback"],[13190,16590,"based on whether their response was correct or incorrect."],[16590,18920,"Let's take a look at how you might have done that."],[18920,21530,"The first step, we'll take a look at the HTML first,"],[21530,23582,"was to write a multiple choice question."],[23582,25040,"You could have picked any question."],[25040,28580,"But here we asked the question using an h3 tag."],[28580,32390,"And then we added buttons for each of the possible answers."],[32390,34760,"And ultimately, and you'll see why in just a moment,"],[34760,37550,"we added classes to these buttons in order"],[37550,40850,"to allow us to identify which response is correct"],[40850,43340,"and which response is incorrect."],[43340,46970,"Here we put the incorrect class on all of the incorrect options"],[46970,49610,"and the correct class on the correct option."],[49610,53210,"There were multiple ways to do this, but this is one possible approach"],[53210,54230,"you could have taken."],[54230,57770,"Right now, these won't change anything about how the user sees these buttons."],[57770,62590,"But we will use these classes as part of our JavaScript in just a moment."],[62590,65610,"Then down below, we have a paragraph whose"],[65610,67800,"ID is just some unique way of identifying"],[67800,70370,"that paragraph, is feedback one."],[70370,71970,"The paragraph is empty right now."],[71970,75720,"There's no text the user is going to see inside of that paragraph."],[75720,79710,"But it's going to have the effect of being a place where we could add text"],[79710,82260,"later to give feedback to the user, letting"],[82260,87100,"them know whether their response was correct or incorrect."],[87100,89495,"Then, in part two, we added a free response question."],[89495,91870,"You could have picked a different free response question."],[91870,95200,"But we have a free response question in an h3."],[95200,97960,"Then an input whose type is text, where the user could"],[97960,101050,"type in some text, and then a button to check their answer,"],[101050,105188,"as well as another paragraph that's also empty at first, called feedback2,"],[105188,107980,"where we could let the user know whether they answered the question"],[107980,111170,"correctly or incorrectly."],[111170,113440,"So that describes the structure of the page."],[113440,117760,"But now we then need to get into the actual logic in JavaScript of handling"],[117760,120590,"these correct and incorrect responses."],[120590,123700,"So for that, we'll scroll up to the top of our page, where"],[123700,126910,"we start by adding an addEventListener on the document,"],[126910,129280,"waiting for DOMContentLoaded."],[129280,131920,"In order to make sure that we're running JavaScript and adding"],[131920,135220,"Event Handlers to elements that already exist on the page,"],[135220,138700,"we want to wait to start running this code until the DOM,"],[138700,143380,"the entire Document Object Model representing our page is done loading."],[143380,145790,"So we'll wait until the DOM content is loaded."],[145790,150550,"And then we're going to run all of the code that you're about to see."],[150550,154450,"The first thing we need to do is make it for our multiple choice question"],[154450,156880,"that when we click on the correct answer, the button that"],[156880,159950,"corresponds to the correct answer, that we do two things."],[159950,162430,"We change the button to be green, and then we"],[162430,166730,"add some text to say that the user answered the question correctly."],[166730,168910,"So let's first try and select that button."],[168910,174370,"And we can do so via document.querySelector correct."],[174370,177670,"That is going to select the one, in this case, only element that"],[177670,181330,"has a class name of correct, storing that inside of this variable"],[181330,183370,"called correct."],[183370,186670,"On that button, we're going to say correct.addEventListener,"],[186670,189710,"adding an event listener for the click event."],[189710,191980,"Meaning when the button is clicked on, we're"],[191980,194230,"going to go ahead and run this code."],[194230,197290,"What code should run when the correct option is clicked on?"],[197290,199040,"Well, two things should happen."],[199040,203800,"One, we want to change the background color of the button to correct.style."],[203800,206620,"It lets us modify the style of that button."],[206620,210850,"We want to change the background color property and set it equal to green."],[210850,214060,"And in addition to changing the color of the button,"],[214060,216160,"we also wanted to provide feedback."],[216160,222010,"So I can use document.querySelector #feedback1 to mean find me the element"],[222010,225100,"whose ID is feedback1."],[225100,229930,"Once I have that element, I can update the inner HTML of that element."],[229930,232210,"And right now, the paragraph is empty."],[232210,237740,"But we're going to update that paragraph to instead display the word 'correct.'"],[237740,241850,"Meanwhile, I need to do something similar for incorrect options."],[241850,245140,"But for incorrect options, there are multiple incorrect options."],[245140,248360,"So rather than use a document.querySelector,"],[248360,251600,"I can instead use document.querySelectorAll,"],[251600,255530,"which will return to me not just one match but an array of all"],[255530,259790,"of the matches for any element that has a class of incorrect."],[259790,263650,"And we're going to store that inside of correct."],[263650,265660,"Next, we have a loop that's going to loop over"],[265660,267325,"each of those incorrect responses."],[267325,269200,"There are a couple of ways you could do this."],[269200,271120,"And you could even simplify this a little bit."],[271120,273662,"But this is closest to what you might be familiar with, with,"],[273662,276620,"like, for loops over an array in C, for example."],[276620,279100,"But for each of these incorrect options, we're"],[279100,280760,"going to do something very similar."],[280760,282520,"We're going to add an EventListener."],[282520,286720,"When that incorrect button is clicked on, we are going to run this function."],[286720,288620,"The function does two things."],[288620,292330,"It takes the incorrect button, changes its style."],[292330,295240,"The background color property is the one we want to change."],[295240,298270,"And we change the background color to be red."],[298270,303040,"And then we get access to feedback1, that's that paragraph."],[303040,306790,"And we change the inner HTML inside of that paragraph"],[306790,310420,"to say that the user answered the question incorrectly."],[310420,313030,"That, then, will handle our multiple choice question,"],[313030,315760,"dealing with both the correct answer button and also"],[315760,318540,"all of the incorrect answer buttons."],[318540,322020,"But now, let's take a look at the free response question."],[322020,326190,"When the Check button is clicked, the button that has an ID of check,"],[326190,329770,"I want to first add an EventListener here to say when the button is clicked,"],[329770,331390,"I want to run this function."],[331390,335280,"I need to verify and see whether what the user typed into the input field"],[335280,337480,"is actually correct or not."],[337480,341250,"So I might start by saying document.querySelectorInput to give"],[341250,344040,"my JavaScript code access to that input field, where"],[344040,346510,"the user was typing in their response."],[346510,349200,"And if I have an input field in JavaScript,"],[349200,354250,"I can access its .value property to get the value of the input field."],[354250,357720,"In other words, what the user typed into that input field."],[357720,361710,"And if the input value is equal to the correct answer,"],[361710,365370,"well, then what I want to do is change the input field,"],[365370,368640,"change its background color to green, much as we changed the background"],[368640,371400,"color of the button to green before."],[371400,375480,"And then now update feedback2 instead of feedback1,"],[375480,378810,"changing this paragraph to let the user know that they"],[378810,381140,"answered the question correctly."],[381140,384340,"Else, if the input value is not the correct answer,"],[384340,386290,"change the background color to red."],[386290,391280,"And then update feedback2 let the user know the answer incorrectly."],[391280,396220,"So now I can try and actually try this website by cd-ing into trivia."],[396220,402100,"And then running http-server to start up an HTTP server."],[402100,406420,"And if I visit that URL, and then choose index.html,"],[406420,410350,"I now have my trivia page, where if I click on an incorrect answer,"],[410350,413140,"the button turns red and I see the word incorrect."],[413140,417490,"But if I click on a correct answer, the button turns green, and I see correct."],[417490,421960,"And likewise, for a free response, if I type in an incorrect answer and press"],[421960,425560,"check answer, the textfield turns red, and it says incorrect."],[425560,431290,"But if I type in the correct answer and press check, the textfield turns green."],[431290,434050,"And it displays the word correct for my questions."],[434050,437560,"And if you do the same, it'll do that for your questions as well."],[437560,438580,"My name is Brian."],[438580,441030,"And this was trivia."]]},"HXwvj8x1Fcs":{"edited":true,"zh":[[500,6780,"这道实验题要你编写一个 Web 应用，用来记录人们的生日。"],[6780,16740,"应用会显示一张生日表，一列是姓名，另一列是生日的月份和日期。页面上还要有一个表单，"],[16740,25920,"让用户填入一个人的姓名、出生月份和出生日期，添加一条新的生日记录。"],[25920,36270,"信息要存入数据库，网页也要随之更新，显示数据库里每个人的姓名和生日。"],[36270,41640,"首先要了解我们提供的数据库是什么结构。"],[41640,45570,"这个数据库里有一张表，叫 birthdays。"],[45570,47340,"表里有一个 id 字段。"],[47340,56570,"每条生日记录还包括一个姓名，以及两个整数，分别表示出生的月份和日期。"],[56570,61200,"现在来看看我们为这个应用提供的起始代码。"],[61200,63210,"这是一个 Flask 应用。"],[63210,66450,"先看看 application.py。"],[66450,77940,"在 application.py 中，我们用 CS50 库打开 birthdays.db，"],[77940,82646,"用变量 db 表示这个数据库。"],[82646,92620,"这个应用只有一个路由，就是默认的根路径 /。它接受两种请求方法，GET 和 POST。"],[92620,99220,"用户只是浏览页面时，例如输入网址或点击链接，会使用 GET 请求。"],[99220,108920,"用户提交表单数据时，例如想向数据库中添加一个人的生日，则会使用 POST。"],[108920,116300,"如果请求方法是 POST，就说明用户提交了表单。我们已经帮你写好了这个判断。"],[116300,122690,"接下来，你要把用户提交的姓名和生日添加到数据库，"],[122690,125840,"再将用户重定向到默认路由。"],[125840,133040,"如果用户只是通过 GET 访问网站，没有提交新的生日记录，就显示 index.html。"],[133040,141420,"index.html 要能拿到数据库中每个人的生日信息。"],[141420,150410,"因此，要在这里查询数据库，取出所有生日记录，再把它们传给 index.html。"],[150410,155270,"现在打开 templates 文件夹里的 index.html。"],[155270,160730,"这里有一个标题 Add a Birthday，下方还没有内容。"],[160730,163550,"你要自己在这个位置创建一个表单。"],[163550,172880,"下面是一张显示生日的表格。每行有两个单元格，一个放姓名，一个放生日，"],[172880,174320,"生日用月份和日期表示。"],[174320,177590,"不过当前表格的主体还是空的。"],[177590,189080,"你需要在 index.html 中遍历从数据库中读出的所有生日，在 HTML 模板中为每条生日记录"],[189080,195950,"生成一行，显示那个人的姓名和生日。"],[195950,199890,"我们再梳理一下这道题要做的事。"],[199890,207620,"首先在 application.py 中查询所有生日，并把数据传给 index.html。"],[207620,211700,"这段逻辑应该写在路由的 else 分支里，用于处理普通的 GET 请求。"],[211700,223760,"因为用户通过 GET 访问页面时，我们需要查出数据库里的所有生日，把信息交给 index.html，供 HTML 模板使用，"],[223760,226550,"从而生成表格的所有行。"],[226550,230990,"接着在 index.html 里生成这些行。"],[230990,241700,"查询结果里的每条生日记录占一行；这一行有两个单元格，分别显示姓名和生日。"],[241700,246740,"在 HTML 中可以用 tr 标签创建一行。"],[246740,253010,"在行内用 td 标签创建单元格。td 是 table data 的缩写。"],[253010,263180,"可以用循环遍历所有生日记录。每取出一条记录，就生成一行，"],[263180,265910,"把它显示在 HTML 表格里。"],[265910,272180,"完成这部分后，你应该就能在网页上看到数据库里原有的生日。"],[272180,276630,"接着还要能往数据库里添加新的生日记录。"],[276630,282050,"因此，在 index.html 中添加一个表单，供用户录入生日。"],[282050,292410,"表单要让用户填写姓名、出生月份和日期，再点击按钮提交，"],[292410,294890,"把一条新的生日记录添加到数据库。"],[294890,307250,"最后，在 application.py 中编写处理表单提交的逻辑，读取用户提交的数据，把新的生日记录插入数据库。"],[307250,317840,"完成后，用户就可以打开这个网页，填写姓名、月份和日期，把自己的生日添加到数据库。"],[317840,323880,"这样，用户的姓名和生日也会出现在 HTML 表格中。"],[323880,325690,"具体可以怎么做呢？"],[325690,330900,"要对数据库执行 SQL 查询，可以调用 db.execute。"],[330900,337140,"Flask 应用里的变量 db 就代表这个数据库。"],[337140,344250,"在 Python 里调用 db.execute，就能对数据库执行 SELECT 或 INSERT 等语句。"],[344250,353460,"还记得吗？查询里的问号可以作为占位符，执行时再替换为实际的值。"],[353460,359890,"比如，可以用用户通过表单提交的值作为这次查询的参数。"],[359890,366790,"写这部分代码时，还要分清 GET 和 POST 这两种请求方法。"],[366790,376330,"用户用 GET 打开页面时，只需查询所有生日，再显示含有完整生日表的 HTML 页面。"],[376330,380380,"当用户提交表单时，走的则是 POST 请求。"],[380380,387520,"因此，要把表单的 method 设为 POST，这样数据就会通过 POST 发送。"],[387520,397870,"还要让路由能处理 POST 请求，把提交的生日添加到数据库。这样一来，用户下次访问页面时，"],[397870,400090,"也能在页面上看到刚录入的生日。"],[400090,404010,"我是 Brian，这就是 Birthdays 这道题。"]],"en":[[500,4380,"BRIAN: In this lab, your task is going to be to write a web application that"],[4380,6780,"keeps track of people's birthdays."],[6780,10020,"Your web application is going to display a table of birthdays"],[10020,13237,"with people's names in one column and their birthday mont
