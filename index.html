 whole result and take it modulo 26."],[630120,635580,"This %26 means we're going to take the remainder when we take this whole value"],[635580,637750,"and divide it by 26."],[637750,639160,"Why does this work?"],[639160,643800,"Well, for sake of example, let's say that a is represented by the number 0,"],[643800,647940,"b is represented by the number 1, c is represented by 2, so on and so forth,"],[647940,651490,"up until z, represented by the number 25."],[651490,653970,"So how might I go about taking the character z"],[653970,656910,"and shifting it by 1, using this formula?"],[656910,658430,"Well, here is the formula."],[658430,660390,"And the plaintext character I want to shift"],[660390,664400,"is the character z, which is here represented by the number 25."],[664400,668540,"And I want to shift it by the key k, which in this case is 1."],[668540,673400,"So I have 25 plus 1, which is the number 26, and 26--"],[673400,678590,"mod 26-- is what's the remainder when I divide 26 by 26?"],[678590,682100,"Well, the remainder is just 0, so I'm left with 0, which"],[682100,684950,"corresponds to a in the above chart."],[684950,687520,"The result is that I'm able to take a character,"],[687520,689210,"shift it by a certain amount."],[689210,693260,"And by using modulo 26, I'm able to get the remainder when I divide it"],[693260,696260,"by 26, which allows me to loop back around"],[696260,701045,"effectively to the beginning of the alphabet so that z wraps around to a."],[701045,705620,"And this mapping of a to 0, b to 1, c to 2, et cetera,"],[705620,708080,"you can call an alphabetical index."],[708080,711260,"Where I might say that a's alphabetical index is 0,"],[711260,717240,"b's alphabetical index is 1, c's alphabetical index is 2, and so forth."],[717240,720240,"But of course, in our computer, we don't use the alphabetical index"],[720240,721870,"to represent each character."],[721870,726720,"We use ASCII, where A is 65 and B is 66 and C is 67,"],[726720,729610,"and so we can't directly apply this formula."],[729610,733140,"So what do we need to do in order to take an ASCII character"],[733140,735600,"and shift it by a certain amount, while still preserving"],[735600,739080,"this wrap-around effect of going from the end of the alphabet back"],[739080,740400,"to the beginning?"],[740400,742500,"Well, here's what we might try to do."],[742500,747090,"We might first convert an ASCII character to its alphabetical index"],[747090,750240,"so that capital A becomes the number 0, for example,"],[750240,752730,"and capital B becomes the number 1."],[752730,756300,"And you might want to think about what math you could do to make that work."],[756300,760110,"Once you have an alphabetical index, you can shift that alphabetical index"],[760110,763750,"using the formula, adding the key and taking the result mod"],[763750,767800,"26 to get the new character's alphabetical index."],[767800,771030,"And finally, you can take the resulting alphabetical index"],[771030,774180,"and convert that back into ASCII, so that 0"],[774180,777510,"becomes A, 1 becomes B, so on and so forth,"],[777510,779400,"being sure to preserve the case--"],[779400,781780,"uppercase letters should remain uppercase,"],[781780,785040,"lowercase letters should remain lowercase."],[785040,788100,"And that will allow you to encipher one alphabetic character."],[788100,791310,"If it's alphabetic, you'll want to shift it to its alphabetic index,"],[791310,795810,"then shift it using the formula, then convert the result back to ASCII."],[795810,799200,"But how, then, instead of enciphering just a single character,"],[799200,802590,"do you encipher all of the characters that are in the plaintext?"],[802590,805980,"Well, recall that the plaintext is really just a string."],[805980,810030,"And when you have a string, you can access individual characters by using"],[810030,816060,"array-like notation, where I can say text[0] will get me the first character"],[816060,819960,"of the string text, which in this case is capital T. Likewise,"],[819960,826480,"text[1] is lowercase h, text[2] is lowercase i, so on and so forth."],[826480,829440,"And I can use this notation to access any"],[829440,832200,"of the characters inside of the string."],[832200,835080,"How do I know how many characters are in the string?"],[835080,838940,"Well, there's another function called strlen, short for string length,"],[838940,842440,"that will take a string and tell you how many characters are in it."],[842440,844140,"In this case, 12."],[844140,846870,"So by combining this, knowing the length of the string,"],[846870,850110,"knowing how to access an individual character in the string,"],[850110,853500,"and knowing how to encipher an individual character in the string,"],[853500,857400,"you should be able to implement this Caesar program by first figuring out"],[857400,860010,"what the key is, then getting the plaintext,"],[860010,864030,"then enciphering that plaintext by shifting all the alphabetic characters,"],[864030,869660,"and printing the result. My name is Brian and this was Caesar."]]},"cXAoZAsgxJ4":{"edited":true,"zh":[[120,12510,"在 Substitution 这道题里，你要实现替换密码：把明文里的每个字母换成另一个字母，从而给文本加密。"],[12510,14170,"具体是什么样子呢？"],[14170,16140,"先看一个密钥的例子。"],[16140,26950,"上面是明文字母，从 A 一直到 Z。使用替换密码时，每个明文字母都要换成对应的密文字母。"],[26950,34710,"比如，按屏幕上的对应关系，A 换成 J，B 换成 T，C 换成 R，"],[34710,36400,"后面的字母也依此类推。"],[36400,38970,"实际加密时，该如何使用这组对应关系呢？"],[38970,50130,"假设明文是 HELLO，按这组规则得到的密文就是 VKXXN，因为明文中的 H"],[50130,52170,"对应密文中的 V。"],[52170,61650,"E 对应 K，两个 L 都对应 X，最后的 O 对应 N，这样就得到了完整的密文。"],[61650,67380,"你要用 C 写一个程序，实现这样的替换密码。"],[67380,68890,"程序应该怎样运行呢？"],[68890,78720,"运行 ./substitution，后面跟一个长度为 26 的密钥。这个密钥规定了每个字母"],[78720,87090,"应该换成哪个字母：第一个字符对应 A，第二个字符对应 B，依此类推。"],[87090,90720,"程序接着应提示用户输入一些明文。"],[90720,101010,"比如用户输入 ABC，程序应输出 ciphertext:，再输出加密后的文字，这里依次是 J、T，"],[101010,109530,"然后是 R。使用同一密钥加密 HELLO，输出就是 VKXXN。"],[109530,114930,"当然，你的程序也要能处理包含小写字母的明文。"],[114930,122790,"如果用同一密钥运行 ./substitution，输入的明文是全小写的 hello，"],[122790,127590,"那么输出也应该全是小写：vkxxn。"],[127590,130169,"也就是说，要保留明文中每个字母的大小写。"],[130169,140130,"再看一个稍复杂的例子，仍用这个密钥运行 ./substitution，这次输入 This is CS50!"],[140130,143010,"得到的密文就像屏幕上这样。"],[143010,154920,"注意，明文中的大写字母在密文里仍然大写，小写字母也仍然小写。"],[154920,160890,"空格、数字、标点等非字母字符都没有被改动。"],[160890,165180,"它们在明文和密文中完全相同。"],[165180,171150,"另外，通过命令行参数传进来的密钥本身不区分大小写。"],[171150,174030,"例如，这里把整个密钥都写成了大写字母。"],[174030,183180,"把同一密钥全部写成小写，或者混用大小写，程序都应该产生相同的结果。"],[183180,189398,"不过，用户通过命令行传入的字符串，未必是有效的替换密钥。"],[189398,194950,"因此，程序还需要验证输入的密钥是否合法。"],[194950,207180,"比如用户只运行 ./substitution，没有提供密钥，就要提示正确用法：程序名 ./substitution 后面还需要跟一个密钥。"],[207180,209850,"还有哪些情况算无效密钥呢？"],[209850,220600,"如果 ./substitution 后面的密钥不足 26 个字符，就无法给字母表里的每个字母都指定替换对象。"],[220600,232560,"这时无须再请用户输入明文。应该提示密钥必须恰好有 26 个字符，并返回状态码 1 表示出错。"],[232560,235830,"还有什么情况要判为无效？"],[235830,247200,"比如，这次 ./substitution 后面的密钥确实有 26 个字符，但最后一个字符是数字 2，而不是字母。"],[247200,253980,"这样的密钥也无效，因为替换密码要把每个字母换成另一个字母。"],[253980,265050,"所以，如果命令行传入的密钥中含有任何非字母字符，程序就应该报错，提醒用户密钥只能包含字母，"],[265050,269670,"然后返回 1，表示出错了。"],[269670,281310,"最后，再看这个传给 ./substitution 的密钥：开头是 J，结尾也是 J。"],[281310,283880,"这样的替换规则同样无效。"],[283880,292470,"要提示密钥中不能有重复字母，并同样以状态码 1 退出程序。"],[292470,295230,"总结一下，这道题需要做些什么？"],[295230,297478,"首先，取得密钥。"],[297478,301280,"然后验证密钥，确认它能构成有效的替换规则。"],[301280,304100,"之后提示用户输入明文。"],[304100,307820,"用替换密钥给这段明文加密。"],[307820,311090,"最后输出密文。"],[311090,313370,"第一步，怎么取得密钥呢？"],[313370,317000,"密钥会作为命令行参数传给程序。"],[317000,322400,"用户输入 ./substitution，后面紧跟着密钥。"],[322400,324890,"怎样读取这个命令行参数？"],[324890,333860,"可以把 main 写成接收两个参数的形式：整数 argc 表示命令行参数的个数，"],[333860,340290,"字符串数组 argv 则保存各个命令行参数。"],[340290,346670,"读到这些命令行参数之后，下一步是验证密钥。"],[346670,351380,"先检查密钥的长度，确认它恰好有 26 个字符。"],[351380,362000,"还要检查有没有非字母字符、有没有重复的字母。字母表中的每个字母都应该在密钥里出现，而且只出现一次，"],[362000,366380,"这里不区分大写和小写。"],[366380,372560,"验证通过之后，就可以提示用户输入要加密的明文。"],[372560,380060,"可以调用 CS50 库里声明的 get_string 函数，把用户输入的内容作为一个字符串读进来。"],[380060,392480,"拿到字符串后，就能开始加密：逐个查看其中的字母，根据命令行传入的密钥确定这个字母"],[392480,400010,"应该替换成什么，同时保留它原来的大小写。"],[400010,410600,"如果遇到空格、标点或数字这样的非字母字符，就原样放进密文。"],[410600,418460,"最后把密文输出给用户，让他们看到原始消息加密后的结果。"],[418460,430280,"可以运行 ./substitution，传入一个有效的 26 字母密钥，再输入明文，查看输出的密文，"],[430280,435110,"核对其中的每个字母是否都换成了密钥指定的字母。"],[435110,439300,"我是 Brian，这就是 Substitution。"]],"en":[[120,2100,"BRIAN: In substitution, your task is going"],[2100,6000,"to be to implement a substitution cipher where you'll encrypt or encipher"],[6000,10020,"some plain text by taking every alphabetic character in that plain text"],[10020,12510,"and replacing it with another character."],[12510,14170,"What might that actually look like?"],[14170,16140,"Well, let's take a look at a sample key."],[16140,18480,"Here, we have the plain text letters of the alphabet"],[18480,22350,"from A all the way through Z. And in a substitution cipher,"],[22350,25140,"we're going to replace each of those plain text characters"],[25140,26950,"with a cipher text character."],[26950,30000,"For example, here is a mapping that maps the plain text character"],[30000,34710,"A to the letter J, maps the letter B to T, maps the letter C to R,"],[34710,36400,"so on and so forth."],[36400,38970,"How do we actually use this inside of a cipher?"],[38970,43110,"Well, if the plain text is the word hello, then using this substitution"],[43110,50130,"cipher, we would end up with the cipher text VKXXN because H in plain text maps"],[50130,52170,"to V in the cipher text."],[52170,56940,"E maps to K both of the Ls map to the letter X. And of course,"],[56940,61650,"O maps to the letter N, which gives us that resulting cipher text."],[61650,65519,"Your task is going to be to write a program in C that is going to implement"],[65519,67380,"such a substitution cipher."],[67380,68890,"How does the program work?"],[68890,72870,"Well, you'll run the program by calling dot slash substitution followed"],[72870,76590,"by a 26-character-long key that's going to describe how you're"],[76590,78720,"going to map each of the alphabetic characters"],[78720,82230,"into other alphabetic characters where here, the first character is what"],[82230,87090,"we map A to, the second character is what we might B to, so on and so forth."],[87090,90720,"Your program should then prompt the user to type in some plain text."],[90720,93390,"And if the user types in ABC, for example,"],[93390,95910,"then your program should output cipher text"],[95910,101010,"followed by the enciphered version of that plain text-- in this case, J, T,"],[101010,103890,"and then R. So if we were to call that same substitution"],[103890,109530,"cipher passing in hello as the plain text, then the output is VKXXN."],[109530,113430,"Of course, your program should be able to support plain text that isn't just"],[113430,114930,"uppercase characters."],[114930,119600,"So if we were to instead call dot slash substitution followed by the same key"],[119600,122790,"and the plain text were hello in all lowercase letters,"],[122790,127590,"then the output should still be vkxxn but the characters should be lowercase."],[127590,130169,"The case of the plain text should be preserved."],[130169,133570,"And if our plain text was a little more complicated, for example,"],[133570,136560,"if we called dot slash substitution on the same key"],[136560,140130,"but this time the plain text were this is CS50,"],[140130,143010,"then this is what the cipher text would look like."],[143010,144960,"Notice in particular that the characters that"],[144960,147330,"were originally uppercase in the plain text"],[147330,150240,"are still uppercase in the cipher text, and the characters that"],[150240,152580,"were originally lowercase in the plain text"],[152580,154920,"are still lowercase in the cipher text."],[154920,157530,"Any character that isn't a letter, like the space"],[157530,160890,"or the digits or the punctuation, those haven't been changed at all."],[160890,165180,"And they're the same in both the plain text and the cipher text."],[165180,169260,"In addition, the key that your program takes as a command line argument"],[169260,171150,"should be case insensitive."],[171150,174030,"Here, for example, the key is all uppercase letters."],[174030,176220,"But the program should behave exactly the same"],[176220,179070,"if, for example, the key were all lowercase letters"],[179070,183180,"or if there was a mix of uppercase and lowercase letters inside of the key."],[183180,186390,"However, not every key that's provided as a command line argument"],[186390,189398,"is necessarily going to be a valid substitution cipher."],[189398,191190,"So there's some additional work you'll need"],[191190,194950,"to do in order to validate the key to make sure it is indeed valid."],[194950,198510,"For example, if a user were to call dot slash substitution"],[198510,201060,"but not provide a key at all, then your program"],[201060,204570,"should remind the user of how to use the program by calling dot slash"],[204570,207180,"substitution followed by a key."],[207180,209850,"What else might count as an invalid key?"],[209850,213810,"Well, if a user were to call dot slash substitution and provide a key that's"],[213810,216570,"fewer than 26 characters, then we're not going"],[216570,219000,"to know how to map every single alphabetic character"],[219000,220600,"to another character."],[220600,223170,"So in this case, your program, rather than prompting the user"],[223170,226020,"to type in any plain text should instead report"],[226020,228750,"that the key must contain 26 characters and then"],[228750,232560,"return with a status code of one to indicate an error."],[232560,235830,"What else might be considered an invalid key?"],[235830,239760,"Well, if the user were to run dot slash substitution and then provide"],[239760,244020,"this key, which is 26 characters but the last character"],[244020,247200,"is the number two instead of an alphabetic character,"],[247200,250890,"this key is not valid because in a valid substitution cipher,"],[250890,253980,"every letter should be substituted for another letter."],[253980,257519,"So if any character in the key that is provided as a command line argument"],[257519,260250,"is not an alphabetic character, then your program"],[260250,262380,"should report that error, reporting to the user"],[262380,265050,"that the key must only contain alphabetic characters"],[265050,267600,"and then returning one, for example, to indicate"],[267600,269670,"that there was, in fact, an error."],[269670,274140,"And finally, if the user were to run dot slash substitution and then provide"],[274140,277200,"this key, where notice that the first character of the key"],[277200,281310,"is the letter J and the last character of the key is also the letter J,"],[281310,283880,"this too is not a valid substitution."],[283880,285630,"And your program should report to the user"],[285630,288210,"that the key should not contain repeated characters,"],[288210,292470,"and your program should, again, exit with a return code of one."],[292470,295230,"So in summary what do you need to do in this problem?"],[295230,297478,"Well, you'll first need to get the key."],[297478,299520,"Then you'll need to validate the key to make sure"],[299520,301280,"that it's a valid substitution."],[301280,304100,"Then you'll need to prompt the user to type in some plain text."],[304100,307820,"Then you'll need to encipher that plain text using your substitution key."],[307820,311090,"And then finally, you'll need to print out that cipher text."],[311090,313370,"How are you going to get the key?"],[313370,317000,"Well, recall that the key is going to be provided as a command line argument."],[317000,321230,"The user is going to run your program by running dot slash substitution followed"],[321230,322400,"by the key."],[322400,324890,"How do you extract that command line argument?"],[324890,327230,"Well, you can structure your main function as something"],[327230,329840,"like this, taking two arguments, one of which"],[329840,333860,"is an int argc representing the number of command line arguments,"],[333860,338270,"and one of which is an array of strings, argv, representing all of the command"],[338270,340290,"line arguments that were provided."],[340290,342380,"Once you've collected the command line arguments,"],[342380,346670,"the next step is going to be validating the key to make sure that it's valid."],[346670,348590,"And here, you should check the key length"],[348590,351380,"to make sure that it is, in fact, 26 characters."],[351380,354680,"You should also check to make sure that there are no non-alphabetic characters"],[354680,358280,"inside of the key, and you should also check for repeated characters"],[358280,362000,"because every letter of the alphabet should appear once and only once"],[362000,366380,"in the key, regardless of whether it's uppercase or lowercase."],[366380,368420,"After you've validated the key, then you can"],[368420,372560,"start to prompt the user to type in some input by asking for plain text."],[372560,374990,"Here, you can use the function get_string,"],[374990,377900,"declared in the CS50 library, as a way of getting input"],[377900,380060,"from the user as a string."],[380060,383150,"After you've gotten the string, then you can encipher the text"],[383150,386010,"where for each alphabetic character you'll need to determine,"],[386010,389120,"based on the substitution cipher that you've collected as a command line"],[389120,392480,"argument input, what character should this alphabetic character"],[392480,396530,"map to, making sure to preserve case so that uppercase characters stay"],[396530,400010,"uppercase and lowercase characters stay lowercase."],[400010,403970,"If there are any non-alphabetic characters like spaces or punctuation"],[403970,406280,"or numbers, those characters should be left"],[406280,410600,"as is and unchanged between the plain text and the cipher text."],[410600,412550,"Finally, after all of that, you should be"],[412550,414680,"able to print out the cipher text to the user"],[414680,418460,"so that they see the enciphered version of their original message."],[418460,422210,"You can test your code by running dot slash substitution followed"],[422210,427040,"by a valid 26-character substitution key, then typing in some plain text"],[427040,430280,"and making sure the cipher text is the result of substituting"],[430280,432680,"all of the alphabetic characters for the characters"],[432680,435110,"that are mapped to by the key."],[435110,439300,"My name is Brian, and this was substitution."]]},"-Bhxxw6JKKY":{"edited":true,"zh":[[510,7380,"这道实验题的任务是判断几个程序各自用了哪种排序算法。"],[7380,10850,"到目前为止，我们学过三种排序算法："],[10850,14430,"选择排序、冒泡排序和归并排序。"],[14430,21060,"先回顾一下选择排序。给定一个数组，我们会重复这样一个过程："],[21060,27540,"遍历整个数组，找出其中最小的数，"],[27540,31037,"然后把最小的数移到数组开头。"],[31037,33120,"接着，在剩下的数里继续找，"],[33120,35910,"找到其中最小的数，"],[35910,39300,"再把它移到刚才选出的数后面。"],[39300,42990,"一直重复这个过程："],[42990,46470,"在还没有排好序的部分找出最小的元素，"],[46470,49780,"把它和下一个待填位置上的元素交换。"],[49780,55440,"这样处理完整个数组，就得到排好序的数组了。"],[55440,58480,"冒泡排序的做法有些不同。"],[58480,63060,"它也会一遍遍扫过数组，但每次只比较两个数。"],[63060,68970,"它依次检查每对相邻的数，看它们的顺序是否正确。"],[68970,72750,"比如要从小到大排序，"],[72750,78165,"那么对于任意一对相邻的数，较小的那个都应该在左边。"],[78165,83040,"如果发现两个数的顺序反了，冒泡排序就交换它们。"],[83040,85440,"接下来继续这个过程，"],[85440,92110,"比较下一对数，需要时就交换，一直走到数组末尾。"],[92110,95510,"最后来看归并排序，它的思路和前两种很不一样。"],[95510,100060,"先把数组分成左右两半，"],[100060,107260,"递归地把两边分别排好序，再把它们合并起来。"],[107260,110140,"这样一层一层地递归处理，"],[110140,114240,"就能很快得到一个完整的有序数组。"],[114240,118110,"我们可以分析这几种算法的运行时间。"],[118110,123530,"大 O（O）表示完成排序需要多少步的渐近上界，"],[123530,129419,"大 Omega（Ω）则表示所需步数的渐近下界。"],[129419,136050,"看这里，选择排序的上界和下界分别是 O(n²) 和 Ω(n²)。"],[136050,139095,"也就是说，假设有 n 个数需要排序，"],[139095,144810,"选择排序需要的步数就在 n² 这个数量级上。"],[144810,148410,"冒泡排序的上界同样是 O(n²)。"],[148410,152385,"给 n 个数排序，最多也可能需要 n² 量级的步数，"],[152385,156180,"但它的下界是 Ω(n)。"],[156180,161760,"比如运气好，拿到的数组本来就是有序的，"],[161760,165570,"那么处理 n 个元素只需要 n 量级的步数："],[165570,168270,"从头到尾扫一遍，"],[168270,174390,"发现一次交换都不需要，就可以停下，因为数组已经有序了。"],[174390,179850,"再看归并排序，它的运行时间上界是 O(n log n)，"],[179850,184005,"下界也是 Ω(n log n)。也就是说，要给 n 个数排序，"],[184005,191670,"它所需的步数就在 n log n 这个数量级上。"],[191670,198380,"这个增长速度比 n² 慢，不过还是比线性的 n 快。"],[198380,202460,"实验会给你三个程序："],[202460,205550,"sort1、sort2 和 sort3。"],[205550,207290,"其中一个使用选择排序，"],[207290,208910,"一个使用冒泡排序，"],[208910,212810,"还有一个使用归并排序。至于各自用的是哪种，就留给你判断了。"],[212810,217760,"你的任务是用不同的输入来运行这些排序程序。"],[217760,221020,"可以改变数的个数，也可以改变它们原先的排列顺序，"],[221020,226800,"再根据结果判断各个程序对应哪种算法。"],[226800,229320,"我们提供了这些输入文件。"],[229320,232320,"例如，有一个叫 random5000.txt 的文件，"],[232320,238980,"它是一个文本文件，里面有 5000 个随机排列的数。"],[238980,243030,"同样，random10000.txt 和 random50000.txt"],[243030,248070,"分别有一万个和五万个数，顺序也都是随机的。"],[248070,250140,"除了这些随机排列的数据，"],[250140,254760,"还有 reversed5000.txt、reversed10000.txt 等文件。"],[254760,261930,"它们存的也是数字，这次都按降序排列，从大到小。"],[261930,266520,"最后还有 sorted5000.txt、sorted10000.txt 等。"],[266520,270390,"同样是文本文件，每行一个数，"],[270390,276000,"不过里面的数已经从小到大排好了。"],[276000,279540,"来看看怎么用这些文件。"],[279540,282592,"这是 Sort 实验提供的文件。"],[282592,287550,"这里有三个程序：sort1、sort2 和 sort3。"],[287550,289070,"旁边是我们刚才提到的输入文件。"],[289070,294120,"比如 random5000.txt 有 5000 行，"],[294120,298170,"每行一个数，排列没有特定顺序。"],[298170,301830,"再看 reversed5000.txt。"],[301830,308070,"它也有 5000 个数，不过按降序排列，从大到小。"],[308070,311640,"最后是 sorted5000.txt 这样的文件。"],[311640,318610,"它也有 5000 行，数字按升序排列，从最小一直到最大。"],[318610,324170,"现在可以用 sort1、sort2 和 sort3 这几个程序，"],[324170,329750,"看看它们怎样排序，以及给这些文件排序要花多久。"],[329750,338610,"比如，可以输入 ./sort1 random5000.txt。"],[338610,341250,"运行之后，你会看到，"],[341250,344220,"程序会用某种排序算法排好这些数，"],[344220,348330,"再按从小到大的顺序，把它们输出到终端。"],[348330,350190,"刚才一共花了多久？"],[350190,357490,"有一个叫 time 的命令，专门用来测量其他程序的运行时间。"],[357490,365010,"我可以输入 time ./sort1 random5000.txt。"],[365010,368430,"排序完成后，就能看到时间，"],[368430,373440,"这里 real 显示实际经过了 0.168 秒。"],[373440,376210,"所用的排序程序不同，"],[376210,384360,"输入文件里的数字个数、原先的排列顺序不同，"],[384360,390720,"对所有数字排序并输出所花的时间，也可能不同。"],[390720,393000,"现在，你要利用这些信息来解谜："],[393000,396570,"sort1 用的是哪种算法？"],[396570,402240,"sort2 和 sort3 又分别用了哪种？"],[402240,408420,"再说一遍，测试时可以运行 ./sort1、./sort2 或 ./sort3，"],[408420,412660,"把要处理的文本文件作为命令行参数传进去。"],[412660,418260,"比如，这里是让 sort1 处理 reversed10000.txt。"],[418260,422040,"要测量这些命令运行了多久，"],[422040,427560,"只要在原本想运行的命令前面加上 time 就行。"],[427560,431985,"比如这里，我们在测量 sort1"],[431985,437300,"给 reversed10000.txt 中的所有数排序并输出所花的时间。"],[437300,440120,"最后，你需要选一些我们提供的样例文件，"],[440120,444260,"用每个程序分别测试并计时。"],[444260,446600,"不用把所有文件都测一遍，"],[446600,451100,"但最好多试几个，看看这些程序的表现"],[451100,457550,"会怎样随输入规模以及数据原先的有序程度而变化。"],[457550,459620,"有了这些信息，"],[459620,463790,"就可以判断各个程序用的是什么算法了。"],[463790,468710,"判断的依据就是你对这些排序算法运行时间的了解。"],[468710,473390,"比如，某种算法最好情况下所需的步数比最坏情况少得多，"],[473390,478890,"那它在已经排好序的数据上，就有可能快得多。"],[478890,481760,"你还可以分别观察这几个程序，"],[481760,485060,"逐渐增大输入规模，让它们处理越来越多的数，"],[485060,491780,"对比一下它们处理大文件和小文件时分别用了多久。"],[491780,494610,"把这些线索放在一起，"],[494610,501650,"应该就能推断出每个程序具体用了哪种排序算法。"],[501650,505030,"我是 Brian，这就是 Sort 这道题。"]],"en":[[510,2340,"BRIAN YU: In this lab, your task is going"],[2340,6210,"to be to determine which sorting algorithm various different programs"],[6210,7380,"use."],[7380,10850,"We've been introduced, now, to three different sorting algorithms--"],[10850,14430,"selection sort, bubble sort, and merge sort."],[14430,17400,"Recall that in selection sort, the way the algorithm works"],[17400,21060,"is by taking an array of numbers and repeating some process--"],[21060,23940,"the process of looking through that entire array of numbers"],[23940,27540,"to try and find the smallest item in that entire array,"],[27540,31037,"and then bringing that smallest item to the beginning of the array."],[31037,33120,"Then we search through the remainder of the array,"],[33120,35910,"looking for the next smallest item, and when we find it,"],[35910,39300,"we bring that next smallest item back to the beginning of the array,"],[39300,42990,"and we repeat that process, continually looking through the remaining"],[42990,46470,"unsorted portion of the array, finding the smallest element,"],[46470,49780,"and swapping it with the element in the next position."],[49780,52380,"Once we repeat that process through the entire array,"],[52380,55440,"we'll end up with a sorted array."],[55440,58480,"Meanwhile, bubble sort works a little bit differently."],[58480,63060,"It also makes passes through the array, but it compares two values at a time."],[63060,65519,"It looks at every pair of values and tries"],[65519,68970,"to determine whether that pair of numbers is in the correct order."],[68970,72750,"That is to say, if you're trying to sort from smallest to largest, making sure"],[72750,75900,"that for any pair of two numbers, the smaller number is"],[75900,78165,"to the left of the larger number."],[78165,80790,"And what bubbles sort does is that if it finds two numbers that"],[80790,83040,"are out of order, then it swaps them."],[83040,85440,"And bubble sort will continually go through this process"],[85440,89580,"of considering pairs of values and swapping them if necessary, until it"],[89580,92110,"gets to the end of the array."],[92110,95510,"Finally, merge sort works fundamentally differently."],[95510,100060,"It works by taking an array and dividing it into a left half and a right half,"],[100060,103630,"and sorting each of those halves first, and after we've recursively"],[103630,107260,"sorted each of those halves, we merge those halves back together."],[107260,110140,"By repeating this process recursively again and again,"],[110140,114240,"we can build up an entire sorted array very quickly."],[114240,118110,"Each of these algorithms can be analyzed in terms of their running time,"],[118110,119640,"in terms of big O--"],[119640,123530,"the upper bound on the number of steps required to complete the sort--"],[123530,125310,"and as well as big omega--"],[125310,129419,"the lower bound on the number of steps required to complete the sort."],[129419,133410,"In this case, we can see that for a selection sort, it has both a big O"],[133410,136050,"and a big omega of n squared."],[136050,139095,"That is to say that if there are n numbers that we are trying to sort,"],[139095,143910,"it might take about n squared steps in order to actually complete that sorting"],[143910,144810,"algorithm."],[144810,148410,"Bubble sort, meanwhile, also has a big O of n squared."],[148410,152385,"As an upper bound, it still might take on the order of n squared steps to sort"],[152385,156180,"n numbers, but it has a big omega of n."],[156180,158520,"That is to say, if we were to get lucky and we"],[158520,161760,"were given an array that's already sorted, for example,"],[161760,165570,"bubble sort could sort n items and using just n steps"],[165570,168270,"by making one pass through the array, concluding"],[168270,172080,"that no swaps are necessary, and then not continuing on with anything else,"],[172080,174390,"because the array is already sorted."],[174390,179850,"Meanwhile, merge sort has a running time of big O of n log n, and big omega of n"],[179850,184005,"log n as well, meaning that if there are n numbers that we are trying to sort,"],[184005,188940,"this algorithm is going to take on the order of n times log n steps"],[188940,191670,"in order to sort all of those numbers."],[191670,196680,"That's better than n squared, though not nearly as good as big omega of n,"],[196680,198380,"for example."],[198380,202460,"Your task now, in this lab, is that we are going to give you three programs--"],[202460,205550,"sort1, sort2, and sort3."],[205550,207290,"One of them uses selection sort."],[207290,208910,"One of them uses bubble sort."],[208910,212810,"And one of them uses merge sort, but we're not telling you which is which."],[212810,215310,"Your task is going to be to run these sorting algorithm"],[215310,217760,"programs on various different inputs--"],[217760,221020,"lists of numbers of different sizes and different orders--"],[221020,226800,"and to try to determine which algorithm corresponds to which program."],[226800,229320,"The files we give you are going to be these."],[229320,232320,"We'll give you a file called random5000.txt,"],[232320,235740,"for example, which will be a text file that"],[235740,238980,"contains 5,000 numbers in random order."],[238980,243030,"Likewise, random10000.txt and random50000.txt"],[243030,248070,"will contain 10,000 50,000 numbers, respectively, all in random order."],[248070,250140,"In addition to files in random order, we'll"],[250140,254760,"also give you files called reversed5000.txt and reverse10000.txt,"],[254760,258540,"and so forth, each of which will also contain numbers, but this time"],[258540,261930,"in reverse order, from largest to smallest."],[261930,266520,"And finally, we also give you sorted5000 and sorted10000.txt,"],[266520,270390,"which again will be text files that just contain numbers, one on each line,"],[270390,273720,"but this time the numbers will already be in sorted order"],[273720,276000,"from smallest to largest."],[276000,279540,"Let's take a look at what you might do with these files."],[279540,282592,"Here's the distribution code for the sort lab."],[282592,284550,"You'll notice that we have our three programs--"],[284550,287550,"sort1, sort2, and sort3--"],[287550,289070,"and we also have these files."],[289070,294120,"Random5000.txt, for example, is going to be a file with 5,000 lines,"],[294120,298170,"each with numbers, where those numbers are not in any particular order."],[298170,301830,"Meanwhile, reversed5000.txt is going to be a text file that"],[301830,305700,"also has 5,000 numbers, but this time they're in reverse order,"],[305700,308070,"from largest to smallest."],[308070,311640,"And finally, files like sorted5000.txt will give you"],[311640,315690,"5,000 lines of numbers, where they're in sorted order in ascending order"],[315690,318610,"from smallest, all the way to largest."],[318610,324170,"You can then use these sorting programs-- sort1, sort2, and sort3--"],[324170,326450,"to try to see how you would go about sorting,"],[326450,329750,"and how long it might take to sort any of these files."],[329750,338610,"For example, I might run ./sort1 on, let's say, random5000.txt."],[338610,341250,"And what you'll see when I run that program is the program"],[341250,344220,"will sort those numbers using some sorting algorithm,"],[344220,348330,"and then print those numbers in sorted order from smallest to largest."],[348330,350190,"Now, how long did that take?"],[350190,353040,"It turns out there's also a program called time"],[353040,357490,"that can time how long it takes for some other program to run."],[357490,365010,"So I might say time ./sort1, and then random5000.txt, and if I run that,"],[365010,368430,"after everything is sorted, I'll see that the amount of time that took"],[368430,373440,"in real time was 0.168 seconds."],[373440,376210,"And depending on which sorting program I use,"],[376210,379920,"and depending on what file I run that sorting algorithm on, and the number"],[379920,384360,"of values that are in that file, as well as what order that file is already in,"],[384360,386910,"I might get different values for the amount of time"],[386910,390720,"it takes to sort and print out all of those numbers."],[390720,393000,"Using that information, your challenge is"],[393000,396570,"to solve that puzzle, to figure out which algorithm does sort1 use,"],[396570,402240,"and which algorithm does sort2 use, and which algorithm does sort3 use?"],[402240,408420,"Again, you can test any of these sorting programs by running ./sort1 or ./sort2"],[408420,412660,"sort3 on a text file that's provided as a command line argument."],[412660,418260,"For example, in this case, we're running sort1 on reversed10000.txt."],[418260,422040,"And to time how long any of these commands take, all you need to do"],[422040,425700,"is prepend the time command in front of whatever command"],[425700,427560,"you would otherwise want to run."],[427560,431985,"For example, here we're timing how long it takes to use sort1 to sort"],[431985,437300,"and print out all of the values in reversed10000.txt."],[437300,440120,"Ultimately, what you'll need to do is test and time"],[440120,444260,"each of these programs on some of the sample files that we give you."],[444260,446600,"Don't have to test it on all of them, but you'll likely"],[446600,451100,"want to test on at least a few to get a sense for how these programs behave"],[451100,454700,"depending on the size of the input, and depending on how well-ordered"],[454700,457550,"the values inside of that text file already are."],[457550,459620,"And using that information, you should be"],[459620,463790,"able to determine which program corresponds to which sorting algorithm"],[463790,466640,"by taking advantage of what you know about the running"],[466640,468710,"times of those sorting algorithms."],[468710,473390,"If one sorting algorithm has a much better big omega then it does big O,"],[473390,477050,"then you might expect that it would be much faster on a text file that's"],[477050,478890,"already sorted, for example."],[478890,481760,"And you might examine what happens with each of these programs"],[481760,485060,"as you try to run them on larger and larger inputs of inputs that"],[485060,490160,"have more and more values to see how long that takes in comparison to files"],[490160,491780,"that have fewer values."],[491780,494610,"Using all of that as your clues and information,"],[494610,497090,"you should be able to piece together and draw conclusions"],[497090,501650,"about which of these sorting algorithms we're using in each of those programs."],[501650,505030,"My name is Brian, and this was sort."]]},"uOYhrBs37j0":{"edited":true,"zh":[[180,3460,"我们来看看 Sort 这道题可以怎么解。"],[3460,11050,"题目给了三个程序，分别使用选择排序、冒泡排序和归并排序。"],[11050,12990,"但没有告诉你哪个程序用了哪种算法。"],[12990,17820,"你的任务就是用不同的输入给这些程序计时，据此判断它们用的算法。"],[17820,25560,"比如，文件 random10000.txt 里有一万个随机排列的数，可以用来测试排序。"],[25560,33990,"可以先从运行时间的上界入手。冒泡排序和选择排序都是 O(n²)，"],[33990,37560,"归并排序的上界则是 O(n log n)。"],[37560,46980,"因此，当输入规模较大、数字排列随机时，归并排序很可能明显快于另外两种。"],[46980,56100,"可以让三个程序都处理 random10000.txt，也可以试试其他文件。我们预计归并排序最快。"],[56100,57510,"来试试看。"],[57510,67260,"运行 time ./sort1 random10000.txt，看 ./sort1 处理这一万个数需要多久。"],[67260,74010,"结果是 0.505 秒，大约半秒。"],[74010,80030,"用同一文件再试试 ./sort2，看它做同样的事需要多久。"],[80030,80700,"好了。"],[80700,89400,"实际用时只有 0.038 秒，明显短于 ./sort1 的大约半秒。"],[89400,92230,"为比较得更全面，也来试试 ./sort3，"],[92230,97230,"看看它的耗时与前两个程序有什么不同。"],[97230,104430,"它给这一万个数排序大约也要半秒多一点。"],[104430,114880,"根据这些结果，可以合理推断：./sort2 处理随机输入最快，很可能用的是归并排序。"],[114880,119460,"至于另两个程序，哪个是选择排序、哪个是冒泡排序，现在还不能确定。"],[119460,123450,"不过，猜测 ./sort2 是归并排序已经相当有依据了。"],[123450,128160,"你也可以换一些输入再测一下，验证这个推断。"],[128160,132960,"现在要想办法区分 ./sort1 和 ./sort3。"],[132960,136430,"哪个用冒泡排序，哪个用选择排序？"],[136430,141810,"可以利用我们对这两种算法运行时间下界，也就是大 Ω 的了解。"],[141810,145710,"冒泡排序的下界是 Ω(n)。"],[145710,151260,"在最理想的情况下，所有数字已经有序，冒泡排序很快就能处理完。"],[151260,161370,"它从头到尾检查每对相邻的数，发现一次都不需要交换，就能在线性时间内确认数组已有序，"],[161370,165870,"无须再一遍遍扫描数组。"],[165870,176280,"所以，虽然这两种算法处理随机文件时耗时接近，但如果给它们一个很大的有序文件，"],[176280,180460,"冒泡排序应该会明显快于选择排序。"],[180460,181890,"我们来试试。"],[181890,190330,"最大的有序输入文件是 sorted50000.txt，里面有五万个已经排好序的数。"],[190330,201340,"运行 time ./sort1 sorted50000.txt，看看把这些数排序并输出一共要花多久。"],[201340,213010,"./sort1 花了三秒多一点。要注意，仅仅把五万个数输出到终端，本身也需要时间。"],[213010,222750,"再让 ./sort3 处理同一个 sorted50000.txt，看看它做同一件事要花多久，"],[222750,227730,"也就是给这五万个本来就有序的数排序。"],[227730,236448,"./sort1 用了大约三秒，而这个程序用了将近七秒，是前者的两倍多。"],[236448,241750,"你也可以多做几次实验，把这些测试重复几遍。"],[241750,250680,"从结果来看，处理有序数据时 ./sort1 快于 ./sort3，而处理随机数据时两者表现接近。"],[250680,260100,"这就很有力地说明，./sort1 很可能用的是冒泡排序，./sort3 很可能用的是选择排序，因为冒泡排序"],[260100,269970,"在数据已经有序时会更快，而选择排序仍得一遍遍扫描剩余数组，每次找出最小的元素。"],[269970,275220,"即使数组本来就有序，选择排序也要扫描多遍。"],[275220,280540,"这样，就得出了三个程序分别使用什么算法。"],[280540,282780,"./sort1 使用冒泡排序。"],[282780,284750,"./sort2 使用归并排序。"],[284750,287610,"./sort3 使用选择排序。"],[287610,288720,"我是 Brian。"],[288720,291050,"这就是 Sort。"]],"en":[[180,3460,"SPEAKER 1: Let's take a look at how you might have solved the sort problem."],[3460,5880,"In this problem, we gave you three different programs"],[5880,9650,"that used three different sorting algorithms, selection sort, bubble"],[9650,11050,"sort, and merge sort."],[11050,12990,"But we didn't tell you which was which."],[12990,15930,"And your job was to figure it out by timing these programs"],[15930,17820,"on various different inputs."],[17820,21362,"For example, we gave you this file random10000.txt"],[21362,25560,"with 10,000 numbers in random order, potentially sort."],[25560,28140,"And one thing you might have tried is recognizing"],[28140,31859,"that both bubble sort and selection sort have a Big O running"],[31859,33990,"time of Big O of n squared."],[33990,37560,"Whereas merge sort has a Big O running time of n log n."],[37560,41970,"Then, for large random inputs, you should probably expect that merge sort"],[41970,46980,"is going to be significantly faster than both bubble sort and selection sort."],[46980,50730,"So if we try these three programs on a file like random10000,"],[50730,54570,"but you might try it on some others, too, you would expect that merge sort"],[54570,56100,"should be the fastest."],[56100,57510,"Let's try it out."],[57510,64019,"Let's time ./sort1 on random10000.txt and see how long it takes to run"],[64019,67260,"./sort1 on these 10,000 numbers."],[67260,74010,"Here we see that it took 0.505 seconds for ./sort1, so about half a second."],[74010,77520,"Let's try it again for ./sort2, and see how long it takes ./sort2 to do"],[77520,80030,"the same thing with the same file."],[80030,80700,"OK."],[80700,86970,"It took, in real terms, 0.038 seconds, significantly faster than the nearly"],[86970,89400,"half a second it took for ./sort1."],[89400,92230,"But just for good measure, let's try ./sort3 as well."],[92230,96120,"And compare ./sort3 against the other two sorting algorithms in terms of how"],[96120,97230,"long it takes."],[97230,101310,"And it looks like this one also takes a little over half a second"],[101310,104430,"to be able to sort these 10,000 numbers."],[104430,108630,"So based on that information, it seems pretty reasonable to conclude that"],[108630,112890,"./sort2, the one which was the fastest on dealing with these random inputs,"],[112890,114880,"is probably merge sort."],[114880,117630,"Between the other two, whether it's selection sort or bubble sort,"],[117630,119460,"we really don't know for sure just yet."],[119460,123450,"But it's probably a pretty good guess that ./sort2 is going to be merge sort."],[123450,126960,"And you could verify that for yourself by testing it on some other inputs"],[126960,128160,"as well."],[128160,132960,"But now we need to figure out some way of distinguishing ./sort1 from ./sort3."],[132960,136430,"Which one is bubble sort and which one is selection sort?"],[136430,139440,"And to do that, we can take advantage of what we know about each"],[139440,141810,"of their big omega running times."],[141810,145710,"Bubble sort, we know, has a big omega of n running time."],[145710,149310,"In an ideal case where all of the numbers are already sorted,"],[149310,151260,"bubble sort can sort the numbers very easily."],[151260,154530,"It'll go through each of the numbers, one pair at a time,"],[154530,157110,"and realize that there are no swaps necessary,"],[157110,161370,"and then just declare that the numbers are already sorted in linear time"],[161370,165870,"without needing to make multiple passes through the array again and again."],[165870,169860,"So we should expect that even though these two sorting algorithms had"],[169860,172710,"a very similar running time on a random file,"],[172710,176280,"if we gave them a big file that was already in sorted order,"],[176280,180460,"bubble sort should be much faster than selection sort."],[180460,181890,"So let's try it out."],[181890,184620,"The biggest file that's all in sorted order we have"],[184620,190330,"is sorted50000.txt, with 50,000 numbers, each of which is in sorted order."],[190330,196170,"And let's try timing ./sort1 on that sorted50000.txt file,"],[196170,199890,"and see how long it takes in order to sort all of those numbers and print"],[199890,201340,"them out as well."],[201340,205320,"It looks like it took a little over three seconds for ./sort1 to be able"],[205320,207420,"to sort and then print, all of those numbers,"],[207420,211350,"recognizing that it's going to take some time to print 50,000 numbers"],[211350,213010,"to the terminal as well."],[213010,219120,"But let's compare that then to ./sort3 on that same input, sorted50000,"],[219120,222750,"and see how much time it takes for ./sort3 to do the same thing,"],[222750,227730,"sort these 50,000 numbers that are already in sorted order themselves."],[227730,230220,"Whereas ./sort1 took about three seconds,"],[230220,233580,"it looks like this algorithm is taking closer to 7 seconds,"],[233580,236448,"more than double the amount of time required."],[236448,239490,"And so based on that, and you could do some additional experiments, maybe"],[239490,241750,"testing these multiple times as well."],[241750,247110,"But for sorted numbers, it seems that ./sort1 is outperforming ./sort3,"],[247110,250680,"whereas for numbers in random order, they're behaving pretty similarly."],[250680,255480,"And that, then, is a pretty good sign that ./sort1 is probably bubble sort"],[255480,260100,"and ./sort3 is probably selection sort, given that we know that bubble sort"],[260100,263480,"performs better when the numbers are already in sorted order,"],[263480,266970,"whereas selection sort still needs to go through that entire array,"],[266970,269970,"looking for the smallest element every single time,"],[269970,272220,"making multiple passes through the array,"],[272220,275220,"even if the array is already in sorted order."],[275220,278160,"And that then gives us our answer for which algorithm"],[278160,280540,"is in use by each of these programs."],[280540,282780,"./sort1 is using bubble sort."],[282780,284750,"./sort2 is using merge sort."],[284750,287610,"And ./sort3 is using selection sort."],[287610,288720,"My name is Brian."],[288720,291050,"And this was sort."]]},"ftOapzDjEb8":{"edited":true,"zh":[[362,2070,"我们来看 Plurality 这道题。"],[2070,6660,"你要写一个程序，模拟一场选举。"],[6660,12570,"程序读入一系列选票，最后输出选举的获胜者。"],[12570,14540,"具体该怎么做呢？"],[14540,17970,"每场选举都会有一组候选人。"],[17970,22140,"比如这场选举的候选人是 Alice、Bob 和 Charlie。"],[22140,26010,"每位选民从中选一人，把票投给他。"],[26010,34810,"把每位选民的选择汇总起来，就能判断谁赢得了选举。"],[34810,36810,"过程中需要记录哪些信息？"],[36810,41520,"需要记录每位候选人是谁，以及每位候选人得了多少票。"],[41520,47340,"在这个例子中，Alice 有 3 票，Bob 有 1 票，Charlie 有 2 票。"],[47340,50640,"因此获胜者是 Alice。"],[50640,54900,"这种投票制度叫作 plurality voting，也就是相对多数制，英文也叫 first-past-the-post。"],[54900,56880,"基本规则是这样的："],[56880,60150,"每位选民选择一位候选人，把票投给他。"],[60150,66010,"投票结束后，谁的票数最多，谁就获胜。"],[66010,68220,"你的程序运行起来应该是什么样的？"],[68220,74640,"用户运行 ./plurality，在后面依次列出这场选举的所有候选人姓名。"],[74640,77412,"这里就是 Alice、Bob 和 Charlie。"],[77412,80940,"接着，程序要询问用户有多少位选民。"],[80940,83340,"例如这里可以输入 4。"],[83340,88890,"于是程序会提示四次，让每位选民输入要投给谁。"],[88890,91270,"比如第一票投给 Alice。"],[91270,93870,"下一位选民可以投给 Bob。"],[93870,96540,"最后两位选民都投给 Charlie。"],[96540,102660,"收齐选票后，程序要判断谁是胜者，并输出胜者的名字。"],[102660,104880,"这个例子里就是 Charlie。"],[104880,106963,"怎样实现这个程序呢？"],[106963,109380,"先回顾一下要保存哪些数据。"],[109380,117270,"需要随时知道每名候选人得了多少票。也就是说，对每位候选人，都要保存两项相关的信息。"],[117270,126150,"在 C 程序中，要把关联的信息放在一起，可以使用结构体 struct。"],[126150,131520,"这里已经定义好了一个叫 candidate 的结构体，里面有两个字段。"],[131520,142380,"字符串 name 保存候选人的姓名，整数 votes 保存这名候选人的当前票数。"],[142380,153270,"每位候选人都由这样一个结构体表示。把它们依次存进名为 candidates 的数组，"],[153270,155160,"就收齐了当前参选的所有候选人。"],[155160,166650,"和其他数组一样，可以通过下标访问元素：candidates[0] 是第一位，candidates[1] 是第二位，"],[166650,169470,"candidates[2] 是第三位。"],[169470,174630,"每个元素本身是一个结构体，里面存着姓名和票数。"],[174630,184680,"要读取结构体中的字段，可以用点号。例如，candidates[2].name 就是这位候选人的名字，"],[184680,190720,"而 candidates[2].votes 就是 Charlie 当前的票数。"],[190720,193320,"那么，在 Plurality 这道题里你要写什么呢？"],[193320,195420,"要实现两个函数。"],[195420,198750,"一个叫 vote，另一个叫 print_winner。"],[198750,203730,"vote 接收一个名为 name 的字符串参数。"],[203730,210780,"它要在候选人中查找姓名与 name 相同的人。"],[210780,217030,"如果找到了，就更新这名候选人的票数，并返回 true。"],[217030,224620,"如果没找到，就不要改动任何人的票数，直接返回 false。"],[224620,225900,"具体会是什么过程呢？"],[225900,234610,"比如把 \"Bob\" 传给 vote，可以遍历候选人数组。从第一位开始问："],[234610,237690,"这名候选人的名字是 Bob 吗？"],[237690,238830,"在这个例子里，第一位不是。"],[238830,239670,"于是继续往下看，"],[239670,241290,"来到下一位候选人。"],[241290,243450,"这个人的名字是 Bob 吗？"],[243450,244260,"这次是的。"],[244260,251130,"既然匹配上了，就把他的票数加 1，从原来的 1 票变成 2 票，记下这张新选票。"],[251130,253555,"随后 vote 返回 true。"],[253555,262540,"如果投给了根本没有参选的人，比如 Dave，就不更新任何人的票数，函数返回 false。"],[262540,264098,"这就是 vote 的任务。"],[264098,267725,"第二个要实现的函数叫 print_winner。"],[267725,272043,"它负责输出选举的获胜者。"],[272043,278070,"这里要输出所有得票最多的候选人的姓名，可能有一位，也可能有好几位。"],[278070,286260,"因为投票结束时，可能有多人并列最高票。出现这种情况，他们每一个人都是胜者。"],[286260,288910,"应该依次输出他们的名字。"],[288910,298330,"比如 Alice 有 3 票，Bob 有 1 票，Charlie 有 2 票，Alice 票数最多，所以她胜选。"],[298330,300720,"程序应输出 Alice。"],[300720,307620,"再看这一组票数：Alice 和 Bob 各有 3 票，并列第一。"],[307620,312810,"那么程序应在一行输出 Alice，再在下一行输出 Bob。"],[312810,320220,"实现 vote 和 print_winner 之后，就写齐了模拟一场相对多数制选举所需的代码。"],[320220,328560,"运行 ./plurality，输入一系列选票，就应该能看到程序输出这场选举的获胜者。"],[328560,329610,"我是 Brian。"],[329610,332330,"这就是 Plurality。"]],"en":[[362,2070,"BRIAN YU: Let's take a look at plurality."],[2070,4260,"In plurality, your task is going to be to write"],[4260,6660,"a program that simulates an election."],[6660,9420,"Your program will take a sequence of votes as input,"],[9420,12570,"and your program will output the winner of that election."],[12570,14540,"Let's take a look at how you might do that."],[14540,17970,"Your election is going to have a sequence of candidates in the election."],[17970,22140,"This election has Alice, Bob, and Charlie as the candidates, for example."],[22140,26010,"And each voter is going to select one of those candidates to vote for."],[26010,28530,"If you take this voter's information in combination"],[28530,30900,"with the information from all of the other voters,"],[30900,34810,"you can use that information to figure out who the winner of the election is."],[34810,36810,"What information will you need to keep track of?"],[36810,38910,"Well, you'll need to keep track of each of the candidates,"],[38910,41520,"and for each of the candidates, how many votes they have."],[41520,45570,"In this case, Alice has three votes, Bob has one vote,"],[45570,47340,"and Charlie has two votes."],[47340,50640,"So as a result, Alice is declared the winner of the election."],[50640,54900,"This is what we call a plurality vote, also known as first past the post."],[54900,56880,"The rules basically work like this."],[56880,60150,"Every voter chooses one candidate who they would like to vote for."],[60150,62610,"And at the end of the election, whichever candidate has"],[62610,66010,"the most votes is declared the winner of that election."],[66010,68220,"So how is your program going to work?"],[68220,72930,"Well, your program is going to be run as ./plurality followed by the names"],[72930,74640,"of all of the candidates in the election."],[74640,77412,"In this case, Alice, Bob, and Charlie."],[77412,79620,"Your program will then prompt the user for the number"],[79620,80940,"of voters in the election."],[80940,83340,"In this case, we might say four, for example."],[83340,85650,"And then now four times your program is going"],[85650,88890,"to prompt the voter to type in who they're going to vote for."],[88890,91270,"So the first vote for Alice, for example."],[91270,93870,"And then the next voter might vote for Bob, for example."],[93870,96540,"And maybe the last two voters are going to vote for Charlie."],[96540,98790,"After all of the votes are in, your program"],[98790,102660,"is going to figure out who the winner of the election is and output their name."],[102660,104880,"In this case, Charlie."],[104880,106963,"So how are you going to do this?"],[106963,109380,"Well, recall that this is the data that you need to store."],[109380,112110,"For each candidate, you need to keep track of how many votes"],[112110,114750,"they currently have, which means that for any candidate,"],[114750,117270,"you're really storing two pieces of information."],[117270,120090,"And when you're storing multiple pieces of information,"],[120090,123060,"one convenient way to represent that in a c program"],[123060,126150,"is by storing the information inside of a struct."],[126150,129419,"Here, we've defined a struct called a candidate, inside"],[129419,131520,"of which we're going to store two fields."],[131520,135810,"One field which is a string called name representing the candidate's name,"],[135810,140070,"and one field which is an integer called votes representing the number of votes"],[140070,142380,"that this candidate currently has."],[142380,145590,"We can take all of these candidates stored inside of these structs"],[145590,149160,"and put them in a sequence by creating an array of candidates which we're"],[149160,153270,"going to call candidates that's going to store all of the candidates that"],[153270,155160,"are currently in the election."],[155160,158880,"Because this is an array, we can index into this array the same way we index"],[158880,162840,"into any other array by using candidates[0] to mean the first"],[162840,166650,"candidate in the election, candidates[1] to mean the second candidate,"],[166650,169470,"and candidates[2] to mean the third candidate."],[169470,171630,"But remember that each candidate is itself"],[171630,174630,"a struct that has a name and a number of votes."],[174630,177840,"So if we want to take this struct and access a property of it,"],[177840,181320,"we could say candidates[2].name, for example--"],[181320,184680,"using the dot syntax to access the name of this candidate--"],[184680,189450,"and using candidates[2].votes to access the number of votes that Charlie"],[189450,190720,"currently has."],[190720,193320,"So what are you going to do in plurality?"],[193320,195420,"Well, you're going to implement two functions."],[195420,198750,"One called vote and one called a print_winner."],[198750,201330,"Your vote function is going to take as its argument"],[201330,203730,"a string parameter called name."],[203730,205950,"And what your vote function is going to do"],[205950,207990,"is it's going to look for a candidate who's"],[207990,210780,"called name, who has that same name."],[210780,213180,"And if you're able to find a candidate with that name,"],[213180,217030,"you're going to update their vote total and return true."],[217030,219390,"Otherwise, if you aren't able to find that candidate,"],[219390,221700,"you're going to not update any vote totals at all,"],[221700,224620,"and you're instead going to return false."],[224620,225900,"So how might that work?"],[225900,228160,"Well, if the vote function is called on Bob,"],[228160,232050,"for example, you might want to iterate through this array of candidates"],[232050,234610,"starting with the first one and asking yourself,"],[234610,237690,"does this candidate's name match Bob?"],[237690,238830,"In this case, it doesn't."],[238830,239670,"So we move on."],[239670,241290,"We'd move to the next candidate."],[241290,243450,"Does this candidate's name match Bob?"],[243450,244260,"Well, it does."],[244260,247860,"So we found a match, which means we can take the vote total and increment it,"],[247860,251130,"moving it from 1 to 2 to keep track of this new vote."],[251130,253555,"And then our vote function would return true."],[253555,256680,"Of course, if we had voted for someone who wasn't in this election at all--"],[256680,258269,"for example, Dave--"],[258269,262540,"we wouldn't update any vote totals, and our function would return false."],[262540,264098,"So that's the vote function."],[264098,266640,"The second function you're going to implement in this program"],[266640,267725,"is print_winner."],[267725,270600,"And the print_winner function is going to be tasked with printing out"],[270600,272043,"the winner of the election."],[272043,273960,"So in this function, you're going to print out"],[273960,278070,"the name of the candidate or candidates who have the most votes."],[278070,280800,"Because remember, it's possible that at the end of the election,"],[280800,284430,"multiple people are tied for the most number of votes, in which case"],[284430,286260,"each of them should be declared a winner."],[286260,288910,"And you'll want to print out each of their names."],[288910,292530,"So in this case where Alice has three votes, Bob has one vote,"],[292530,295620,"and Charlie has two votes, Alice has the most votes,"],[295620,298330,"and Alice is going to be declared the winner of the election."],[298330,300720,"So you should print out Alice's name."],[300720,303240,"But consider, for example, these vote totals"],[303240,305760,"where both Alice and Bob each are tied for winning"],[305760,307620,"the election at three votes each."],[307620,311280,"So your program should print out Alice on one line and then Bob"],[311280,312810,"on the next line."],[312810,316083,"After you've implemented these two functions, vote and print_winner,"],[316083,318000,"you should have implemented all you need to be"],[318000,320220,"able to simulate a plurality election."],[320220,324780,"And by running ./plurality, you should be able to type in a sequence of votes"],[324780,328560,"and have your program output who the winner of the election is."],[328560,329610,"My name is Brian."],[329610,332330,"And this was plurality."]]},"-Vc5aGywKxo":{"edited":true,"zh":[[500,2400,"现在我们来看 Runoff。"],[2400,10590,"这道题使用按偏好排名的投票方式。上一题 Plurality 中，每个选民只能选一名候选人；"],[10590,20380,"而在 Runoff 中，每个人都可以把所有候选人按喜好排序。选票上能填写第一选择、第二选择，"],[20380,22320,"还有第三选择，像这里这样。"],[22320,26380,"比如，一位选民最希望 Alice 当选。"],[26380,29190,"但如果 Alice 不能胜出，这个人的第二选择是 Charlie；"],[29190,32070,"如果 Charlie 也不能胜出，下一位就是 Bob。"],[32070,35370,"一张按偏好排名的选票大致就是这样。"],[35370,38160,"那么，即时决选是怎么计票的呢？"],[38160,46950,"先让每位选民给所有候选人排序，填出第一、第二、第三选择，一直排完全部候选人。"],[46950,54820,"如果某人获得过半数选票，也就是票数超过总票数的一半，就宣布这名候选人获胜。"],[54820,65250,"如果没人过半，就淘汰得票最少的候选人，排除他们，重新计票。重复这个过程，直到有人"],[65250,67740,"获得过半数选票。"],[67740,70500,"先看一个简单的例子。"],[70500,78480,"这次选举有 7 张选票，因此一名候选人至少需要 4 票才能过半胜出。"],[78480,80640,"候选人是 Alice、Bob 和 Charlie。"],[80640,82830,"我们逐张来看。"],[82830,87210,"在第一张选票上，选民把 Alice 排在第一位。"],[87210,89340,"所以这张票归 Alice。"],[89340,91950,"下一张票也归 Alice。"],[91950,96810,"这张的第一选择是 Bob，所以它归 Bob，紧接着的一张也归 Bob。"],[96810,98670,"下一张归 Alice。"],[98670,100350,"再下一张归 Bob。"],[100350,104070,"最后一张选票上，Charlie 是第一选择。"],[104070,108810,"现在，Alice 有 3 票，Bob 有 3 票，Charlie 有 1 票。"],[108810,113880,"但别忘了，一共 7 张选票，要有 4 票才能赢。"],[113880,116070,"所以得进行下一轮计票。"],[116070,121950,"Charlie 的票数最少，因此要淘汰 Charlie。"],[121950,125010,"那么，先前投给 Charlie 的那张选票怎么办？"],[125010,127030,"那名选民填了第二选择，"],[127030,129060,"而他的第二选择是 Alice。"],[129060,132090,"所以这一轮，最后那张票转给 Alice。"],[132090,136800,"Alice 现在有 4 票，Bob 有 3 票，而 4 票已经过半了。"],[136800,140460,"所以这场选举由 Alice 获胜。"],[140460,143100,"这就是即时决选的基本过程。"],[143100,145330,"但实际情况也可能更复杂。"],[145330,153780,"再看一个例子，这次有 10 张选票，四名候选人分别是 Alice、Bob、Charlie 和 Dave。"],[153780,160320,"第一轮，按照每张选票的第一选择，把票计入相应候选人的名下。"],[160320,167100,"结果是 Alice 有 3 票，Bob 有 4 票，Charlie 有 1 票，Dave 有 2 票。"],[167100,174570,"如果用相对多数制，也就是 first-past-the-post，Bob 已经赢了，因为他的票数比任何人都多。"],[174570,182880,"但这里用的是即时决选。10 张票中至少要得到 6 票才过半，才能当选。"],[182880,186180,"还没有人拿到 6 票，所以我们开始下一轮计票。"],[186180,195270,"Charlie 再次排在最后，被淘汰。原先投给他的那张票，转给了这名选民的第二选择 Alice。"],[195270,196770,"Alice 现在有 4 票。"],[196770,197940,"Bob 也是 4 票。"],[197940,200130,"Dave 有 2 票。"],[200130,205170,"依然没人达到过半所需的 6 票，还要再来一轮。"],[205170,208260,"这时 Dave 的得票最少，"],[208260,210420,"所以 Dave 被淘汰。"],[210420,212820,"先前投给 Dave 的选民怎么办？"],[212820,220950,"其中第一位的下一选择是 Alice；第二位把 Charlie 列为自己的第二选择。"],[220950,225030,"可 Charlie 已经被淘汰，这张票也不能给 Charlie。"],[225030,230310,"所以要接着往下看。这位选民的第三选择也是 Alice。"],[230310,236580,"这样两张票都转给 Alice，她一共有 6 票，Bob 则有 4 票。"],[236580,241980,"Alice 得到了过半数选票，成为这场选举的胜者。"],[241980,247770,"Runoff 这道题的任务，就是写一个程序模拟这样的即时决选。"],[247770,249910,"要从哪里着手呢？"],[249910,253050,"先考虑怎样表示这些数据。"],[253050,258839,"需要表示的一类数据是每位候选人，以及和他们有关的信息。"],[258839,267420,"除了候选人的姓名、当前得票数，还要存一个布尔标志，值可以是 true 或 false，"],[267420,271560,"用它来表示这名候选人是否已经被淘汰。"],[271560,282540,"最初这些标志全是 false，因为还没有人被淘汰。之后每当淘汰一位候选人，就把他的标志从 false 改为 true。"],[282540,294420,"可以用提供的 candidate 结构体表示每名候选人。它有三个字段：字符串 name、整数 votes 和一个布尔值"],[294420,300330,"eliminated。这个字段记录候选人是否已经被淘汰。"],[300330,308910,"把这些候选人放在 candidates 数组中，每个元素都是一个 candidate 结构体。"],[308910,314282,"要进行即时决选，需要保存的信息除了候选人的情况，"],[314282,320280,"还有选民的信息，尤其是每位选民把候选人按什么顺序排列。"],[320280,326400,"我们用一个名为 preferences 的二维数组来存储这些偏好。"],[326400,328710,"怎样读这个二维数组呢？"],[328710,336720,"preferences[i][j] 就是数组中第 i 行、第 j 列的元素。它存的是某个候选人的下标，"],[336720,341770,"指的是 i 号选民排在第 j 个位置上的人。这句话具体是什么意思？"],[341770,343420,"看一个例子。"],[343420,354000,"有三位候选人：在 candidates 数组中，Alice 的下标是 0，Bob 是 1，Charlie 是 2。"],[354000,358780,"假如我们把 preferences[0][0] 设为 2，会怎样？"],[358780,364290,"就是在行下标 0、列下标 0 的位置填入数字 2。"],[364290,374100,"行下标 0 表示第一位选民，列下标 0 表示这位选民的第一选择。"],[374100,378990,"值 2 表示下标为 2 的候选人，也就是 Charlie。"],[378990,387130,"所以 preferences[0][0] 等于 2，就表示第一位选民最希望 Charlie 当选。"],[387130,390030,"如果又把 preferences[0][1] 设为 0 呢？"],[390030,395530,"就是在二维数组的这个格子里填入数字 0。"],[395530,399850,"行下标仍然是 0，还是说第一位选民。"],[399850,405700,"不过这次列下标是 1，代表第二选择。"],[405700,409900,"这里存了 0，而 0 号候选人是 Alice。"],[409900,417570,"所以 preferences[0][1] 等于 0，表示第一位选民的第二选择是 Alice。"],[417570,426140,"依此填完整个 preferences 数组，就记下了每位选民给每位候选人排的名次。"],[426140,429850,"那么，实现 Runoff 具体需要做什么？"],[429850,437530,"在 runoff.c 里，你要实现六个函数，把即时决选的计票过程写出来。"],[437530,446260,"依次是 vote、tabulate、print_winner、find_min、is_tie，最后是 eliminate。"],[446260,449770,"我们逐个来看。"],[449770,451470,"先看 vote。"],[451470,458610,"vote 接收三个参数。整数 voter 表示当前正在投票的是第几号选民。"],[458610,468810,"整数 rank 表示这名选民正在填写哪个名次。0 是第一选择，1 是第二选择，"],[468810,470380,"后面依此类推。"],[470380,476880,"最后，字符串 name 表示这名选民打算在这个位置填哪位候选人。"],[476880,478740,"vote 要做什么呢？"],[478740,482370,"它要找到姓名和 name 匹配的候选人。"],[482370,489833,"如果找到了，就更新二维数组 preferences，记下这个人是这名选民在 rank 位置上的选择。"],[489833,494800,"然后返回 true，表示已成功记录这一选择。"],[494800,501160,"如果没有找到对应候选人，就不要改动 preferences，直接返回 false。"],[501160,502680,"来看一个例子。"],[502680,505320,"候选人仍是 Alice、Bob 和 Charlie。"],[505320,512320,"还是用二维数组 preferences 保存各人选票的内容。在程序里，它是一个全局变量。"],[512320,519110,"假设第一张选票这样填写：最喜欢 Alice，其次 Charlie，最后 Bob。"],[519110,528000,"Alice 在 candidates 数组中的下标是 0，所以在 preferences 第 0 行第 0 列填入 0，"],[528000,531390,"这就记录了第一位选民的首选。"],[531390,535470,"他的第二选择是 Charlie，在候选人数组中的下标是 2。"],[535470,539610,"于是在 preferences 的同一行，下一格填 2。"],[539610,541830,"最后，Bob 是第三选择。"],[541830,544050,"Bob 在候选人数组中的下标是 1，"],[544050,546480,"所以接下来填 1。"],[546480,549330,"之后收到的每一张选票都要这样处理。"],[549330,558720,"如果下一位选民把 Charlie 排在第一位，而 Charlie 的下标是 2，就把 2 填在这名选民的第一选择位置。"],[558720,564930,"第二选择是 Bob，下标 1，第三选择是 Alice，下标 0。"],[564930,575800,"对剩余选民重复这个过程，直到 preferences 中记下了所有选民的完整排名。"],[575800,586200,"再看 tabulate。这个函数负责统计本轮的票数，更新每名候选人的当前得票数。"],[586200,587650,"具体怎么统计呢？"],[587650,596160,"每张选票都会优先投给排在最前面的人，但已经被淘汰的候选人不能再得票。"],[596160,602830,"所以，对每张选票，都把票投给「仍在参选的人中，排名最靠前的那一位」。"],[602830,606870,"用一些示例数据来看看 tabulate 会怎么工作。"],[606870,610440,"这里是几名候选人，以及各位选民的排名。"],[610440,612510,"暂时还没有人被淘汰。"],[612510,623010,"Alice、Bob 和 Charlie 的 eliminated 都是 false，因此每名选民都能把票投给自己的第一选择。"],[623010,627450,"比如，第一位选民投给 0 号候选人，也就是 Alice。"],[627450,632790,"tabulate 就要更新 Alice 的得票数，把 0 改为 1。"],[632790,635070,"下一位投给 Charlie。"],[635070,636960,"再下一位投给 Bob。"],[636960,638970,"接着这位又投给 Charlie。"],[638970,641220,"最后一位投给 Alice。"],[641220,650490,"所以 tabulate 执行完后，candidates 数组中记下的应当是 Alice 有 2 票，Bob 有 1 票，Charlie 有 2 票。"],[650490,659580,"再看稍复杂的情况：假设 Bob 已经被淘汰了，现在需要重新计票。"],[659580,668040,"还是像刚才一样遍历数组。第一位选民投给 Alice，第二位投给下标为 2 的 Charlie，"],[668040,673410,"第三位则想投给下标为 1 的候选人，也就是 Bob。"],[673410,677070,"但 Bob 已经被淘汰了，这张票不能再归 Bob。"],[677070,683400,"所以再看这名选民的下一选择：2 号候选人 Charlie。"],[683400,689430,"Charlie 仍在参选，于是得到这张票，票数从 1 增加到 2。"],[689430,697550,"下一位选民投给 Charlie，没有问题。最后一位投给 Alice。所以这一轮结束时，Alice 有 2 票，Charlie 有 3 票。"],[697550,707880,"这就是 tabulate 的任务：逐一查看选民的选票，只为仍在参选的候选人累计本轮票数。"],[707880,710705,"再下一个函数叫 print_winner。"],[710705,719160,"如果这场选举已经产生了胜者，它就要输出胜者的姓名。"],[719160,720370,"怎么判断呢？"],[720370,729060,"只要某名候选人的得票超过总票数的一半，就输出这个人的名字，并返回 true。"],[729060,734490,"也有可能现在还没人得票过半，选举还没有胜者。"],[734490,739000,"这时不要输出任何内容，只需要返回 false。"],[739000,741250,"看个例子。"],[741250,748870,"如果有 5 张选票，要胜选就需要至少 3 票，才算过半。"],[748870,752290,"这里谁也没有 3 票，所以尚未产生胜者。"],[752290,757450,"因此 print_winner 不应输出任何人的名字，直接返回 false。"],[757450,760480,"再看这组票数。"],[760480,766520,"仍有 5 张选票，需要 3 票才能获胜。此时 Charlie 得到了 3 票。"],[766520,768730,"所以 Charlie 就是这场选举的胜者。"],[768730,778090,"在这种情况下，print_winner 应输出 Charlie 的名字，再返回 true，表示已经选出了胜者。"],[778090,782530,"接下来，runoff.c 中要实现的函数叫 find_min。"],[782530,788870,"find_min 要返回仍然参选的候选人中，票数最少的人得了多少票。"],[788870,794330,"用这个数就可以找出这轮计票应淘汰谁。"],[794330,796610,"看个例子。"],[796610,802270,"这里有五名候选人 Alice、Bob、Charlie、Dave 和 Emma，旁边列出了他们的得票数。"],[802270,809550,"注意这五人的 eliminated 标志都是 false，也就是说，都还在参选。"],[809550,819220,"此时 find_min 应返回 1，因为在所有仍参选的人中，Bob 的票数最少，只有 1 票。"],[819220,823820,"当然，实际计票时也可能有些候选人已经被淘汰。"],[823820,825880,"来看这样一个例子。"],[825880,829050,"比如 Bob 已经被淘汰了。"],[829050,833810,"那么在 Bob 的 candidate 结构体中，eliminated 就是 true。"],[833810,843260,"即使 Bob 的 0 票是整个数组中最小的数，也不该把 0 返回，因为 Bob 已经出局。"],[843260,846970,"这里只考虑仍然参选的候选人。"],[846970,858190,"在这个例子中，仍在参选、票数又最低的，是各得 2 票的 Alice 和 Emma，所以 find_min 应返回 2。"],[858190,867890,"接着要实现的是 is_tie，用于判断剩余的所有候选人是否平票。"],[867890,869710,"这个函数怎么工作呢？"],[869710,878380,"它接收一个整数参数 min，也就是刚才通过 find_min 算出来的最低票数。"],[878380,884290,"如果剩下的所有候选人票数都相同，is_tie 就返回 true。"],[884290,889550,"如果剩余候选人的票数不全相同，就返回 false。"],[889550,899830,"例如大家都还在参选，而且每个人都是 2 票，此时全员平票，函数应返回 true。"],[899830,902950,"再看这个例子，这也是平票。"],[902950,912040,"虽然数组中各人的票数看起来不同，但 Bob 和 Dave 已经出局。只需要看另外三位仍在参选的人。"],[912040,920420,"他们每人都是 2 票，所以剩下的人全部平票，函数应该返回 true。"],[920420,931060,"最后，runoff.c 里还要编写 eliminate。它负责淘汰本轮得票最少的候选人，"],[931060,936740,"这样下一轮就可以在排除这些人的情况下重新计票。"],[936740,943060,"因此，eliminate 应淘汰所有仍在参选且得票数等于 min 的人。"],[943060,950020,"min 是传给这个函数的参数，就是刚才 find_min 返回的最低票数。"],[950020,958960,"达到这个最低票数的可能是一个人，也可能有几个人，这些人都要淘汰。"],[958960,960520,"看个例子。"],[960520,968530,"假设现在还没人被淘汰，而 Bob 的得票数最低。"],[968530,971650,"他只有 1 票，其他人的票数都比他多。"],[971650,983140,"这时，eliminate 要更新 Bob 的 candidate 结构体，把 eliminated 从 false 改为 true，表示 Bob 已经出局。"],[983140,990970,"到了下一轮，重新计票之后，可能会出现这样的情况：Bob 已经被淘汰，"],[990970,996490,"而我们算出，当前仍在参选的人中，最低票数是 2。"],[996490,998470,"这时候函数要做些什么呢？"],[998470,1007650,"检查所有候选人，找出 Alice 和 Emma，两人都是 2 票，并列本轮最低票。"],[1007650,1016467,"要把他们都淘汰，也就是找到各自的 candidate 结构体，把两人的 eliminated 都从 false 改为 true。"],[1016467,1027300,"实现了 vote、tabulate、print_winner、find_min、is_tie 和 eliminate，就写齐了模拟即时决选所需的函数。"],[1027300,1039720,"你可以自己测试：运行 ./runoff，在后面把候选人的姓名作为命令行参数传入，然后逐个输入每名选民"],[1039720,1045960,"对候选人的排名，检查程序能否算出这场即时决选的正确胜者。"],[1045960,1049369,"我是 Brian，这就是 Runoff。"]],"en":[[500,2400,"BRIAN: Let's now dive into runoff."],[2400,6330,"In runoff, we're going to take advantage of ranked preference voting,"],[6330,10590,"whereas in plurality, each voter only got to vote for one candidate."],[10590,13800,"In runoff, a voter might be able to rank all of their candidates"],[13800,17520,"in sequence, so the ballot might look a little something like this, where they"],[17520,20380,"have a space to fill in their first preference, second preference,"],[20380,22320,"and third preference, for example."],[22320,26380,"One voter, for instance, might want Alice as their first preference vote."],[26380,29190,"But if Alice can't win, their next choice would be Charlie."],[29190,32070,"And if Charlie can't win, their next choice would be Bob."],[32070,35370,"So this is what a ranked preference ballot might look like."],[35370,38160,"How then does the runoff vote actually work?"],[38160,40080,"Well, the runoff vote is first going to say"],[40080,42720,"that every voter should rank all of their preferences,"],[42720,45030,"first, second, third, up to as many candidates"],[45030,46950,"as there are in the election."],[46950,50430,"If any candidate has a majority of the vote, meaning more than half"],[50430,52470,"of the votes, then that candidate is going"],[52470,54820,"to be declared the winner of the election."],[54820,56760,"But if nobody has a majority, we're going"],[56760,59670,"to eliminate the candidate with the fewest number of votes"],[59670,62550,"and rerun the election without them, and we're"],[62550,65250,"going to keep repeating that process until someone"],[65250,67740,"has won a majority of the votes."],[67740,70500,"So let's take a look at a simple example."],[70500,73350,"In this election, we have seven votes, which"],[73350,76770,"means that a candidate needs four votes, a majority of the seven"],[76770,78480,"in order to win the election."],[78480,80640,"The candidates here are Alice, Bob, and Charlie."],[80640,82830,"And so we'll look at the ballots one at a time."],[82830,87210,"For this first ballot, Alice is this voter's top preferred candidate."],[87210,89340,"So Alice is going to get this ballot."],[89340,91950,"This next ballot is also going to go to Alice."],[91950,95760,"This ballot has Bob as their top choice, so Bob gets this ballot as well as"],[95760,96810,"the next one."],[96810,98670,"The next ballot goes to Alice."],[98670,100350,"The next ballot goes to Bob."],[100350,104070,"And the final ballot has Charlie as the top preferred candidate."],[104070,107130,"At this point, Alice has three votes, Bob has three votes,"],[107130,108810,"and Charlie has one vote."],[108810,111090,"But remember, with seven votes in this election,"],[111090,113880,"a candidate needs four votes in order to win."],[113880,116070,"So at this point, we need to hold a runoff."],[116070,118410,"Charlie has the fewest number of votes in this election"],[118410,121950,"so far, so Charlie is going to be eliminated from the race."],[121950,125010,"What happens to the voter who originally voted for Charlie?"],[125010,127030,"Well, that voter had a second preference."],[127030,129060,"And their second preference was Alice."],[129060,132090,"So Alice at this point is going to get this last ballot."],[132090,135360,"Alice now has four votes compared to Bob's three votes,"],[135360,136800,"and four is a majority."],[136800,140460,"So Alice is going to be declared the winner of this election."],[140460,143100,"That, in short, is how a runoff election works."],[143100,145330,"But it could be a little more complicated."],[145330,147940,"So let's take a look at a more sophisticated example,"],[147940,152040,"this time with 10 ballots and four different candidates, Alice, Bob,"],[152040,153780,"Charlie, and Dave."],[153780,156660,"The first step happens, and we give each candidate,"],[156660,160320,"all of the voters who chose that candidate as their first preference."],[160320,164070,"And at this point, Alice has three votes, Bob has four votes,"],[164070,167100,"Charlie has one vote, and Dave has two votes."],[167100,170250,"In a plurality election, or a first past the post election,"],[170250,174570,"Bob would win this election now, because Bob has more votes than anyone else."],[174570,177840,"But with 10 ballots in the election, in a runoff election,"],[177840,181200,"a candidate needs a majority, or six out of the 10 votes"],[181200,182880,"in order to be declared the winner."],[182880,186180,"Since nobody has six votes yet, we need to hold a runoff."],[186180,189000,"Charlie, again, is in last place in this election,"],[189000,191280,"so we're going to eliminate Charlie from the election,"],[191280,195270,"and their voter is going to now vote for Alice, the second preference."],[195270,196770,"Alice now has four votes."],[196770,197940,"Bob has four votes."],[197940,200130,"And Dave has two votes."],[200130,202650,"Still, nobody has a majority of six votes,"],[202650,205170,"so we need to hold yet another runoff."],[205170,208260,"Dave has the fewest number of votes in this election at this point."],[208260,210420,"So Dave is going to be eliminated."],[210420,212820,"What happens to the people who voted for Dave?"],[212820,214620,"Well, the first person who voted for Dave"],[214620,218700,"chose Alice as their next preference, and the second voter who voted for Dave"],[218700,220950,"chose Charlie as their second preference."],[220950,225030,"But Charlie has already been eliminated, so the vote can't go to Charlie either."],[225030,228150,"So we now look to that voter's third preference, which in this case,"],[228150,230310,"is also Alice."],[230310,233460,"This means that Alice gets each of the two remaining votes,"],[233460,236580,"and Alice now has six votes compared to Bob's four."],[236580,238830,"Alice has a majority of the votes in the election,"],[238830,241980,"so Alice is declared the winner of this election."],[241980,245580,"Your task in runoff is going to be to write a program that simulates"],[245580,247770,"this style of runoff election."],[247770,249910,"So how are you going to do that?"],[249910,253050,"Well, one thing to think about is how you're going to represent this data."],[253050,255420,"And one piece of data you're going to need to represent"],[255420,258839,"are all of the candidates and the information associated with them."],[258839,262260,"In this case, in addition to storing the candidate's name and the number"],[262260,264240,"of votes they currently have, you'll also"],[264240,267420,"want to store a Boolean flag, true or false,"],[267420,270480,"representing whether that candidate has been eliminated from the race"],[270480,271560,"yet or not."],[271560,273630,"At first, all of these values will be false,"],[273630,275610,"because nobody will have been eliminated,"],[275610,278880,"but as candidates are eliminated in this runoff process,"],[278880,282540,"you might switch those values from false to true."],[282540,285750,"You can represent each of these candidates using a struct that we'll"],[285750,289740,"give you, where this struct representing a candidate has three fields,"],[289740,294420,"a string field called name, and int field, called votes, and a Bool field,"],[294420,296760,"called eliminated, representing whether or not"],[296760,300330,"that candidate has been eliminated from the election or not."],[300330,302220,"We can store a sequence of these candidates"],[302220,306510,"inside an array of candidates, where each individual element in that array"],[306510,308910,"is one of these candidate's structs."],[308910,311250,"But the candidates aren't the only piece of information"],[311250,314282,"that we need to keep track of in order to run the runoff election."],[314282,315990,"We also need to keep track of information"],[315990,320280,"about the voters, in particular about who their preferences are."],[320280,324090,"And to do that, we're going to represent preferences using a two dimensional"],[324090,326400,"array called preferences."],[326400,328710,"How do you interpret this two dimensional array?"],[328710,333270,"Well, preferences IJ, meaning row I and column J,"],[333270,336720,"is going to be a cell that store is the index of the candidate who"],[336720,341770,"is voter I's preference number J. So what does that actually mean?"],[341770,343420,"Let's take a look at an example."],[343420,346590,"In this case, we have three candidates, Alice, Bob, and Charlie,"],[346590,349650,"where Alice is stored at index 0 in the candidate's array,"],[349650,354000,"Bob is stored at index 1, and Charlie is stored at index 2."],[354000,358780,"What happens if we say something like preference of 0, 0 equals 2."],[358780,361380,"Well, that means we're going to fill into row 0 and column"],[361380,364290,"0 of this array, the number 2."],[364290,369030,"And the way to interpret that is that row 0 is talking about the first voter"],[369030,374100,", and column 0 is talking about the first preference for that voter."],[374100,378990,"And the 2 means candidate at index 2, which in this case is Charlie."],[378990,384570,"So preference 0, 0 equals true means the first voter's top preferred candidate"],[384570,387130,"is, in fact, Charlie."],[387130,390030,"What if we then said preferences 0, 1 equals 0?"],[390030,392950,"Well, that would mean we would fill in the number 0"],[392950,395530,"into this slot in the two dimensional array."],[395530,397900,"We're still on preference is 0, this first row"],[397900,399850,"talking about the first voter."],[399850,403510,"But now we're on column 1, which is here going to represent"],[403510,405700,"the voter's second preference."],[405700,409900,"Their second preference is zero, and candidate 0 is Alice."],[409900,413980,"So preference is 0, 1 equals 0 means the first voter's"],[413980,417570,"second preferred candidate is Alice."],[417570,420690,"And we can fill in this entire preference's two dimensional array"],[420690,423990,"to keep track of every single voter and every single preference"],[423990,426140,"that that voter has."],[426140,429850,"So what do you actually need to do to implement the runoff program?"],[429850,432520,"Well inside of runoff.c, you're going to implement"],[432520,436630,"six functions that will perform the algorithm of implementing this runoff"],[436630,437530,"election."],[437530,441910,"First, you'll implement vote, then tabulate, then print winner,"],[441910,446260,"then find min, then is tie, and then finally, eliminate."],[446260,449770,"And we'll go through each of these functions one by one."],[449770,451470,"Let's start with the vote function."],[451470,454320,"The vote function takes three arguments, an integer"],[454320,458610,"called voter, representing which number voter is currently voting."],[458610,461340,"It also takes an integer called rank, representing"],[461340,464880,"which rank the voter is currently trying to indicate a preference for,"],[464880,468810,"rank 0 meaning their top preference rank 1, meaning their next preference,"],[468810,470380,"so on and so forth."],[470380,473430,"And finally, the function takes in a string called name,"],[473430,476880,"indicating which candidate they're currently trying to vote for."],[476880,478740,"So what is vote going to do?"],[478740,482370,"Well, your vote function should look for a candidate called name."],[482370,485490,"If you find that candidate, you should update the two dimensional"],[485490,489833,"array of preferences, so that they are that voter's rank preference."],[489833,492750,"And then you should return true to indicate that you were successfully"],[492750,494800,"able to record this preference."],[494800,497760,"But if no candidate was found, you shouldn't update any preferences"],[497760,501160,"at all, and your function should just return false."],[501160,502680,"Let's take a look at it example."],[502680,505320,"Here again, we have Alice, Bob, and Charlie."],[505320,507570,"And here again, we have a two dimensional array"],[507570,509430,"of preferences, which is going to be stored"],[509430,512320,"as a global variable in your program."],[512320,514380,"Let's imagine that this ballot comes along,"],[514380,519110,"where the first preference is Alice, then comes Charlie, then comes Bob."],[519110,523350,"Well, Alice is the candidate at index 0 in the candidate's array, which"],[523350,528000,"means we're going to fill in 0 in to row 0 and column 0 of this array,"],[528000,531390,"representing the first voter's top preference."],[531390,535470,"This voter's next preference is Charlie, who's at index 2 in the array."],[535470,539610,"So 2 gets filled in to the next spot in this preferences row."],[539610,541830,"And finally, Bob is the third preference."],[541830,544050,"Bob, again, is at index 1 in the array."],[544050,546480,"So 1 gets filled in next."],[546480,549330,"And we're going to do this for each of the votes that comes our way."],[549330,551880,"If the next voter votes for Charlie as their top preference,"],[551880,554940,"and Charlie is at index 2 in the candidate's array,"],[554940,558720,"then we're going to fill in 2 as the first preference for this voter."],[558720,561330,"Bob is the second preference, who's at index 1,"],[561330,564930,"and Alice is the third preference, who is the candidate at index 0."],[564930,567810,"And we're going to do the same thing for each remaining voter who"],[567810,570160,"votes in the election until by the end of it,"],[570160,573540,"we filled in the entire preferences array for each of the voters"],[573540,575800,"and for each of their preferences."],[575800,579930,"Next up is the tabulate function, and the job of the tabulate function"],[579930,583200,"is going to be the update the vote counts for each of the candidates"],[583200,586200,"to represent how many votes they currently have."],[586200,587650,"How are you going to do that?"],[587650,591000,"Well, recall that every voter is going to ideally vote for their highest"],[591000,594690,"preference candidate, but a voter can't vote for a candidate who's"],[594690,596160,"already been eliminated."],[596160,600210,"So each voter is going to vote for their highest preferred candidate who has not"],[600210,602830,"yet been eliminated from the race."],[602830,606870,"So what might this tabulate function actually do on some sample data?"],[606870,610440,"Well, let's take a look at these preferences and these candidates."],[610440,612510,"None of the candidates have been eliminated yet."],[612510,614850,"Alice's eliminated status is set to false,"],[614850,617430,"and so is Bob's, and so is Charlie's, which"],[617430,619650,"means that since nobody has been eliminated,"],[619650,623010,"every voter gets to vote for their top preferred candidate."],[623010,627450,"This first voter, for example, is voting for candidate 0, who's Alice."],[627450,630270,"So our tabulate function would update Alice's vote total,"],[630270,632790,"changing it from 0 to 1."],[632790,635070,"Next up, this voter's voting for Charlie."],[635070,636960,"The next voter is voting for Bob."],[636960,638970,"The next voter is voting for Charlie again."],[638970,641220,"And the final voter is voting for Alice."],[641220,643230,"So at the end of our tabulate function, we"],[643230,647040,"should have recorded in our candidates array that Alice has two votes,"],[647040,650490,"Bob has one vote, and Charlie has two votes."],[650490,653910,"But what happens in a more complex scenario, where, for example,"],[653910,657120,"Bob may have been already eliminated from this election,"],[657120,659580,"and we want to tabulate these votes again."],[659580,661950,"Well, we'd go through the array, much as we did before"],[661950,664350,"and see that the first voter was voting for Alice,"],[664350,668040,"and the second voter is voting for Charlie, the candidate at index 2,"],[668040,670620,"and the third voter is trying to vote for the candidate"],[670620,673410,"at index 1, who in this case is Bob."],[673410,677070,"But Bob's already been eliminated, so the vote can't actually go to Bob."],[677070,681000,"So instead, this voter is going to look at their next preference, candidate"],[681000,683400,"number 2, who in this case, is Charlie."],[683400,686580,"Charlie's still in the race, and so Charlie gets this vote,"],[686580,689430,"and his vote total gets updated from 1 to 2."],[689430,692160,"The next voter votes for Charlie, no problem, and the final voter"],[692160,695880,"votes for Alice, so by the end of it, Alice has two votes,"],[695880,697550,"and Charlie has three."],[697550,699300,"So that's what you're tabulate function is"],[699300,702750,"going to do, go through each of the voters and update the vote counts,"],[702750,705630,"making sure to only update vote counts for candidates"],[705630,707880,"who are still in the race."],[707880,710705,"The next function you're going to write is print winner."],[710705,713580,"The print winner function is going to be a function that's ultimately"],[713580,716400,"going to be tasked with printing out who the winner of the election"],[716400,719160,"is
