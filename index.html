h and birth"],[13237,16740,"day in another column, as well as have a forum where"],[16740,19530,"users can add a new birthday to a database"],[19530,22840,"by typing in the name of a new person, the month in which they were born,"],[22840,25920,"and the day in which they were born, and then using that information"],[25920,30270,"to then store that inside the database and then have your website update based"],[30270,34410,"on that database, displaying the names and birthdays of all of the people"],[34410,36270,"that are in the database."],[36270,38880,"In order to do so, the first thing to understand"],[38880,41640,"is the structure of the database that we give you."],[41640,45570,"And we'll give you a database that has one table called birthdays."],[45570,47340,"This table has an ID."],[47340,51030,"Every birthday also has a name of the person whose birthday were storing"],[51030,56570,"as well as an integer for the month and the day of that person's birth."],[56570,58760,"Let's take a look now at the distribution code"],[58760,61200,"that we give you as part of this application."],[61200,63210,"This is a flask application."],[63210,66450,"So let's first take a look at application.py."],[66450,69690,"What you'll notice is that inside of application.py,"],[69690,72840,"we're giving ourselves access to this database"],[72840,77940,"by using the CS50 library to get access to birthdays.db representing"],[77940,82646,"the database inside of this variable called DB."],[82646,86800,"Next, we have a single route in this web application, just the slash"],[86800,90850,"route which is the default one, that accepts two request methods,"],[90850,92620,"GET and POST."],[92620,94840,"Get will be the request method we use when"],[94840,99220,"someone is just visiting our page as by typing its URL or clicking on a link."],[99220,101620,"And POST will be the request method we use"],[101620,104080,"when the user is submitting some form data,"],[104080,108920,"like submitting a person's birthday to be added to the database."],[108920,112610,"If the request method is POST, we've already written this part for you,"],[112610,116300,"well, that means the user has submitted something via a form."],[116300,119900,"And so what you'll want to do is add that user's entry"],[119900,122690,"with their name and their birthday into the database."],[122690,125840,"And then they get redirected back to the default route."],[125840,128300,"But otherwise, if the user is just getting the website,"],[128300,133040,"they're not submitting a new birthday, then we're going to display index.html."],[133040,137240,"Ultimately, index.html needs to also get access"],[137240,141420,"to information about all of the people's birthdays inside of the database."],[141420,144500,"So you'll want to add logic here to query the database"],[144500,150410,"to get access to all of those birthdays and pass them into index.html."],[150410,152990,"Let's now take a look at index.html which"],[152990,155270,"is inside of our Templates folder."],[155270,158000,"You'll notice that here we have a section that"],[158000,160730,"says add a birthday then nothing beneath it just yet."],[160730,163550,"This form is going to be up to you to create."],[163550,166130,"And then we have a table for displaying birthdays,"],[166130,169010,"where every row in that table is going to have"],[169010,172880,"one cell for the name of the person, and one cell for their birthday,"],[172880,174320,"month and day."],[174320,177590,"But you'll notice that the body of this table right now is empty."],[177590,182210,"Your task ultimately is going to be to inside of index.html loop"],[182210,185540,"through all of the birthdays that you've got access to from the database"],[185540,189080,"and print one row into this HTML template"],[189080,193940,"for each of those birthdays, printing one row that has a name for the person"],[193940,195950,"as well as their birthday."],[195950,199890,"So let's recap what you're going to do as part of this lab."],[199890,202790,"The first thing you should do in application.py"],[202790,207620,"is query for all birthdays and pass that data to index.html."],[207620,211700,"This is in the else section of that route for a standard GET request."],[211700,213770,"Because when someone is getting your page,"],[213770,216920,"you want to query for all of the birthdays from the database"],[216920,220190,"and then give that information to index.html"],[220190,223760,"so that your HTML template can take advantage of that data"],[223760,226550,"to render all of those table rows."],[226550,230990,"The next step in index.html is to render those table rows."],[230990,233510,"For each of the birthdays that you got from the query,"],[233510,236210,"you're going to render each as a row in that table"],[236210,239660,"with one cell in that table for the name and one cell"],[239660,241700,"in that table for the birthday."],[241700,246740,"Recall that you can create a table row in HTML using the TR tag."],[246740,253010,"And you can create a cell in that row using TD, TD standing for table data."],[253010,255680,"And you'll likely want to use some kind of loop here"],[255680,259790,"as well to be able to loop over your list of all of those birthdays,"],[259790,263180,"and for each of those birthdays rendering one row that"],[263180,265910,"shows up inside of your HTML table."],[265910,268800,"After you've implemented that part of the application,"],[268800,272180,"you should be able to view the birthdays that are already in the database."],[272180,276630,"But now we want the ability to add new birthdays to that database as well."],[276630,282050,"So in index.html, you'll add a form to let users add a new birthday."],[282050,284780,"That form should give users the ability to specify"],[284780,287570,"the name of a person, what month they were born in,"],[287570,289670,"and what day they were born on, and then click"],[289670,292410,"some button that lets them submit that form"],[292410,294890,"to add a new birthday to the database."],[294890,297500,"And then finally in application.py you'll"],[297500,301460,"need to add logic to handle those form submissions accessing whatever"],[301460,304580,"data was submitted via that form, and inserting"],[304580,307250,"that new birthday into the database."],[307250,311180,"After you've done that, users should be able to visit your website application,"],[311180,314630,"fill out that form by typing in their name, a month, and a day,"],[314630,317840,"and have their birthday added to your database of birthdays."],[317840,322580,"And as a result, their name and birthday should appear inside of your HTML table"],[322580,323880,"as well."],[323880,325690,"How might you go about doing this?"],[325690,330900,"Well to run SQL queries on your database, you can use db.execute."],[330900,334680,"Recall that DB is the name representing that database that we"],[334680,337140,"have inside of our flask application."],[337140,340410,"And execute will let you run a query like a select"],[340410,344250,"or an insert on that database from your Python program."],[344250,348120,"And recall too that if you add question marks into that query,"],[348120,350880,"you can use those as placeholders for other values"],[350880,353460,"such that you can substitute in values that"],[353460,356980,"came from the user as via a form submission for example"],[356980,359890,"as part of the query that you're running."],[359890,362230,"As you do so, you'll also want to bear in mind"],[362230,365530,"the distinction between these two different request methods, GET"],[365530,366790,"and POST."],[366790,370000,"When the user is getting the page, all you're going to do"],[370000,372790,"is query for all of the birthdays and display"],[372790,376330,"that HTML page that has that table of all of the birthdays."],[376330,380380,"POST meanwhile, is what's going to happen when the user submits a form."],[380380,384400,"So you want to make sure that your form has a method of POST to make sure"],[384400,387520,"that when you're sending data, you're sending that data via POST."],[387520,391540,"And then make sure that your route is able to handle those POST requests,"],[391540,394120,"adding each of those birthdays to the database"],[394120,397870,"such that the next time the user visits that page, their birthday"],[397870,400090,"will be on that page as well."],[400090,404010,"My name is Brian, and this was birthdays."]]},"lVwv4o8vmvI":{"edited":true,"zh":[[180,3180,"来看看 Birthdays 这道题的一种解法。"],[3180,8520,"这次实验要设计一个 Web 应用，用来记录用户的生日。"],[8520,17100,"首先，做一个 HTML 页面来显示数据库里已有的所有生日。"],[17100,22560,"要做到这一点，需要先在 Python 代码中查询所有生日记录。"],[22560,25230,"来看看这个查询可以怎么写。"],[25230,35130,"这里进入 else 分支，表示请求方法是 GET。接下来用 db.execute 执行 SQL 查询。"],[35130,46550,"查询 SELECT * FROM birthdays 会取出 birthdays 表里的所有记录，返回的行保存在列表 birthdays 中。"],[46550,56030,"接着，渲染 index.html 时，要向模板传一个名为 birthdays 的变量，它的值就是"],[56030,59250,"刚刚查询得到并保存在 birthdays 里的结果。"],[59250,65430,"来看看怎样在 index.html 里使用这个 birthdays 列表。"],[65430,69640,"起始代码中已提供一张用来显示生日的表格，"],[69640,72270,"不过表格的主体原本是空的。"],[72270,82650,"我们要遍历所有生日，为每条记录生成一行。这一行包含两个单元格，一个放姓名，"],[82650,84960,"另一个放生日。"],[84960,96580,"Flask 使用 Jinja 模板。在这里，我们把 for 循环等逻辑写在 {% 和 %} 之间。"],[96580,102240,"这里写 for birthday in birthdays，和 Python 的循环语法很像。"],[102240,107790,"每遍历到一条生日记录，就生成一个表格行，也就是一个 tr。"],[107790,115530,"这一行里的第一个单元格是 td，显示这条生日记录所对应的姓名。"],[115530,124410,"用 birthday.name 访问名字。name 对应刚刚查询的 SQL 表中的一列。"],[124410,131820,"这里的 birthday 对应 SQL 表中的一行，在 Python 中用字典表示。"],[131820,138630,"在 Jinja 模板中，birthday.name 就是这个人的名字。"],[138630,143220,"同样，第二个单元格用来显示这个人的生日。"],[143220,152290,"用 birthday.month 取月份，跟一个斜杠，再用 birthday.day 取得日期。"],[152290,157720,"这样，数据库中已有的生日就都能显示出来了。"],[157720,161950,"不过，我们还想让这个网站能够添加记录，"],[161950,167380,"让用户自己往数据库里录入新的生日。"],[167380,171240,"为此，可以在网站上添加一个 HTML 表单。"],[171240,172950,"来看看具体怎样写。"],[172950,177810,"向上滚动，在 Add a Birthday 标题下面可以看到一个表单。"],[177810,180720,"表单的 action 属性设为 /，"],[180720,186830,"它表示用户提交表单时，要将这些数据发送给哪个路由。"],[186830,189220,"method 属性则是 POST，"],[189220,193870,"这个属性决定了发送表单数据时使用哪种请求方法。"],[193870,195340,"这里使用的是 POST。"],[195340,198920,"另一种可选方法是 GET。"],[198920,200290,"因此这个表单会用 POST 发送数据。"],[200290,202190,"表单需要哪些输入框呢？"],[202190,205240,"首先需要一个输入框，让用户填写姓名。"],[205240,216130,"这个输入框的 name 属性也设为 \"name\"。引号中的值是我们给输入框起的名字，因此稍后在 Python 代码里，"],[216130,219580,"就能引用不同的输入框。"],[219580,227130,"我们得知道哪个是姓名、哪个是月份、哪个是日期，所以要为各个输入框命名。"],[227130,231790,"这个输入框存的是姓名，所以它恰好也叫 name。"],[231790,235990,"placeholder 是显示给用户看的提示文字，这里提示填写姓名。"],[235990,239450,"这个输入框的 type 是 text，也就是文本输入。"],[239450,241840,"我们还需要一个月份输入框。"],[241840,246220,"可以用占位提示文字 Month，告诉用户这里要填月份。"],[246220,248380,"它的 type 是 number，也就是数值。"],[248380,259610,"还可以利用 HTML 的其他属性，例如用 min 和 max 将月份限制在 1 到 12 之间。"],[259610,261940,"日期的处理方法很相似。"],[261940,264010,"用一个名为 day 的输入框，"],[264010,266680,"并在框里显示提示填写日期的文字。"],[266680,272980,"它也是 number 类型，这里的有效范围是 1 到 31。"],[272980,278050,"表单末尾的输入元素类型是 submit，"],[278050,281800,"它会显示成一个提交表单的按钮。"],[281800,286760,"这个输入元素的 value 决定按钮上显示什么文字。"],[286760,291030,"这个例子中，按钮上会显示 Add Birthday。"],[291030,294210,"到这里，HTML 页面上就有表单了。"],[294210,297450,"不过现在提交表单还不会产生任何效果。"],[297450,303520,"还得在 application.py 中添加逻辑，处理这个表单提交的数据。"],[303520,306150,"现在回到 application.py。"],[306150,316590,"如果请求方法是 POST，表示用户提交了刚才创建的表单。我们首先需要知道"],[316590,319440,"用户在表单里输入了哪些值。"],[319440,324150,"可以调用 request.form.get 来读取表单的值。"],[324150,329490,"传给这个函数的参数，是你要读取的输入框的名字。"],[329490,338130,"在 index.html 里，三个输入框的 name 属性分别是 name、month 和 day。"],[338130,347070,"对应的值分别用 request.form.get('name')、request.form.get('month') 和 request.form.get('day') 读取。"],[347070,354090,"这三个参数与 HTML 表单中各输入框的名字完全对应。"],[354090,360590,"接着，把读到的值分别保存在新变量 name、month 和 day 中。"],[360590,366000,"接着用 db.execute 向 birthdays 表插入一行。"],[366000,370550,"新增的生日记录要包含姓名、月份和日期。"],[370550,374690,"这里用三个问号作为这些值的占位符。"],[374690,379880,"因为写代码时，还不知道姓名、月份和日期具体是什么；"],[379880,382140,"实际的值要等用户填写后才能确定。"],[382140,390650,"所以先在 SQL 中写占位符，再把实际值作为额外的参数传给 db.execute，依次传入变量 name、month，"],[390650,396520,"以及 day。这三个变量就是要插入表里的值。"],[396520,399660,"现在，这个 Web 应用的各个部分都齐了，"],[399660,402480,"可以把它运行起来试一试。"],[402480,405960,"在终端中用 cd birthdays 进入目录，"],[405960,410130,"再执行 flask run 启动应用。"],[410130,413880,"点开这个网址，就能打开我们的 Web 应用。"],[413880,420030,"首先映入眼帘的，是数据库中原本就有的所有生日记录。"],[420030,429210,"我用 db.execute 查询了所有生日，把结果传给 index.html 模板，现在这些数据都显示在表格中。"],[429210,439650,"想添加生日，可以填写带有三个输入框的表单。比如姓名填 Luna，月份填 2，日期"],[439650,441090,"填 13 号。"],[441090,443070,"然后点击 Add Birthday。"],[443070,446970,"这样，数据库里就会多出一条生日记录。"],[446970,459390,"再打开这个页面时，刚添加的生日也会显示出来。现在我们既能查看已有的生日，也能继续添加。"],[459390,460470,"我是 Brian。"],[460470,463280,"这就是 Birthdays 这道题的解答。"]],"en":[[180,3180,"BRIAN YU: Let's take a look at how you might have solved your birthdays."],[3180,6240,"In this lab your task was to design a web application that"],[6240,8520,"could keep track of users' birthdays."],[8520,11550,"And the first thing you wanted to do was to just display"],[11550,15270,"an HTML page that showed you all of the birthdays that were currently"],[15270,17100,"stored in the database."],[17100,19740,"To do that, you first, in your Python code,"],[19740,22560,"needed to query for all of those birthdays."],[22560,25230,"Let's see how you might have done that."],[25230,29910,"Here, underneath the else, which means the request method is get,"],[29910,35130,"we're going to run db.execute to execute a SQL query on your database."],[35130,37470,"The query we wanted to execute was Select"],[37470,40920,"* FROM birthdays to get access to all of the birthdays data,"],[40920,46550,"saving all of those rows inside of a list called birthdays."],[46550,50150,"Then when we rendered index of HTML, we wanted"],[50150,53540,"to pass to that template a variable called birthdays,"],[53540,56030,"which was equal to birthdays, that variable"],[56030,59250,"that we queried for just a moment ago."],[59250,63320,"Now let's take a look at how we actually use that birthdays list inside"],[63320,65430,"of index.html."],[65430,67770,"We had already given to you a table where you"],[67770,69640,"were going to store those birthdays."],[69640,72270,"But the body was previously empty."],[72270,76050,"What you wanted to do was to loop over each of those birthdays,"],[76050,78420,"and for each of those birthdays render a row"],[78420,82650,"of that table that had two cells, one cell for the name"],[82650,84960,"and one cell for the birthday."],[84960,88950,"So here we have a for loop that, in this language called Jinja,"],[88950,94710,"the templating language that Flask uses, we use curly brace and % sign for any"],[94710,96580,"of these logical operations."],[96580,98940,"So here I'm saying for birthday and birthday,"],[98940,102240,"in syntax that looks very similar to Python syntax."],[102240,107790,"But for each one of those birthdays, I want to render a table row, a tr."],[107790,112140,"And inside of that row, I first have one table data cell, td,"],[112140,115530,"with the name of the person whose birthday I'm representing."],[115530,119250,"And I can access that as birthday.name, where name here"],[119250,122610,"corresponds to one of the columns from my SQL table"],[122610,124410,"that I was querying from before."],[124410,129509,"Recall that birthday here is one row of that SQL table, which is represented"],[129509,131820,"in Python as a Python dictionary."],[131820,135990,"And so here in Jinja, I can say birthday.name to get access"],[135990,138630,"to the name of that person."],[138630,141510,"And likewise, in the second table data cell,"],[141510,143220,"I want to represent their birthday."],[143220,146840,"And so here I'm saying birthday.month for the month of their birthday,"],[146840,152290,"slash, and then birthday.day for the day of their birthday as well."],[152290,155160,"And so that will then render all of the birthdays that"],[155160,157720,"are currently inside of the database."],[157720,160110,"But we didn't want our website to just display"],[160110,161950,"all of the birthdays from the database."],[161950,166350,"We also wanted to give users the ability to add new birthdays to the database"],[166350,167380,"as well."],[167380,171240,"So to do that we could add an HTML form to our website."],[171240,172950,"Let's see how we might do that."],[172950,176490,"If we scroll up on this page, here underneath add a birthday,"],[176490,177810,"we have a form."],[177810,180720,"The action of the form is slash."],[180720,184320,"This is what route the user should submit this data to when"],[184320,186830,"the form ultimately gets submitted."],[186830,189220,"Then the method is post."],[189220,193870,"The method is what request method should be used when sending this form data."],[193870,195340,"And in this case, we're using post."],[195340,198920,"But another option would have been get, for example."],[198920,200290,"So we're sending data via post."],[200290,202190,"And what inputs do we need?"],[202190,205240,"Well, we need one input to let the user type in their name."],[205240,209770,"Name in this case is going to be name, where this value in quotation marks"],[209770,212990,"is just some label that we're giving to that input field"],[212990,216130,"so that later, in our Python code that we'll take a look at in a moment,"],[216130,219580,"we have some way of referencing these different input fields."],[219580,222580,"We need some way of knowing what's the name, what's the month,"],[222580,227130,"and what's the day, and giving each input field a name is how we do that."],[227130,229180,"So the name of this input field just happens"],[229180,231790,"to be \"name,\" because we're storing the user's name."],[231790,234700,"Placeholder is just some helpful text the user is going to see,"],[234700,235990,"which is name."],[235990,239450,"And the type of this is going to be a text input."],[239450,241840,"We also have an input for storing the month."],[241840,243910,"We'll display a nice user placeholder for month"],[243910,246220,"to let them know they should be typing a month here."],[246220,248380,"The type of this is going to be a number."],[248380,250960,"And then optionally, if you wanted to, HTML also"],[250960,255280,"supports additional attributes you can give to inputs like min and max"],[255280,259610,"to say that the month needs to be between 1 and 12, for example."],[259610,261940,"And likewise, we do something similar for day."],[261940,264010,"We have an input whose name is day."],[264010,266680,"We display some placeholder text for that day."],[266680,269420,"And this is also going to be a number that, in this case,"],[269420,272980,"needs to be between 1 and 31."],[272980,274960,"Then finally, at the end of this form, we"],[274960,278050,"have one last input whose type is submit."],[278050,281800,"This is going to render as a button that is going to submit this form."],[281800,285100,"And the value of the input field here is what"],[285100,286760,"should be displayed on that button."],[286760,291030,"So this button is going to display the words, add birthday."],[291030,294210,"So this creates a form inside of our HTML page."],[294210,297450,"But nothing yet happens when we submit that form."],[297450,301200,"To do that, we need to add some logic to application.pi"],[301200,303520,"to handle that form submission."],[303520,306150,"So let's go back to application.pi."],[306150,310740,"And if the request method is post, meaning if the user is submitting data"],[310740,314250,"as by submitting that form that we just created a moment ago,"],[314250,316590,"the first thing I need to do is figure out what"],[316590,319440,"values the user typed into that form."],[319440,324150,"And for that I can use this function, request.form.get."],[324150,327810,"And then the argument is the name of the input field"],[327810,329490,"that I want to get the value of."],[329490,333090,"So recall that back in index.html, I had an input whose"],[333090,338130,"name was name, an input whose name was month, and an input whose name was day."],[338130,340890,"And so to access those three values, I can"],[340890,345060,"say request.form.getname, request.form.getmonth,"],[345060,347070,"and request.form.getday."],[347070,352020,"These three values line up exactly to the names of the input fields"],[352020,354090,"from my HTML form."],[354090,358660,"And I'm going to save those values inside of name and month and day"],[358660,360590,"as new variables."],[360590,365240,"Then I'm going to use db.execute to insert a new row into the birthdays"],[365240,366000,"table."],[366000,368720,"I'm going to add a new birthday, specifying values"],[368720,370550,"for name and month and day."],[370550,374690,"And then I'm using three question marks as placeholders for those values."],[374690,377000,"At the time that I'm writing this code right now,"],[377000,379880,"I don't know what the name of the month and day are going to be."],[379880,382140,"Those are going to be provided by the user."],[382140,386390,"And so I use placeholders and then specify them as additional arguments"],[386390,390650,"to db.execute, specifying the name variable, the month variable,"],[390650,396520,"and the day variable as the values that I want to insert into this table."],[396520,399660,"So now that I have all of the pieces of this web application."],[399660,402480,"I can try it out by running my web application."],[402480,405960,"In the terminal, I'll cd into my birthdays directory."],[405960,410130,"And then run flask run to start up my web application."],[410130,413880,"And when I click on this URL, I'll now open up my web application."],[413880,415950,"And the first thing you'll see is that I do"],[415950,420030,"see all of the birthdays that were currently stored inside of my database."],[420030,423840,"I used db.execute to get all of those birthdays, passed them"],[423840,427590,"into my index.html template, and now I'm displaying a table"],[427590,429210,"with all of that data."],[429210,432000,"And if I wanted to add a new birthday, I could do so"],[432000,435870,"using this form that has three input fields, one for the name,"],[435870,439650,"maybe Luna, one for the month, maybe February, one for the day,"],[439650,441090,"like the 13th."],[441090,443070,"Then I click Add Birthday."],[443070,446970,"And that has the effect of adding a new birthday to my database."],[446970,449400,"And then the next time I see this page, it now"],[449400,451770,"renders with the new birthday added to it"],[451770,454830,"as well, so that I can keep track of all of the birthdays"],[454830,459390,"already in the database and add new birthdays to the database, too."],[459390,460470,"My name is Brian."],[460470,463280,"And this was birthdays."]]},"7wPTAwT-6bA":{"edited":true,"zh":[[0,7290,"这道题要你设计一个网站，让用户在里面管理自己的股票投资组合。"],[7290,11290,"为此，你需要实现几项功能。"],[11290,15300,"首先，用户得能注册账户。"],[15300,19860,"注册后，用户可以查询股票报价，"],[19860,26250,"买入股票，再到首页查看自己买了哪些股票。"],[26250,33610,"用户还可以卖出手里的股票，查看自己的每一笔交易记录。"],[33610,41140,"完成这些功能以后，再给网站加上一项你自己设计的功能。"],[41140,48840,"在我们逐项介绍这些功能之前，先来看看可以用哪些起始代码。"],[48840,53520,"题目提供的文件分为几部分。"],[53520,61800,"有 app.py 和 helpers.py 两个 Python 文件，还有一个 SQLite 数据库 finance.db。"],[61800,64830,"另外还有一个放着模板的文件夹。"],[64830,69130,"我们逐个文件看一下。"],[69130,75190,"先看 app.py，这个网站的大部分 Python 代码都会写在这里。"],[75190,84600,"app.py 定义了一个 Flask 应用，以及用于连接 SQL 数据库的变量 db。"],[84600,91770,"比如，调用 db.execute 就可以在数据库中执行一条 SQL 语句。"],[91770,97890,"在 app.py 后面，你还会看到应用中各条路由的定义。"],[97890,102000,"每条路由都以 @app.route 开头。"],[102000,105090,"一条路由可以接受不同的 HTTP 请求方法。"],[105090,112747,"最常见的有 GET 和 POST。GET 用于获取页面内容，向路由提交数据一般用 POST。"],[112747,118020,"有些路由已经写好了，比如登录和退出。"],[118020,126520,"我们拿登录路由举个例子，看看 Flask 是怎样处理请求的。"],[126520,137280,"看这里的 @app.route。括号里的 /login 是用户访问登录功能时使用的路径。"],[137280,142020,"这条路由接受 GET 和 POST 两种请求。"],[142020,145710,"与它关联的函数叫 login。"],[145710,157800,"同一条路由对 GET 和 POST 要做的事不同，所以要先判断收到的是哪种请求。"],[157800,163540,"如果收到 POST，就表示用户刚刚提交了登录表单。"],[163540,169890,"这时，程序需要取出用户填进表单的数据。"],[169890,179950,"比如，request.form.get(\"username\") 可以取出用户输入的用户名。"],[179950,184980,"如果用户没有填用户名，就调用 apology 显示错误提示，"],[184980,190190,"告诉用户需要填写用户名。"],[190190,196730,"检查过用户名之后，也要检查用户有没有输入密码。"],[196730,202550,"如果没填密码，也要用 apology 显示提示。"],[202550,211220,"确认两项都填了，再到 finance.db 中查找这名用户，"],[211220,215690,"核实用户名与密码是否匹配。"],[215690,225980,"用 db.execute 执行 SELECT 查询，在已有的数据库中查找用户。"],[225980,228230,"要找的是用户名与表单输入相同的那一行。"],[228230,234890,"只有等用户输入名字、点击提交，我们才知道要查哪个名字。"],[234890,241130,"所以 SQL 里先写一个问号，给表单输入的值占个位置。"],[241130,247430,"这个实际的值，仍然用 request.form.get 取出来。"],[247430,258079,"调用 db.execute 执行 SELECT 时，返回的是一个列表，里面是所有符合查询条件的行。"],[258079,270210,"接下来要检查两件事：查询结果是否恰好有一行，以及输入的密码是否正确。"],[270210,279530,"如果找不到用户，或者密码输入有误，就调用 apology 返回错误提示，"],[279530,284920,"告诉用户用户名与密码不匹配。"],[284920,294430,"通过了前面的检查，就说明用户填了用户名和密码，而且两者确实匹配。"],[294430,299260,"接下来就可以让用户登录了。"],[299260,306530,"怎样记住谁已登录？可以用 session 保存当前用户的信息。"],[306530,313420,"把刚从数据库查到的用户 ID 存入 session[\"user_id\"]。"],[313420,317750,"登录成功后，把用户重定向到首页。"],[317750,322870,"在那里，用户可以查询报价、买入或卖出股票。"],[322870,327970,"函数的末尾还要处理另一种请求。"],[327970,335500,"刚刚讲的代码处理的是 POST，也就是用户真正提交了登录表单的情况。"],[335500,342230,"如果收到 GET，表示用户刚点开登录表单。"],[342230,351490,"这时要渲染登录模板，把表单显示出来，让用户填写用户名和密码。"],[351490,363560,"除了 app.py，还有 helpers.py。这个 Python 文件提供了几个实现网站功能时会用到的函数。"],[363560,368200,"比如，apology 用来向用户显示错误信息。"],[368200,376060,"把 @login_required 加在视图函数上，就可以要求用户先登录，才能访问对应的路由。"],[376060,382390,"例如，用户要买卖股票，你可能想先确认他已登录。"],[382390,389410,"lookup 函数会调用股票行情 API，按股票代码获取当前报价。"],[389410,395260,"有了股票代码，就可以通过 lookup 查到这只股票现在的价格。"],[395260,401020,"最后，usd 函数可以把一个数格式化为美元金额，"],[401020,405070,"显示美元符号和以美元、美分表示的数值。"],[405070,414950,"接下来是 finance.db。这个 SQLite 数据库用于保存整个网站的应用数据。"],[414950,418690,"里面已经有一张名为 users 的表。"],[418690,428920,"各列分别记录用户 ID、用户名、密码的哈希值，以及用户持有的现金。"],[428920,435250,"要实现网站的全部功能，你可能还需要往数据库里添加新表。"],[435250,440050,"可以用 SQL 的 CREATE TABLE 语句来建表。"],[440050,451750,"起始代码里还有 templates 文件夹。用户访问网站的不同部分时，可以渲染相应的 HTML 模板。"],[451750,463270,"其中的 layout.html 定义了各个页面共用的 HTML 结构。"],[463270,473650,"其他模板可以用 extends 继承这个布局，再分别填上自己的页面标题和正文。"],[473650,484540,"起始代码看过了。下面逐项看看，你需要实现哪些功能，网站才能完整运行。"],[484540,491600,"第一项是注册，让每个用户都能注册自己的 Finance 账户。"],[491600,497980,"注册路由 /register 需要接受 GET 和 POST 两种请求。"],[497980,505010,"如果用户通过 GET 访问 /register，就给他显示一张表单，"],[505010,507640,"供他注册新账户。"],[507640,515570,"用户提交表单后，/register 会收到 POST。这时先检查输入有没有问题。"],[515570,523190,"如果检查通过，就把新用户添加到 users 表，然后让他登录。"],[523190,528340,"先来看注册表单。怎样把它显示给用户？"],[528340,535660,"可以新建一个模板，在里面写注册表单的 HTML。"],[535660,541810,"这些模板都放在 finance 目录下的 templates 文件夹中。"],[541810,549050,"我们已经提供了 login.html，可以参考它来设计注册表单。"],[549050,560580,"表单需要有三个输入框，让用户填写用户名和密码，再输入一次密码进行确认。"],[560580,572810,"用户填好表单并提交后，Python 代码要能取到用户输入的各项内容。"],[572810,583940,"比如，假设 HTML 里有个输入框，它的属性是 name=\"password\"。"],[583940,595250,"在 Flask 的 Python 代码中，调用 request.form.get(\"password\")，传入的就是输入框的名称。"],[595250,602720,"这样便能取到用户填在这个输入框里、通过 POST 提交的值。"],[602720,607880,"密码、确认密码和用户名，都可以用这种方式读取。"],[607880,611540,"在路由里，还要检查用户输入是否有误。"],[611540,619430,"注册时可能出哪些问题？比如有输入框没填，用户漏了用户名，"],[619430,627230,"或者漏了密码、确认密码，就调用 apology 告诉用户这几项都必填。"],[627230,632310,"两次输入的密码不一致时，也要提示用户。"],[632310,641690,"如果用户名已经被数据库里的其他用户占用，同样要显示错误提示。"],[641690,652250,"输入都检查通过后，就可以把新用户加入 users 表。这里要注意账户安全。"],[652250,657530,"数据库里绝不能保存明文密码。"],[657530,664850,"先用提供的 generate_password_hash 函数计算密码的哈希值，"],[664850,671530,"然后在数据库里保存这个哈希值。"],[671530,681850,"哈希值算好后，就可以用 db.execute 执行 INSERT 语句，"],[681850,685010,"在 users 表中新增一行。"],[685010,693640,"编写 SQL 时，还不知道具体取值的地方可以用问号占位。"],[693640,698140,"把用户添加进 users 表以后，就可以让他登录。"],[698140,705170,"将 session[\"user_id\"] 设为数据库刚分配给这个新用户的 ID。"],[705170,711820,"用户可以注册之后，下一步是让他能够查询股票报价。"],[711820,717280,"查询路由 /quote 也接受 GET 和 POST 两种请求。"],[717280,725260,"通过 GET 访问 /quote 时，显示查询表单，让用户输入想查的股票代码。"],[725260,735130,"表单通过 POST 提交后，调用 lookup 查询这个代码，再把结果展示给用户。"],[735130,736930,"lookup 是怎样工作的呢？"],[736930,741940,"它是我们在 helpers.py 里定义的函数。"],[741940,746230,"传入股票代码，就能查询这只股票的报价。"],[746230,756730,"查询成功时，lookup 会返回一个字典，里面有股票名称、股票代码，"],[756730,758860,"以及当前的每股价格。"],[758860,762160,"查询也有可能失败。"],[762160,766810,"比如，用户输入了一个不存在的股票代码。"],[766810,774580,"这时应该调用 apology，告诉用户查不到这个代码。"],[774580,786510,"如果查询成功，就显示一个 HTML 页面，让用户看到这只股票的名称和当前价格。"],[786510,791970,"要做到这一点，得把查到的值传进 HTML 模板。"],[791970,793720,"怎样传呢？"],[793720,805290,"在 Python 里，render_template 除了渲染 HTML，还能把变量传给 Jinja 模板。"],[805290,815280,"例如，这里渲染 hello.html 时，向模板传入了名为 name 的变量，它的值是 Brian。"],[815280,820900,"在 Jinja 模板中，把变量名放进两对花括号里。"],[820900,829530,"这里写的是 {{ name }}，网页中就会显示 render_template 传来的值。"],[829530,836910,"用同样的写法，就可以显示用户刚查到的股票价格。"],[836910,843600,"除了查询报价，我们还要让用户可以买入股票。"],[843600,848550,"买入路由 /buy 同样接受 GET 和 POST。"],[848550,853950,"用户通过 GET 访问页面时，显示一张可以买股票的表单。"],[853950,860640,"用户提交表单后，如果现金足够，就替他完成这笔买入。"],[860640,869160,"在 HTML 表单里，用户既要填写股票代码，也要填写想买的股数。"],[869160,872940,"表单提交后，先检查输入是否有效。"],[872940,876810,"比如，买入的股数不能是负数。"],[876810,881580,"还要确认股票代码确实有效。"],[881580,889170,"要把这些数据存进数据库，你可能得先建一张或几张新表来记录它们。"],[889170,896910,"目前，finance.db 里的 users 表记录了用户以及每个人有多少现金，"],[896910,901900,"但数据库中还没有记录各用户持股情况的表。"],[901900,910020,"所以先想想，应该增加哪些表，每张表又需要哪些字段。"],[910020,918660,"用 CREATE TABLE 添加新表时，注意为每一列选择合适的 SQL 数据类型。"],[918660,921280,"这里可以有不止一种正确的设计。"],[921280,929190,"想想你觉得哪种设计最合理，最适合处理这个网站的数据。"],[929190,936390,"数据表准备好之后，就要把这次买入的股票加入用户的投资组合了。"],[936390,940620,"先确认用户手头的现金够不够。"],[940620,950790,"如果现金不够买下指定的股数，就调用 apology，告诉用户此次购买余额不足。"],[950790,962460,"如果现金充足，就执行相应的 SQL 语句，记录这笔买入，并更新用户的现金余额，"],[962460,964720,"从中扣除刚刚花掉的金额。"],[964720,971010,"实现这个功能后，用户登录网站就可以买入股票了。"],[971010,980580,"买入之后，用户自然还想有个地方能查看手里有哪些股票。这就是下一个功能。"],[980580,991410,"首页要用一张 HTML 表格列出当前用户持有的每种股票，"],[991410,998100,"写清持有多少股、当前每股价格，以及这项持仓的总价值。"],[998100,1004400,"比如，同一只股票买了多股，它们加起来的价值自然会更高。"],[1004400,1016510,"首页还要显示现金余额，以及所有持仓的市值加上手头现金之后的资产总额。"],[1016510,1022000,"写这张表时，你会发现有些 HTML 会重复出现。"],[1022000,1027579,"一只股票占一行，换到另一只股票，这行的结构几乎一样。"],[1027579,1032050,"对用户持有的每只股票都要重复一次。"],[1032050,1043690,"如果用循环遍历这些股票，每遇到一只就在表格中生成一行，写起来就方便多了。"],[1043690,1048560,"Jinja 模板里就可以写这样的循环。"],[1048560,1058420,"看这个例子。我们用 render_template 渲染 hello.html，传进去的是一个由 Python 字典组成的列表。"],[1058420,1069310,"模板用 for contact in contacts 依次取出每个字典，再用点号访问其中的字段，"],[1069310,1071380,"也就是取得字典中各项的值。"],[1071380,1075860,"在这个例子里，写作 contact.name 或 contact.house。"],[1075860,1079270,"你也可以在首页采用类似的方式。"],[1079270,1088630,"先通过数据库和 lookup 函数拿到当前用户每项持仓所需的数据，"],[1088630,1095380,"再在 HTML 模板里遍历这些持仓，让用户持有的每只股票在表里各占一行。"],[1095380,1101210,"现在，用户已经能买入股票，还能在首页查看全部持仓。"],[1101210,1105390,"接下来，让用户也能卖出股票。"],[1105390,1113940,"用户通过 GET 访问 /sell 时，显示卖出表单，让他从自己持有的股票中选择要卖哪一只，"],[1113940,1117390,"并填写要卖多少股。"],[1117390,1125910,"表单通过 POST 提交后，先检查有没有错误，再卖出指定的股数，"],[1125910,1130470,"并相应地增加用户的现金余额。"],[1130470,1132330,"这里可能会有哪些错误呢？"],[1132330,1142260,"比如，卖出的股数不能超过用户实际持有的股数，股数也不能是负数。"],[1142260,1147000,"这样，用户就能在网站上买卖股票了。"],[1147000,1154140,"接下来，还要让用户能查看以前每一笔交易的记录。"],[1154140,1163740,"访问 /history 时，用 HTML 表格列出历次交易，每一笔买入或卖出各占一行。"],[1163740,1173880,"写明交易的是哪只股票、买卖了多少股，以及交易发生的时间。"],[1173880,1183510,"交易历史要怎么实现，取决于你的数据库设计，比如建了哪些表、各张表有哪些列。"],[1183510,1191170,"为了支持交易历史，你也许需要回头调整已有的数据库结构。"],[1191170,1202680,"这些功能全部实现以后，最后再自己设计一项新功能，加到 CS50 Finance 里。"],[1202680,1211890,"例如，让用户修改密码，或者给账户增加现金。你也可以选择别的功能。"],[1211890,1220940,"先想好你希望这个应用能做什么，再按需要设计新的路由、模板或数据表。"],[1220940,1231710,"完成以后，用户就能在这个网站上注册、登录、买卖股票，并查看自己的全部交易记录。"],[1231710,1235660,"我是 Brian，这就是 CS50 Finance。"]],"en":[[0,2340,"SPEAKER 1: In this problem, your task is going"],[2340,4740,"to be to design a web application that allows"],[4740,7290,"users to manage a portfolio of stocks."],[7290,9270,"In order to do so, you'll need to implement"],[9270,11290,"a variety of different features."],[11290,15300,"First, you'll need to make sure that every user can register for an account."],[15300,17520,"Once they register for an account, a user"],[17520,19860,"should have the ability to look up a stock quote,"],[19860,23340,"buy a stock if they want to, see an index page that"],[23340,26250,"shows them all of the stocks the current user is bought,"],[26250,30450,"then the user should be able to sell any of the stocks that they currently own,"],[30450,33610,"and see a history of all of their transactions."],[33610,36270,"And finally, once you've implemented all of these features,"],[36270,40170,"you'll implement a personal touch of your very own to add to this website"],[40170,41140,"application."],[41140,44070,"But before we dive into the features that you're going to implement,"],[44070,47040,"let's start by taking a look at the distribution code that will"],[47040,48840,"provide to you as a starting point."],[48840,51630,"For this problem, the distribution code for this problem"],[51630,53520,"comes in a number of different parts."],[53520,58740,"We'll give you a few Python files, app.py, and helpers.py, in addition to"],[58740,61800,"a SQLite database called finance.db."],[61800,64830,"In addition, we'll also give you a folder filled with templates."],[64830,67770,"And we'll walk through each of these parts of the distribution code"],[67770,69130,"one file at a time."],[69130,73380,"Let's start with app.py, which is where you'll write most of your Python code"],[73380,75190,"for this web application."],[75190,79590,"App.py defines a Flask web application, and also defines"],[79590,84600,"a variable called db, which will allow you to connect to a SQL database."],[84600,88140,"In particular, you can use the function db.execute"],[88140,91770,"to execute a SQL statement on your SQL database."],[91770,94800,"Later in app.py, you'll also see definitions"],[94800,97890,"for each of the routes inside of your web application."],[97890,102000,"Each of which will start with the syntax @app.route."],[102000,105090,"These routes can take a variety of different request methods."],[105090,109080,"Most notably for getting the contents of a page and post"],[109080,112747,"generally used if you're submitting data to a particular route."],[112747,115080,"There are some routes that have already been implemented"],[115080,118020,"for you, such as log in and log out."],[118020,121350,"And let's now take an opportunity to look at one of these routes, the login"],[121350,124320,"route, just to get a sense for how routes in Flask"],[124320,126520,"this web framework actually work."],[126520,129180,"So here is the login route, and it begins"],[129180,133380,"with this syntax, @app.route with slash login being the route"],[133380,137280,"that users can use to access this part of your web application."],[137280,142020,"This particular route accepts two different methods, GET and POST."],[142020,145710,"And it's associated with this function called login."],[145710,149640,"Because the login route accepts to request methods, GET and POST,"],[149640,153090,"and we need to make different decisions based on that request method,"],[153090,157800,"one of the first things we'll need to do is check what the request method is."],[157800,161250,"If the request method is POST, that means the user has just"],[161250,163540,"submitted the login form."],[163540,165870,"And if the user has just submitted the login form,"],[165870,169890,"then we'll need to access whatever data the user typed into that form."],[169890,175680,"In order to do that, we can use this syntax here, reques.form.getusername,"],[175680,179950,"to get whatever the current username is that the user typed in into that form."],[179950,182800,"And if the user didn't provide a username,"],[182800,184980,"well then we should render an apology."],[184980,187470,"An error message to the user to let them know"],[187470,190190,"that they need to provide a username."],[190190,193550,"Likewise, just as we make sure that the user has typed in a username,"],[193550,196730,"we also need to make sure that the user has typed in a password."],[196730,198980,"And if the user didn't type in a password,"],[198980,202550,"then we should render an apology as well."],[202550,204890,"After that, once we're sure that the user has"],[204890,207770,"typed in both a username and a password, we"],[207770,211220,"need to now look them up inside of our finance.db database"],[211220,215690,"to make sure that this is a valid username and password combination."],[215690,220790,"So we'll use db.execute to run a select query on our existing database,"],[220790,225980,"and do a SELECT to try and find the user whose username is equal to whatever"],[225980,228230,"it is the user typed in into the form."],[228230,231800,"We won't know what the user name is until the user actually"],[231800,234890,"types in their username and clicks the button to submit the form."],[234890,237320,"And so here, we're using a question mark,"],[237320,241130,"where the question mark is acting as a placeholder for whatever the user typed"],[241130,243470,"into the form, which again, we can access"],[243470,247430,"via this syntax, request.form.get."],[247430,251720,"Whenever we run the execute function on a select query running"],[251720,255950,"on our database, what we'll get back is a list of all of the rows"],[255950,258079,"that matched our SELECT query."],[258079,261740,"So the next thing we should do is check to make sure that what we got"],[261740,266270,"back is exactly one row representing that particular user,"],[266270,270210,"and we should check to make sure that their password was correct."],[270210,273050,"If either of those isn't true, if the user is not in the database,"],[273050,275180,"or they typed in their password wrong, well then"],[275180,279530,"we should return an error back to the user using that apology function"],[279530,283100,"to let the user know that this was an invalid username and password"],[283100,284920,"combination."],[284920,287050,"And if we made it through all of that, that"],[287050,290020,"means the user has typed in a username and a password,"],[290020,294430,"and we verified that this is a valid username password combination."],[294430,296830,"And if that's the case, then the next thing we should do"],[296830,299260,"is actually log the user in."],[299260,301570,"How do we do that, we'll recall that we can"],[301570,306530,"use the session variable to keep track of information about the current user."],[306530,311740,"So we'll store inside of session bracket user ID, the current user's ID"],[311740,313420,"that we got from the database."],[313420,315160,"And after we've signed the user in, we'll"],[315160,317750,"go ahead and redirect the user back to the home page."],[317750,319930,"So that they can now go ahead and look up stocks"],[319930,322870,"buy stocks or sell stocks if they would like to."],[322870,325300,"And finally, at the very end of the function,"],[325300,327970,"we need to take care of the other request method."],[327970,332050,"All of that code we just took a look at was if the request method was POST."],[332050,335500,"The user actually submitted the login form."],[335500,337930,"But if instead the request method is GET,"],[337930,342230,"that means the user just clicked on a button to access the login form."],[342230,344230,"And in order to do that, what we'll do is"],[344230,347560,"return a template back to the user rendering the login"],[347560,351490,"form so the user can go ahead and type in their username and password."],[351490,354040,"In addition to app.py, we also provide you"],[354040,358580,"with helpers.py, which is a Python file that contains some useful functions"],[358580,360340,"that you might take advantage of as you're"],[360340,363560,"building the various features of this web application."],[363560,365680,"We'll give you a function called apology that"],[365680,368200,"displays an error message to the user."],[368200,371740,"Login required can be used above any of your functions"],[371740,376060,"to require that a user log in before they're able to access a given route."],[376060,379900,"For example, you might want to make sure that a user is logged in before they're"],[379900,382390,"able to buy or sell stocks."],[382390,387280,"The lookup function, meanwhile, uses a stocks API to get the current stock"],[387280,389410,"quote for a particular stock symbol."],[389410,391450,"So you can look up a stock buy it's symbol"],[391450,395260,"and figure out what the current quote for that stock is."],[395260,399100,"And finally, we give you a function called USD that takes a number"],[399100,401020,"and formats it as US dollars."],[401020,405070,"With a dollar sign, some number of dollars, and some number of cents."],[405070,408130,"Next in the distribution code is finance.db"],[408130,412150,"and this is the SQLite database that is going to store all of the application"],[412150,414950,"data for your web application."],[414950,418690,"So far in financ.db will give you a user's table."],[418690,421510,"And inside of this user's table, you'll find columns"],[421510,424900,"for keeping track of each user's ID, their username,"],[424900,428920,"a hash of their password, and how much cash that user has."],[428920,431980,"But you'll likely need to add new tables into this database"],[431980,435250,"to finish implementing all of the features of the web application."],[435250,440050,"And you can do that using the CREATE TABLE syntax in SQL."],[440050,442150,"Finally, in this distribution code, we also"],[442150,446110,"give you a folder of templates that contains HTML templates that"],[446110,450100,"can be rendered to the user depending on what part of the web application"],[450100,451750,"they're trying to access."],[451750,455920,"There's a file inside of your templates folder called layout.HTML"],[455920,459890,"that defines the general HTML structure for all of your pages,"],[459890,463270,"and then the rest of your HTML pages can use the syntax"],[463270,467380,"to extend layout.HTML to use that existing layout"],[467380,471580,"and add to it a title for the page and the main body content of each"],[471580,473650,"of your other HTML pages."],[473650,476050,"Now that we've taken a look at the distribution code that"],[476050,479170,"will provide to you for this problem, let's now turn our attention"],[479170,481060,"to each of the different features that you'll"],[481060,484540,"need to implement to make this web application fully functional."],[484540,486730,"The first thing you'll need to do is make sure"],[486730,491600,"that each user has the ability to register for your finance application."],[491600,495340,"In order to do that, your register route should accept two different request"],[495340,497980,"methods, GET and POST."],[497980,502120,"If the user tries to access the register route using the GET request method,"],[502120,505010,"then you should just display a form to the user."],[505010,507640,"So that they can register for a new account."],[507640,511240,"Once the user submits that form, accessing your register route"],[511240,515570,"via the POST request method, what you should do is check for possible errors."],[515570,519880,"And if there are no errors, then you can insert the new user into the user's"],[519880,523190,"table and log the user in after that."],[523190,525310,"So let's start with that registration form."],[525310,528340,"How will you display a registration form to the user?"],[528340,530350,"Well in order to do that, you'll likely need"],[530350,535660,"to create a new template that contains the HTML for that registration form."],[535660,538330,"And recall that you can find all of your templates inside"],[538330,541810,"of that templates folder in your finance directory."],[541810,545230,"You can use the login.HTML template that we've already"],[545230,549050,"provided to you as inspiration for what this new template might look like."],[549050,551710,"And remember, the HTML form that you create"],[551710,555280,"should contain input fields that allow the user to choose a username,"],[555280,560580,"choose a password, and then verify that they typed in their password correctly."],[560580,564080,"Once the user types in information into that registration form"],[564080,566150,"and submits it to your website application,"],[566150,570290,"your Python code is going to need to access whatever it is the user typed"],[570290,572810,"in to that registration form."],[572810,576020,"In order to do that, you can use some syntax like this."],[576020,579440,"If you have an input field inside of your HTML code"],[579440,583940,"with an attribute that says name equals password, for example."],[583940,586340,"Well then inside of your Flask application,"],[586340,589490,"inside of your Python code, you can use this syntax here,"],[589490,594560,"request.form.get, and then the name of that input field, in this case,"],[594560,595250,"password."],[595250,597320,"And that will allow you to access whatever"],[597320,599750,"it is the user typed into the form, and then"],[599750,602720,"submitted via the POST request method."],[602720,605090,"You can do that for the password, for the confirmation,"],[605090,607880,"and for the user's username as well."],[607880,611540,"Inside of your route, you'll also want to check for possible errors."],[611540,615420,"What might go wrong when the user is trying to register for a new account"],[615420,619430,"Well, if any field is left blank, if the user didn't type in a username,"],[619430,622370,"didn't provide a password, or didn't confirm their password,"],[622370,625940,"you should return an apology, letting the user know that each of those fields"],[625940,627230,"was required."],[627230,629570,"If the two passwords don't match with each other,"],[629570,632310,"you should also let the user know that as well."],[632310,635900,"And finally, if the user name is already taken by some other user"],[635900,639260,"already inside of your database, you should apologize to the user"],[639260,641690,"and let them know about that as well."],[641690,645290,"Once you've confirmed that there are no errors with what the user provided"],[645290,649430,"to you, you'll want to add the user to the user's table of your database,"],[649430,652250,"but you should keep security in mind as you do so."],[652250,657530,"In particular, remember the databases should never store plaintext passwords."],[657530,660380,"Instead, you should first generate a hash"],[660380,663530,"of the user's password using the Generate password hash"],[663530,664850,"function provided to you."],[664850,668750,"And then store the hash of the password inside of the database instead"],[668750,671530,"of the plaintext password itself."],[671530,673780,"Once you've generated a hash of the password,"],[673780,677920,"then you can add all of this information into the database"],[677920,681850,"by using db.execute in order to run an insert statement"],[681850,685010,"to add a new row into the user's table."],[685010,688150,"And remember again, you can use the question mark symbol"],[688150,692110,"to stand in as a placeholder for a value that you might not know yet at the time"],[692110,693640,"that you're writing this code."],[693640,696650,"Once the user has been added into the user's table,"],[696650,698140,"then you can log the user in."],[698140,703030,"Setting session, bracket user ID, equal to the new ID for whatever user"],[703030,705170,"you've just added to the database."],[705170,708020,"Once the user has been able to register for an account,"],[708020,711820,"next, you'll want to allow the user to look up stock quotes."],[711820,715510,"In your quote route, you should also accept to request methods,"],[715510,717280,"GET and POST."],[717280,720370,"If a user tries to access your quote route via GET,"],[720370,723850,"you should display a form that lets the user request a stock that they"],[723850,725260,"would like to look up."],[725260,728890,"And when the form is submitted via POST, then your application"],[728890,732430,"should look up that stock symbol by calling the lookup function"],[732430,735130,"and display the results back to the user."],[735130,736930,"How does the lookup function work?"],[736930,739240,"Will recall that lookup is a function that we have"],[739240,741940,"defined for you inside of helper.py."],[741940,746230,"And it takes a stock symbol and returns a stock quote."],[746230,749440,"If lookup was able to successfully look up the stock quote,"],[749440,752410,"then the function is going to return a dictionary back to you"],[752410,756730,"with fields to represent the name of the stock, the symbol for that stock,"],[756730,758860,"and what the stock's current price is."],[758860,762160,"But it's also possible that the lookup will not be successful."],[762160,766810,"If for example, the user tries to type in a stock symbol that doesn't exist."],[766810,769000,"In that case, you should return an apology"],[769000,774580,"to the user letting them know that particular stock symbol doesn't exist."],[774580,776580,"But if the lookup is successful, what you'll"],[776580,781140,"want to do is display an HTML page to the user that contains information"],[781140,783900,"about the stock, the name of the stock, and what"],[783900,786510,"the current price of that stock is."],[786510,791970,"In order to do so, you'll need to pass in values into your HTML template."],[791970,793720,"And how might you do that?"],[793720,797580,"Well, in your Python code, you can use the render template function"],[797580,800580,"to render an HTML template, but you can also"],[800580,805290,"provide variables into this template that's known as a jinja template."],[805290,809310,"For example, in this code here, I'm rendering Hello.HTML,"],[809310,811740,"but giving this template access to a variable"],[811740,815280,"called name, which in this case is equal to Brian."],[815280,819390,"And then inside of my jinja template, I can use double curly braces"],[819390,820900,"around the variable name."],[820900,823500,"In this case, name, in order to display whatever"],[823500,829530,"was passed in from the render template function here inside of my HTML."],[829530,832440,"Likewise, you could do something like this as well in order"],[832440,836910,"to display the current price of whatever stock the user has just looked up."],[836910,839940,"In addition to allowing users to look up a stock quote,"],[839940,843600,"we also want to allow users to buy a new stock."],[843600,847770,"In order to do that, your buyer out will also accept to request methods GET,"],[847770,848550,"and POST."],[848550,851070,"Where when the user gets this page they should"],[851070,853950,"be shown a form that allows the user to buy a stock."],[853950,858300,"And when the user submits that form, you should purchase the stock as long"],[858300,860640,"as the user can actually afford it."],[860640,864750,"Your HTML form should allow the user to type in what stock symbol"],[864750,869160,"they would like to buy, in addition to how many shares they would like to buy."],[869160,872940,"Once the user submits the form, you'll want to check it for valid input."],[872940,876810,"For example, a user shouldn't be allowed to by a negative number of shares."],[876810,881580,"And you'll also want to make sure that the stock symbol is actually valid."],[881580,884280,"But before you can add this data into your database,"],[884280,887070,"you'll likely need to create one or more new tables"],[887070,889170,"to keep track of this new information."],[889170,891930,"Right now the finance.db database we provide"],[891930,894600,"to you includes a table for keeping track of users"],[894600,896910,"and how much cash they have but doesn't include"],[896910,900570,"any tables for keeping track of what stocks each of those users"],[900570,901900,"actually owns."],[901900,904980,"So you'll first want to give some thought as to what new tables"],[904980,907230,"you'll want to add to this database, and what"],[907230,910020,"fields that table or tables will have."],[910020,914430,"You can use the CREATE TABLE statement to add a new table to the database,"],[914430,918660,"and you'll want to be sure to use appropriate SQL types as you do so."],[918660,921280,"There are multiple correct ways to implement this."],[921280,924120,"So decide for yourself what kind of database design"],[924120,928110,"makes the most sense to you and is most logical for this particular web"],[928110,929190,"application."],[929190,932160,"Once you're happy with the tables inside of your database,"],[932160,936390,"you'll want to add this new stock purchase to the user's portfolio."],[936390,939360,"First, remember that you'll need to make sure the user has enough cash"],[939360,940620,"to afford the stock."],[940620,943470,"If the user can't afford the number of shares of the stock"],[943470,946170,"that they're trying to purchase, you should return an apology"],[946170,948210,"to the user letting them know that they don't"],[948210,950790,"have enough cash for this purchase."],[950790,953910,"But assuming the user does have enough cash for the purchase,"],[953910,957270,"you should run whatever SQL statement you need on your database"],[957270,962460,"to purchase that stock, and also be sure to update that user's cash to reflect"],[962460,964720,"the purchase that they've just made."],[964720,966870,"Once you've implemented this feature, users"],[966870,971010,"should be able to log into your web application and buy new stocks."],[971010,974250,"But once users have bought those new stocks it would be nice"],[974250,977220,"if there was a place where users could view all of the stocks"],[977220,980580,"they've already bought, and that's what you'll do in this next feature."],[980580,985230,"The index page of your application should display an HTML table"],[985230,988110,"with all of the information about all of the stocks"],[988110,991410,"that the current user owns, how many shares of each stock"],[991410,994950,"the user owns, the current price of each of those stocks,"],[994950,998100,"as well as the total value for each of those holdings."],[998100,1001490,"For example, if the user has multiple of a certain stock,"],[1001490,1004400,"their total value for that stock will be higher."],[1004400,1008030,"You should also display the user current cash balance on this page,"],[1008030,1010760,"as well as their grand total of the combination"],[1010760,1013280,"of the value of all of their stocks and whatever"],[1013280,1016510,"cash they happen to have on hand."],[1016510,1019810,"As you create this HTML table, you'll realize that there's"],[1019810,1022000,"some HTML that you're going to repeat."],[1022000,1024880,"For example, you might have one row for one stock,"],[1024880,1027579,"and a very similar row for another stock."],[1027579,1032050,"And again and again for each of the stocks that the user currently owns."],[1032050,1034540,"In order to render this as HTML, it might"],[1034540,1036640,"be nice to have some kind of a loop where"],[1036640,1041140,"you're looping over all of the stocks, adding 1 row of the table for each"],[1041140,1043690,"of the stocks the user currently owns."],[1043690,1048560,"And it turns out we can use loops like this inside of a jinja template."],[1048560,1052750,"In this example, we return render template Hello.HTML,"],[1052750,1058420,"and then also pass into that HTML template a list of Python dictionaries."],[1058420,1062110,"Then inside of our jinja template we're able to loop over"],[1062110,1065560,"each one of those dictionaries for contact in contacts"],[1065560,1069310,"and then use dot notation inside of the template to access"],[1069310,1071380,"any of the fields of that dictionary."],[1071380,1075860,"Dot name or dot house, in this particular example."],[1075860,1079270,"And you might imagine doing something similar in your own index page."],[1079270,1081940,"First, using the database and the lookup function"],[1081940,1084880,"to look up all of the information you need about the stocks"],[1084880,1088630,"that the current user has, and then looping over all of them"],[1088630,1093640,"inside of your HTML template displaying one row of a table for each stock"],[1093640,1095380,"that the user currently owns."],[1095380,1098080,"Users now have the ability to buy new stocks"],[1098080,1101210,"and see an index of all of the stocks they currently own."],[1101210,1105390,"So next, let's give users the ability to sell a stock."],[1105390,1108330,"When the user tries to request your cell route via GET,"],[1108330,1111940,"you should display a form that allows the user to choose which of the stocks"],[1111940,1113940,"they currently own that they would like to sell,"],[1113940,1117390,"and how many shares of that stock they would like to sell."],[1117390,1120390,"And when the user submits that form via POST,"],[1120390,1123000,"you should check for possible errors, and then"],[1123000,1125910,"sell the specified number of shares of that stock,"],[1125910,1130470,"and update the user's cash balance to reflect that sale."],[1130470,1132330,"What kind of errors might come up?"],[1132330,1135330,"Well for example, you want to make sure that the user actually"],[1135330,1138270,"has the number of shares of stock they're trying to sell,"],[1138270,1142260,"and you want to make sure that the user can't sell a negative number of shares."],[1142260,1145110,"With all of these features, users now have the ability"],[1145110,1147000,"to buy and sell stocks."],[1147000,1149310,"But let's now give users the ability to see"],[1149310,1154140,"a history of all of their previous transactions on your application."],[1154140,1156570,"When the user accesses the history route,"],[1156570,1159510,"you should display to the user in HTML table"],[1159510,1163740,"with all of their previous transactions, with one row for every buy"],[1163740,1168090,"or sell including information about what stock was bought or sold,"],[1168090,1170790,"how many shares of that stock were bought or sold,"],[1170790,1173880,"and when that transaction actually took place."],[1173880,1177480,"How you implement the history functionality in your web application"],[1177480,1181410,"will depend on how you've designed your database, what tables there are,"],[1181410,1183510,"and what columns each table has."],[1183510,1186570,"And it's possible that you might need to revisit and revise"],[1186570,1191170,"your existing database structure to allow for this new history feature."],[1191170,1194490,"Once you've implemented all of those features, the last thing you'll do"],[1194490,1197040,"is add a personal touch to your website application"],[1197040,1200160,"by deciding a new feature of your own that you'd like to implement"],[1200160,1202680,"and adding it to CS 50 finance."],[1202680,1206280,"For example, you might allow users to change their password,"],[1206280,1210660,"or you might allow users to add new cash into their account,m or you can choose"],[1210660,1211890,"something else entirely."],[1211890,1215040,"Deciding on a feature you would like for this web application to have"],[1215040,1217800,"and designing new route, templates, or tables as"],[1217800,1220940,"needed to make that functionality possible."],[1220940,1223820,"Once you've completed that you'll have a fully functional web"],[1223820,1227690,"application, allowing users to register, sign into their account,"],[1227690,1231710,"buy and sell stocks, and see a history of all of their transactions."],[1231710,1235660,"My name is Brian, and this was CS 50 finance."]]}}}</script>
<script>
'use strict';
const {rows,tracks}=JSON.parse(document.querySelector('#records').textContent);
const id=s=>document.getElementById(s);
const weeks=[...new Set(rows.map(r=>String(r.week)))];
const topics=['Scratch','C','数组','算法','内存','数据结构','Python','SQL','HTML、CSS、JavaScript','Flask'];
const weekName=w=>String(w)==='final'?'期末项目':'第 '+w+' 周 · '+topics[w];
const nodes=(tag,cls,txt)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(txt)n.textContent=txt;return n;};
function anchor(txt,url){const a=nodes('a','',txt);a.href=url;a.target='_blank';a.rel='noopener';return a}
function option(sel,value,txt){sel.add(new Option(txt,value));}
let chosen=null, quality='mp4', lang='zh', media=null;
option(id('week'),'all','全部周次');weeks.forEach(w=>option(id('week'),w,weekName(w)));
id('week').value='4';
id('week').onchange=()=>{
 const week=id('week').value;
 if(week!=='all' && String(chosen?.row.week)!==week){
   const row=rows.find(r=>String(r.week)===week);
   chosen={row,video:row.videos.find(v=>!v.spoiler)??null};
   renderPlayer();
 }
 renderList();
 id('list').scrollTop=0;
};
function pick(row,video){
 chosen={row,video};renderList();renderPlayer();
 if(innerWidth<=850) id('panel').scrollIntoView({block:'start'});
}
function navButton(row,v){
 const b=nodes('button','choice',v.label);b.type='button';b.dataset.video=v.id;
 b.setAttribute('aria-current',String(chosen?.video===v));b.onclick=()=>pick(row,v);return b;
}
function renderList(){
 const list=id('list'),selectedWeek=id('week').value;const oldScroll=list.scrollTop;
 const opened=new Set([...list.querySelectorAll('details[open]')].map(el=>el.dataset.key));list.replaceChildren();
 let last=null;
 rows.forEach((row,idx)=>{
   if(selectedWeek!=='all' && selectedWeek!==String(row.week))return;
   if(selectedWeek==='all' && last!==row.week){list.append(nodes('div','weekhead',weekName(row.week)));last=row.week;}
   const g=nodes('section','group'),head=nodes('div','ghead');head.append(nodes('h3','',row.title),anchor('题目 ↗',row.page));g.append(head);
   if(!row.videos.length){const b=nodes('button','noentry','阅读题目说明');b.type='button';b.onclick=()=>pick(row,null);b.setAttribute('aria-current',String(chosen?.row===row&&!chosen.video));g.append(b);}
   const details=nodes('details');details.dataset.key=String(idx);details.append(nodes('summary','','查看官方解答（含答案）'));
   row.videos.forEach(v=>{if(v.spoiler){details.append(navButton(row,v));}else{g.append(navButton(row,v));}});
   if(details.children.length>1){details.open=opened.has(String(idx)) || (chosen?.row===row && chosen.video?.spoiler);g.append(details);}
   list.append(g);
 });list.scrollTop=oldScroll;
}
function seconds(ms){return ms/1000;}
function saveSub(cues,name){
 function time(ms){const d=new Date(ms);return d.toISOString().slice(11,23).replace('.',',');}
 const txt=cues.map(([a,b,t],i)=>(i+1)+'\r\n'+time(a)+' --> '+time(b)+'\r\n'+t+'\r\n').join('\r\n');
 const url=URL.createObjectURL(new Blob(['\uFEFF',txt],{type:'application/x-subrip;charset=utf-8'}));
 const a=document.createElement('a');a.download=name;a.href=url;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);
}
function renderPlayer(){
 const {row,video:v}=chosen;
 if(media){media.pause();media.removeAttribute('src');media.load();media=null;}
 const screen=id('screen'),controls=id('controls'),note=id('note'),error=id('error');screen.replaceChildren();controls.replaceChildren();error.textContent='';
 id('where').textContent=weekName(row.week);
 id('title').textContent=row.title + (v && v.label!=='思路引导'?' · '+v.label:'');
 note.textContent=row.note||'';note.hidden=!note.textContent;
 if(!v?.mp4){
    const box=nodes('div','empty'),inside=nodes('div');inside.append(nodes('strong','',v?'尚无已核实的直链':'这道题以文字说明为主'),anchor('打开官方题目 ↗',row.page));box.append(inside);screen.append(box);return;
 }
 const trackData=tracks[v.id];const movie=nodes('video');movie.controls=true;movie.playsInline=true;movie.preload='metadata';screen.append(movie);media=movie;
 movie.setAttribute('aria-label',row.title+' '+v.label);
 movie.src=(quality==='low'&&v.low)?v.low:v.mp4;
 const languages={};if(trackData){for(const [key,title,langCode] of [['zh','简体中文','zh-CN'],['en','English','en']]){
    if(!trackData[key]?.length)continue;
    const track=movie.addTextTrack('subtitles',title,langCode);track.mode='hidden';
    for(const [start,end,text] of trackData[key]){track.addCue(new VTTCue(seconds(start),seconds(end),text.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')));}
    languages[key]=track;
 }}
 const activate=()=>{for(const [k,tr] of Object.entries(languages))tr.mode=k===lang?'showing':'disabled';};
 activate();movie.addEventListener('loadedmetadata',activate,{once:true});
 movie.addEventListener('error',()=>{if(media===movie)error.textContent='视频暂时无法加载。可以切换到 360p，或点下方「打开 MP4」在浏览器中播放。';});
 const opts=nodes('div','controls');
 const label=nodes('label','','字幕'),sels=nodes('select');sels.setAttribute('aria-label','字幕');if(languages.zh)option(sels,'zh','简体中文');if(languages.en)option(sels,'en','English');option(sels,'off','关闭');
 sels.value=languages[lang]?lang:'off';sels.onchange=()=>{lang=sels.value;activate();};label.append(sels);opts.append(label);
 const qlabel=nodes('label','','画质'),qs=nodes('select');qs.setAttribute('aria-label','画质');option(qs,'mp4','720p');if(v.low)option(qs,'low','360p');qs.value=v.low?quality:'mp4';qlabel.append(qs);opts.append(qlabel);
 const links=nodes('div','links'),direct=anchor('打开 MP4 ↗',movie.src);links.append(direct,anchor('官方题目 ↗',row.page));
 qs.onchange=()=>{const t=movie.currentTime,playing=!movie.paused;quality=qs.value;error.textContent='';
    movie.addEventListener('loadedmetadata',()=>{if(Number.isFinite(t)&&t>0)movie.currentTime=t;activate();if(playing)movie.play().catch(()=>{});},{once:true});
    movie.src=quality==='low'?v.low:v.mp4;direct.href=movie.src;};
 if(trackData?.zh?.length){const down=nodes('button','linkbtn','下载中文字幕 .srt');down.type='button';down.onclick=()=>saveSub(trackData.zh,row.title+' - '+v.label+'.zh-CN.srt');links.append(down);}
 if(v.srt)links.append(anchor('官方英文字幕 ↗',v.srt));
 controls.append(opts,links);
 if(trackData)controls.append(nodes('p','subnote',trackData.edited?'本段中文字幕已按英文原字幕逐段翻译校对。':'本段中文字幕为离线机器翻译，遇到术语可切换到 English 对照。'));
}
const initial=rows.find(r=>r.title==='Volume');chosen={row:initial,video:initial.videos[0]};renderList();renderPlayer();
</script>
</html>
