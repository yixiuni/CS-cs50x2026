a little bit lower."],[89980,93880,"And one thing that we can do is just take the red, green, and blue values"],[93880,98120,"and calculate the average pixel value for any of these individual channels"],[98120,102478,"and use that as the new value for red, green, and blue."],[102478,104020,"What does this look like in practice?"],[104020,107350,"Well, let's take this shade of green, for example, where the red value is"],[107350,113230,"equal to 50, the green value is equal to 190, and the blue value is equal to 90."],[113230,117250,"If we take these three channel values and take the average of the three,"],[117250,119980,"the average is 110."],[119980,123280,"So for our new pixel that we're going to convert to grayscale,"],[123280,127840,"we're going to take the red value, set it equal to 110, take the green value,"],[127840,133240,"set it equal to 110, and take the blue value and set it equal to 110 as well."],[133240,137500,"The result is a shade of gray that approximately matches the brightness"],[137500,140350,"or darkness of the original pixel."],[140350,143170,"Of course, it's possible that depending on the original color"],[143170,147010,"values, the average value you get might not be a whole number."],[147010,150820,"In this case, the average is 109.67."],[150820,153040,"Remember that each of red, green, and blue"],[153040,157670,"need to be integer values in the range from 0 to 255."],[157670,160390,"So if the average value is not an integer,"],[160390,163330,"you'll want to make sure to round it to the nearest integer"],[163330,167410,"in order to determine what the new value actually should be."],[167410,170650,"So that's how to take one pixel and convert it to grayscale."],[170650,173200,"But how are you going to do it for the entire image?"],[173200,176360,"Well, you could imagine looping through the image one row at a time,"],[176360,179900,"starting with the first row, then going to the next row, so on and so forth,"],[179900,182650,"and converting each row to grayscale."],[182650,186760,"Where for each row, you'd iterate one more time, using yet another loop,"],[186760,190490,"starting with the first pixel in the row, then the second pixel in the row,"],[190490,191800,"so on and so forth."],[191800,194650,"And for each pixel, what you'll likely want to do"],[194650,196870,"is calculate what the average pixel value"],[196870,199840,"is by taking the red channel value, the green channel"],[199840,203530,"value, and the blue channel value and averaging them together."],[203530,205510,"Then, once you've calculated the average,"],[205510,207470,"you can set each of the color values--"],[207470,209380,"each of red, green, and blue--"],[209380,211490,"to whatever that average value is--"],[211490,214790,"of course, making sure to round it to the nearest integer."],[214790,217280,"After you've implemented the grayscale function,"],[217280,219410,"you should be able to try the filter program."],[219410,223070,"After you make the filter program, you can run ./filter,"],[223070,225740,"passing in -g as a command line argument,"],[225740,228800,"indicating that you'd like to apply the grayscale filter,"],[228800,233270,"passing in an input file as infile.bmp or whatever the file name happens"],[233270,237410,"to be, and then specifying the name of the new file you'd like to produce"],[237410,238370,"as output--"],[238370,240720,"outfile.bmp, for example."],[240720,243740,"If you do that and pass it an input file in color,"],[243740,246470,"if you've implemented the grayscale function successfully,"],[246470,249110,"after you run the program, you open up the out file,"],[249110,252920,"you should see the same photo, but converted to grayscale."],[252920,254060,"My name is Brian."],[254060,256810,"And this was grayscale."]]},"m0_vouQLufc":{"edited":true,"zh":[[500,1770,"接下来是 sepia，棕褐色滤镜。"],[1770,11730,"你要在 sepia 函数里给位图换上红褐色调， 让它看起来像一张老照片。"],[11730,13090,"这种效果怎么做呢？"],[13090,17610,"要把每个像素都换成与它对应的棕褐色。"],[17610,19320,"具体是什么样呢？"],[19320,30600,"比如这个绿色像素，转换之后， 红色分量是 183，绿色是 163，蓝色是 127。"],[30600,33370,"这些数是怎么算出来的呢？"],[33370,45540,"有一组棕褐色转换公式。 给定原来的红、绿、蓝三个分量，就能算出新的三个分量。"],[45540,47550,"来看看这个算法。"],[47550,50790,"要计算转换后的红色分量，"],[50790,55260,"先取原来的红色分量乘以 0.393，"],[55260,59610,"加上原来的绿色分量乘以 0.769，"],[59610,63630,"再加上原来的蓝色分量乘以 0.189。"],[63630,70860,"新的绿色和蓝色分量也各有一道类似的公式。"],[70860,73830,"再拿刚才的绿色像素举例。"],[73830,80550,"取出它原来的红、绿、蓝三个分量，"],[80550,85530,"将这三个原始值代入对应的公式，"],[85530,92670,"就能得出变成棕褐色后，三个分量各应该是多少。"],[92670,98580,"不过，代入公式之后，得到的值往往带有小数。"],[98580,103193,"还记得吗？红、绿、蓝三个通道的取值都必须是整数。"],[103193,109830,"所以，要把计算结果四舍五入到最接近的整数。"],[109830,112920,"还有哪些特殊情况要留意？"],[112920,122610,"比如这个像素，原本的红色分量是 200，绿色是 240，蓝色是 190。"],[122610,132590,"用同样的公式计算棕褐色的三个分量，红色算出来是 299.07，"],[132590,138480,"绿色是 266.36，蓝色是 207.45。"],[138480,141120,"这些数当然也要四舍五入。"],[141120,142720,"但这样一来，还有一个问题。"],[142720,152320,"每个分量都得是整数，而且必须落在 8 位能表示的范围内。"],[152320,157590,"也就是最小为 0，最大为 255。"],[157590,162870,"可是，这里红色和绿色的值都超过了 255。"],[162870,167040,"红色是 299，绿色是 266。"],[167040,182150,"所以，只要某个分量超过 255，就把它设为 255。 这样仍然只需 8 位就能存下它。"],[182150,184940,"把这些步骤连起来，算法是什么样呢？"],[184940,193450,"图像是个二维像素数组。对每个像素， 都用棕褐色转换公式计算新的颜色分量。"],[193450,199640,"注意，用这个像素原来的红、绿、蓝分量，算出三个新的分量。"],[199640,208900,"最后要确保每个通道的结果都是 0 到 255 之间的整数，包含两端。"],[208900,218890,"写好 sepia 函数后，运行 ./filter， 加上参数 -s；s 代表 sepia。"],[218890,223030,"然后依次给出输入文件名和输出文件名，就能测试了。"],[223030,229750,"如果一切正常，输出的照片就会带上棕褐色调。"],[229750,233200,"我是 Brian。以上就是 sepia。"]],"en":[[500,1770,"Next up is sepia."],[1770,3780,"In the sepia function, your task is going"],[3780,6630,"to be to implement a filter that takes a bitmap image"],[6630,8970,"and converts it to sepia, giving everything"],[8970,11730,"a reddish brown old-time feel to it."],[11730,13090,"How are you going to do that?"],[13090,17610,"Well, you're going to take each pixel and convert it to its sepia equivalent."],[17610,19320,"So what does that look like?"],[19320,21840,"If we take this green pixel, for example, it"],[21840,27960,"has a sepia equivalent wear the red value is 183, the green value is 163,"],[27960,30600,"and the blue value is 127."],[30600,33370,"But where did these numbers actually come from?"],[33370,35520,"Well, it turns out that there's a sepia formula--"],[35520,38860,"an algorithm that you can use that takes the original red, green,"],[38860,42510,"and blue values and determines what the new red, green, and blue values"],[42510,45540,"should be in the sepia version of that pixel."],[45540,47550,"And the algorithm looks like this."],[47550,50790,"We compute the amount of red in the sepia version of the pixel"],[50790,55260,"by taking the original amount of red and multiplying it by 0.393,"],[55260,59610,"taking the original amount of green and multiplying it by 0.769,"],[59610,63630,"and taking the original amount of blue and multiplying it by 0.189."],[63630,66060,"And there are similar formulas for calculating"],[66060,68340,"how much green should be in the resulting pixel"],[68340,70860,"and how much blue should be in the resulting pixel."],[70860,73830,"So given a pixel like our green pixel from before,"],[73830,77430,"if we take the original color values-- the original amount of red,"],[77430,80550,"the original amount of green, and the original amount of blue--"],[80550,82530,"then we can compute what the new values should"],[82530,85530,"be just by plugging in all of those original values"],[85530,89340,"into the formula to calculate how much red, green, and blue"],[89340,92670,"there should be in the sepia version of the same pixel."],[92670,94650,"Of course, when you run this formula, you'll"],[94650,98580,"probably notice that the output you get is not going to be an integer."],[98580,101550,"And recall that every channel value-- red, green, and blue--"],[101550,103193,"needs to be an integer value."],[103193,105360,"So what you'll likely want to do is be sure to round"],[105360,107880,"that number to the nearest whole number to make sure"],[107880,109830,"that it is actually an integer."],[109830,112920,"What other corner cases might you run into, though?"],[112920,116790,"Well, imagine this pixel, where the original red value is 200,"],[116790,122610,"the original green value is 240, and the original blue value is 190."],[122610,125040,"When you run through this formula, applying the formula"],[125040,127110,"to calculate how much red, green, and blue"],[127110,132590,"there should be in the sepia pixel, what you get is a red value of 299.07,"],[132590,138480,"a green value of 266.36, and a blue value of 207.45."],[138480,141120,"Of course, we'll want to round these as we did before."],[141120,142720,"But there is still a problem."],[142720,146940,"Remember that each of red, green, and blue not only need to be integer values"],[146940,149670,"but they also need to be values in a valid range,"],[149670,152320,"representable by eight bits of memory."],[152320,154470,"In other words, the minimum value is zero."],[154470,157590,"And the maximum value is 255."],[157590,162870,"But in this case, you'll notice that the red and green values both exceed 255."],[162870,167040,"The red value is to 299 and the green value is to 266."],[167040,171470,"So in this case, if we ever get channel values that exceed 255,"],[171470,176820,"we'll want to make sure to cap them at 255, setting those values to 255,"],[176820,182150,"to make sure that we can still represent that color value using only eight bits."],[182150,184940,"So what does this algorithm actually look like?"],[184940,187450,"Well, for each pixel in our two-dimensional array"],[187450,189670,"of pixels that represents our image, we're"],[189670,193450,"going to calculate each new color value using the sepia formula,"],[193450,196630,"using the original amounts of red, green, and blue to figure out"],[196630,199640,"what the new amounts of red, green, and blue should be."],[199640,201460,"But in particular, we'll want to make sure"],[201460,207040,"that the result we get for each channel value is an integer between 0 and 255,"],[207040,208900,"inclusive."],[208900,212050,"Once you've written the sepia function, you should be able to test it"],[212050,215230,"by running your filter program by calling ./filer,"],[215230,218890,"passing in the -s command line argument, s for sepia,"],[218890,222120,"specifying what the input file is and what file you'd like to produce"],[222120,223030,"as output."],[223030,226870,"And if all goes well, you should see your original image converted"],[226870,229750,"to the sepia version of the same image."],[229750,230860,"My name is Brian."],[230860,233200,"And this was sepia."]]},"dlWpx8gQdFo":{"edited":true,"zh":[[120,5160,"下一个要实现的是镜像滤镜 reflect。"],[5160,8700,"它会把原图左右翻转，就像照镜子一样。"],[8700,10210,"这个效果要怎么做呢？"],[10210,13920,"还记得吗？每张图像其实就是一个二维数组，"],[13920,18475,"分成若干行，每一行又包含许多个像素。"],[18475,20100,"我们可以给每一行编号。"],[20100,23850,"比如这张图里有第 0、1、2、3、4、5 行。"],[23850,27240,"把这张图左右翻转时，会发生什么？"],[27240,31560,"各行仍然按原来的顺序排列，变的是行内像素的位置。"],[31560,35370,"第 0 行仍在最上面，只是它内部左右翻转了。"],[35370,39970,"第 1 行仍在第二行，它的像素也左右翻转了。其余行同理。"],[39970,47430,"所以，要得到整张图的镜像， 只需对每一行做同样的处理。"],[47430,51000,"来看这一行，里面各个像素的颜色可以不同。"],[51000,56730,"左右翻转以后，原本最左边的像素到了最右边，"],[56730,62640,"原本左数第二个像素到了右数第二个的位置，以此类推。"],[62640,66390,"如果一行里的像素个数是奇数，就像这里这样，"],[66390,71820,"那么正中间的像素就留在原位。图中它的下标是 5。"],[71820,73950,"如果像素个数是偶数呢？"],[73950,81490,"这样一来，每个像素都会跟同一行另一端 与它左右对称的像素交换位置。"],[81490,84480,"具体要实现怎样的算法呢？"],[84480,89550,"对每一行，都把左右对称位置上的两个像素调换一下。"],[89550,92940,"最左边的换到最右边，最右边的也换到最左边。"],[92940,98700,"一行会处理了，就可以用循环把这个操作应用到每一行。"],[98700,103530,"先交换第一行里的像素，再交换第二行、第三行，依次做下去。"],[103530,108480,"写好这个函数后，可以运行 ./filter -r 来测试。"],[108480,113500,"-r 表示使用镜像滤镜，后面依次跟输入文件名和输出文件名。"],[113500,116250,"如果输入的图片是画面上这样，"],[116250,120270,"那么输出的图片就应该是原图左右翻转后的样子。"],[120270,123750,"我是 Brian。以上就是 reflect。"]],"en":[[120,1870,"BRAIN YU: The next filter you'll implement"],[1870,5160,"is a reflection filter, wherein this filter, you'll take an image"],[5160,8700,"and produce the mirror image of that original picture."],[8700,10210,"How are you going to do that?"],[10210,13920,"Well, recall that each image is really just a two dimensional array where"],[13920,18475,"we have rows, and every row has individual pixels inside of that row."],[18475,20100,"We could number the rows in this image."],[20100,23850,"So we have rows 0, 1, 2, 3, 4, and 5, for example."],[23850,27240,"When we take the mirror image of this picture, what really happens"],[27240,31560,"is that the rows stay in the same order, but the pixels in the row switch"],[31560,35370,"places so that row 0 is still at the top, but it's been reflected."],[35370,39970,"Row 1 is still the second row, but it's been reflected, so on and so forth."],[39970,43500,"So what we really need to do in order to take the reflection of an image"],[43500,47430,"is just to take each row and apply the same filter to each row,"],[47430,51000,"taking the individual pixels in that row, which might all be different,"],[51000,54570,"and reflecting them so that the pixel that was originally on the far left"],[54570,56730,"of the row is now in the far right."],[56730,59310,"The pixel that was originally second from the left in the row"],[59310,62640,"is now second from the right so on and so forth."],[62640,66390,"If there are an odd number of pixels, as there are in this particular row,"],[66390,69660,"you'll notice that the middle pixel, the pixel at index 5,"],[69660,71820,"doesn't actually change position."],[71820,73950,"But if there were an even number of pixels,"],[73950,77940,"then every pixel would switch positions with the pixels on the mirror image"],[77940,81490,"side of it on the opposite end of the same row."],[81490,84480,"So what is the algorithm you're actually going to implement here?"],[84480,86220,"Well, for every row, you're going to want"],[86220,89550,"to swap the pixels on horizontally opposite sides"],[89550,92940,"where the far left pixel becomes the far right and vice versa."],[92940,94740,"And once you can do this for one row, you"],[94740,98700,"can repeat this using some sort of loop applying it to every row in the image"],[98700,103530,"swapping the first row, then the second row, third row, so on and so forth."],[103530,108480,"After you've implemented this function, you can test it by running ./filter -r"],[108480,113500,"for the reflect filter then passing in an infile and specifying an outfile."],[113500,116250,"Once you do that, if the input file looks like this,"],[116250,120270,"then the output file should be the reflection of that original image."],[120270,123750,"My name is Brian, and this was reflect."]]},"6opWB7DaFCY":{"edited":true,"zh":[[500,3480,"最后一个要实现的滤镜叫 blur，也就是模糊滤镜。"],[3480,10650,"blur 会把原图处理得柔和一些，让细节显得没那么锐利。"],[10650,14230,"我们放大一点，看看实际效果。"],[14230,18232,"这张是原图，这张是模糊之后的样子。"],[18232,22090,"注意看，细节柔和了，也更难辨认。"],[22090,27720,"那么，什么样的算法能让照片变模糊？"],[27720,32610,"来看这张简单的 6 × 6 图像，里面只有红、蓝两种颜色。"],[32610,35310,"如果把它模糊化，会得到什么？"],[35310,45240,"结果大概是这样：细节变得柔和，线条也没有原先那么清晰。"],[45240,46920,"把它们并排来看。"],[46920,52360,"左边是原图，右边是模糊后的图。"],[52360,55620,"各个像素的颜色稍微变了一点。"],[55620,59970,"原本纯红的像素带上了一点蓝色，"],[59970,64180,"原本纯蓝的像素则带上了一点红色。"],[64180,66340,"这个效果怎么做出来？"],[66340,70080,"这里用的是方框模糊，也叫 box blur。"],[70080,82680,"要计算一个像素的新颜色，取它周围 3 × 3 范围内的九个像素， 包括它自己，把原来的颜色分量分别求平均。"],[82680,88840,"换句话说，这些像素和中心像素最多相差一行、一列。"],[88840,91250,"对这张图来说，这意味着什么呢？"],[91250,96850,"比如，要算出这个像素模糊之后的颜色，"],[96850,106030,"就看这九个像素原来的颜色， 它们离目标像素都不超过一行、一列。"],[106030,113950,"同样，要对这里这个像素做模糊处理， 就取这里九个像素原来的颜色求平均。"],[113950,119500,"但并非图里每个像素的周围，都能凑齐 3 × 3 的九个像素。"],[119500,124400,"比如边缘上的这个像素，要怎么处理？"],[124400,137890,"只取这六个像素来求平均。 在行、列都相差不超过一的范围里，图内只有这六个像素。"],[137890,150860,"再看角落里的像素。这个范围内只有四个像素， 所以就用这四个像素的平均值。"],[150860,159070,"来具体算一遍。我们要给这张图做模糊处理，求这个像素的新值。"],[159070,168310,"要看它自己以及周围的像素。 行和列分别最多相差一格，合起来就是这九个。"],[168310,170140,"放大来看。"],[170140,176980,"蓝色像素的蓝色分量是 255，红色和绿色分量是 0。"],[176980,181930,"另外五个是红色像素，它们的红色分量是 255，绿和蓝都是 0。"],[181930,185780,"中间这个像素模糊后会是什么颜色？"],[185780,191770,"我们要分别算出红色、绿色、蓝色的平均值。"],[191770,196300,"九个像素的红色分量取平均，四舍五入后是 142。"],[196300,200770,"因为其中有五个像素的红色分量是最大值，另外四个是 0。"],[200770,209290,"所有像素的绿色分量都是 0，所以绿色平均值也是 0。 蓝色平均值则是 113。"],[209290,212380,"这里都取最接近的整数。"],[212380,222100,"所以，模糊后中心像素的颜色，就是这九个像素原有颜色的平均值。"],[222100,230040,"新的红色分量是 142，绿色是 0，蓝色是 113。"],[230040,236890,"对原图中的每个像素都这样做，分别计算红、绿、蓝的新值。"],[236890,242880,"每次取行、列都相差不超过一的像素， 用它们原来的颜色求平均。"],[242880,250150,"最后就得到了眼前这张图，也就是模糊版的原图。"],[250150,259410,"处理好每一个像素后，运行 ./filter 测试， 加上 -b 参数，选择模糊滤镜。"],[259410,264480,"再依次指定输入文件和输出文件。"],[264480,270510,"运行之后，你就能用原图生成一张模糊后的图片。"],[270510,274010,"我是 Brian。以上就是 blur。"]],"en":[[500,3480,"BRIAN: Finally, the last filter you'll implement is called Blur."],[3480,6120,"In Blur, your task is going to be to take an image"],[6120,8790,"and create a blurred version of the same image, where"],[8790,10650,"everything is a little bit softer."],[10650,14230,"Let's zoom into this image a little bit to see what this actually looks like."],[14230,16420,"Notice that if this is the original image,"],[16420,18232,"this is what the blurred image looks like."],[18232,20190,"Notice that the details are a little bit softer"],[20190,22090,"and it's a bit tougher to make out."],[22090,24400,"So what does that algorithm actually look like?"],[24400,27720,"How do we take an image and blur it, so to speak?"],[27720,30780,"Well, let's look at this image, a simple six by six image,"],[30780,32610,"where we have red and blue."],[32610,35310,"And what would it look like if we were to blur the image?"],[35310,37770,"Well, the blurred image might look a little something"],[37770,40320,"like this, where the details are a bit softer"],[40320,42780,"and you can't quite make out the lines as crisply"],[42780,45240,"or as sharply as you could before."],[45240,46920,"You can look at them side by side here."],[46920,49860,"On the left is the original image, and on the right"],[49860,52360,"is the blurred version of the same image."],[52360,55620,"You'll notice that the pixels have changed their color values slightly."],[55620,59970,"The pixels that were originally just pure red now look a little more blue,"],[59970,64180,"and the pixels that were originally blue now look a little more red."],[64180,66340,"So how do we actually do this?"],[66340,70080,"Well, the type of blur we're going to do is what's called a box blur."],[70080,73380,"And to implement a box blur, we're going to compute the new value"],[73380,78750,"for a pixel by taking the average of the old color values of all of the nine"],[78750,82680,"pixels that form a grid around that original pixel,"],[82680,84960,"in other words, all of the pixels that are within one"],[84960,88840,"row and one column of the original pixel."],[88840,91250,"What does that mean for an image like this?"],[91250,93550,"Well if we take this pixel, for example, and we"],[93550,96850,"want to compute its new color value in the blurred image,"],[96850,100960,"we're going to do that by looking at the original color values of these nine"],[100960,106030,"pixels, the pixels that are within one row and one column of that pixel."],[106030,109630,"Likewise, to determine the blurred version of this pixel,"],[109630,112780,"we're going to take the average of the original color values of these nine"],[112780,113950,"pixels."],[113950,117520,"Of course, not every pixel in our image has nine pixels that"],[117520,119500,"form a three by three grid around it."],[119500,122830,"Let's consider an edge case, for example, like this pixel."],[122830,124400,"What happens now?"],[124400,127090,"Well, instead of averaging nine pixels to get the new color"],[127090,129460,"value for this pixel, we're instead going"],[129460,132430,"to average these six color values, because these six"],[132430,137890,"pixels are the only ones within one row and one column of that original pixel."],[137890,141160,"And likewise, if we look at this pixel down in the corner,"],[141160,144790,"we're going to compute its new value by taking the average of these four"],[144790,148330,"pixels, the only pixels that are within one row and one"],[148330,150860,"column of this particular pixel."],[150860,154450,"So let's take a look at an example in a little more detail by calculating"],[154450,159070,"the new value for this pixel if we were to try and blur this image."],[159070,162130,"In order to do so, we need to look not just at this pixel,"],[162130,165730,"but at all of the pixels within one row and one column of it, which"],[165730,168310,"would be this grid of nine pixels."],[168310,170140,"Let's take a look at them in more detail."],[170140,173620,"Notice that the blue pixels have a blue value of 255"],[173620,176980,"and a red and green value of 0, and the red pixels, of which there"],[176980,181930,"are five of them, have a red value of 255 and a green and blue value of 0."],[181930,185780,"So what are we going to do to filter the pixel in the middle here?"],[185780,188650,"Well, what we're going to do is calculate the average amount of red,"],[188650,191770,"the average amount of green, and the average amount of blue."],[191770,196300,"The average amount of red across all nine of these pixels is 142."],[196300,199240,"Five of the pixels have the maximum amount of red and four of them"],[199240,200770,"have no red."],[200770,204010,"As for green, none of these pixels have any green at all,"],[204010,206260,"so the average amount of green is 0."],[206260,209290,"And the average amount of blue is 113."],[209290,212380,"Again, all of these rounded to the nearest integer."],[212380,216310,"So what that means is that the blurred version of this new middle pixel"],[216310,219700,"is going to be based on the average of the original color values"],[219700,222100,"for all nine of these pixels, which means"],[222100,226570,"it's going to now have a red value of 142, a green value of 0,"],[226570,230040,"and a blue value of 113."],[230040,233850,"If we do that same process for each of the pixels in the original image,"],[233850,236890,"determining the new color values for each of red,"],[236890,240030,"green, and blue, by taking the average of the original color"],[240030,242880,"values for all of the pixels that are within one row and one"],[242880,246180,"column of that pixel, the end result is an image"],[246180,250150,"that looks like this, a blurred version of that original image."],[250150,252540,"And once you've done that for every pixel in the image,"],[252540,256620,"you can test this by running dot slash filter, passing in dash b"],[256620,259410,"to specify that you want to run the blurry filter,"],[259410,262650,"then specifying the input file that you'd like to use as a source,"],[262650,264480,"and of course, the output file."],[264480,267390,"Once you've done that, you should be able to take the original image"],[267390,270510,"and create a blurred version of the same thing."],[270510,274010,"My name is Brian and this with Blur."]]},"vsOsctDernw":{"edited":true,"zh":[[500,8200,"在 Filter 这道题里，你要给图像应用几种不同的滤镜算法。"],[8200,10770,"可以对这张图做哪些处理呢？"],[10770,16379,"首先做一个灰度滤镜，让彩色图片变成黑白图。"],[16379,23880,"接着做镜像滤镜，让图像左右翻转，就像照镜子一样。"],[23880,30330,"模糊滤镜则让画面变得柔和，边缘也没原先那么锐利。"],[30330,39580,"最后是边缘检测滤镜，用来突出图像中物体的边界。"],[39580,47000,"这就是本题的四部分：grayscale、reflect、blur 和 edges。"],[47000,50600,"到底怎么给图像应用滤镜呢？"],[50600,56540,"回想一下，图像就是由许多像素按行和列排列而成的。"],[56540,58700,"怎样表示一个像素？"],[58700,63620,"对屏幕上的每个像素，我们用三个数来表示它的颜色，也就是三个颜色通道。"],[63620,72900,"三个通道分别是红、绿、蓝。每个通道从 0 到 255， 0 表示完全没有这种颜色，255 表示强度最大。"],[72900,77720,"比如，把红色分量设成一个较小的值，像素里就有一点红色。"],[77720,86150,"值越大，红色分量就越强，直到 255 达到最大值。"],[86150,89420,"把它调回 0，这个像素就又变黑了。"],[89420,93950,"为什么通道的取值是 0 到 255？"],[93950,98540,"因为 0 的二进制表示还是 0，"],[98540,103010,"而用二进制表示 255，正好是连续八个 1。"],[103010,110550,"所以红、绿、蓝每个分量都可以用一个字节，也就是 8 位来表示。"],[110550,115610,"三个分量合起来，每个像素就是 3 个字节，也就是 24 位。"],[115610,120270,"你可能听过“24 位色”，指的就是这个。"],[120270,124950,"红色通道控制像素里有多少红色，"],[124950,128750,"绿色通道控制有多少绿色，"],[128750,132800,"蓝色通道则控制有多少蓝色。"],[132800,140300,"这三个通道可以搭配使用，组合出各种各样的颜色。"],[140300,145470,"比如让红色分量多一些，加上一点蓝色，就得到画面上的颜色。"],[145470,152280,"如果有很多绿色、很多蓝色和一点红色，就能调出这种青绿色。"],[152280,163630,"如果三个通道都取最大值 255，就得到一个纯白色的像素。"],[163630,176030,"把许多像素设成适当的颜色，再排在相应的位置上， 就能组成一幅看得出内容的图像。"],[176030,179930,"做这道题要用到哪些文件？"],[179930,184850,"bmp.h 里存放的是位图格式的相关定义，"],[184850,190720,"其中有几个结构体，是做这道题要用到的。"],[190720,196270,"filter.c 提供了运行这些滤镜的主程序。"],[196270,204890,"它负责读入图像，调用函数应用滤镜， 再将处理好的图像作为一个新文件写到磁盘上。"],[204890,212800,"helpers.c 里放的就是实现这道题各个滤镜的函数。"],[212800,224380,"helpers.h 是头文件，声明了 helpers.c 中所有滤镜函数， 给出了各个函数的返回类型和参数类型。"],[224380,235480,"题目还提供了 Makefile。运行 make， 就能把各个文件编译成一个可执行程序，给自己的图片应用滤镜。"],[235480,240740,"其他文件已经写好。你需要动手补完的是 helpers.c。"],[240740,244240,"那么，实现滤镜的代码该怎么写呢？"],[244240,252640,"bmp.h 中已经定义了一个叫 RGBTRIPLE 的结构体， 表示一个带有红、绿、蓝三个分量的像素。"],[252640,255190,"这个结构体有三个成员。"],[255190,259195,"rgbtBlue 表示蓝色分量，"],[259195,262660,"rgbtGreen 表示绿色分量，"],[262660,266680,"rgbtRed 表示红色分量。"],[266680,272860,"每个成员都占一个字节，也就是 8 位。"],[272860,281140,"你要在 helpers.c 中实现四个函数：grayscale、reflect、blur 和 edges。"],[281140,284020,"这几个函数都接收三个参数。"],[284020,295428,"两个整数 height 和 width，以及一个由 RGBTRIPLE 组成的二维数组。 也就是由 height 行、width 列像素组成的图像。"],[295428,306440,"图像就像画面上的二维数组。它的高度和宽度都作为参数传给函数。"],[306440,312550,"假设这个存放图像的二维数组叫 image，那么 image[0] 就表示第一行。"],[312550,318490,"image[1] 表示第二行，image[2] 表示第三行，依此类推。"],[318490,321940,"那要怎么取得最后一行？"],[321940,332180,"图像一共有 height 行，下标从 0 开始， 所以最后一行就是 image[height - 1]。"],[332180,337600,"现在已经能找到某一行了，那怎么找到其中一个特定的像素？"],[337600,342350,"image[0] 是一行，这一行本身又是一个数组。"],[342350,350020,"既然 image[0] 是第一行，image[0][0] 就是这一行的第一个像素。"],[350020,356450,"image[0][1] 是这一行第二个像素，image[0][2] 是第三个，以此类推。"],[356450,360130,"用这种写法能访问图里的任意一个像素。"],[360130,367640,"比如，image[2][3] 表示行下标为 2、列下标为 3 的像素。"],[367640,373090,"找到一个像素后，怎样修改它的颜色？"],[373090,380860,"还记得吗？像素是结构体，其中包含 rgbtRed、rgbtGreen 和 rgbtBlue。"],[380860,383050,"访问结构体的成员要用点号。"],[383050,390580,"比如，给 image[2][3].rgbtRed 赋值，就能更改这个像素的红色分量。"],[390580,393740,"绿色和蓝色分量也可以这样改。"],[393740,404140,"如果将红、绿、蓝三个值都设为 0，这个像素就会变黑。 因为黑色对应的正是三个分量全为 0。"],[404140,419220,"每个滤镜函数都接收这幅二维像素数组作为输入。 你要修改数组里的像素，实现相应的滤镜效果。"]],"en":[[500,3240,"BRIAN YU: In filter, your task is going to be to take an image"],[3240,8200,"and apply a number of different image filtering algorithms to that image."],[8200,10770,"What sort of filters could you apply to this image?"],[10770,14160,"Well, you'll, first, create a grayscale filter that will take this image"],[14160,16379,"and convert it to black and white."],[16379,19980,"Next, you'll implement a reflection filter that will take an image"],[19980,23880,"and get the mirror image or the reflection of that image instead."],[23880,26880,"Next, you'll implement a blur filter that will take an image"],[26880,30330,"and soften it a little bit, so the edges are a little bit less sharp."],[30330,33450,"And finally, you'll implement an edge-detection filter"],[33450,35280,"that will take an image and highlight where"],[35280,39580,"all the boundaries between objects are inside of that image."],[39580,43170,"So these are the four parts of the filter assignment-- grayscale,"],[43170,47000,"reflect, blur, and then finally, edges."],[47000,50600,"But how do you go about applying filters to images at all?"],[50600,53120,"Well, every image, remember, is just a sequence"],[53120,56540,"of individual pixels arranged into a particular grid."],[56540,58700,"And how do we represent a pixel?"],[58700,62150,"Well, on a computer screen, every pixel has three values,"],[62150,63620,"which we might call channels--"],[63620,67430,"a red channel, a green channel, and a blue channel where those values"],[67430,72900,"range from 0, meaning none, to 255, meaning the maximum."],[72900,75080,"If we set the red value to a small value,"],[75080,77720,"you'll see that we have a little bit of red in the pixel."],[77720,80450,"A higher red value means more red in the pixel."],[80450,86150,"And 255 means we have as much red as we possibly can in this particular pixel."],[86150,89420,"We set it back to 0, and the pixel goes back to black."],[89420,93950,"Why is it that each channel value goes from 0 to 255?"],[93950,98540,"Well, 0, represented in binary, is just 0, as you might imagine."],[98540,103010,"And 255 represented in binary is eight 1's,"],[103010,107690,"which means that for each color value, we can use one byte or eight bits"],[107690,110550,"for each color-- red, green, and blue."],[110550,115610,"And since we have three of those, we can use 3 bytes or 24 bits per pixel."],[115610,118230,"So if you've ever heard the term 24-bit color,"],[118230,120270,"that's what this is referring to."],[120270,124950,"So we can use the red channel to control how much red is in this pixel."],[124950,128750,"We can use the green channel to control how much green is in the pixel."],[128750,132800,"And we can use the blue channel to control how much blue is in the pixel."],[132800,136100,"But, of course, we don't need to just use one of the channels at a time."],[136100,140300,"We can use them in combination to create any number of different colors."],[140300,142820,"If we have a lot of red and a little bit of blue,"],[142820,145470,"we have a color that looks a little something like this."],[145470,148910,"And if we have a lot of green and a lot of blue but just a little bit of red,"],[148910,152280,"then we get a turquoise color that looks a little something like this."],[152280,155430,"And if we set each of the channel values of red, green,"],[155430,159980,"and blue to the maximum value of 255, well, that pixel"],[159980,163630,"is just going to be a pure white pixel."],[163630,167080,"If we take enough of these pixels, set them to the right color value,"],[167080,169300,"and arrange them in the appropriate order,"],[169300,171730,"the result is that we can actually see an image that"],[171730,176030,"looks like something by arranging colors in the correct position."],[176030,179930,"So what files do you actually need to work with in this problem?"],[179930,184850,"Well, there's bmp.h, which is going to store information about bitmap images."],[184850,187180,"It's going to store some of the structs that you're"],[187180,190720,"going to need to deal with in order to complete this assignment."],[190720,193780,"We've also given you filter.c, which is the program you'll"],[193780,196270,"run to actually run these filters, which is going"],[196270,199150,"to take care of the logic of reading the file from memory,"],[199150,203170,"calling a function to apply a filter, and then writing the new image to disk"],[203170,204890,"as a brand new file."],[204890,207940,"Helpers.c is the file that actually contains"],[207940,210640,"all of the functions that are going to implement each"],[210640,212800,"of the filters for this assignment."],[212800,215290,"Helpers.h is the header file that's going"],[215290,219040,"to declare all of the functions that show up in helpers.c, telling you"],[219040,221410,"what the return type of the function is and what"],[221410,224380,"all of the types of the arguments to the functions are."],[224380,227200,"Finally, we've given you a Makefile, which when you run make"],[227200,230080,"is going to take all of these files and combine them together"],[230080,234220,"into an executable that you can run to actually apply these filters to images"],[234220,235480,"of your very own."],[235480,238687,"We've completed all of the files except for helpers.c,"],[238687,239770,"and that's where you come."],[239770,240740,"In."],[240740,244240,"So how are you actually going to write the code to implement these filters?"],[244240,247300,"Well, in bmp.h, we've defined a struct for you"],[247300,250720,"called RGBTRIPLE, which is going to represent a pixel that"],[250720,252640,"has a red, green, and blue value."],[252640,255190,"You'll notice that this struct has three fields,"],[255190,259195,"a field called rgbtBlue representing the amount of blue in the triple,"],[259195,262660,"a field called rgbtGreen representing the amount of green,"],[262660,266680,"and a field called rgbtRed representing the amount of red."],[266680,269620,"Each field stores a byte worth of information,"],[269620,272860,"remembering that a byte is really just 8 bits."],[272860,277090,"Your task is going to be to implement the four functions in helpers.c--"],[277090,281140,"grayscale, reflect, blur, and edges."],[281140,284020,"Each of these functions takes three arguments,"],[284020,287320,"an integer called height, an integer called width,"],[287320,290260,"and a two-dimensional array of RGBTRIPLES,"],[290260,295428,"a 2D array of pixels where there are height rows and width columns."],[295428,297220,"So your image might look a little something"],[297220,301090,"like this, a two-dimensional array which has a particular height, which"],[301090,304390,"will be an argument to your function, and it has a particular width,"],[304390,306440,"which will also be an argument."],[306440,309040,"So if we have an image, which is a two-dimensional array,"],[309040,312550,"image 0 is going to represent the first row of that image."],[312550,314860,"Image 1 represents the second row."],[314860,318490,"Image 2 represents the third row so on and so forth."],[318490,321940,"How, for example, would you get the last row in the image?"],[321940,324640,"Well, if there are height many rows in the image"],[324640,328210,"and we start counting from row 0, then the last row in the image"],[328210,332180,"is going to be image height minus for 1, for example."],[332180,333970,"So that's how you get a row of the image."],[333970,337600,"But how do you get it at a very particular pixel in that image?"],[337600,342350,"Well, image 0 is a row of the image, which itself is just an array."],[342350,344950,"So if image 0 is the first row of the image,"],[344950,350020,"image 0 0 is going to be the first pixel in that first row."],[350020,352720,"Image 0 1 is the second pixel in the row."],[352720,356450,"Image 0 2 is the third pixel in the row so on and so forth."],[356450,360130,"And we can use this notation to access any pixel in the image."],[360130,364030,"Image 2 3, for example, is the pixel in row 2"],[364030,367640,"and column 3 of this particular image."],[367640,369880,"So if we have a pixel, how do we actually"],[369880,373090,"modify the pixel to change its color values?"],[373090,376990,"Well, recall that every pixel is really just a struct that has values"],[376990,380860,"rgbtRed, rgbtGreen, and rgbtBlue."],[380860,383050,"So to access the properties of a struct, we"],[383050,387700,"can use dot notation using image 2 3.rgbtRed"],[387700,390580,"to set the red value of the pixel equal to something"],[390580,393740,"and doing the same for the green and the blue values, for example."],[393740,396130,"If we set the red, green, and blue values all to 0,"],[396130,397990,"then we're going to turn this pixel black"],[397990,401290,"because black is the color represented by values of 0"],[401290,404140,"for each of red, green, and blue."],[404140,406600,"Your task in each of these functions is going"],[406600,410050,"to be to take the image as input, as this two-dimensional array"],[410050,414460,"and modify the two-dimensional array changing the individual pixels in order"],[414460,419220,"to create the effect that you would get by applying one of these filters."]]},"ry6mY60W8fI":{"edited":true,"zh":[[120,3090,"你要实现的第一个滤镜叫 grayscale，也就是灰度滤镜。"],[3090,8280,"它会把彩色照片转换成只有黑、白和深浅灰色的照片。"],[8280,11080,"这个效果要怎么实现呢？"],[11080,16710,"来看一个像素。还记得吗？ 每个像素都有红、绿、蓝三个分量。"],[16710,20250,"三个值都是 0 时，像素就是黑色。"],[20250,26610,"如果三个值都取最大值 255，像素就是白色。"],[26610,34690,"有意思的是，只要红、绿、蓝三个值相等， 就能得到不同深浅的灰色。"],[34690,38220,"如果这三个值相等而且都比较小，"],[38220,42540,"得到的灰色就比较深，更接近黑色。"],[42540,48240,"如果三个值相等而且都比较大，得到的灰色就比较浅，"],[48240,50880,"更接近白色。"],[50880,58210,"所以，grayscale 要做的就是 让每个像素的红、绿、蓝三个分量相等。"],[58210,60900,"可是，应该把它们设成多少呢？"],[60900,66810,"你大概会希望，原来颜色较浅的地方转成浅灰色，"],[66810,71487,"原来颜色较深的地方转成深灰色。"],[71487,76410,"比如画面上这个颜色，适合用浅一点的灰色来表示。"],[76410,82130,"可以把红、绿、蓝三个分量都设成同一个较大的值。"],[82130,86570,"如果原来的颜色再暗一点，相应的灰色也应该深一点，"],[86570,89980,"三个分量的值就都应该小一些。"],[89980,98120,"一种做法是算出这个像素的红、绿、蓝三个分量的平均值，"],[98120,102478,"然后把三个分量都设成这个平均值。"],[102478,104020,"具体怎么算呢？"],[104020,113230,"拿这种绿色举例。它的红色分量是 50， 绿色分量是 190，蓝色分量是 90。"],[113230,119980,"把三个分量加起来再除以 3，得到的平均值是 110。"],[119980,123280,"所以，把这个像素转成灰度时，"],[123280,127840,"先把红色分量设为 110，"],[127840,133240,"再把绿色和蓝色分量也都设为 110。"],[133240,140350,"这样得到的灰色，明暗程度就和原来的像素差不多。"],[140350,147010,"当然，算出来的平均值有时并不是整数。"],[147010,150820,"比如画面上这个例子，平均值约为 109.67。"],[150820,157670,"还记得吗？红、绿、蓝每个分量 都得是 0 到 255 之间的整数。"],[157670,163330,"所以，当平均值不是整数时，要先四舍五入，"],[163330,167410,"用最接近的整数作为新的分量值。"],[167410,170650,"这就是把单个像素转换成灰度的方法。"],[170650,173200,"那整张图像要怎么处理？"],[173200,176360,"可以用一个循环，逐行处理图像。"],[176360,182650,"从第一行开始，接着处理下一行， 依次把每一行都转换成灰度。"],[182650,186760,"处理每一行时，再用一层循环，"],[186760,191800,"从这行的第一个像素走到第二个像素，依次往后。"],[191800,196870,"遇到每个像素，先算出它的分量平均值。"],[196870,203530,"也就是取出红、绿、蓝三个分量，算出它们的平均数。"],[203530,207470,"算出平均数之后，就可以给各个颜色分量赋值，"],[207470,211490,"把红、绿、蓝都设成这个平均数。"],[211490,214790,"当然，记得先四舍五入到最接近的整数。"],[214790,219410,"写好 grayscale 函数后，就能试运行 filter 程序了。"],[219410,223070,"用 make 编译好 filter，再运行 ./filter，"],[223070,228800,"加上命令行参数 -g，表示要使用灰度滤镜。"],[228800,233270,"接着输入原图的文件名，比如 infile.bmp，"],[233270,240720,"最后给新生成的文件起个名字，比如 outfile.bmp。"],[240720,246470,"如果输入的是一张彩色图片，而且 grayscale 实现正确，"],[246470,249110,"运行程序后，打开输出文件，"],[249110,252920,"你就会看到同一张照片的灰度版本。"],[252920,256810,"我是 Brian。以上就是 grayscale。"]],"en":[[120,3090,"BRIAN YU: The first filter you're going to implement is grayscale."],[3090,5250,"The grayscale filter should take a color photo"],[5250,8280,"and convert it into grayscale, turning it into black and white."],[8280,11080,"But how exactly are you going to do that?"],[11080,13590,"Well, let's take a look at a pixel, which as you'll recall,"],[13590,16710,"has a red value, a green value, and a blue value."],[16710,20250,"If all of those values are zero, the pixel shows up as black."],[20250,24270,"And remember that if all of the values are the maximum of 255,"],[24270,26610,"then the pixel shows up as white."],[26610,28950,"The interesting thing to note, though, is as long"],[28950,32520,"as the red, green, and blue values are the same, what you'll get"],[32520,34690,"is a different shade of gray."],[34690,38220,"If the red, green, and blue values are the same small value,"],[38220,40410,"you'll get a darker shade of gray, something closer"],[40410,42540,"to the black end of the spectrum."],[42540,44920,"And if the red, green, and blue values are all the same"],[44920,48240,"but are a higher value, then you'll get a lighter shade of gray,"],[48240,50880,"something closer to the white end of the spectrum."],[50880,54180,"So your task in grayscale is really just, for each pixel,"],[54180,58210,"to make sure that the red, green, and blue values are all the same."],[58210,60900,"But what value are you going to set them to?"],[60900,63570,"Well, you might imagine that for a lighter color,"],[63570,66810,"you probably want a lighter shade of gray to represent it."],[66810,69990,"And for a darker color, you probably want a darker shade of gray"],[69990,71487,"to represent that."],[71487,74070,"So if we have a color that looks a little something like this,"],[74070,76410,"you probably want a lighter shade of gray"],[76410,79410,"to represent it by setting the red, green, and blue values"],[79410,82130,"all to a relatively high value."],[82130,84280,"But if we have a color that's a little bit darker,"],[84280,86570,"then you probably want a darker shade of gray,"],[86570,89980,"where the red, green, and blue values are all a little bit lower."],[89980,93880,"And one thing that we can do is just take the red, green, and blue values"],[93880,98120,"and calculate the average pixel value for any of these individual channels"],[98120,102478,"and use that as the new value for red, green, and blue."],[102478,104020,"What does this look like in practice?"],[104020,107350,"Well, let's take this shade of green, for example, where the red value is"],[107350,113230,"equal to 50, the green value is equal to 190, and the blue value is equal to 90."],[113230,117250,"If we take these three channel values and take the average of the three,"],[117250,119980,"the average is 110."],[119980,123280,"So for our new pixel that we're going to convert to grayscale,"],[123280,127840,"we're going to take the red value, set it equal to 110, take the green value,"],[127840,133240,"set it equal to 110, and take the blue value and set it equal to 110 as well."],[133240,137500,"The result is a shade of gray that approximately matches the brightness"],[137500,140350,"or darkness of the original pixel."],[140350,143170,"Of course, it's possible that depending on the original color"],[143170,147010,"values, the average value you get might not be a whole number."],[147010,150820,"In this case, the average is 109.67."],[150820,153040,"Remember that each of red, green, and blue"],[153040,157670,"need to be integer values in the range from 0 to 255."],[157670,160390,"So if the average value is not an integer,"],[160390,163330,"you'll want to make sure to round it to the nearest integer"],[163330,167410,"in order to determine what the new value actually should be."],[167410,170650,"So that's how to take one pixel and convert it to grayscale."],[170650,173200,"But how are you going to do it for the entire image?"],[173200,176360,"Well, you could imagine looping through the image one row at a time,"],[176360,179900,"starting with the first row, then going to the next row, so on and so forth,"],[179900,182650,"and converting each row to grayscale."],[182650,186760,"Where for each row, you'd iterate one more time, using yet another loop,"],[186760,190490,"starting with the first pixel in the row, then the second pixel in the row,"],[190490,191800,"so on and so forth."],[191800,194650,"And for each pixel, what you'll likely want to do"],[194650,196870,"is calculate what the average pixel value"],[196870,199840,"is by taking the red channel value, the green channel"],[199840,203530,"value, and the blue channel value and averaging them together."],[203530,205510,"Then, once you've calculated the average,"],[205510,207470,"you can set each of the color values--"],[207470,209380,"each of red, green, and blue--"],[209380,211490,"to whatever that average value is--"],[211490,214790,"of course, making sure to round it to the nearest integer."],[214790,217280,"After you've implemented the grayscale function,"],[217280,219410,"you should be able to try the filter program."],[219410,223070,"After you make the filter program, you can run ./filter,"],[223070,225740,"passing in -g as a command line argument,"],[225740,228800,"indicating that you'd like to apply the grayscale filter,"],[228800,233270,"passing in an input file as infile.bmp or whatever the file name happens"],[233270,237410,"to be, and then specifying the name of the new file you'd like to produce"],[237410,238370,"as output--"],[238370,240720,"outfile.bmp, for example."],[240720,243740,"If you do that and pass it an input file in color,"],[243740,246470,"if you've implemented the grayscale function successfully,"],[246470,249110,"after you run the program, you open up the out file,"],[249110,252920,"you should see the same photo, but converted to grayscale."],[252920,254060,"My name is Brian."],[254060,256810,"And this was grayscale."]]},"AuS7oAZbHhg":{"edited":true,"zh":[[120,5160,"下一个要实现的是镜像滤镜 reflect。"],[5160,8700,"它会把原图左右翻转，就像照镜子一样。"],[8700,10210,"这个效果要怎么做呢？"],[10210,13920,"还记得吗？每张图像其实就是一个二维数组，"],[13920,18475,"分成若干行，每一行又包含许多个像素。"],[18475,20100,"我们可以给每一行编号。"],[20100,23850,"比如这张图里有第 0、1、2、3、4、5 行。"],[23850,27240,"把这张图左右翻转时，会发生什么？"],[27240,31560,"各行仍然按原来的顺序排列，变的是行内像素的位置。"],[31560,35370,"第 0 行仍在最上面，只是它内部左右翻转了。"],[35370,39970,"第 1 行仍在第二行，它的像素也左右翻转了。其余行同理。"],[39970,47430,"所以，要得到整张图的镜像， 只需对每一行做同样的处理。"],[47430,51000,"来看这一行，里面各个像素的颜色可以不同。"],[51000,56730,"左右翻转以后，原本最左边的像素到了最右边，"],[56730,62640,"原本左数第二个像素到了右数第二个的位置，以此类推。"],[62640,66390,"如果一行里的像素个数是奇数，就像这里这样，"],[66390,71820,"那么正中间的像素就留在原位。图中它的下标是 5。"],[71820,73950,"如果像素个数是偶数呢？"],[73950,81490,"这样一来，每个像素都会跟同一行另一端 与它左右对称的像素交换位置。"],[81490,84480,"具体要实现怎样的算法呢？"],[84480,89550,"对每一行，都把左右对称位置上的两个像素调换一下。"],[89550,92940,"最左边的换到最右边，最右边的也换到最左边。"],[92940,98700,"一行会处理了，就可以用循环把这个操作应用到每一行。"],[98700,103530,"先交换第一行里的像素，再交换第二行、第三行，依次做下去。"],[103530,108480,"写好这个函数后，可以运行 ./filter -r 来测试。"],[108480,113500,"-r 表示使用镜像滤镜，后面依次跟输入文件名和输出文件名。"],[113500,116250,"如果输入的图片是画面上这样，"],[116250,120270,"那么输出的图片就应该是原图左右翻转后的样子。"],[120270,123750,"我是 Brian。以上就是 reflect。"]],"en":[[120,1870,"BRAIN YU: The next filter you'll implement"],[1870,5160,"is a reflection filter, wherein this filter, you'll take an image"],[5160,8700,"and produce the mirror image of that original picture."],[8700,10210,"How are you going to do that?"],[10210,13920,"Well, recall that each image is really just a two dimensional array where"],[13920,18475,"we have rows, and every row has individual pixels inside of that row."],[18475,20100,"We could number the rows in this image."],[20100,23850,"So we have rows 0, 1, 2, 3, 4, and 5, for example."],[23850,27240,"When we take the mirror image of this picture, what really happens"],[27240,31560,"is that the rows stay in the same order, but the pixels in the row switch"],[31560,35370,"places so that row 0 is still at the top, but it's been reflected."],[35370,39970,"Row 1 is still the second row, but it's been reflected, so on and so forth."],[39970,43500,"So what we really need to do in order to take the reflection of an image"],[43500,47430,"is just to take each row and apply the same filter to each row,"],[47430,51000,"taking the individual pixels in that row, which might all be different,"],[51000,54570,"and reflecting them so that the pixel that was originally on the far left"],[54570,56730,"of the row is now in the far right."],[56730,59310,"The pixel that was originally second from the left in the row"],[59310,62640,"is now second from the right so on and so forth."],[62640,66390,"If there are an odd number of pixels, as there are in this particular row,"],[66390,69660,"you'll notice that the middle pixel, the pixel at index 5,"],[69660,71820,"doesn't actually change position."],[71820,73950,"But if there were an even number of pixels,"],[73950,77940,"then every pixel would switch positions with the pixels on the mirror image"],[77940,81490,"side of it on the opposite end of the same row."],[81490,84480,"So what is the algorithm you're actually going to implement here?"],[84480,86220,"Well, for every row, you're going to want"],[86220,89550,"to swap the pixels on horizontally opposite sides"],[89550,92940,"where the far left pixel becomes the far right and vice versa."],[92940,94740,"And once you can do this for one row, you"],[94740,98700,"can repeat this using some sort of loop applying it to every row in the image"],[98700,103530,"swapping the first row, then the second row, third row, so on and so forth."],[103530,108480,"After you've implemented this function, you can test it by running ./filter -r"],[108480,113500,"for the reflect filter then passing in an infile and specifying an outfile."],[113500,116250,"Once you do that, if the input file looks like this,"],[116250,120270,"then the output file should be the reflection of that original image."],[120270,123750,"My name is Brian, and this was reflect."]]},"dxNO-hCjT0w":{"edited":true,"zh":[[150,3120,"接下来要实现的滤镜叫 blur，也就是模糊滤镜。"],[3120,10860,"blur 会把原图处理得柔和一些，让细节显得没那么锐利。"],[10860,14440,"我们放大一点，看看实际效果。"],[14440,18400,"这张是原图，这张是模糊之后的样子。"],[18400,22300,"注意看，细节柔和了，也更难辨认。"],[22300,27930,"那么，什么样的算法能让照片变模糊？"],[27930,32820,"来看这张简单的 6 × 6 图像，里面只有红、蓝两种颜色。"],[32820,35520,"如果把它模糊化，会得到什么？"],[35520,45450,"结果大概是这样：细节变得柔和，线条也没有原先那么清晰。"],[45450,47130,"把它们并排来看。"],[47130,52570,"左边是原图，右边是模糊后的图。"],[52570,55830,"各个像素的颜色稍微变了一点。"],[55830,60180,"原本纯红的像素带上了一点蓝色，"],[60180,64390,"原本纯蓝的像素则带上了一点红色。"],[64390,66550,"这个效果怎么做出来？"],[66550,70290,"这里用的是方框模糊，也叫 box blur。"],[70290,82890,"要计算一个像素的新颜色，取它周围 3 × 3 范围内的九个像素， 包括它自己，把原来的颜色分量分别求平均。"],[82890,89050,"换句话说，这些像素和中心像素最多相差一行、一列。"],[89050,91460,"对这张图来说，这意味着什么呢？"],[91460,97060,"比如，要算出这个像素模糊之后的颜色，"],[97060,106240,"就看这九个像素原来的颜色， 它们离目标像素都不超过一行、一列。"],[106240,114130,"同样，要对这里这个像素做模糊处理， 就取这里九个像素原来的颜色求平均。"],[114130,119710,"但并非图里每个像素的周围，都能凑齐 3 × 3 的九个像素。"],[119710,124610,"比如边缘上的这个像素，要怎么处理？"],[124610,138100,"只取这六个像素来求平均。 在行、列都相差不超过一的范围里，图内只有这六个像素。"],[138100,151070,"再看角落里的像素。这个范围内只有四个像素， 所以就用这四个像素的平均值。"],[151070,159280,"来具体算一遍。我们要给这张图做模糊处理，求这个像素的新值。"],[159280,168520,"要看它自己以及周围的像素。 行和列分别最多相差一格，合起来就是这九个。"],[168520,170350,"放大来看。"],[170350,175780,"蓝色像素的蓝色分量是 255，红色和绿色分量是 0。"],[175780,182140,"另外五个是红色像素，它们的红色分量是 255，绿和蓝都是 0。"],[182140,185990,"中间这个像素模糊后会是什么颜色？"],[185990,191950,"我们要分别算出红色、绿色、蓝色的平均值。"],[191950,196510,"九个像素的红色分量取平均，四舍五入后是 142。"],[196510,200980,"因为其中有五个像素的红色分量是最大值，另外四个是 0。"],[200980,209500,"所有像素的绿色分量都是 0，所以绿色平均值也是 0。 蓝色平均值则是 113。"],[209500,212560,"这里都取最接近的整数。"],[212560,222280,"所以，模糊后中心像素的颜色，就是这九个像素原有颜色的平均值。"],[222280,230270,"新的红色分量是 142，绿色是 0，蓝色是 113。"],[230270,237980,"对原图中的每个像素都这样做，分别计算红、绿、蓝的新值。"],[237980,244520,"每次取行、列都相差不超过一的像素， 用它们原来的颜色求平均。"],[244520,250350,"最后就得到了眼前这张图，也就是模糊版的原图。"],[250350,262040,"处理好每一个像素后，运行 ./filter 测试， 加上 -b 参数，选择模糊滤镜。"],[262040,264710,"再依次指定输入文件和输出文件。"],[264710,270710,"运行之后，你就能用原图生成一张模糊后的图片。"],[270710,274210,"我是 Brian。以上就是 blur。"]],"en":[[150,3120,"INSTRUCTOR: The next filter that you'll implement is called blur."],[3120,5940,"In blur, your task is going to be to take an image"],[5940,10860,"and blur it by creating a softer, less sharp version of the same image."],[10860,14440,"Let's zoom in to this image a little bit to see what this actually looks like."],[14440,16630,"Notice that if this is the original image,"],[16630,18400,"this is what the blurred image looks like."],[18400,20400,"Notice that the details are a little bit softer,"],[20400,22300,"and it's a bit tougher to make out."],[22300,24510,"So what does that algorithm actually look like?"],[24510,27930,"How do we take an image and blur it, so to speak?"],[27930,30990,"Well, let's look at this image, a simple 6-by-6 image"],[30990,32820,"where we have red and blue."],[32820,35520,"And what would it look like if we were to blur the image?"],[35520,37980,"Well, the blurred image might look a little something"],[37980,40530,"like this, where the details are a bit softer,"],[40530,44070,"and you can't quite make out the lines as crisply or as sharply"],[44070,45450,"as you could before."],[45450,47130,"You can look at them side by side here."],[47130,50070,"On the left is the original image, and on the right"],[50070,52570,"is the blurred version of the same image."],[52570,55830,"You'll notice that the pixels have changed their color values slightly."],[55830,60180,"The pixels that were originally just pure red now look a little more blue,"],[60180,64390,"and the pixels that were originally blue now look a little more red."],[64390,66550,"So how do we actually do this?"],[66550,70290,"Well, the type of blur we're going to do is what's called a box blur."],[70290,74640,"And to implement a box blur, we're going to compute the new value for a pixel"],[74640,79770,"by taking the average of the old color values of all of the nine pixels"],[79770,82890,"that form a grid around that original pixel--"],[82890,85830,"in other words, all of the pixels that are within one row"],[85830,89050,"and one column of the original pixel."],[89050,91460,"What does that mean for an image like this?"],[91460,93620,"Well, if we take this pixel, for example,"],[93620,97060,"and we want to compute its new color value in the blurred image,"],[97060,101170,"we're going to do that by looking at the original color values of these nine"],[101170,106240,"pixels, the pixels that are within one row and one column of that pixel."],[106240,109840,"Likewise, to determine the blurred version of this pixel,"],[109840,112990,"we're going to take the average of the original color values of these nine"],[112990,114130,"pixels."],[114130,117610,"Of course, not every pixel in our image has nine pixels"],[117610,119710,"that form a 3-by-3 grid around it."],[119710,123040,"Let's consider an edge case, for example, like this pixel."],[123040,124610,"What happens now?"],[124610,127300,"Well, instead of averaging nine pixels to get the new color"],[127300,129669,"value for this pixel, we're instead going"],[129669,132640,"to average these six color values because these six"],[132640,138100,"pixels are the only ones within one row and one column of that original pixel."],[138100,141370,"And likewise, if we look at this pixel down in the corner,"],[141370,145000,"we're going to compute its new value by taking the average of these four"],[145000,148540,"pixels, the only pixels that are within one row and one"],[148540,151070,"column of this particular pixel."],[151070,154660,"So let's take a look at an example in a little more detail by calculating"],[154660,159280,"the new value for this pixel if we were to try and blur this image."],[159280,162340,"In order to do so, we need to look not just at this pixel,"],[162340,165940,"but in all of the pixels within one row and one column of it, which"],[165940,168520,"would be this grid of nine pixels."],[168520,170350,"Let's take a look at them in more detail."],[170350,173830,"Notice that the blue pixels have a blue value of 255,"],[173830,175780,"and our red and green value of 0."],[175780,180100,"And the red pixels, of which there are five of them, have a red value of 255"],[180100,182140,"and a green and blue value of 0."],[182140,185990,"So what are we going to do to filter the pixel in the middle here?"],[185990,188860,"Well, what we're going to do is calculate the average amount of red,"],[188860,191950,"the average amount of green, and the average amount of blue."],[191950,196510,"The average amount of red across all nine of these pixels is 142."],[196510,199450,"Five of the pixels have the maximum amount of red, and four of them"],[199450,200980,"have no red."],[200980,204220,"As for green, none of these pixels have any green at all,"],[204220,209500,"so the average amount of green is 0, and the average amount of blue is 113--"],[209500,212560,"again, all of these rounded to the nearest integer."],[212560,216520,"So what that means is that the blurred version for this new middle pixel"],[216520,219910,"is going to be based on the average of the original color values"],[219910,222280,"for all nine of these pixels, which means"],[222280,226780,"it's going to now have a red value of 142, a green value of 0,"],[226780,230270,"and a blue value of 113."],[230270,234050,"If we do that same process for each of the pixels in the original image,"],[234050,237980,"determining the new color values for each of red, green, and blue"],[237980,241850,"by taking the average of the original color values for all of the pixels"],[241850,244520,"that are within one row and one column of that pixel,"],[244520,248570,"the end result is an image that looks like this, a blurred version"],[248570,250350,"of that original image."],[250350,252740,"And once you've done that for every pixel in the image,"],[252740,257839,"you can test this by running ./filter, passing in -b to specify that you want"],[257839,262040,"to run the blur filter, then specifying the input file that you'd like to use"],[262040,264710,"as a source, and of course, the output file."],[264710,267590,"Once you've done that, you should be able to take the original image"],[267590,270710,"and create a blurred version of the same thing."],[270710,274210,"My name is Brian, and this was blur."]]},"PnVQN4vzC4U":{"edited":true,"zh":[[165,3030,"接下来要实现的滤镜是 edges，也就是边缘检测。"],[3030,13093,"你要对图像使用 Sobel 边缘检测算法，把物体之间的边界突出出来。"],[13093,18960,"比如这里能看到桥的轮廓，还有水边一些植物的轮廓。"],[18960,21750,"你要实现的就是产生这个效果的算法。"],[21750,27150,"可是，仅凭一张图，怎么知道物体的边界在哪里？"],[27150,34750,"我们先看一张简单的图，想想可以凭什么辨认边界。"],[34750,40660,"图里有两个物体，左边是蓝色矩形，右边是红色矩形。"],[40660,46780,"正中间的紫线，可以看作它们之间的边界。"],[46780,48090,"怎么知道这里是边界？"],[48090,55410,"因为线左边的颜色跟右边的颜色明显不同。"],[55410,61140,"在更复杂的图里检测边缘，也可以用同样的道理。"],[61140,68670,"如果一条线左边的像素是某种颜色，右边的颜色却相差很大，"],[68670,76590,"说明越过这条线时颜色有突变，这里就可能是两个物体的边界。"],[76590,86940,"每个像素都有红、绿、蓝三个分量，我们先单看各个像素的红色分量。"],[86940,93340,"从图的左边往右边走，看看这个值怎么变。"],[93340,100680,"左边这些蓝色像素的红色分量都是 0。"],[100680,104920,"右边的红色像素，红色分量都是 255。"],[104920,110850,"正中间则介于两者之间，比如这里是 128。"],[110850,118350,"怎样判断某个位置附近的红色分量有没有明显变化？"],[118350,122370,"接下来要用到一种叫“卷积核”的矩阵。"],[122370,132180,"画面上这个卷积核叫 Gx，用来判断沿着 x 方向 颜色有没有明显变化，是否可能遇到物体边界。"],[132180,137670,"这里的 x 方向就是水平方向，比如从左往右。"],[137670,150480,"思路跟之前的模糊算法很像。选定一个像素， 用以它为中心的 3 × 3 方格里的九个像素计算它的新值。"],[150480,161560,"这次要给九个位置各配一个系数， 把各处的颜色分量乘上对应的系数，然后相加。"],[161560,163240,"我们来看个例子。"],[163240,173110,"对图里这个红色像素应用 Gx 卷积核，算出它在 x 方向上的变化量。"],[173110,177660,"这个红色像素周围的颜色没怎么变。"],[177660,181890,"它的左边、右边都有大片红色。"],[181890,192960,"所以算出的 Gx 应该很小，说明从左往右经过它时，红色分量变化很小。"],[192960,194980,"具体怎么算？"],[194980,204060,"和之前做模糊时一样，先取以它为中心的 3 × 3 个像素。"],[204060,209460,"先看 Gx 卷积核左上角的系数，"],[209460,219840,"是 −1。把它乘以这九个像素左上角的红色分量，这里是 255。"],[219840,225270,"然后看最上面一行正中的像素。"],[225270,230580,"卷积核在那个位置的系数是 0，所以这一项是 0 × 255。"],[230580,233610,"右上角那一项是 1 × 255。"],[233610,245160,"继续算中间一行：左边是 −2 × 255，正中间是 0 × 255，"],[245160,248670,"右边是 2 × 255。"],[248670,256260,"最下面一行是 −1 × 255，加上 0 × 255，再加上 1 × 255。"],[256260,263400,"算出所有乘积再求和，你会发现所有非零项都抵消了。"],[263400,268890,"每一个 1 × 255 都和一个 −1 × 255 抵消，"],[268890,274320,"2 × 255 和 −2 × 255 也抵消了。"],[274320,284733,"最后得到 0，也就是说，从左往右红色分量没有变化。"],[284733,289950,"这和图像吻合，因为这里的九个像素都是相同的红色。"],[289950,294900,"如果把这个卷积核用到别的像素上，又会怎样？"],[294900,305440,"拿中间这个像素举例。看它周围这 3 × 3 个像素，这次颜色确实在变。"],[305440,311710,"从左到右，红色分量从 0 增加到 255。"],[311710,320840,"红色分量的变化很大，所以我们预期算出来的 Gx 也会很大。"],[320840,322630,"来算一下。"],[322630,330310,"左上角是 −1 × 0，接着加上正上方的 0 × 128，"],[330310,339700,"再加上右上角的 1 × 255。其余位置也按同样的方法计算。"],[339700,344260,"中间一行先算 −2 × 0，加上正中间的 0 × 128，"],[344260,346990,"再加上右边的 2 × 255。"],[346990,350750,"最下面一行也照样算。"],[350750,364527,"把这些数加起来，结果是 1020。这个值很大， 表示横向经过这个像素时，红色分量发生了很大的变化。"],[364527,369290,"这就是一个有力的线索，说明这里很可能是边界。"],[369290,374645,"怎样把这个方法应用到整张图的每一个像素？"],[374645,377270,"有几点需要留意。"],[377270,380587,"首先，刚才只计算了红色分量。"],[380587,388030,"绿色和蓝色分量也要各自做一遍同样的计算。"],[388030,401020,"其次，目前只看了 x 方向，也就是从左往右时， 红、绿、蓝的值有没有大幅增加或减少。"],[401020,407680,"但从图像顶部到底部，也就是沿 y 方向，也可能遇到边界。"],[407680,414320,"跨过一条水平线时，颜色分量可能由低变高，也可能由高变低。"],[414320,426880,"所以，除了检测 x 方向变化的 Gx 矩阵， 我们还需要一个检测 y 方向变化的 Gy 矩阵。"],[426880,430480,"Gy 跟 Gx 的形状很像，把矩阵转个方向就行。"],[430480,438850,"取中心像素下方一排的三个像素，将它们的分量依次乘以 1、2、1。"],[438850,450100,"再取中心像素上方的三个像素，依次乘以 −1、−2、−1。"],[450100,460390,"把这些项加起来，就能大致反映出从像素上方走到下方时， 某个颜色分量变化了多少。"],[460390,466250,"我们用 Gx 和 Gy 这两个矩阵，分别衡量两个方向上的颜色变化。"],[466250,471310,"怎样用这些结果确定每个像素的新颜色？"],[471310,478360,"对每个像素的红、绿、蓝三个通道，分别算出 Gx 和 Gy。"],[478360,489940,"这样一共有六个结果。先对红、绿、蓝各应用一次 Gx 矩阵， 再对三个通道各应用一次 Gy 矩阵。"],[489940,501500,"和模糊滤镜一样，这里也要处理边界情况。 像素在边上或角落里时，周围凑不齐 3 × 3 个像素。"],[501500,511475,"这次遇到越出图像范围的位置，就把它当成纯黑像素，三个分量都是 0。"],[511475,523760,"比如整张图左上角的像素，它的正上方没有像素， 计算时就当那个位置是纯黑色。"],[523760,537660,"算出每个通道的 Gx 和 Gy 之后， 还要用这两个数得到输出图像里这个通道的最终值。"],[537660,540290,"这里用到下面的公式。"],[540290,546930,"每个通道的新值等于 Gx 的平方加上 Gy 的平方，再开平方根。"],[546930,555020,"举例来说，要算这个像素新的红色分量，先用原图中的红色值计算 Gx，"],[555020,559130,"再用原图中的红色值计算 Gy，"],[559130,562800,"把二者分别平方，相加，再开平方根。"],[562800,572180,"分别取平方，是因为我们关心的是变化的大小。 不管红色是突然增多还是突然减少，"],[572180,581390,"两种变化都可能是边界。平方就能去掉方向造成的正负号。"],[581390,584120,"最后再开平方根，得到两个方向合起来的变化幅度。"],[584120,591440,"和其他滤镜一样，结果有可能超过通道能表示的最大值 255。"],[591440,597740,"遇到这种情况，就把结果限制为 255。"],[597740,611750,"对原图里的每个像素都重复这个步骤， 分别用原图数据算出红、绿、蓝各自的 Gx 和 Gy，再得到新的分量值。"],[611750,624830,"完成后就能测试了。运行 ./filter，加上 -e 表示边缘检测， 再依次给出输入位图和输出位图的文件名。"],[624830,631730,"如果一切正常，你就能在输出图像里看到原图中物体的轮廓。"],[631730,635410,"我是 Brian。以上就是 edges。"]],"en":[[165,3030,"BRIAN YU: The next filter that you'll implement is called edges."],[3030,5850,"In edges, what you're going to do is take an image"],[5850,9840,"and apply the Sobel edge detection algorithm to this image"],[9840,13093,"in order to highlight all of the boundaries between objects."],[13093,15510,"Notice that we've highlighted the boundaries of the bridge"],[15510,18960,"in this case and some of the plants that are surrounding the water here."],[18960,21750,"And this is the algorithm that you're going to try to create."],[21750,23970,"But how do we take an image and figure out"],[23970,27150,"where the boundaries between objects actually are?"],[27150,29580,"Well, let's first look at a simplified image"],[29580,34750,"to try to get a sense for how we can detect boundaries between objects."],[34750,38790,"Here we have two objects, a blue rectangle on the left"],[38790,40660,"and a red rectangle on the right."],[40660,42870,"And as you might guess, this middle purple line you"],[42870,46780,"can think of as a boundary between these two objects."],[46780,48090,"How do we know it's a boundary?"],[48090,52350,"Well, it's a boundary because the colors on the left side of the line"],[52350,55410,"are different from the colors on the right side of the line."],[55410,57570,"And the same thing could be generally true"],[57570,61140,"when we start to think about edge detection in more complex images."],[61140,65420,"If we have a line where, on the left side of the line, colors are one value,"],[65420,68670,"and on the right side of the line, the colors are a very different value, that"],[68670,71760,"indicates a major change in color across pixels,"],[71760,76590,"and therefore, might indicate a boundary between objects in that image."],[76590,81160,"So you recall that every pixel is composed of color values of red, green,"],[81160,84330,"and blue, but let's first just look at red values,"],[84330,86940,"and look at the red value for each of these pixels,"],[86940,89460,"and take a look at how those values change"],[89460,93340,"as we move from left to right inside of this image."],[93340,95220,"So if we just look at the red values, you'll"],[95220,98340,"notice that all the pixels on the left, the blue pixels,"],[98340,100680,"have a red channel value of zero."],[100680,104920,"All the red pixels on the right-hand side have a channel value of 255,"],[104920,107670,"and in the middle, they're somewhere in between with a red channel"],[107670,110850,"value of 128, for example."],[110850,113670,"How are we going to determine whether, at any particular point,"],[113670,118350,"we're noticing a change in color from one red value to another red value?"],[118350,122370,"Well, to do that, we're going to use what's called a convolutional matrix."],[122370,124920,"Here, for example, is the convolutional matrix"],[124920,128220,"called gx, which is going to determine whether or not"],[128220,132180,"there is some sort of change in color or boundary between objects"],[132180,135030,"as we move in the x direction in the image,"],[135030,137670,"moving from left to right, for example."],[137670,140640,"And the idea of this is going to be very similar to the algorithm"],[140640,143400,"that we applied in blur where we took a pixel"],[143400,147450,"and looked at the nine pixels that formed a square around that pixel"],[147450,150480,"to compute a new value for that same pixel."],[150480,153900,"We're going to do the same thing here, except rather than just averaging"],[153900,156000,"all of the values around the middle pixel,"],[156000,158790,"we're instead going to multiply each of the surrounding"],[158790,161560,"pixels by a different value."],[161560,163240,"Let's take a look at an example."],[163240,167490,"So here, we're going to apply this gx convolutional matrix"],[167490,171870,"to try to compute what the value of gx should be for this red pixel"],[171870,173110,"right here."],[173110,176820,"Now, notice that this red pixel does not have a whole lot of change"],[176820,177660,"happening around it."],[177660,181890,"To the left and to the right of it, it still has a lot of red surrounding it,"],[181890,185280,"so we should expect that this gx value that we compute"],[185280,189660,"will be very low, indicating that there is not much change in the red color"],[189660,192960,"as we move from left to right along this pixel."],[192960,194980,"So what does this actually look like?"],[194980,197190,"Well, we're first, much as with blur, going"],[197190,201540,"to form a 3-by-3 grid of pixels that surround the center pixel,"],[201540,204060,"and then we're going to do some calculations."],[204060,207600,"We'll take our gx convolutional matrix and first look"],[207600,209460,"at the value in the upper left."],[209460,213000,"It's negative 1, and so we're going to multiply negative 1"],[213000,217440,"by the red value in the upper left of this 3-by-3 grid of pixels,"],[217440,219840,"in this case 255."],[219840,222090,"Then we'll move on and say, all right, let's"],[222090,225270,"take the top pixel in this 3-by-3 grid."],[225270,230580,"The matrix says that we should multiply its value by 0, so we have 0 times 255."],[230580,233610,"And then we have 1 times 255."],[233610,237060,"And we're going to repeat this process of adding up negative 2"],[237060,240030,"times the red value of the pixels on the left, which in this case"],[240030,245160,"is also 255, plus 0 times 255, the pixel in the middle."],[245160,248670,"Then the right is going to be 2 times 255."],[248670,254010,"Then the bottom left is minus 1 times 255, plus 0 times 255,"],[254010,256260,"plus 1 times 255."],[256260,258959,"And if we do the math, performing all these multiplications"],[258959,261420,"and adding all these numbers together, what you'll notice"],[261420,263400,"is that everything cancels out."],[263400,268890,"All of the plus 1 times 255s cancel out with a minus 1 times 255,"],[268890,274320,"and the plus 2 times 255 cancels out with a minus 2 times 255."],[274320,277140,"So the result of all this after we do all the math"],[277140,280050,"is that we get the number 0, implying that there's"],[280050,284733,"no change in the red values as we move from left to right."],[284733,287400,"And that's to be expected here, because as we look at this grid,"],[287400,289950,"we see that all of the pixels are red."],[289950,292500,"What might happen, though, if we instead try to apply"],[292500,294900,"this matrix to a different pixel--"],[294900,297930,"say, for example, this pixel here in the middle, where"],[297930,301330,"you'll notice if we take a look at the 3-by-3 grid of pixels"],[301330,305440,"that surround this middle pixel, we see that the color values do change?"],[305440,308680,"There's an increase in red from 0 on the left-hand side"],[308680,311710,"to 255 on the right-hand side."],[311710,314300,"That's a big change in the red channel value,"],[314300,318550,"so we would expect that after we do this calculation of the value of gx"],[318550,320840,"that we would get a large value."],[320840,322630,"So how do we do the math here?"],[322630,325510,"Well, again, we'll do negative 1 times the value"],[325510,330310,"of the pixel in the upper left, 0, plus 0 times the value of the pixel on top,"],[330310,334960,"128, plus 1 times the value of the pixel in the upper right,"],[334960,339700,"255, and then repeating this process for each of the other pixels--"],[339700,344260,"minus 2 times 0, plus 0 times 128, the pixel in the middle,"],[344260,346990,"plus 2 times 255 for the pixels on the right,"],[346990,350750,"and then repeating the same process for the bottom row."],[350750,354500,"After we do all of that math and calculate it, the answer that we get"],[354500,357800,"is 1,020, a big number that's going to represent"],[357800,361460,"the fact that as we move from left to right along this pixel,"],[361460,364527,"we see a large change in the value of red."],[364527,367610,"And that's pretty good evidence that there is some sort of boundary that's"],[367610,369290,"happening here."],[369290,372740,"So how do we take this and apply it not just to one pixel,"],[372740,374645,"but to all of the pixels in the image?"],[374645,377270,"Well there are a couple of things that we need to keep in mind."],[377270,380587,"First of all, we've so far only done this calculation for red values."],[380587,382420,"And you'll imagine you'll probably also want"],[382420,385720,"to do the same calculation for the values in the green channel"],[385720,388030,"as well as for the values in the blue channel."],[388030,392350,"But also, thus far, we're only looking at changes in the x direction"],[392350,395380,"as we move from left to right, taking a look at whether there's"],[395380,399260,"a big increase or a big decrease in the value of red,"],[399260,401020,"green, or blue, for example."],[401020,403570,"But you could also imagine that there might be boundaries"],[403570,406360,"as we look in the y direction, from the top of the image"],[406360,407680,"to the bottom of the image."],[407680,410290,"We might find places where there are horizontal lines where"],[410290,414320,"we go from low values to high values or vise versa."],[414320,417670,"So in addition to a gx convolutional matrix, which"],[417670,420700,"is going to look for boundaries in the x direction,"],[420700,424360,"we're also going to want to introduce a gy matrix, which is going"],[424360,426880,"to look for changes in the y direction."],[426880,429100,"And the gy matrix is going to look very similar."],[429100,430480,"Just rotate it."],[430480,433600,"Here we're going to say, take all the values in the three pixels"],[433600,438850,"below this middle pixel, and multiply them by 1, 2, and 1 respectively,"],[438850,442840,"and take all the values in the row of three pixels above this middle pixel"],[442840,446530,"and multiply those by negative 1, negative 2, and negative 1"],[446530,450100,"respectively, the result of which is that we'll compute a value that"],[450100,454390,"will approximately represent how the value of red or green or blue"],[454390,458800,"is changing as we move from the pixels above a pixel to the pixels"],[458800,460390,"below a pixel."],[460390,463420,"And so we'll use these two matrices, gx and gy,"],[463420,466250,"to compute how much colors are changing."],[466250,468730,"How do you use these results to actually determine what"],[468730,471310,"the new value of each pixel should be?"],[471310,473410,"Well, for each pixel, you're going to want"],[473410,478360,"to compute gx and gy for each channel of red, green, and blue."],[478360,481390,"So ultimately, you're going to be computing six different values"],[481390,485290,"by applying the gx matrix to all of the red values,"],[485290,489940,"then to the green values and the blue values, and doing the same for gy."],[489940,492040,"Of course, as in the case with blur, there"],[492040,495520,"will be situations where we're looking at a pixel at the border, in the corner"],[495520,499570,"or at the edge of the image where there isn't a perfect 3-by-3 grid of pixels"],[499570,501500,"that surrounds it, for example."],[501500,504190,"In that case, for any pixels that are at the border,"],[504190,506170,"you should treat any pixel values that are"],[506170,510580,"beyond the border as having all zero values or being pure black,"],[510580,511475,"for example."],[511475,513850,"So for the pixel in the corner, in the upper left corner,"],[513850,517870,"for example, the pixel immediately above it, which doesn't exist,"],[517870,523760,"you should just treat as having all zero values, as being a solid black pixel."],[523760,526400,"Once you've computed these gx and gy values"],[526400,528560,"for each of red, green, and blue, you need"],[528560,533070,"to use those values to somehow compute the total amount of red, green,"],[533070,537660,"and blue that should be in the new pixel in the resulting image."],[537660,540290,"So to do that, we're going to use this formula."],[540290,544370,"You're going to compute each new channel value as the square root of gx"],[544370,546930,"squared plus gy squared."],[546930,550730,"So to compute the new value of red for a particular pixel,"],[550730,555020,"you're going to compute gx for that red pixel based on the original image,"],[555020,559130,"and you're going to compute gy for that red pixel based on the original image,"],[559130,562800,"square them both, add them together, and take the square root."],[562800,566390,"We're squaring each of them to make sure that the magnitude we end up with"],[566390,569300,"is a positive value because regardless of whether there's"],[569300,572180,"a big increase in red or a big decrease in red,"],[572180,575780,"we still want to represent that as a potential border from a lot of red"],[575780,577910,"to a little bit of red or vise versa."],[577910,581390,"And squaring the number makes sure we end up with a positive value."],[581390,584120,"And we're taking the square root to normalize."],[584120,587990,"Of course, as with the other filters, it may be the case that the value you get"],[587990,591440,"exceeds the maximum channel value of 255."],[591440,593600,"And in that case, you should be careful to make"],[593600,597740,"sure to cap the value you get at the number 255."],[597740,601340,"And you'll repeat the same process for red and green and blue"],[601340,604820,"for each of the original pixels, computing gx and gy"],[604820,608930,"based on the original image in order to calculate a new channel value"],[608930,611750,"for each pixel in the resulting image."],[611750,615230,"After you've done all of that, you should be able to test your program"],[615230,620480,"by running ./filter, -e for edges, and then providing the name of an input"],[620480,624830,"bitmap file as well as an output bitmap file that you're hoping to generate."],[624830,628010,"And if all goes well, you should see that you take the original image"],[628010,631730,"and highlight where all of the edges in that image are."],[631730,635410,"My name is Brian, and this was edges."]]},"ooL0r_8N9ms":{"edited":true,"zh":[[500,6300,"在 Recover 这道题里，我们误删了一张相机存储卡上的所有照片。"],[6300,12990,"你的任务是写一个程序，把这些照片找回来， 每张照片恢复成一个单独的 JPEG 文件。"],[12990,14530,"具体怎么做呢？"],[14530,19170,"首先，打开我们给你的存储卡镜像文件。"],[19170,24610,"然后在文件里查找，看看 JPEG 文件从哪里开始。"],[24610,29640,"一旦找到一张照片的开头，就新建一个 JPEG 文件来写入数据。"],[29640,33690,"每次往里写 512 个字节，"],[33690,38820,"直到发现下一张 JPEG。此时就能关闭前一个文件，改写新的文件。"],[38820,46230,"这样边找边写，直到读完整张卡。"],[46230,47880,"这些步骤怎么实现？"],[47880,51660,"我们先看看怎样打开存储卡镜像文件。"],[51660,59130,"可以用 fopen。第一个参数是要打开的文件名。"],[59130,67830,"第二个参数表示打开模式。这里用 \"r\"， 也就是读取模式，因为我们要从这个文件读数据。"],[67830,72450,"一边读取，一边要留意有没有遇到 JPEG。"],[72450,74740,"怎么判断一段数据是不是 JPEG 图像的开头呢？"],[74740,83830,"JPEG 有特定的文件头。它的第一个字节用十六进制表示是 0xff，"],[83830,86850,"第二个字节是 0xd8，"],[86850,89670,"第三个字节是 0xff。"],[89670,91710,"第四个字节的取值稍有不同。"],[91710,95490,"它可以是 0xe0、0xe1、0xe2……"],[95490,100440,"十六进制的高位是 e，低位可以变化，比如 0xef。"],[100440,102960,"这些都是这道题中可能遇到的 JPEG 文件头。"],[102960,113200,"所以，如果某个 512 字节的数据块开头出现这四个字节， 你就基本可以认定这里是一张 JPEG 的起点。"],[113200,116070,"我们再具体看看。"],[116070,124560,"刚才说过，JPEG 文件头的前三个字节依次是 0xff、0xd8、0xff。"],[124560,131009,"第四个可能是 0xe0、0xe1、0xe2，一直到 0xef。"],[131009,133560,"你要找的就是这种文件头。"],[133560,138150,"还有一个已知条件：卡里的 JPEG 是一张接一张存放的。"],[138150,142050,"一张结束后，下一张就开始，以此类推。"],[142050,147460,"它们就这样存在一块块 512 字节的数据里，直到文件末尾。"],[147460,152070,"利用这一点，该怎样从存储卡里找出 JPEG？"],[152070,156900,"想象一下，这张卡由许多个 512 字节的数据块组成。"],[156900,163850,"从卡的第一块开始，检查开头有没有 JPEG 文件头。"],[163850,168270,"如果没看到，就继续往后找，每次看一个块。"],[168270,175540,"直到遇到刚才那四个字节，就知道这个块是一张 JPEG 的开头。"],[175540,180360,"找到以后，就打开一个新的 JPEG 文件，准备往里写。"],[180360,186810,"接下来，每读到属于这张照片的数据块，就依次写进去。"],[186810,194260,"继续读下去，总会遇到另一个数据块， 开头的四个字节看起来也是 JPEG 文件头。"],[194260,202500,"这时就知道，下一张照片多半开始了， 上一张已经写完，可以关闭文件。"],[202500,209080,"接着打开新的 JPEG，把后面属于它的数据块写进去。"],[209080,210900,"就这样一块一块地往里写。"],[210900,217760,"继续往下找。再看到 JPEG 文件头，就开始写下一个文件。"],[217760,228090,"反复做下去，直到读到存储卡末尾，卡里的 JPEG 就都找出来了。"],[228090,231420,"那么，怎样从存储卡读取数据？"],[231420,236230,"可以用 fread。它有四个参数。"],[236230,238200,"第一个参数在这里叫 data。"],[238200,247020,"它是个指针，指向用来存放读入数据的地方， 比如用一个数组做缓冲区。"],[247020,254330,"第二个参数 size，表示每个待读元素占多少字节。"],[254330,260120,"第三个参数 number，表示这一次打算读多少个这样的元素。"],[260120,265403,"最后是 inptr，指向要从中读取数据的文件。"],[265403,271850,"还记得吗？我们要从存储卡镜像里每次读取 512 个字节。"],[271850,281330,"读入一块 512 字节的数据后，怎么判断它是不是一张 JPEG 的起点？"],[281330,284580,"还是靠 JPEG 特有的文件头。"],[284580,291380,"假设已经把这 512 个字节读入了缓冲区 buffer， 它可以是个字节数组。"],[291380,300320,"先看 buffer[0]，也就是第一个字节， 是不是 JPEG 开头的 0xff。"],[300320,307970,"再按同样的方法，检查第二个字节是不是 0xd8， 第三个字节是不是 0xff。"],[307970,311150,"第四个字节稍微麻烦一点。"],[311150,319490,"还记得吗？buffer[3] 有 16 种可能的取值， 从 0xe0、0xe1 一直往下。"],[319490,323780,"一开始，你可能会写一个布尔条件，"],[323780,333360,"逐个比较 buffer[3] 是 0xe0，还是 0xe1、0xe2、0xe3、0xe4……"],[333360,336770,"不过要这样检查 16 次，写起来很繁琐。"],[336770,340900,"可以用位运算来简化这个判断。"],[340900,346180,"把 buffer[3] 和 0xf0 做按位与运算。"],[346180,355730,"这样就只保留了这个字节的高 4 位，把低 4 位全部清零。"],[355730,365600,"因此，0xe0、0xe1、0xe2 等等，清掉低 4 位后都会变成 0xe0。"],[365600,370370,"把按位与的结果和 0xe0 比较，"],[370370,376940,"就知道这个字节是否符合 JPEG 文件头第四个字节的特征。"],[376940,385550,"如果四个字节的条件都满足，这个 512 字节的数据块 就很可能是一张新 JPEG 的开头。"],[385550,393140,"找到新 JPEG 的开头后，就要新建文件来保存它的数据。"],[393140,394910,"怎么创建新的 JPEG 文件呢？"],[394910,404375,"文件名有指定格式：三位数字加上 .jpg。 按找到图片的顺序，从 000.jpg 开始编号。"],[404375,412040,"所以你可以记录已经找到了多少张 JPEG， 这样就能按顺序给文件起名。"],[412040,416000,"如何生成“三位数字加 .jpg”这样的字符串？"],[416000,419360,"可以使用 sprintf 函数。"],[419360,425570,"它把格式化的结果写入字符串。 第一个参数就是存放这个结果的地方。"],[425570,427130,"这里用的是 filename。"],[427130,429340,"第二个参数是格式字符串。"],[429340,434990,"%03i 表示输出整数时至少占三位，不足三位就在前面补 0。"],[434990,440270,"比如 0、1、2 这些数，原本都只要一位就够了。"],[440270,443120,"最后一个参数是要代入的数字。"],[443120,451490,"如果传入 2，生成的文件名字符串就是 002.jpg。"],[451490,459050,"注意给 filename 留足空间，确保整个文件名都能放得下。"],[459050,464658,"有了文件名，就可以再调用 fopen 来创建文件。"],[464658,468500,"第一个参数仍然是要打开的文件名。"],[468500,474530,"这次第二个参数用 \"w\"，表示写入模式。"],[474530,480590,"这样就能把从存储卡找到的数据写进新文件。"],[480590,482720,"如何向文件写入数据？"],[482720,488960,"可以用 fwrite。它和 fread 的方向相反，用来把数据写入文件。"],[488960,492540,"fwrite 和 fread 一样，也有四个参数。"],[492540,499580,"第一个参数 data 是个指针，指向要写入文件的数据。"],[499580,503810,"接下来，要告诉 fwrite 每个待写元素有多大。"],[503810,510470,"第二个参数 size，表示每个元素占多少字节。"],[510470,514740,"然后是 number，表示要写入多少个元素。"],[514740,523432,"最后一个参数 outptr，是指向输出文件的指针， 这里通常就是刚才打开来写入的 JPEG 文件。"],[523432,529820,"这样依次写完各张 JPEG，直到读到输入文件末尾。"],[529820,533450,"怎么知道已经到文件末尾了呢？"],[533450,543200,"再来看一下 fread。我们用它读取题目给的存储卡镜像。"],[543200,545150,"fread 会返回什么？"],[545150,550880,"它返回成功读取的完整元素个数，每个元素的大小由 size 指定。"],[550880,554870,"我们请求读取 number 个元素，每个元素占 size 个字节。"],[554870,560840,"如果成功读到全部数据，fread 的返回值就是 number。"],[560840,568880,"比如，我要读取 255 个元素。如果全读到了，fread 就返回 255。"],[568880,577280,"假设一个元素占一字节。快到文件末尾时， 剩下的数据可能已经不够 255 个字节了。"],[577280,582625,"这种情况下，fread 的返回值就会小于 255。"],[582625,590660,"可以想想，用什么条件判断 fread 是否已读到文件末尾？"],[590660,597230,"把刚才的步骤放在一起，试着用伪代码描述 Recover 程序。"],[597230,600560,"第一步，打开存储卡镜像。"],[600560,605570,"然后，重复执行下面的步骤，直到卡的末尾。"],[605570,617780,"用 fread 一次读取 512 个字节， 存进一块能容纳这么多数据的缓冲区。"],[617780,620900,"然后查看刚读到的这 512 个字节。"],[620900,630800,"检查前四个字节，看它们是否符合 JPEG 文件头的特征。 如果符合，就找到了一张新 JPEG。"],[630800,637070,"如果这是第一张图片，就开始写第一个文件 000.jpg。"],[637070,647830,"如果此前已经找到过一张，就先关闭刚才正在写的文件， 再打开新的文件继续写。"],[647830,653620,"这就是读到新 JPEG 开头时要做的事。"],[653620,657580,"如果这一块不是新 JPEG 的开头，又该怎么办？"],[657580,662660,"如果之前已经找到 JPEG 并开始写了，就继续往那个文件里写。"],[662660,667690,"现在读到的就是这张 JPEG 的下一个 512 字节数据块。"],[667690,676130,"你可能会连续这样写很多次，因为一张 JPEG 在卡中往往占好几个块。"],[676130,680200,"整个过程就是每读入 512 个字节，就检查一次。"],[680200,687010,"遇到新 JPEG 的开头时按一种方式处理， 没有遇到时则按另一种方式处理。"],[687010,691460,"读到卡的末尾后，关闭所有还开着的文件。"],[691460,693427,"如果一切顺利，到这里就完成了。"],[693427,701800,"你会看到新生成的几个 JPEG 文件，打开就能查看恢复出来的照片。"],[701800,705420,"我是 Brian。以上就是 Recover。"]],"en":[[500,3120,"In recover, we've taken a memory card from a camera"],[3120,6300,"and accidentally deleted all of the images."],[6300,10020,"Your task is going to be to write a program to recover those images,"],[10020,12990,"generating new JPEG files for each."],[12990,14530,"How are you going to do that?"],[14530,16830,"Well, first, you're going to want to open the memory"],[16830,19170,"card file that we'll give to you."],[19170,21450,"Then, you're going to look through that memory card"],[21450,24610,"file for the beginning of a JPEG file."],[24610,27990,"Once you find a JPEG file, you're going to open a new JPEG file"],[27990,29640,"that you'r
