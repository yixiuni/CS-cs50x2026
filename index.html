se},{"label":"官方解答","id":"lVwv4o8vmvI","mp4":"https://cdn.cs50.net/2020/fall/labs/9/solution/birthdays-720p.mp4","low":"https://cdn.cs50.net/2020/fall/labs/9/solution/birthdays-360p.mp4","srt":"https://cdn.cs50.net/2020/fall/labs/9/solution/lang/en/birthdays.srt","zh":"","spoiler":true}],"note":""},{"week":9,"title":"Finance","page":"https://cs50.harvard.edu/x/2026/psets/9/finance/","videos":[{"label":"思路引导","id":"7wPTAwT-6bA","mp4":"https://cdn.cs50.net/2021/fall/walkthroughs/finance/finance-720p.mp4","low":"https://cdn.cs50.net/2021/fall/walkthroughs/finance/finance-360p.mp4","srt":"https://cdn.cs50.net/2021/fall/walkthroughs/finance/lang/en/finance.srt","zh":"","spoiler":false}],"note":""},{"week":"final","title":"Final Project","page":"https://cs50.harvard.edu/x/2026/project/","videos":[],"note":"官方题目页以文字说明项目要求、演示视频和提交流程。"}],"tracks":{"wSk1KSDUEYA":{"edited":true,"zh":[[360,1240,"你好，世界！"],[1240,4410,"我叫 Brian，由我来为大家讲解 CS50 的习题。"],[4410,7050,"每道题我都会先介绍要求，"],[7050,11850,"再带你梳理一下大致的解题思路，"],[11850,13840,"中间也会给一些提示。"],[13840,16230,"我们先来看 Hello 这道题。"],[16230,19230,"现在 hello.c 里有这样一段代码。"],[19230,23850,"main 函数会在屏幕上输出「hello, world」。"],[23850,25770,"这段代码要怎么运行呢？"],[25770,31350,"打开终端，输入 make hello，就能编译程序。"],[31350,34320,"编译完成后，就可以运行了。"],[34320,39570,"输入 ./hello，屏幕上就会出现「hello, world」。"],[39570,44460,"你的任务是修改程序，让它能和用户互动。"],[44460,48120,"具体来说，当你运行 ./hello 时，"],[48120,51180,"程序应该问一句「What is your name?」（你叫什么名字？）"],[51180,54210,"假设用户输入的名字是 Brian，"],[54210,56610,"程序就要输出「hello, Brian」。"],[56610,58320,"要做哪些事呢？"],[58320,63720,"第一步，询问用户的名字，让对方输入。"],[63720,68560,"第二步，在输出问候语时带上这个名字。"],[68560,70270,"具体怎么做呢？"],[70270,75030,"要读取用户的输入，可以用 get_string 函数。"],[75030,77700,"它来自 CS50 库，声明在头文件 cs50.h 里。"],[77700,84000,"调用 get_string 时，在函数名后面的括号里写一个参数。"],[84000,89580,"这个参数就是提示语， 用户会先看到它，然后再输入字符串。"],[89580,91500,"这里我们可以用英语问「你叫什么名字？」"],[91500,97140,"在 What is your name? 后面加上 \\n，表示换行。"],[97140,99300,"这行代码末尾需要加上分号。"],[99300,103530,"我们还要把 get_string 的返回值存进变量里。"],[103530,108520,"这里把变量命名为 name，类型是 string。"],[108520,111750,"这行代码会先问「What is your name?」"],[111750,114660,"用户输入自己的名字，按下回车，"],[114660,118588,"这个名字就存进了 name 变量。"],[118588,124050,"有了用户的名字，下一步就可以跟对方打招呼了。"],[124050,125307,"该怎么做呢？"],[125307,130080,"我们已经写过输出「hello, world」的代码了。"],[130080,135810,"printf 会把字符串输出到终端， 所以之前屏幕上显示的是「hello, world」。"],[135810,137940,"现在我们想换一句问候语。"],[137940,143740,"比如用户输入 Brian，就显示「hello, Brian」。 名字要跟着用户的输入变。"],[143740,146880,"这里可以用一个占位符。"],[146880,150560,"把「hello, world」改成「hello, %s」。"],[150560,158140,"%s 给字符串留了一个位置， 输出时这里会被实际的字符串替换。"],[158140,160020,"那么，这里要放哪一个字符串呢？"],[160020,162150,"要放的是 name 变量里保存的名字，"],[162150,165930,"因此把变量 name 作为另一个参数传给 printf。"],[165930,168510,"这样，这行代码会先输出 hello 和逗号，"],[168510,173250,"接着输出 name 变量里实际存储的名字。"],[173250,176550,"写好后就可以运行程序，测试一下。"],[176550,182040,"先用 make hello 编译，再输入 ./hello 运行。"],[182040,184320,"你应该会看到输入名字的提示。"],[184320,188200,"输入自己的名字，程序就会跟你打招呼了。"],[188200,191630,"我是 Brian，这就是 Hello 这道题。"]],"en":[[360,1240,"BRIAN: Hello, world."],[1240,4410,"My name is Brian, and I'll be your walk-through lead in CS50."],[4410,7050,"For each problem, I'll go through what's required,"],[7050,9780,"as well as giving you a high level overview of how you might"],[9780,11850,"solve each of the course's problems."],[11850,13840,"And I'll give you some hints along the way."],[13840,16230,"So let's begin with Hello."],[16230,19230,"Inside of hello.c, right now, we have this code,"],[19230,22590,"which is some code inside of a main function that prints out \"Hello, world\""],[22590,23850,"to the screen."],[23850,25770,"How can you actually run this code?"],[25770,28980,"Well, if you go to your terminal and run make_hello,"],[28980,31350,"this will compile your program."],[31350,34320,"Once you've compiled your program, you can run your program by running"],[34320,37860,"./hello, at which point you should see the words \"Hello, world\""],[37860,39570,"printed to the screen."],[39570,44460,"Your task in Hello is to modify this program to make it more interactive."],[44460,48120,"What we're going to have your program do instead is, when you run ./hello,"],[48120,51180,"the program should prompt by asking, \"What is your name?\""],[51180,54210,"The user will then type in their name, like Brian, for example,"],[54210,56610,"and the program will say \"Hello, Brian.\""],[56610,58320,"So what do you have to do?"],[58320,61680,"You'll, first, want to prompt the user for their name by asking for their name"],[61680,63720,"and letting them type it in, and then, you'll"],[63720,68560,"want to say hello to that user, giving their name in your printout statement."],[68560,70270,"So how might you actually do that?"],[70270,72240,"Well, to get input from the user, you can"],[72240,75030,"take advantage of the get_string function, defined"],[75030,77700,"in the CS50 library in CS50.h."],[77700,81180,"To use get_string, you'll write get_string, and get_string"],[81180,84000,"takes an argument, inside of parentheses,"],[84000,86610,"which will be the prompt, what's displayed to the user"],[86610,89580,"before they have to type in some_string, for example."],[89580,91500,"So our prompt, in this case, can be \"What"],[91500,94650,"is your name,\" followed by that backslash n character,"],[94650,97140,"which you might recall represents a new line."],[97140,99300,"This line needs to end with a semicolon, and we"],[99300,103530,"want to take the result of get_string and save it inside of a variable."],[103530,105780,"And we're going to save it inside of a variable called"],[105780,108520,"name whose type is string."],[108520,111750,"So a line like this will prompt the user by saying, \"What is your name?\""],[111750,114660,"The user will type in their name, and when they press Return,"],[114660,118588,"their name will be stored inside of that variable called name."],[118588,121380,"Once the user has typed in their name, the next thing we need to do"],[121380,124050,"is actually say \"Hello\" to that user."],[124050,125307,"How might we do that?"],[125307,127140,"Well, we already have code that says \"Hello,"],[127140,130080,"world,\" that looks something like this, printf prints"],[130080,133200,"out some string to the terminal screen, and the string"],[133200,135810,"\"Hello, world\" is what ultimately gets printed."],[135810,137940,"But instead of printing \"Hello, world,\" we instead"],[137940,140490,"want to print \"Hello, Brian,\" for example, or \"Hello\""],[140490,143740,"to whatever user's name was actually typed in."],[143740,146880,"So what we might do here, instead, is use a placeholder."],[146880,150560,"Here, instead of \"Hello, world,\" we're saying \"Hello, %s,\""],[150560,155280,"where %s is a place holder for a string, meaning we're going to plug in some"],[155280,158140,"string into this point of the string."],[158140,160020,"Now, what string are we going to plug in?"],[160020,162150,"We're going to plug in the string \"name,\""],[162150,165930,"so we provide the variable \"name\" as an additional argument to printf."],[165930,168510,"This whole line, now, is going to say \"Hello comma\""],[168510,173250,"and then plugging in whatever the value of the string \"name\" happens to be."],[173250,176550,"Once you do that, you should be able to test your program by running it."],[176550,182040,"First, compile it by running make_hello, then after it's compiled, run ./hello,"],[182040,184320,"and then, that should prompt you to type in your name."],[184320,188200,"Type in your name, and then your program should say \"Hello\" to you."],[188200,191630,"My name is Brian, and this was Hello."]]},"NAs4FIWkJ4s":{"edited":false,"zh":[[680,5060,"在马里奥，你的任务是重塑一个金字塔从超级马里奥兄弟。"],[5060,9560,"所以，在游戏\"超级马里奥兄弟\"中，你可能会记得一个金字塔看起来有点像这个东西。"],[9560,15370,"你的任务就是用屏幕上的井号（#）重塑那个金字塔。"],[15370,18468,"比如金字塔，可能看起来有点像这个。"],[18468,25250,"为了让事情更有趣一点，我们让用户选择他们希望金字塔有多高或有多短。"],[25250,33210,"应当允许用户输入1至8个包含的高度，并看到这个金字塔显示在适当的高度屏幕上。"],[33210,39230,"例如运行 ./mario，程序应提示用户输入金字塔的高度。"],[39230,44780,"如果它们输入的高度是8，比如，它们应该看到一个高度是8的金字塔，就像这个一样出现在屏幕上。"],[44780,54650,"如果用户运行./mario，然后打字和3高，那么这就是金字塔的结果，同一个金字塔，但高度是3而不是8。"],[54650,60710,"但你应该确保只允许1到8之间的高度，作为mario 程序的输入。"],[60710,70460,"如果运行 ./mario 后输入了无效高度，比如 -1，程序应再次提示用户输入高度。"],[70460,74540,"输入 0 也无效，同样要重新提示。"],[74540,77300,"输入的数太大时，也要再次提示。"],[77300,84080,"只有当他们给你一个数字在1到8之间包含，如果你的程序然后显示由此产生的金字塔。"],[84080,94052,"所以，你可能想做的第一件事是尝试写一些伪代码，用英语描述，比如语法，你的程序应该做什么，以便实现期望的行为。"],[94052,98900,"您可能想象到的您程序要做的第一件事是促使用户输入。"],[98900,102375,"他们需要打字在他们想要的金字塔的高度。"],[102375,107320,"可以使用 CS50 库中的 get_int 函数。"],[107320,111568,"get_int 函数将提示用户输入时输入整数。"],[111568,117470,"而get_int函数会自动处理，如果用户在非整数的事物中进行类型。"],[117470,125210,"例如，如果用户在字符或单词中输入，get_int将处理拒绝该输入，并促使用户再次输入某物。"],[125210,130759,"需要做的是增加一些逻辑，以确保高度在有效范围内。"],[130759,134450,"你只想接受1到8之间的高度"],[134450,141080,"如果高度超出这个范围，就再次提示用户输入高度。"],[141080,142790,"所以你的任务就是检查一下"],[142790,146970,"如果输入无效，就再次提示用户输入。"],[146970,154810,"一次又一次地做一些可能的事情，促使用户再次，一次又一次地，可能会提醒你一个循环。"],[154810,157580,"这样我们就可以考虑用循环来解决这个问题。"],[157580,165620,"例如，while 循环会在条件为真时重复执行一段代码。"],[165620,166940,"我们检查一下情况"],[166940,168800,"如果这是真的，那么我们运行代码。"],[168800,173000,"而这将导致重复这个零或更多次代码的区块。"],[173000,176780,"因为如果条件不正确，那我们根本不会运行这个循环。"],[176780,180860,"但是在马里奥，我们知道我们总是会运行这个循环至少一次。"],[180860,184140,"我们总是希望至少提示用户一次输入一个高度。"],[184140,187720,"如果高度无效，那么我们可能会再次促使用户。"],[187720,192410,"这里可以考虑用 while 的另一种形式：do…while 循环。"],[192410,197987,"它与 while 很相近，区别是循环体一定会先执行一次。"],[197987,199820,"然后我们检查一下情况"],[199820,204500,"如果条件为真，我们就会一遍又一遍地运行这个循环。"],[204500,206940,"那么，要怎样使用 do…while 呢？"],[206940,211070,"例如，下面用一个 do…while 循环读取正整数。"],[211070,213800,"首先声明一个名为 n 的变量。"],[213800,215182,"接下来写 do…while 循环。"],[215182,226160,"循环体中调用 get_int，提示用户输入正整数，并把结果存进 n。"],[226160,230063,"只要 n 小于 1，就继续循环。"],[230063,234300,"也就是说，运行完这段代码，再检查 n 是否小于 1。"],[234300,238130,"换句话说，它不是正整数，因为它小于一个？"],[238130,247550,"如果是，就再次提示输入正整数，一直重复到得到正整数为止。"],[247550,251600,"当然，马里奥的情况，你并不想得到一个正整数的提示。"],[251600,255170,"这里要读取的是 1 到 8 之间的整数。"],[255170,262385,"想想 do…while 的条件要怎么写，才能得到预期的效果。"],[262385,270020,"你将要填充到这个条件的，是所谓的布尔表达式，即编程中的表达式，无论是真还是假。"],[270020,272970,"而布尔表达式也有多个不同的品种。"],[272970,275450,"你可以检查一个变量是否等于某个东西。"],[275450,280130,"例如这里是一个布尔表达式，检查x是否等于零。"],[280130,286190,"布尔表达式也可以是类似的东西，是x小于0还是x大于0？"],[286190,290870,"你甚至可以使用两个或两个以上的布尔表达式，把它们结合在一起。"],[290870,294320,"比如说，这两个垂直条的意思就是或。"],[294320,298700,"因此，如果 x 是 0 或 x 是 1，这个表达式是真实的。"],[298700,301650,"这两个 & 符号组成的 && 表示逻辑「与」。"],[301650,308910,"换句话说，只有当x大于0，x小于10时，最后一个布尔表达式才会是真的。"],[308910,316350,"所以，想想 do…while 里该用什么布尔表达式，才能确保输入在 1 到 8 之间。"],[316350,320560,"高度无效时，就再次提示用户输入。"],[320560,325890,"一旦你让用户输入一个有效的高度，下一步将实际建造这个金字塔。"],[325890,330890,"结果发现，实际上建造与你所要建造的金字塔相反的金字塔就更容易了。"],[330890,334650,"这就是你试图建造的金字塔在那里一切都对齐。"],[334650,339870,"但事实证明，实际上建造一个左对齐的金字塔会比较容易一些。"],[339870,343410,"因此，让我们开始尝试建造这个左侧对齐的金字塔。"],[343410,345960,"你可能注意到的是，我们有很多行。"],[345960,348510,"每一行都有若干个井号（#）。"],[348510,355230,"所以我们可能要重复一些代码对于这个金字塔的每一行打印出适当的井号（#）数量。"],[355230,358980,"这里可以使用另一种循环，叫作 for 循环。"],[358980,362520,"for 循环可以把一段代码重复执行指定的次数。"],[362520,367210,"代码重复多少次取决于三个部分。"],[367210,370260,"for 循环的第一部分叫作初始化。"],[370260,374170,"这就是我们初始化或创建变量或变量的地方。"],[374170,381240,"这里要初始化一个变量，用来记录循环已经执行了多少次。"],[381240,383780,"循环的下一部分称为条件。"],[383780,390620,"这个条件是一个布尔表达式，它回答了这样一个问题，我们是否应该继续运行这个循环？"],[390620,395180,"每次我们到达下一轮循环时，我们首先要检查一下情况。"],[395180,398120,"如果条件为真，我们就要再执行一轮循环。"],[398120,401300,"如果条件为假，就停止循环。"],[401300,406930,"最后，我们有一个更新，这就是代码运行在循环的每一个迭代的结尾。"],[406930,412860,"理想的情况是，这很可能会更新我们在初始化阶段设置的变量。"],[412860,414180,"这看起来像什么？"],[414180,420030,"如果我要一个代码印出10次问候，比如说，代码可能看起来有点像这个。"],[420030,425450,"首先初始化计数变量 i，把它设为 0。"],[425450,430040,"只要 i 小于 10，这个循环就继续执行。"],[430040,431280,"更新步骤是什么？"],[431280,439730,"每次循环结束时执行 i++，也就是让 i 的值加 1。"],[439730,446720,"第一次循环 i 是 0，第二次是 1，依此类推，直到 i 等于 10。"],[446720,450450,"这时，由于10不低于10，条件失效。"],[450450,452070,"于是退出循环。"],[452070,455520,"所以这个代码会印出10次你好。"],[455520,457170,"那你想怎么办？"],[457170,458930,"嗯，你可能也想要一个循环。"],[458930,466640,"不过每一行要输出的是相应数量的井号（#），然后换行。"],[466640,468500,"应该输出多少个井号（#）呢？"],[468500,471590,"金字塔第一行需要一个井号。"],[471590,477740,"第二行需要两个井号，接下去依次增加，直到达到金字塔的高度。"],[477740,485290,"所以一旦你这样做，你应该能够编译和运行你的Mario程序，并看到一个左向对齐的金字塔，高度为1，2，3，4，5，"],[485290,487880,"6，7，或8个。"],[487880,489330,"但那是左侧的金字塔"],[489330,491960,"我们要做的是右侧对齐金字塔。"],[491960,496820,"下一步是右向对齐这个金字塔，增加一些点。"],[496820,500820,"我的意思是，现在，我们的金字塔看起来像这样。"],[500820,504170,"这里的金字塔高度是 7，整个图形靠左对齐。"],[504170,515059,"我们现在要做的是更新我们的mario.c 使其右向对齐，沿着行的左侧添加一些点，这样整个金字塔现在都正确对齐了。"],[515059,518720,"要在 mario.c 中改动什么呢？"],[518720,524570,"现在，每行，你都会打印出一些井号（#），然后换行。"],[524570,531110,"在这里你需要改变的是，在你打印出这些井号（#）之前，你需要打印出适当的点数。"],[531110,534620,"当然，这里的自然问题就是，你打印出多少个点？"],[534620,536570,"需要输出多少个井号？"],[536570,539690,"归根结底，这取决于两件事。"],[539690,542630,"将首先取决于金字塔的高度。"],[542630,546450,"这取决于你现在的排行数。"],[546450,547700,"让我举个例子。"],[547700,550220,"这里，我们有7个高度。"],[550220,553010,"每排有多少点和井号（#）？"],[553010,563960,"第一行从 0 开始编号，因为在计算机科学中常从 0 开始计数。这一行有六个点和一个井号。"],[563960,567020,"第一行，我们有五个点和两个井号（#）。"],[567020,571680,"第二行，我们有四个点和三个井号（#），等等。"],[571680,575060,"你可以画出这种图来画其他高度的金字塔。"],[575060,587540,"例如，试一试3个高点，或者8个高点，看看能不能想出某种图案或者某种公式，在那里你可以拿金字塔的高度和行号来判断你需要多少点，在那一行中"],[587540,589613,"以及这一行需要多少个井号。"],[589613,600140,"一旦你能够实施，你应该可以运行你的马里奥程序，并看到这个右侧的金字塔与点对齐，以便将所有行移到右侧。"],[600140,604112,"最后，马里奥的最后一步就是去除那些点。"],[604112,610670,"现在，你的金字塔看起来有点像这个右侧的井号（#）金字塔和点沿左边。"],[610670,621695,"你要做的就是修改mario.c以空格取代那些点这样你就能找到一个右侧对齐的金字塔它看起来就像超级马里奥兄弟的金字塔一样"],[621695,624320,"一旦你这样做，你应该能够测试你的程序。"],[624320,626330,"先运行 make mario 编译程序。"],[626330,633350,"当你运行./mario时，你应该可以打字和打高，并看到由此形成的右向对齐的金字塔。"],[633350,636910,"我叫布莱恩，这是马里奥。"]],"en":[[680,2990,"BRIAN: In Mario, your task is going to be to recreate"],[2990,5060,"a pyramid from Super Mario Brothers."],[5060,7130,"So in the game Super Mario Brothers, you might"],[7130,9560,"recall a pyramid that looks a little something like this."],[9560,11420,"And your task in this problem is going to be"],[11420,15370,"to recreate that pyramid using hashes on the screen."],[15370,18468,"So the pyramid, for example, might look a little something like this."],[18468,20510,"And to make things a little bit more interesting,"],[20510,23840,"we're going to let the user choose how tall or short"],[23840,25250,"they want the pyramid to be."],[25250,29330,"The user should be allowed to input any height between one and eight inclusive"],[29330,33210,"and see this pyramid displayed to the screen of the appropriate height."],[33210,36680,"So for example, if you run the program dot slash Mario,"],[36680,39230,"the program should prompt the user to type in a height."],[39230,41360,"If they type in height of eight, for example,"],[41360,44780,"they should see a pyramid of height 8 just like this appear on the screen."],[44780,47750,"If the user were to instead run dot slash Mario"],[47750,51080,"and then type and a height of three, then this is the pyramid"],[51080,54650,"should result, the same pyramid but with a height of three instead of eight."],[54650,57590,"But you should make sure to only allow heights between one"],[57590,60710,"and eight inclusive as inputs to the Mario program."],[60710,63430,"If someone were to run dot slash Mario, for example,"],[63430,67010,"but provided invalid input, like negative 1, for example,"],[67010,70460,"then your program should reprompt to the user to type in another height."],[70460,73430,"If they type in zero, for example, also not a valid height,"],[73430,74540,"you should reprompt."],[74540,77300,"And if the type a number that's too big, you should also reprompt."],[77300,79880,"And only when they give you a number between one and eight"],[79880,84080,"inclusive, should your program then display the resulting pyramid."],[84080,86000,"So the first thing you might want to do is"],[86000,89930,"try writing some pseudocode to describe in English like syntax"],[89930,94052,"what your program should do in order to implement the desired behavior."],[94052,97010,"The first thing that you might imagine that your program is going to do"],[97010,98900,"is prompting the user for input."],[98900,102375,"They need to type in the height of the pyramid that they want."],[102375,104750,"In order to do that, you can take advantage of a function"],[104750,107320,"in the CS50 library called Get Int."],[107320,111568,"The Get Int function will prompt the user to type in an integer as input."],[111568,113360,"And the Get Int function will automatically"],[113360,117470,"take care of handling if the user types in something that isn't an integer."],[117470,119420,"If the user types in a character or a word,"],[119420,122630,"for example, Get Int will handle rejecting that input"],[122630,125210,"and prompting the user to type in something again."],[125210,127850,"What you'll need to do is add some additional logic"],[127850,130759,"to make sure that the height is within a valid range."],[130759,134450,"You only want to accept heights between one and eight inclusive."],[134450,137480,"And if the height the user types in is outside of that range,"],[137480,141080,"then you'll want to reprompt the user to type in another height."],[141080,142790,"So your task is going to be to check."],[142790,146970,"If the input is invalid, we should reprompt the user for another input."],[146970,150230,"And this idea of doing something potentially again and again and again,"],[150230,154810,"prompting the user one more time, one more time, might remind you of a loop."],[154810,157580,"And so we could think about using a loop to solve this problem."],[157580,160100,"For example, here is a while loop, an example"],[160100,163260,"of a loop that will continue to repeat a block of code"],[163260,165620,"so long as a particular condition is true."],[165620,166940,"We check the condition."],[166940,168800,"If it's true, then we run the code."],[168800,173000,"And this will result in repeating this block of code zero or more times."],[173000,176780,"Because if the condition is false, then we're not going to run the loop at all."],[176780,180860,"But in Mario, we know that we're always going to run this loop at least once."],[180860,184140,"We always want to prompt the user at least once to type in a height."],[184140,187720,"And if the height is invalid, then we might end up prompting the user again."],[187720,191090,"So to do that, we might try to use a sister of the while loop,"],[191090,192410,"the do while loop."],[192410,194480,"Very similar in spirit, the only difference"],[194480,197987,"here is that we're always going to run this block of code at least once."],[197987,199820,"And then we're going to check the condition."],[199820,203390,"And if the condition is true, then we're going to run this loop again and again"],[203390,204500,"and again."],[204500,206940,"So how could you actually use a do while loop?"],[206940,211070,"Well, here's an example of a do while loop that gets a positive integer."],[211070,213800,"We first declare a variable called n."],[213800,215182,"And here's our do while loop."],[215182,216890,"We're going to repeat this block of code,"],[216890,220120,"letting n equal Get Int positive number, meaning"],[220120,222620,"we're going to prompt the user to type in a positive number,"],[222620,226160,"and save whatever they type in inside of the variable n."],[226160,230063,"And we're going to keep repeating this while n is less than one."],[230063,232730,"In other words, after we've run this code, we're going to check,"],[232730,234300,"is n less than one?"],[234300,238130,"In other words, is it not a positive integer because it's less than one?"],[238130,241190,"And if so, then we should reprompt the user asking them"],[241190,243500,"to type in a positive number again and keep"],[243500,247550,"doing this over and over and over until we get a positive integer."],[247550,249830,"Of course, the case of Mario, you don't want a prompt"],[249830,251600,"for just a positive integer."],[251600,255170,"You want to prompt for an integer in the range of one to eight."],[255170,258529,"So you want to think about what you could fill into that condition"],[258529,262385,"in order to get this do while loop to behave the way you would expect it to."],[262385,264260,"What you're going to fill into this condition"],[264260,267950,"is what's called a Boolean expression, an expression in programming that"],[267950,270020,"is either true or false."],[270020,272970,"And Boolean expressions have a number of different varieties."],[272970,275450,"You could check if a variable is equal to something."],[275450,277660,"Here, for example, is a Boolean expression"],[277660,280130,"that checks if x is equal to zero."],[280130,284090,"Boolean expressions can also be things like, is x less than zero"],[284090,286190,"or is x greater than zero?"],[286190,289190,"And you can even take two or more Boolean expressions"],[289190,290870,"and combine them together."],[290870,294320,"Here, for example, these two vertical bars mean or."],[294320,298700,"So this expression is true if x is zero or x is one."],[298700,301650,"And these two ampersand symbols mean and."],[301650,303750,"In other words, this last Boolean expression"],[303750,308910,"will be true only if x is greater than zero and x is less than 10."],[308910,312240,"So think about what Boolean expression you might use inside of your"],[312240,316350,"do while loop to make sure that the input is between one and eight."],[316350,320560,"And if it's not, you should reprompt the user to type in another height."],[320560,322980,"Once you've gotten the user to input a valid height,"],[322980,325890,"the next step is going to be actually building this pyramid."],[325890,328950,"And it turns out, it's actually easier to build the opposite"],[328950,330890,"of the pyramid you're trying to build."],[330890,332790,"So here's the pyramid you're trying to build"],[332790,334650,"where everything is right aligned."],[334650,336900,"But it turns out, it's actually a little bit easier"],[336900,339870,"to build a pyramid that is left aligned instead."],[339870,343410,"So let's start by trying to build this left aligned pyramid."],[343410,345960,"What you might notice is that we have a number of rows."],[345960,348510,"And on each row, we have some number of hashes."],[348510,352620,"And so we're probably going to repeat some code for every row in this pyramid"],[352620,355230,"printing out the appropriate number of hashes."],[355230,358980,"To do that, we can use a different kind of loop called a for loop."],[358980,362520,"A for loop repeats a certain block of code some number of times."],[362520,367210,"And how many times that code repeats depends upon three parts."],[367210,370260,"The first part of the for loop is called the initialization."],[370260,374170,"This is where we initialize or create a variable or variables."],[374170,376340,"And in this case, we'll initialize a variable"],[376340,381240,"that's going to keep track of how many times our loop has run so far."],[381240,383780,"The next part of the for loop is called the condition."],[383780,387830,"The condition is a Boolean expression that answers the question of,"],[387830,390620,"should we continue to run this loop?"],[390620,393350,"Every time we get to the next iteration of the loop,"],[393350,395180,"we're first going to check the condition."],[395180,398120,"And if the condition is true, then we're going to run the loop again."],[398120,401300,"But if the condition is false, then we're going to stop."],[401300,403730,"And finally, we have an update, which is what"],[403730,406930,"code runs at the end of every iteration of the loop."],[406930,410300,"And ideally, this is probably going to be updating that variable that we"],[410300,412860,"set up in the initialization step."],[412860,414180,"So what might this look like?"],[414180,417830,"Well, if I wanted some code that printed hello 10 times, for example,"],[417830,420030,"the code might look a little something like this."],[420030,422300,"We first initialize a counting variable that we're"],[422300,425450,"going to call i and set it equal to zero initially."],[425450,430040,"And we're going to keep repeating this for loop as long as i is less than 10."],[430040,431280,"And what's the update step?"],[431280,433280,"Well, at the end of every iteration of the loop,"],[433280,437690,"we're running i plus plus, which means take the value of i and increment it"],[437690,439730,"or increase it by one."],[439730,443155,"So the first time the loop runs, i is equal to zero, the second time i"],[443155,446720,"is equal to one, so on and so forth until i is equal to 10."],[446720,450450,"At which point, the condition fails because 10 is not less than 10."],[450450,452070,"And so we exit our for loop."],[452070,455520,"So this code will print hello 10 times."],[455520,457170,"So what do you want to do?"],[457170,458930,"Well, you also probably want a for loop."],[458930,461420,"But for each row rather than printing hello,"],[461420,464240,"you're going to want to print out the appropriate number of hashes"],[464240,466640,"and then print out a new line."],[466640,468500,"How many hashes do you want to print out?"],[468500,471590,"Well, on the first row of the pyramid, you probably want one hash."],[471590,474770,"On the second row, you want two hashes so on and so forth up"],[474770,477740,"until the entire height of that pyramid."],[477740,481520,"So once you do that, you should be able to compile and run your Mario program"],[481520,485290,"and see a left aligned pyramid of a height of one, two, three, four, five,"],[485290,487880,"six, seven, or eight."],[487880,489330,"But that's a left aligned pyramid."],[489330,491960,"And what we're going for is a right aligned pyramid."],[491960,496820,"So the next step is going to be to right align this pyramid by adding some dots."],[496820,499160,"And what I mean by that is that, right now, our pyramid"],[499160,500820,"looks a little something like this."],[500820,504170,"Here's a pyramid of height seven that's entirely left aligned."],[504170,507290,"What we're going to do now is update our Mario dot see program"],[507290,511610,"to right align it by adding some dots along the left side of the rows"],[511610,515059,"such that the entire pyramid is now right aligned."],[515059,518720,"What change does this require inside of your Mario dot see program?"],[518720,522409,"Well, right now, for every row, you're printing out some number of hashes,"],[522409,524570,"and then you're printing out a new line."],[524570,528230,"What you'll need to change here is that before you print out those hashes,"],[528230,531110,"you'll need to print out the appropriate number of dots."],[531110,534620,"Of course, the natural question here is, how many dots do you print out?"],[534620,536570,"And how many hashes do you print out?"],[536570,539690,"Well, ultimately, that's going to depend upon two things."],[539690,542630,"It's going to depend first on the height of the pyramid."],[542630,546450,"And it's going to depend second on what row number you're currently on."],[546450,547700,"Let me give you an example."],[547700,550220,"Here, we have a height of seven."],[550220,553010,"And how many dots and hashes are in each row?"],[553010,556580,"Well, in the first row, which I'll call row zero, because in computer science,"],[556580,560870,"we often zero index things so that the first row is called row zero,"],[560870,563960,"we have six dots and then one hash mark."],[563960,567020,"In row one, we have five dots and two hash marks."],[567020,571680,"In row two, we have four dots and three hash marks, so on and so forth."],[571680,575060,"And you can draw this sort of diagram for pyramids of other heights as well."],[575060,577970,"Try one for a height of three, for example, or a height of eight"],[577970,581660,"and see if you can come up with some sort of pattern or some sort of formula"],[581660,584990,"where you can take the height of the pyramid and the row number"],[584990,587540,"to figure out how many dots you need in that row"],[587540,589613,"and how many hashes you need in that row."],[589613,591530,"Once you're able to implement that, you should"],[591530,595160,"be able to run your Mario program and see this right aligned pyramid"],[595160,600140,"with dots in order to shift all of the rows to the right."],[600140,604112,"Finally, the last step of Mario is just going to be removing those dots."],[604112,606320,"That right now, your pyramid looks a little something"],[606320,610670,"like this with a right aligned hash mark pyramid and dots along the left side."],[610670,612590,"And what you'll need to do is just modify"],[612590,615950,"Mario dot see to replace those dots with spaces"],[615950,618080,"so that you end up with a right aligned pyramid"],[618080,621695,"that looks the way the pyramid from Super Mario Brothers also looked."],[621695,624320,"Once you've done that, you should be able to test your program."],[624320,626330,"Compile your program by running make Mario."],[626330,630180,"And then when you run dot slash Mario, you should be able to type and a height"],[630180,633350,"and see the resulting right aligned pyramid."],[633350,636910,"My name is Brian, and this was Mario."]]},"FzN9RAjYG_Q":{"edited":false,"zh":[[500,7690,"在马里奥，你的任务是在C程序代码中重新执行一些来自游戏\"超级马里奥兄弟\"的金字塔。"],[7690,14785,"所以我们要在超级马里奥兄弟会中登上这个舞台，并拿下这两个金字塔，代表他们使用屏幕上的井号（#）。"],[14785,22420,"所以，你会想建立一个金字塔，它看起来有点像这个，左金字塔和右金字塔，以及它们之间的缺口。"],[22420,24080,"你的程序应该如何运作？"],[24080,31120,"用户运行 ./mario 后，程序应提示输入高度，取值为 1 到 8（含两端）。"],[31120,42207,"例如，如果它们输入数字8，这就是应该打印到屏幕上的东西——两个金字塔——一个右对齐，一个左对齐——中间用两个空格分隔，高度为8。"],[42207,49600,"当然，如果用户输入了不同的数字 - 例如，如果用户输入的高度是3，那你应该显示两个金字塔，高度是3，"],[49600,52670,"例如，还有两个空格之间的空格。"],[52670,64390,"但如果用户键入一个无效的输入 - 例如，他们给你一个负数，或者给你一个零，或者给你一个太大的数字 - 那你应该继续拒绝该输入，并重新提示用户输入一个数字"],[64390,68200,"直到用户给您一个在1到8之间的数字。"],[68200,73100,"一旦他们这样做，那么你的程序应该显示金字塔适当的高度。"],[73100,74850,"那你打算怎么做呢？说说看"],[74850,83710,"您程序的第一步可能将会促使用户输入，要求他们输入他们希望他们的金字塔有多高或短。"],[83710,88620,"为了做到这一点，可以使用CS50库中定义的get_int函数。"],[88620,93190,"get_int 会提示用户输入一个整数。"],[93190,98150,"它会自动处理那些输入中非整数的用户。"],[98150,107050,"因此，如果用户在字符或单词中进行键入，例如get_int会自动处理拒绝该输入，并重新提示用户输入另一个数字。"],[107050,115630,"然而，要由您来检查，以确保用户输入的整数是在1至8(包含)的有效范围内。"],[115630,123700,"如果用户在某个数字中键入该范围以外的数字，则由您重新提示用户，请他们以另一个整数键入。"],[123700,124940,"你怎么可以这么做？"],[124940,133780,"可以考虑 do…while 循环：循环体至少运行一次，之后是否重复由条件决定。"],[133780,144860,"在 do…while 的循环体中提示输入，再用条件判断是否要请用户重新输入一个整数。"],[144860,148870,"我由你来决定到底该是什么状况"],[148870,156610,"一旦用户在1到8之间的某个有效高度打字，下一步将实际建造那个金字塔。"],[156610,159370,"最终，这就是一个金字塔样本的模样。"],[159370,161680,"在这种情况下，我们有一个高度7的金字塔。"],[161680,170510,"但我会继续用点来替换空格这样我们就能看到每一个你负责打印到屏幕的字符。"],[170510,176290,"注意，每行都有代表左侧金字塔前空格的点数。"],[176290,180730,"然后，我们有一些井号（#）代表左侧金字塔本身。"],[180730,188620,"然后，在每行，我们有两个空格或两个点代表在这里，把金字塔的左半部和金字塔的右半部分开。"],[188620,192057,"然后，我们有一些井号（#）代表右侧金字塔。"],[192057,196900,"你不需要担心在右侧金字塔后增加空格，因为没有人会看到这些。"],[196900,199960,"那从你需要做什么的角度来说，这是什么意思？"],[199960,203680,"每一行，你都会想打印一些空格。"],[203680,206410,"然后，打印适当的左井号（#）数。"],[206410,208600,"然后打印两个空格。"],[208600,211600,"然后输出组成右侧金字塔的井号。"],[211600,215380,"但你怎么知道你应该打印多少空格或井号（#）？"],[215380,224003,"好吧，你会想考虑，鉴于金字塔的高度以及你现在的排数，你如何计算出该排的空格数，"],[224003,228940,"左侧和右侧金字塔，在这一行各有多少个井号呢？"],[228940,231310,"为此，不妨举出一些例子。"],[231310,234070,"画高3或高4或高8的金字塔。"],[234070,240490,"看看能否找出规律或公式，算出需要多少个空格、多少个井号。"],[240490,249020,"在代码中执行后，结果应该是你有一个金字塔它看起来像一个... 一个左金字塔和一个右金字塔由两个空格分隔开来。"],[249020,258620,"你可以先通过运行 make mario 来测试你的代码，然后运行./mario，在1到8之间的高度打字，"],[258620,263230,"然后看看产生的金字塔是否与你期望它的样子相符。"],[263230,264340,"我叫布莱恩"],[264340,267300,"这是马里奥。"]],"en":[[500,2220,"BRIAN: In Mario, your task is going to be"],[2220,5460,"to re-implement some pyramids from the game Super Mario Brothers"],[5460,7690,"in code in a C program."],[7690,10650,"So we're going to take this stage in Super Mario Brothers"],[10650,12990,"and take those two pyramids and represent"],[12990,14785,"them using hash marks on the screen."],[14785,17910,"So you'll want to create a pyramid that looks a little something like this,"],[17910,22420,"with a left pyramid and a right pyramid and a gap in between them."],[22420,24080,"How should your program work?"],[24080,28330,"Well, if the user runs a ./Mario, they should be prompted to type in a height,"],[28330,31120,"any number between 1 and 8 inclusive."],[31120,33313,"If they type in the number 8, for example,"],[33313,35230,"this is what should be printed to the screen--"],[35230,38170,"two pyramids-- one right aligned, one left aligned--"],[38170,42207,"separated by two spaces in the middle with a height of 8."],[42207,44540,"And of course, if the user typed in a different number--"],[44540,47260,"for example, if the user typed in a height of 3,"],[47260,49600,"then you should display two pyramids with a height of 3,"],[49600,52670,"for example, also with the two-space gap in between."],[52670,55130,"But if the user types an invalid input--"],[55130,58060,"for example, they give you a negative number, or they give you zero,"],[58060,60040,"or they give you a number that's too big--"],[60040,62050,"then you should continue to reject that input"],[62050,64390,"and re-prompt the user to type in a number"],[64390,68200,"until the user gives you a number between 1 and 8 inclusive."],[68200,70690,"Once they do, then your program should display"],[70690,73100,"the pyramids of the appropriate height."],[73100,74850,"So how are you going to do this?"],[74850,76600,"The first step of your program is probably"],[76600,79480,"going to be prompting the user for input, asking them"],[79480,83710,"to type in how tall or short they want their pyramid to be."],[83710,86680,"In order to do this, you can use the GetInt function,"],[86680,88620,"defined in the CS50 library."],[88620,93190,"The GetInt function is going to ask the user to type in an Int as input."],[93190,96580,"And it's automatically going to handle dealing with users that type in input"],[96580,98150,"that are not integers."],[98150,101110,"So if the user types in a character or a word, for example,"],[101110,104020,"GetInt will automatically take care of rejecting that input"],[104020,107050,"and re-prompting the user to type in another number."],[107050,109720,"However, it's up to you to check to make sure"],[109720,111880,"that the integer that the user does type in"],[111880,115630,"is inside the valid range of 1 to 8 inclusive."],[115630,118600,"If the user types in a number that's outside of that range,"],[118600,120790,"then it's up to you to re-prompt the user,"],[120790,123700,"to ask them to type in another integer."],[123700,124940,"How might you do that?"],[124940,127600,"Well, you might consider using a do while loop,"],[127600,131500,"which is a loop that runs at least once and might continue to repeat"],[131500,133780,"if some particular condition is true."],[133780,136510,"You might imagine inside the body of the do while loop,"],[136510,139000,"prompting the user to type in a number, and then"],[139000,142630,"having some condition that checks to see whether or not you should re-prompt"],[142630,144860,"the user to type in another integer."],[144860,148870,"I leave it up to you to figure out what that condition should actually be."],[148870,152950,"Once the user has typed in some valid height between 1 and 8 inclusive,"],[152950,156610,"the next step is going to be actually building that pyramid."],[156610,159370,"Ultimately, this is what a sample pyramid is going to look like."],[159370,161680,"In this case, we have a pyramid of height 7."],[161680,164680,"But I'll go ahead and replace the spaces with dots"],[164680,167770,"so that we can visually see every character that you're going to be"],[167770,170510,"responsible for printing to the screen."],[170510,172900,"Notice that on every row, we have some number"],[172900,176290,"of dots representing the space before the left pyramid."],[176290,180730,"Then, we have some number of hashes representing the left pyramid itself."],[180730,185110,"Then, on every row, we have two spaces or two dots represented here"],[185110,188620,"to separate the left half of the pyramid from the right half of the pyramid."],[188620,192057,"And then, we have some number of hashes representing the right pyramid."],[192057,194890,"You don't need to worry about adding spaces after the right pyramid,"],[194890,196900,"because nobody will see those."],[196900,199960,"So what does that mean in terms of what you need to do?"],[199960,203680,"Well, for each row, you'll want to print some number of spaces."],[203680,206410,"Then, print the appropriate number of left hashes."],[206410,208600,"Then, print a gap of two spaces."],[208600,211600,"And then, print all the hashes to make up the right pyramid."],[211600,215380,"But how do you know how many spaces or hashes you should print?"],[215380,218320,"Well, you'll want to think about, given the height of the pyramid"],[218320,220690,"and given what row number you're currently on,"],[220690,224003,"how can you calculate the number of spaces that should be on that row,"],[224003,226420,"how many hashes should be on the left side of the pyramid,"],[226420,228940,"and how many hashes should be on the right side of the pyramid?"],[228940,231310,"And for this, it might be helpful to draw some examples."],[231310,234070,"Draw a pyramid of height 3 or 4 or 8."],[234070,236920,"And see if you can come up with some sort of pattern or formula"],[236920,240490,"that will let you calculate how many spaces and hashes you'll need."],[240490,242420,"After you implement that in code, the result"],[242420,245170,"should be that you have a pyramid that looks something like this--"],[245170,249020,"a left pyramid and a right pyramid separated by two spaces."],[249020,252790,"And you can test your code by first compiling it by running Make Mario,"],[252790,258620,"and then running ./Mario, typing in some height between 1 and 8 inclusive,"],[258620,261790,"and then seeing whether the resulting pyramid matches what you expect it"],[261790,263230,"to look like."],[263230,264340,"My name is Brian."],[264340,267300,"And this was Mario."]]},"dF7wNjsRBjI":{"edited":true,"zh":[[500,12210,"在 Credit 这道题里，你会拿到一个信用卡号，要判断它属于 American Express、Mastercard、Visa，还是其他情况。"],[12210,13600,"该怎么判断呢？"],[13600,16320,"各种信用卡的卡号都有一定的规律。"],[16320,23850,"例如，American Express 通常是 15 位，以 34 或 37 开头。"],[23850,30557,"Mastercard 通常是 16 位，常见的开头有 51、52、53、54 和 55。"],[30557,39670,"有些 Mastercard 卡号遵循其他规则。这道题只考虑刚才列出的这些情况。"],[39670,45810,"最后，题目中的 Visa 卡号是 13 位或 16 位，以 4 开头。"],[45810,51630,"不过，随便写出一个以 4 开头的 13 位数字，它就一定是 Visa 卡号吗？"],[51630,58310,"有效的卡号还得通过一项校验。卡号各位数字之间要满足某种关系，"],[58310,63540,"我们可以据此检查这串数字有没有可能是有效卡号。"],[63540,67450,"怎么做这项校验呢？步骤是这样的。"],[67450,73560,"从卡号的倒数第二位开始，隔一位取一个数字，把取到的每个数字乘以 2。"],[73560,77760,"把每个乘积拆成各位数字，再把这些数字加起来。"],[77760,82770,"然后，把卡号中那些没有乘 2 的数字也加进来。"],[82770,90490,"如果最后算出的和以 0 结尾，卡号就通过校验，否则就是无效卡号。"],[90490,96300,"我们拿屏幕上的卡号做个例子，实际算一遍。"],[96300,101520,"首先从倒数第二位开始，隔一位取一个数。"],[101520,107340,"从右向左，取到的是 1、0、0、0、0、6、0 和 4。"],[107340,111790,"把它们分别乘以 2。"],[111790,116810,"接下来，把各个乘积的每一位数字加起来。"],[116810,121870,"也就是 8 + 0 + 1 + 2。这里的 1 和 2 是把乘积 12 拆开得到的。"],[121870,127930,"再加上 0、0、0、0 和 2，得到 13。"],[127930,133690,"在 13 的基础上，把原卡号中那些没有乘 2 的数字也加进来。"],[133690,142810,"即 13 + 0 + 3 + 0 + 0 + 0 + 0 + 0 + 4，得到 20。"],[142810,151120,"最终结果的个位是 0，所以这个号码通过了校验，有可能是有效卡号。"],[151120,158165,"所以，这道题里的一项任务，就是判断给定的卡号能否通过校验。"],[158165,163180,"为此，你得从一个很大的整数中取出各位上的数字。"],[163180,166190,"怎么取呢？"],[166190,174670,"看看这个卡号，我们怎样才能单独取到它最右边的 4？"],[174670,182470,"想一想，一个正整数除以 10 的余数，就是它最右边的数字。"],[182470,188170,"这里用卡号除以 10，余数正好是 4，也就是它的个位。"],[188170,193750,"在 C 里，可以用取余运算符 % 得到整数相除的余数。"],[193750,202060,"所以让这个大整数对 10 取余，就能得到 4。"],[202060,207042,"这样，我们就知道怎样取出一个大整数的最后一位了。"],[207042,213640,"倒数第二位、倒数第三位又该怎么取？这部分留给你自己想。"],[213640,216100,"回到题目，程序需要做什么？"],[216100,220870,"首先，提示用户输入信用卡号。"],[220870,231090,"然后计算校验和，看它的个位是不是 0，以此判断这个号码有没有可能有效。"],[231090,241350,"还要检查卡号的长度和开头的数字，看它符合哪一种卡的规则。"],[241350,246420,"卡号既要通过校验，又要符合相应的长度和开头要求。"],[246420,253020,"符合 American Express 的规则就输出 AMEX，属于 Mastercard 就输出 MASTERCARD，属于 Visa 就输出 VISA。"],[253020,257880,"三种都不符合，就输出 INVALID。"],[257880,266100,"最后，找一些有效和无效的示例卡号测试程序，看结果是否正确。"],[266100,269630,"我是 Brian，这就是 Credit。"]],"en":[[500,3960,"BRIAN: In credit, your task is going to be to take a credit card number"],[3960,6930,"and determine whether that number is an American Express credit card"],[6930,10950,"number, a MasterCard number, a Visa number or maybe, something else"],[10950,12210,"entirely."],[12210,13600,"How are you going to do this?"],[13600,16320,"Well, credit card numbers follow particular patterns."],[16320,20160,"American Express card numbers, for example, are generally 15 digits,"],[20160,23850,"and start with the digits 3, 4 or 3, 7."],[23850,26610,"MasterCard numbers will usually have 16 digits,"],[26610,30557,"and often start with 51, 52, 53, 54, or 55."],[30557,33390,"Of course, there are other MasterCard numbers that don't necessarily"],[33390,36250,"follow this pattern, but for the purposes of this problem,"],[36250,39670,"we're just going to look at this subset of MasterCard numbers."],[39670,43170,"And finally, Visa numbers are 13 or 16 digits,"],[43170,45810,"and will start with the digit 4."],[45810,49590,"But not every sequence of 13 digits that starts with the digit 4"],[49590,51630,"is, necessarily, a Visa card number."],[51630,55290,"Every valid credit card number also satisfies a checksum,"],[55290,58310,"a relationship between the digits of that credit card number"],[58310,60990,"that determine whether that particular sequence of numbers"],[60990,63540,"is a valid credit card number or not."],[63540,65550,"How does this checksum algorithm work?"],[65550,67450,"Well, it works as follows."],[67450,71400,"We first, multiply every other digit of the credit card number by 2,"],[71400,73560,"starting with the second to last digit."],[73560,77760,"Then we add those products' digits together to get a number,"],[77760,80640,"and we add that number to the sum of all the digits"],[80640,82770,"that we didn't multiply by 2."],[82770,86100,"If we take that final result, and the last digit is zero,"],[86100,87990,"then the credit card number is valid."],[87990,90490,"And if it's not, then it's invalid."],[90490,94060,"Let's take a look at an example to see this algorithm in practice."],[94060,96300,"Here's an example of a credit card number."],[96300,99390,"The first thing we're going to do is take every other digit,"],[99390,101520,"starting with the second to last digit."],[101520,107340,"So we're looking at the 1, the 0, the 0, the 0, the 0, the 6, the 0, and the 4."],[107340,111790,"And we're going to take each of those digits and multiply them by 2."],[111790,116810,"The next step is going to be to add all of these individual digits together."],[116810,121870,"So 8 plus 0 plus 1 plus 2, because those are the digits in 12,"],[121870,127930,"plus 0 plus 0 plus 0 plus 0 plus 2, that's going to give us the sum 13."],[127930,131920,"We're going to take 13 and add that to all of the other digits"],[131920,133690,"that we didn't multiply by 2."],[133690,139960,"So 13 plus 0 plus 3 plus 0 plus 0 plus 0 plus 0 plus 0 plus 4,"],[139960,142810,"that result is going to give us the number 20."],[142810,145510,"This is our final result. The last digit is 0,"],[145510,148480,"so this credit card number satisfies the checksum."],[148480,151120,"It could be a valid credit card number."],[151120,153940,"So one of your tasks in this problem is going to be,"],[153940,158165,"given the credit card number, figure out if it satisfies the checksum or not."],[158165,160540,"And to do that, you're going to need to take a big number"],[160540,163180,"and get at the individual digits of the number."],[163180,166190,"But how do we get the digits of the number?"],[166190,168550,"Let's take a big number, like this credit card number,"],[168550,172420,"and consider how would we get the last digit of this credit card number, which"],[172420,174670,"in this case is the number 4?"],[174670,178570,"Well, notice that if you take any big number, and take the remainder."],[178570,182470,"When you divide it by 10, what you get is the rightmost digit."],[182470,185680,"If we take this big number, divide it by 10, and take the remainder,"],[185680,188170,"the remainder is 4, the last digit."],[188170,192220,"And in code, we have the modulo operator that gets us the remainder"],[192220,193750,"when we divide it by something."],[193750,196955,"So if we take this big number, and take it modulo 10,"],[196955,199330,"that will give us the remainder, when we take this number"],[199330,202060,"and divide it by 10, which in this case is 4."],[202060,204640,"So this gives us a way of taking a big number"],[204640,207042,"and figuring out what the last digit is."],[207042,208750,"And I'll leave it up to you to figure out"],[208750,212690,"how to adapt this to get the second to last digit, or the third to last digit,"],[212690,213640,"for example."],[213640,216100,"What do you need to do in this problem, then?"],[216100,218680,"Well, you'll first want to prompt the user to type"],[218680,220870,"in their input, a credit card number."],[220870,223660,"Then, you'll want to calculate the checksum to figure out"],[223660,225940,"if it could be a valid credit card or not,"],[225940,231090,"based on if that checksum has a final digit that is or isn't a 0."],[231090,234660,"After you do that, you'll want to check the credit card's length, as well"],[234660,238530,"as the starting digits, to figure out if it matches the pattern for an American"],[238530,241350,"Express card or a Visa or a MasterCard."],[241350,244080,"And if it matches the checksum and also matches"],[244080,246420,"the card length and starting digit requirements,"],[246420,249240,"then your program should print out Amex for an American Express"],[249240,253020,"card, MasterCard for MasterCard, Visa for a Visa card,"],[253020,255210,"and if it doesn't satisfy any of the three,"],[255210,257880,"your program should print out invalid."],[257880,260399,"After you do that, you should be able to test your program"],[260399,263580,"on some sample valid and invalid credit card numbers,"],[263580,266100,"and make sure that you get the right result."],[266100,269630,"My name is Brian, and this was credit."]]},"AOVyZEh9zgE":{"edited":true,"zh":[[0,2330,"我们来看 Readability 这道题。"],[2330,11120,"你要用 C 写一个程序，读入一段英文，估算它适合什么阅读年级。"],[11120,15050,"比如在终端运行 ./readability，"],[15050,18110,"程序会提示用户输入一段文字。"],[18110,27170,"用户输入几句话后，程序要估算：按美国的年级划分，这段文字适合几年级的读者？"],[27170,32040,"例如，这段话可能最适合三年级的学生。"],[32040,41760,"如果用户输入的是更复杂的文章，程序可能会判断它更适合五年级的学生。"],[41760,47960,"说一段文字适合三年级或五年级的学生，依据是什么呢？"],[47960,51920,"比较这两段文字，可以观察到几点。"],[51920,58460,"首先，用词越长，文章往往越适合年级高的读者。"],[58460,68070,"此外，一句话里的单词越多，句子就越长，这通常也意味着阅读难度更高。"],[68070,75950,"其实，有公式能根据一段文字的这些特征，算出它大约适合哪个年级。"],[75950,81710,"这里用的是 Coleman–Liau 指数，计算方法如下。"],[81710,90440,"指数 = 0.0588 × L − 0.296 × S − 15.8。"],[90440,102900,"L 是平均每 100 个单词中的字母数，S 是平均每 100 个单词中的句子数。"],[102900,114110,"因此，要判断一段文字的阅读难度，先统计字母、单词和句子的数量，再代入公式，"],[114110,117148,"就能估算出最合适的阅读年级。"],[117148,123515,"我们依次来看这三项，先统计字母数。"],[123515,130729,"要得到字母总数，就把所有大写字母和小写字母都算上。"],[130729,138510,"还记得吗？用字符串保存一段文字时，可以把它当作一个字符数组。"],[138510,150680,"想知道数组里有多少个字母，可以先创建一个变量，比如叫 letters，用它记录到目前为止遇到了多少个字母。"],[150680,153050,"一开始把 letters 设为 0。"],[153050,159680,"然后遍历整个字符串，每次检查一个字符，看看它是不是字母。"],[159680,161270,"第一个字符是字母，"],[161270,163970,"所以把计数从 0 加到 1。"],[163970,166950,"下一个字符也是字母，是小写字母。"],[166950,169100,"于是计数从 1 加到 2。"],[169100,172080,"对后面的每个字符都重复这个过程。"],[172080,181920,"不过，如果遇到空格、数字或标点这样的非字母字符，就不能把它计入字母总数。"],[181920,184080,"所以这里不增加 letters 的值。"],[184080,188480,"等遇到下一个字母，再把计数加 1。"],[188480,196460,"一直处理完剩余的字符串，就得到了这段文字中的字母总数。"],[196460,207620,"C 的 ctype.h 头文件声明了一些库函数，可以帮你判断一个字符是不是字母。"],[207620,216030,"数完字母，下一步是统计文本里有多少个单词。"],[216030,222200,"这稍微麻烦一些，因为得先界定什么算一个单词。"],[222200,232530,"在这道题中，我们把用空格隔开的一串连续字符算作一个单词。"],[232530,238650,"也就是说，每看到一个空格，就意味着后面要开始一个新单词了。"],[238650,249840,"那么，拿到字符串后，要知道有多少个单词，可以先数一数其中有多少个空格。"],[249840,258440,"比如，逐个字符检查后，发现字符串里有四个空格。"],[258440,263480,"但不能因此就说字符串里有四个单词。"],[263480,271880,"空格出现在单词之间。前面的单词后面都有空格，最后一个单词后面却没有。"],[271880,276900,"可以假设题目给出的文本开头和结尾都没有空格。"],[276900,283440,"所以字符串里虽然只有四个空格，实际上却有五个单词。"],[283440,292180,"一般来说，把空格数加 1，就得到这段文字的单词数。"],[292180,300890,"数完单词，最后还要统计这段文字中有多少个句子。"],[300890,310280,"本题约定，遇到句号、感叹号或问号，就认为一句话结束了。"],[310280,320360,"所以只要统计这三种标点一共出现多少次，就能算出句子数。"],[320360,322270,"看这段示例文字："],[322270,324370,"Congratulations!（恭喜你！）"],[324370,326560,"Today is your day.（今天是你的好日子。）"],[326560,332470,"你会看到，这个字符串里有两个表示句子结束的标点，"],[332470,335510,"一个是感叹号，一个是句号。"],[335510,343510,"所以按照刚才的规则，这段文字共有两句话。"],[343510,355390,"统计出字母数、单词数和句子数后，下一步就用它们计算 Coleman–Liau 指数。"],[355390,363880,"把这三项计数代入 Coleman–Liau 指数的计算过程即可。"],[363880,365650,"再来看一遍公式。"],[365650,375700,"先用每 100 个单词的平均字母数乘以一个系数，再减去每 100 个单词的平均句子数"],[375700,385080,"与另一个系数的乘积，最后减去 15.8，就能估算这段文字的阅读年级。"],[385080,392470,"程序最终要输出相应的年级。记得把算出的指数四舍五入到最接近的整数。"],[392470,398830,"例如，指数是 2.8，四舍五入后就是 3，也就是大约三年级的阅读水平。"],[398830,405090,"程序应该输出 Grade X，X 代表这段文字对应的阅读年级。"],[405090,407850,"输出的年级还有下限和上限。"],[407850,414120,"如果结果小于 1，就输出 Before Grade 1。"],[414120,419460,"如果结果是 16 或更高，就输出 Grade 16+。"],[419460,429040,"中间则按相应年级输出，例如 Grade 2、Grade 3、Grade 4，一直到 Grade 15。"],[429040,440890,"做完这些，你的 Readability 程序就能接受一段英文，然后估算它最适合美国几年级的读者。"],[440890,441810,"我是 Brian。"],[441810,444950,"这就是 Readability。"]],"en":[[0,2330,"BRIAN YU: Let's take a look at readability."],[2330,6350,"In readability, your task is going to be to write a program in C that"],[6350,11120,"can take some text and assess the approximate reading level of that text."],[11120,15050,"So for example, you might run your program as ./readability."],[15050,18110,"Your program should then prompt the user to type in some text."],[18110,20540,"And after the user types in a few sentences"],[20540,25100,"maybe, your program is going to produce as output the approximate US grade"],[25100,27170,"reading level for that particular text."],[27170,31190,"Maybe this text for instance, is most appropriate for a third grade reading"],[31190,32040,"level."],[32040,36335,"But if instead the user were to type in a more sophisticated text, then"],[36335,38210,"your program might output something like this"],[38210,41760,"is more appropriate for a fifth grade reading level, for example."],[41760,44000,"But what does it really mean for a text to be"],[44000,47960,"appropriate for a third grade reading level or a fifth grade reading level?"],[47960,51920,"Well, taking a look at these examples, we might make a couple of observations."],[51920,55100,"We might observe the first, longer words tend"],[55100,58460,"to mean that a text is more appropriate for a higher reading level."],[58460,62220,"We might also observe that if there are more words in a sentence,"],[62220,66320,"in other words, the longer sentences, that too generally tends to correlate"],[66320,68070,"with a higher reading level."],[68070,70370,"In fact, there are formulas that we can use in order"],[70370,74120,"to calculate based on any particular text what grade level might"],[74120,75950,"be appropriate for that text."],[75950,79880,"One such formula that we'll use here is the Coleman-Liau Index,"],[79880,81710,"which is calculated as follows."],[81710,90440,"It's calculated as 0.0588 times L minus 0.296 times S minus 15.8."],[90440,94460,"Where here L represents the average number of letters"],[94460,98420,"per 100 words in this text, and S represents"],[98420,102900,"the average number of sentences per 100 words in this text."],[102900,106460,"So in order to determine the readability of a particular text, what"],[106460,110570,"we need to do is calculate the number of letters, words, and sentences"],[110570,114110,"in that text and then use the commonly index formula"],[114110,117148,"to figure out what grade level might be most appropriate."],[117148,118940,"So let's take a look at each of those three"],[118940,123515,"in sequence beginning with figuring out how many letters are in the text."],[123515,125390,"In this case, we're going to count the number"],[125390,128210,"of uppercase and lowercase letters in the text"],[128210,130729,"to determine the total number of letters."],[130729,134550,"And recall that if you have some text as a string, for example,"],[134550,138510,"we can treat that string as an array of characters."],[138510,140390,"So if we have an array of characters and we"],[140390,142760,"want to find out how many letters there are,"],[142760,145040,"we might start by creating a variable, I'll"],[145040,148280,"call it letters, that's going to keep track of how many letters"],[148280,150680,"we found inside of this string."],[150680,153050,"At first, letters is going to be 0."],[153050,155690,"But we can loop through this string one character"],[155690,159680,"at a time checking each character to see whether or not it's a letter."],[159680,161270,"The first character is a letter."],[161270,163970,"So we can increase the count from 0 to 1."],[163970,166950,"The next character is also a letter it's a lowercase letter."],[166950,169100,"And so the count increases from 1 to 2."],[169100,172080,"And we can repeat that process for every character."],[172080,175880,"Notice though that if we come across a character that is not a letter,"],[175880,178610,"like a space or a number or a punctuation mark,"],[178610,181920,"we don't want to count that in our total account of letters."],[181920,184080,"So we shouldn't increment letters here."],[184080,186980,"But when we get to the next character that is a letter,"],[186980,188480,"then we can increment the count."],[188480,191270,"And we'll do that for the rest of this string"],[191270,194420,"until we end up with a final count of the number of letters"],[194420,196460,"that are inside of this text."],[196460,199730,"You might find that C has some helpful library functions declared"],[199730,203600,"in a file called ctype.h that might help you for taking a character"],[203600,207620,"and assessing whether or not it is in fact a letter."],[207620,211310,"Once we figured out how many letters there are inside of the text,"],[211310,214280,"the next step is going to be to calculate how many words there"],[214280,216030,"are inside of the text."],[216030,218570,"And this gets a little bit trickier because we first"],[218570,222200,"need to decide what does it mean for something to be a word."],[222200,224600,"And for the purposes of this problem, we're"],[224600,226880,"going to count the number of words in a sentence"],[226880,230420,"by assuming that a word is any sequence of characters"],[230420,232530,"that is separated by a space."],[232530,235280,"So every time you see a space appear in the text, that's"],[235280,238650,"going to be an indication that a new word is coming."],[238650,242840,"And so if we were to take a string again, just an array of characters"],[242840,245150,"and try and find out how many words there are,"],[245150,248750,"we might start by looking to see how many spaces there are inside"],[248750,249840,"of this string."],[249840,252470,"And if we were to loop through this string checking"],[252470,256610,"for the number of spaces, we might find that there are four spaces inside"],[256610,258440,"of the string, for example."],[258440,260990,"But we shouldn't jump to then saying that there are therefore"],[260990,263480,"four words inside of this string."],[263480,266540,"After all, spaces appear in between words"],[266540,269120,"and there's a space after each word, but there's"],[269120,271880,"no space after the last word in the string."],[271880,273950,"You can assume that the string we provide to you"],[273950,276900,"won't start or end with a space."],[276900,280370,"So even though there are four spaces inside of the string,"],[280370,283440,"there are actually five words in the string."],[283440,285890,"And in general, we can take the number of spaces"],[285890,289790,"and add 1 to it to figure out how many words there are inside"],[289790,292180,"of any given piece of text."],[292180,294400,"After we figured out how many words there are,"],[294400,296770,"the final step in terms of what we need to count up"],[296770,300890,"is counting up the number of sentences that appear in that text as well."],[300890,303140,"And again, for the purposes of this program,"],[303140,307630,"we're going to assume that any period, exclamation point, or question mark"],[307630,310280,"is going to indicate the end of a sentence."],[310280,313870,"So figuring out how many sentences there are in a particular text"],[313870,318280,"is just a matter of counting up how many times do we see periods, exclamation"],[318280,320360,"points, or question marks."],[320360,322270,"So for example, let's take this text."],[322270,324370,"Congratulations!"],[324370,326560,"Today is your day."],[326560,330580,"In this particular string, you'll notice that there are two punctuation marks"],[330580,332470,"that denote the end of a sentence."],[332470,335510,"We have one exclamation point and one period."],[335510,339490,"And so as a result, we could conclude that based on this particular string,"],[339490,343510,"we're able to find two sentences inside of that string."],[343510,346930,"Once we've counted up the number of letters, words, and sentences"],[346930,349660,"that appear inside a given text, the next step"],[349660,353560,"is going to be to use those values to calculate what the Coleman-Liau"],[353560,355390,"Index should actually be."],[355390,359420,"In order to do so, you're going to take these three values: letters, words,"],[359420,363880,"and sentences and plug them into the common layout index formula."],[363880,365650,"Again, that formula is here."],[365650,369400,"That's a result of multiplying the average number of letters per 100 words"],[369400,372310,"by a particular value and subtracting the result"],[372310,375700,"of taking the average number of sentences per 100 words multiplied"],[375700,379450,"by a value as well and subtracting 15.8 at the end"],[379450,382390,"in order to get an estimate for what the approximate reading"],[382390,385080,"level of a particular text is."],[385080,388170,"Ultimately, your program should output what that grade reading"],[388170,392470,"level is but be sure to round your score to the nearest whole number."],[392470,395340,"So for example, if your index is 2.8, you're"],[395340,398830,"going to round that and say that it's about a third grade reading level."],[398830,402480,"And your program should output squared X, where X corresponds"],[402480,405090,"to the reading level of that text."],[405090,407850,"But we do want to set a minimum and a maximum here."],[407850,410760,"If it turns out that your output would have been less than 1,"],[410760,414120,"your program should just output before grade 1."],[414120,417150,"And if the output is 16 or higher, then your program"],[417150,419460,"should output grade 16 plus."],[419460,421950,"But anywhere in between grades 2 through 15,"],[421950,426240,"your program should output grade 2, grade 3, grade 4, et, cetera, as it"],[426240,429040,"corresponds to the reading level of the program."],[429040,432750,"Once you follow these steps, you should have a completed readability program"],[432750,435210,"where you can type in some text, and your program"],[435210,438270,"will calculate what US grade reading level would be most"],[438270,440890,"appropriate for that particular text."],[440890,441810,"My name is Brian."],[441810,444950,"And this was readability."]]},"V2uusmv2wxI":{"edited":true,"zh":[[500,4140,"在 Caesar 这道题里，我们要给一段文本加密。"],[4140,8760,"方法是把里面的每个字母都沿字母表移动相同的位数。"],[8760,15900,"程序首先要取得密钥，也就是每个字母要移动多少位。"],[15900,19620,"然后提示用户输入明文，也就是要加密的文字。"],[19620,24630,"接下来按密钥移动每个字母，给明文加密。"],[24630,28620,"最后输出加密后的文字，也就是密文。"],[28620,29980,"举个例子。"],[29980,37480,"假如密钥是 2，就把明文中的每个字母沿字母表向后移两位。"],[37480,44850,"明文里的大写 A 会变成密文里的大写 C，因为它往后移了两位。"],[44850,50670,"同样，B 变成 D，C 变成 E，一直到 X 变成 Z。"],[50670,56620,"那 Y 呢？再往后数两位，就超出了字母表的范围。"],[56620,60850,"这时候要绕回字母表的开头。"],[60850,68010,"所以 Y 移两位变成 A，而 Z 移两位变成 B。"],[68010,70950,"放到程序里，运行起来会是什么样子？"],[70950,76470,"比方说，我们运行 ./caesar，把数字 2 作为命令行参数。"],[76470,80160,"这表示密钥是 2，所有字母都要移动两位。"],[80160,87030,"如果输入的明文是 ABC，程序就应该输出密文 CDE。"],[87030,92330,"可以看到，每个字母都往后移了两位。"],[92330,98120,"再比如运行 ./caesar 2，输入明文 hello，"],[98120,106190,"密文就是 jgnnq，也就是把 hello 的每个字母都往后移两位。"],[106190,108870,"最后再看一个例子。"],[108870,117700,"运行 ./caesar，密钥仍然是 2，输入「This is CS50!」，就得到屏幕上这样的密文。"],[117700,122030,"有几点值得注意。首先，字母的大小写要保留。"],[122030,128479,"明文里的大写字母，在密文里还是大写字母。"],[128479,134870,"同样，明文里的小写字母，在密文里也要保持小写。"],[134870,143240,"遇到字母以外的字符，比如空格、数字或标点，就让它们保持原样。"],[143240,146210,"空格还是空格，50 还是 50，"],[146210,152220,"感叹号也还是感叹号。只有字母才需要变。"],[152220,158320,"下面一步步来看，怎么用代码实现这个程序。"],[158320,165840,"程序第一步要取得密钥，也就是每个字母要移动的位数。"],[165840,167640,"怎么取得它呢？"],[167640,174420,"密钥以命令行参数的形式提供。"],[174420,184320,"也就是说，用户输入 ./caesar，后面跟一个数，指定字母的移动位数。"],[184320,186930,"那怎么读到这些命令行参数？"],[186930,191520,"回顾一下，C 程序里的 main 函数可以接收参数。"],[191520,197160,"其中 argc 的意思是 argument count，也就是命令行参数的个数。"],[197160,204360,"另一个参数叫 argv，是一个字符串数组，里面存着各个命令行参数。"],[204360,211920,"假设运行 ./caesar 3，用 3 当密钥，那么 argc 就是 2。"],[211920,215490,"因为输入了两项：程序名 ./caesar 和参数 3。"],[215490,220650,"而 argv 就是存放这两项的字符串数组。"],[220650,227310,"别忘了，可以用方括号和下标访问数组中的某个元素。"],[227310,234420,"argv[0] 是数组里的第一个字符串，这里就是程序名 ./caesar。"],[234420,241620,"argv[1] 则是第二项，这里是字符串 \"3\"。"],[241620,243990,"这样就能读到用户提供的密钥了。"],[243990,248010,"取得密钥时，先确认程序名后面只跟了一个命令行参数。"],[248010,256110,"还要检查这个参数里是不是全为数字字符，再把它转换为整数。"],[256110,261510,"比如用户输入 ./caesar 2 8，"],[261510,268530,"参数个数多了。此时程序应该输出一条用法提示。"],[268530,274470,"提醒用户运行 ./caesar，后面只跟一个密钥。"],[274470,279450,"只要命令行参数的个数不对，都应该给出这样的提示。"],[279450,285790,"即使参数个数正确，参数也可能不全是数字。"],[285790,292360,"比如运行 ./caesar 20x，其中就混入了字母 x。"],[292360,299310,"同样要输出用法提示，让用户在 ./caesar 后面给出有效的密钥。"],[299310,301420,"怎么检查密钥是否合法呢？"],[301420,309490,"可以逐个查看这个参数字符串里的字符，确认每一个都是数字。"],[309490,316530,"想一想，什么函数能检查一个字符是不是数字？"],[316530,319980,"确认命令行参数正确之后，"],[319980,325590,"最后还要把这个参数从字符串转换成整数。"],[325590,332460,"注意，表示密钥的 argv[1] 存的是字符串 \"3\"，而不是整数 3。"],[332460,339220,"在 C 中，每个变量都有类型，比如整型 int 或字符串类型 string。"],[339220,344160,"这里 argv[1] 是字符串 \"3\"。"],[344160,348880,"之后要拿它做数学运算，就需要用到整数 3。"],[348880,352410,"因此需要把字符串转成整数。"],[352410,359220,"可以用 stdlib.h 里声明的 atoi 函数。传入字符串 \"3\"，"],[359220,362250,"它就会返回整数 3。"],[362250,367860,"这样就得到了后面计算要用的整数密钥。"],[367860,372780,"取得密钥之后，下一步是提示用户输入明文。"],[372780,379890,"可以调用 get_string，请用户输入想加密的文字。"],[379890,382200,"有了明文之后，就要对它加密。"],[382200,389550,"按密钥把每个字母移位，得到相应的密文。"],[389550,392820,"在处理整段明文之前，"],[392820,398770,"先单看一个字符。这个字符要怎么加密？"],[398770,401760,"这里需要分几种情况。"],[401760,407280,"如果它是一个字母，无论大写还是小写，"],[407280,412350,"都要按密钥移位，同时保留原来的大小写。"],[412350,417120,"比如，原来是大写，移位之后仍然应该是大写。"],[417120,423120,"如果不是字母，比如是空格、标点或者数字，"],[423120,427500,"那就保留原字符，不需要做任何改动。"],[427500,432950,"那怎么判断一个字符是不是字母，是大写还是小写？"],[432950,441090,"有几个函数可以帮忙：isalpha、isupper 和 islower。"],[441090,449070,"isalpha 接收一个字符，用它的返回值可以判断该字符是不是字母。"],[449070,455880,"同样，isupper 能判断是不是大写字母，islower 能判断是不是小写字母。"],[455880,463770,"比如对大写 A 调用这几个函数。isalpha('A') 的结果为真，因为 A 是字母。"],[463770,468870,"isupper('A') 也为真，因为 A 是大写字母。"],[468870,474870,"而 islower('A') 的结果为假，因为 A 不是小写字母。"],[474870,481500,"利用它们，就能判断给定的字符是哪一种情况。"],[481500,486030,"每个英文字母，无论大写还是小写，都有对应的 ASCII 码。"],[486030,494070,"ASCII 编码规定了字符与数字的对应关系，"],[494070,499380,"例如大写 A 对应 65，大写 B 对应 66，依此类推。"],[499380,501900,"小写字母也有对应的数字。"],[501900,509470,"小写 a 是 97，b 是 98，c 是 99，依此类推。"],[509470,514860,"所以在运算时，可以把一个字符当作它所对应的数值。"],[514860,516760,"在代码里是什么样子呢？"],[516760,522450,"比如我有一个字符变量 c，令它等于大写字母 'A'。"],[522450,531060,"输出时使用 %c，就是要在字符串的这个位置放入一个字符。"],[531060,535830,"你看到的自然是字母 A。"],[535830,541870,"但在计算机里，这个 A 的数值是 65，所以能把它当作 65 来运算。"],[541870,546780,"和其他数一样，可以对它做加法或减法。"],[546780,550650,"比如，给大写 'A' 加上 1。"],[550650,555300,"大写 A 对应 65，65 加 1 是 66。"],[555300,566610,"如果把 66 当作字符输出，显示的就是 B，因为 B 的 ASCII 码正是 66。"],[566610,572820,"可是，如果给大写 Z 也往后移一位，会怎么样？"],[572820,579840,"把 Z 的 ASCII 码加 1，"],[579840,585570,"得到的并不是大写 A，而是一个超出大写字母范围的编码。"],[585570,592140,"我们想要的效果是，一旦越过字母 Z，就绕回字母表开头，"],[592140,597550,"回到 A。怎么做呢？"],[597550,600370,"这里可以用一个公式。"],[600370,605280,"屏幕上就是把明文转换成密文的公式。"],[605280,608580,"看上去有点复杂，我们把它拆开看。"],[608580,617010,"这里的 cᵢ 表示密文的第 i 个字符。它是怎么求出来的？"],[617010,625400,"取明文中同一位置的字符 pᵢ，加上密钥 k。"],[625400,630120,"再把这个和对 26 取模。"],[630120,637750,"这里的 % 26 表示把前面的结果除以 26，然后取余数。"],[637750,639160,"这样做为什么有效？"],[639160,651490,"假设从 0 开始给字母编号：a 是 0，b 是 1，c 是 2，一直到 z 是 25。"],[651490,656910,"那怎么用这个公式，把 z 向后移一位？"],[656910,658430,"来看公式。"],[658430,664400,"想移动的明文字母是 z，在这里它的编号是 25。"],[664400,668540,"密钥 k 是 1，所以要移动一位。"],[668540,678590,"25 加 1 是 26。26 对 26 取模，也就是 26 除以 26，余数是多少？"],[678590,684950,"余数是 0，查上面的表，0 对应的字母正好是 a。"],[684950,689210,"这样，就能把字母向后移动指定的位数。"],[689210,701045,"再对 26 取模，越过字母表末尾时就能回到开头，所以 z 之后又回到了 a。"],[701045,708080,"a 对应 0、b 对应 1、c 对应 2，这种编号可以叫作字母表下标。"],[708080,717240,"也就是说，a 的下标是 0，b 的下标是 1，c 的下标是 2，依此类推。"],[717240,721870,"但计算机表示字符时，用的并不是这个从 0 开始的下标。"],[721870,729610,"它用的是 ASCII 码，大写 A 是 65，B 是 66，C 是 67，因此不能直接套用公式。"],[729610,733140,"那我们该如何把一个 ASCII 字符"],[733140,740400,"向后移动指定的位数，同时又能在越过末尾时回到字母表开头呢？"],[740400,742500,"可以试试下面的办法。"],[742500,750240,"先把 ASCII 码换算成字母表下标。这样，大写 A 就变成 0，"],[750240,756300,"大写 B 变成 1。想一想，用什么运算可以完成这个转换？"],[756300,760110,"有了下标之后，就能代入公式："],[760110,767800,"加上密钥，再对 26 取模，就得到了新字母的下标。"],[767800,777510,"最后把结果从字母表下标换回 ASCII 码，让 0 对应 A，1 对应 B，以此类推。"],[777510,779400,"别忘了保留大小写："],[779400,785040,"原来是大写就保持大写，原来是小写就保持小写。"],[785040,788100,"这样就完成了对单个字母的加密。"],[788100,795810,"总结一下：对于字母，先得到它的下标，按公式移位，再把结果转换回 ASCII 码。"],[795810,802590,"那怎样从加密一个字符，扩展到加密明文中的所有字符呢？"],[802590,805980,"明文本身就是一个字符串。"],[805980,816060,"可以像访问数组那样，用下标读取字符串中的单个字符。"],[816060,819960,"比如 text[0] 是字符串 text 的第一个字符，在这里是大写 T。"],[819960,826480,"text[1] 是小写 h，text[2] 是小写 i，以此类推。"],[826480,832200,"用这种写法，就可以访问字符串中的任意字符。"],[832200,835080,"那要怎么知道字符串有多长？"],[835080,842440,"strlen 就是 string length 的缩写，传入字符串，它就会返回字符串的长度。"],[842440,844140,"在这个例子里，长度是 12。"],[844140,850110,"现在你既知道字符串有多长，也知道怎么访问其中的某个字符，"],[850110,853500,"还知道怎样单独加密每个字符。"],[853500,860010,"把这些步骤连起来，就能实现 Caesar：先取得密钥，再读取明文，"],[860010,864030,"移动明文中的每个字母，完成加密，"],[864030,869660,"最后输出结果。我是 Brian，这就是 Caesar 这道题。"]],"en":[[500,4140,"SPEAKER: In Caesar, your task is going to be to encipher or encrypt"],[4140,8760,"some text by shifting all of the letters in that text by a certain amount."],[8760,13530,"What your program is ultimately going to do is it's first going to get the key--"],[13530,15900,"the amount that we should shift each character by."],[15900,19620,"Then we're going to prompt the user to type in some plain text."],[19620,21900,"Then we're going to encipher that plain text"],[21900,24630,"by shifting all the letters by the key."],[24630,28620,"And finally, we're going to print out the resulting cipher text."],[28620,29980,"What does this look like?"],[29980,33720,"Well, if the key is 2, then for any plaintext character,"],[33720,37480,"we're going to shift that character by 2 letters in the alphabet."],[37480,40020,"So if we had a plain text capital A, that"],[40020,43290,"would become the ciphertext capital C, because we're shifting it"],[43290,44850,"by 2 letters from the alphabet."],[44850,48540,"B would become D. C would become E. So on and so forth up,"],[48540,50670,"until X would become Z."],[50670,54090,"And then when we get to Y, if we were to shift Y by 2 characters,"],[54090,56620,"we would go past the boundary of the alphabet."],[56620,60850,"So what we'll instead want to do is wrap around to the beginning of the alphabet"],[60850,64140,"so that Y becomes A when we shift it by 2,"],[64140,68010,"and Z becomes B when we shift it by 2."],[68010,70950,"What does this mean for how your program should actually work?"],[70950,75330,"Well, if we were to run ./caesar and then provide, a command line argument,"],[75330,76470,"the number 2--"],[76470,80160,"meaning we'd want to use 2 as the key, shifting everything by 2--"],[80160,83310,"and we were to type in the plain text ABC,"],[83310,87030,"then your program should print out the ciphertext CDE--"],[87030,92330,"the same as the plain text, but with every character shifted by 2 letters."],[92330,97010,"If we were to instead run ./caesar2 and provide the plain text of \"hello,\""],[97010,98120,"for example, --"],[98120,102410,"then the ciphertext should be this J-G-N-N-Q,"],[102410,106190,"which is each of the letters in \"hello\" shifted by 2 letters."],[106190,108870,"Let's take a look at one last example."],[108870,114380,"If I were to run ./caesar with a key of 2 ans input a plaintext of \"This is"],[114380,117700,"CS50,\" then the ciphertext should look like this."],[117700,119730,"And there are a couple of things to note here."],[119730,122030,"One is that we're preserving case."],[122030,125240,"If a character is an uppercase letter in the plaintext,"],[125240,128479,"then it's also an uppercase letter in the ciphertext."],[128479,131870,"And likewise, a character that's a lowercase letter in the plaintext"],[131870,134870,"is also a lowercase letter in the ciphertext."],[134870,138170,"And any character that's not an alphabetical character at all--"],[138170,142100,"so things like spaces or numbers or punctuation marks--"],[142100,143240,"those don't change."],[143240,144770,"The spaces stay spaces."],[144770,146210,"The 50 stays 50."],[146210,148940,"The exclamation point stays an exclamation point."],[148940,152220,"Only the alphabetic characters are changing."],[152220,155070,"So let's go through each of the steps of the caesar program"],[155070,158320,"to figure out how you can actually write the code to do this."],[158320,161880,"The first thing you'll want your program to do is to get the key--"],[161880,165840,"get the amount that we should shift each of the individual letters by."],[165840,167640,"How is your program going to do that?"],[167640,171270,"Well, remember that your program is going to take the key as a command line"],[171270,174420,"argument, meaning that when the user is running your program,"],[174420,177810,"they're going to run your program as something like ./caesar,"],[177810,182610,"followed by a number representing the key of how many characters to shift"],[182610,184320,"each of the letters by."],[184320,186930,"How do you access those command line arguments?"],[186930,191520,"Well, recall that in a C program your main function can take arguments."],[191520,193950,"It can take an argument called argc, which"],[193950,197160,"is going to represent the argument count-- the number of command line"],[197160,200250,"arguments-- and also an array of strings,"],[200250,204360,"called argv, representing each of those command line arguments."],[204360,208710,"So for example, if I were to run ./caesar2 and then the number 3"],[208710,211920,"as the key, argc would be 2."],[211920,213090,"I typed in two things--"],[213090,215490,"./caesar2 and 3."],[215490,218760,"And argv is going to be the actual array of strings"],[218760,220650,"representing those arguments."],[220650,222600,"And recall that when you have an array, you"],[222600,227310,"can access an individual element of that array using square bracket notation."],[227310,231900,"So argv[0] is going to be the first string in the argv array--"],[231900,234420,"which, in this case, is ./caesar2--"],[234420,238650,"and argv[1] is going to be the second thing in that argv array--"],[238650,241620,"which, in this case, is the string 3."],[241620,243990,"So that's how we might access the key."],[243990,248010,"Now, when we get the key, you'll want to ensure that only a single command line"],[248010,251760,"argument is provided, and that that argument contains only digit"],[251760,256110,"characters before you actually take that argument and convert it to an integer."],[256110,261510,"What I mean by that is that if the user runs ./caesar, and then 2 and then 8,"],[261510,265050,"providing more command line arguments that's expected, your program,"],[265050,268530,"rather than doing anything else, should just print out a usage message"],[268530,271500,"reminding the user that in order to run the Caesar program,"],[271500,274470,"they should run ./caesar2, followed by a key."],[274470,278100,"And you should do this anytime they don't use the correct number of command"],[278100,279450,"line arguments."],[279450,282300,"But even if they have the correct number of command line arguments,"],[282300,285790,"that argument might not be entirely numeric."],[285790,289260,"If the user runs something like ./caesar20x,"],[289260,292360,"where the command line argument is not entirely numeric,"],[292360,295530,"you should also display a usage message reminding the user that they need"],[295530,299310,"to run ./caesar, followed by a valid key."],[299310,301420,"How do you check if the key is valid?"],[301420,304140,"Well, you'll probably want to take that command line argument"],[304140,306540,"and check each of the individual characters"],[306540,309490,"in that string to make sure the character is a digit."],[309490,311490,"And you might want to think about what functions"],[311490,315510,"might be helpful for checking if an individual character is or is not"],[315510,316530,"a digit."],[316530,319980,"Once you've checked to make sure that the command line arguments are correct,"],[319980,323460,"the last thing you'll need to do here is actually take the command line argument"],[323460,325590,"and convert it into an integer."],[325590,328890,"Notice that argv[1] right now, representing the key,"],[328890,332460,"is not the number 3, but the string \"three.\""],[332460,335190,"Recall that in C, every variable has a type."],[335190,339220,"Some variables are ints, and other variables are strings, for example."],[339220,344160,"And here, argv[1] is the string \"three,\" rather than the integer 3--"],[344160,347430,"which we'll probably want to use in case we need to do some math with that"],[347430,348880,"number, for example."],[348880,352410,"So what we'll need to do is convert the string into an into an integer."],[352410,355170,"To do this, you can use the A2I function,"],[355170,359220,"declared in standard lib.h, that takes a string, like the string 3,"],[359220,362250,"and converts it into the number 3, for example."],[362250,364740,"So that function might be helpful for making sure"],[364740,367860,"that your key is in fact an integer."],[367860,369870,"After you've gotten the key, the next step"],[369870,372780,"is to prompt the user to type in the plaintext."],[372780,375330,"To do that, you can use a call to get string,"],[375330,379890,"asking the user to type in what plaintext they want to encrypt."],[379890,382200,"Once you've gotten that plaintext, the next step"],[382200,386220,"is going to be to encipher that plaintext, shifting all of the letters"],[386220,389550,"by the key to get the ciphertext result."],[389550,392820,"But before we talk about how to encipher the entire plaintext,"],[392820,397350,"let's just talk about how to encipher one particular character."],[397350,398770,"How are we going to do that?"],[398770,401760,"Well, there are a couple of cases that we might want to consider."],[401760,405060,"If the character is an alphabetic character, like an uppercase letter"],[405060,407280,"or a lowercase letter, for example, then we'll"],[407280,410550,"want to shift that plaintext character by the key,"],[410550,412350,"making sure to preserve the case."],[412350,414240,"If it was originally an uppercase letter,"],[414240,417120,"it should stay in uppercase letter, for example."],[417120,420520,"Of course, if the character is not alphabetic-- for example,"],[420520,423120,"if it's a space or a punctuation mark or a digit--"],[423120,425010,"then you can leave the character as is."],[425010,427500,"Nothing actually needs to change there."],[427500,430590,"But how do you know if a character is an alphabetic character"],[430590,432950,"or an uppercase character or a lowercase character?"],[432950,435450,"Well, it turns out, there are a number of functions that you"],[435450,437310,"can use that might be helpful here."],[437310,441090,"Functions like is alpha, is upper, and is lower."],[441090,443520,"Is alpha is a function that takes a character"],[443520,446130,"and returns a Boolean value, true or false,"],[446130,449070,"depending on whether or not that character is alphabetic."],[449070,452490,"And likewise, is upper checks to see if the character is uppercase"],[452490,455880,"and is lower checks to see if a character is lowercase."],[455880,459360,"If we call is alpha, is upper, and is lower on capital A,"],[459360,462520,"for example, is alpha of capital A is true."],[462520,463770,"It is an alphabetic character."],[463770,467310,"Is upper of capital A is also true because capital A"],[467310,468870,"is an uppercase letter."],[468870,473310,"And is lower of capital A is false because capital A is not"],[473310,474870,"a lowercase letter."],[474870,477910,"And so that can help you to figure out, given a particular character,"],[477910,481500,"is it an uppercase character or is it a lowercase character?"],[481500,486030,"And every character, uppercase and lowercase, has an ASCII value."],[486030,489870,"Recall that ASCII is just a mapping from characters to numbers"],[489870,494070,"that represent them, where we've decided that capital A is represented"],[494070,498150,"by the number 65, capital B is represented by the number 66,"],[498150,499380,"so on and so forth."],[499380,501900,"And lowercase letters have a mapping as well."],[501900,505760,"Lowercase a is represented by the number 97, lowercase b by the number"],[505760,509470,"98, lowercase c by 99, so on and so forth."],[509470,511980,"And you can treat any individual character"],[511980,514860,"as equivalent to the number that represents it."],[514860,516760,"So what does that mean in code?"],[516760,519450,"Well, it means that if I have a character in a variable called"],[519450,522450,"c that I set equal to the character A--"],[522450,527130,"capital A-- and I print out that character using %c to mean I want"],[527130,531060,"to substitute a character into this string, then what gets printed out,"],[531060,535830,"as you might expect, is the character A. But this character A is really just"],[535830,540300,"the number 65 inside of my computer, and I can treat this character like"],[540300,541870,"the number 65."],[541870,545040,"And like any number, I can do math with it, adding or subtracting"],[545040,546780,"numbers from it, for example."],[546780,550650,"So I can take capital A and add 1 to it, for example."],[550650,552990,"Capital A is represented by 65."],[552990,555300,"65 plus 1 is 66."],[555300,557550,"So if I print out the character corresponding"],[557550,560910,"to the number 66, what's ultimately going to be printed out"],[560910,566610,"is the character B because B in ASCII is represented by the number 66."],[566610,570870,"But what happens if I try to take a character like the character capital Z"],[570870,572820,"and shift that by one?"],[572820,577680,"If I take the ASCII value corresponding to the letter Z and add 1 to it,"],[577680,579840,"I don't get the ASCII value corresponding"],[579840,583830,"to capital A. I get something that's outside of the range of all"],[583830,585570,"of the capital letters."],[585570,587940,"What I'd really like to happen here is that once I"],[587940,592140,"try to shift past the letter Z, I want to wrap around back"],[592140,597550,"to the beginning of the alphabet, back to the letter A. But how do I do that?"],[597550,600370,"Well, to do this, we can take advantage of a formula."],[600370,602820,"And here's the formula that we're going to use to convert"],[602820,605280,"the plaintext into the ciphertext."],[605280,608580,"It looks a little bit complicated, but we'll break it down piece by piece."],[608580,613590,"c sub i here represents the ith character of the ciphertext."],[613590,617010,"How do we determine what the ith character of the ciphertext is?"],[617010,621420,"Well, we're going to start by taking the ith character of the plaintext"],[621420,625400,"and we're going to add k to it, where k is the key."],[625400,630120,"And we're going to take that
